<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Sua entrega</title>
<link rel="icon" href="/static/app/icone-192.png">
<script>/* EMPRESAS: aberto como /<empresa>/APP/ → tudo o que o app pede em /api/… vai para /<empresa>/api/… (dados só daquela empresa) */
(function () { var m = location.pathname.match(/^\/([a-z0-9][a-z0-9-]{1,30})\/(cliente|motorista|relatorios|entrega)(\/|$)/); if (m && /^(cliente|motorista|relatorios|entrega)$/.test(m[1])) m = null; window.HUB_BASE = m ? "/" + m[1] : "";
  if (!m) return; var f = window.fetch; window.fetch = function (u, o) { return f.call(this, typeof u === "string" && u.indexOf("/api/") === 0 ? window.HUB_BASE + u : u, o); };
  document.querySelectorAll('link[rel="manifest"]').forEach(function (l) { l.setAttribute("href", window.HUB_BASE + l.getAttribute("href")); }); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* WROUTER — link de acompanhamento do cliente (wendleyservice). Visual Aurora. */
:root{
  --paper:#05060a; --sheet:rgba(255,255,255,.055); --ink:#eef0f5; --ink-2:#c3c8d4; --ink-3:#8b92a3; --rule:rgba(255,255,255,.12); --rule-2:rgba(255,255,255,.07);
  --steel:#22d3ee; --steel-soft:rgba(34,211,238,.12); --amber:#e8b33d; --amber-soft:rgba(232,179,61,.12); --ok:#34d399; --ok-soft:rgba(52,211,153,.13);
  --bad:#fb7185; --bad-soft:rgba(251,113,133,.13); --gold:#e8b33d; --laranja:#fb923c; --laranja-soft:rgba(251,146,60,.14); --verm:#f87171; --verm-soft:rgba(248,113,113,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 0% -10%,rgba(139,92,246,.2),transparent 60%),radial-gradient(800px 500px at 110% 0%,rgba(34,211,238,.13),transparent 60%),var(--paper);background-attachment:fixed;color:var(--ink);font:16px/1.45 "Inter",system-ui,Roboto,Arial,sans-serif}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;line-height:1.15}
.bar{background:linear-gradient(135deg,rgba(14,17,26,.95),rgba(8,10,16,.92));border-bottom:1px solid var(--rule);backdrop-filter:blur(18px);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;font:700 19px "Space Grotesk",sans-serif;letter-spacing:.02em}
.bar b{color:var(--gold)}
main{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 30px);display:grid;gap:12px;max-width:560px;margin:0 auto}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(18px);border:1px solid var(--rule);border-radius:20px;box-shadow:0 18px 40px -24px rgba(0,0,0,.8);padding:16px;display:grid;gap:10px}
.cap{font-size:13.5px;color:var(--ink-3);margin:0}
.km{border-radius:16px;padding:18px 16px;display:grid;gap:4px;text-align:center;background:var(--steel-soft);color:var(--steel);border:2px solid transparent}
.km b{font:700 58px/1 "Space Grotesk",sans-serif;letter-spacing:-.01em}
.km span{font-size:15px;font-weight:600}
.km.laranja{background:var(--laranja-soft);color:var(--laranja);border-color:var(--laranja)}
.km.vermelho{background:var(--verm-soft);color:var(--verm);border-color:var(--verm)}
.fase{display:flex;gap:10px;align-items:center;font-weight:600}
.fase i{font-style:normal;font-size:26px}
.palavra{border:2px dashed var(--gold);background:var(--amber-soft);border-radius:14px;padding:14px;text-align:center;display:grid;gap:4px}
.palavra b{font:700 30px "Space Grotesk",monospace;letter-spacing:.14em;color:var(--ink)}
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--amber-soft);color:var(--amber)} .p-aco{background:var(--steel-soft);color:var(--steel)}
.it{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2);font-size:15px}
.it:last-child{border-bottom:0}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink-2)}
label.f small{font-weight:400;color:var(--ink-3)}
input{font:inherit;font-size:17px;padding:12px;border:1px solid var(--rule);border-radius:10px;background:rgba(0,0,0,.25);color:var(--ink);width:100%}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:12px;padding:13px 14px;font-weight:600;width:100%}
.pri{background:linear-gradient(135deg,#f5d27a,#e8b33d 55%,#a77a1c);color:#1a1206;border-color:transparent;box-shadow:0 10px 26px -12px rgba(232,179,61,.9)}
.ghost{background:transparent;border-color:transparent;color:var(--steel);padding:8px 4px}
.msg{font-size:14px;font-weight:600;min-height:1em;color:var(--bad);margin:0}
.viz{background:var(--steel-soft);color:var(--steel);border-radius:12px;padding:12px;display:grid;gap:4px}
.erro{text-align:center;padding:40px 16px}
/* mapa (só quando o motorista entra na faixa de aproximação) */
.mapa-card{padding:0;overflow:hidden}
#mapa{height:300px;background:#e9ecef}
.mapa-leg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2);padding:10px 14px}
.mapa-leg span{display:inline-flex;gap:6px;align-items:center}
.ic-cam{width:34px;height:34px}.ic-cam svg{width:34px;height:34px;transition:transform .6s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.ic-bal svg{width:30px;height:40px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.leaflet-div-icon{background:transparent;border:0}
</style>
</head>
<body>
<div class="bar"><span id="emp"></span><b id="empSep" hidden> · </b><b>Sua entrega</b></div>
<main id="app"><div id="topo"><div class="card"><p class="cap">Carregando…</p></div></div>
  <div class="card mapa-card" id="mapaCard" hidden><div id="mapa"></div>
    <div class="mapa-leg"><span><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2 21 21 12 16 3 21Z" fill="#f59e0b" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>Motorista</span>
      <span><svg width="13" height="17" viewBox="0 0 30 40"><path d="M15 39C15 39 2 23 2 14a13 13 0 0 1 26 0c0 9-13 25-13 25Z" fill="#111" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>Seu endereço</span>
      <span id="mapaAtu" style="margin-left:auto"></span></div></div>
  <div id="resto"></div></main>
<script>
"use strict";
/* [v6.6] Página do link de acompanhamento: /entrega/<código> → /api/entrega/<código> (pública; o código é a chave). */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TOKEN = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const hora = iso => iso ? String(iso).slice(11, 16) : "";
const dataBR = iso => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) : "";
const kmTxt = k => k < 1 ? `${Math.round(k * 1000)} m` : `${k.toFixed(1).replace(".", ",")} km`;
const mTxt = m => m < 1000 ? `${Math.max(0, Math.round(m / 10) * 10)} m` : `${(m / 1000).toFixed(1).replace(".", ",")} km`;
const haQuanto = s => s == null ? "" : s < 90 ? "agora há pouco" : s < 3600 ? `há ${Math.round(s / 60)} min` : `há ${Math.round(s / 3600)} h`;
const S = { d: null, form: false, erro: "", enviando: false };

async function api(url, corpo) {
  const r = await fetch(url, corpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) } : { cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.detail || "Não foi possível carregar agora."); e.status = r.status; throw e; }
  return j;
}
async function carregar() {
  try { S.d = await api(`/api/entrega/${encodeURIComponent(TOKEN)}`); }
  catch (e) { if (!S.d || e.status === 404 || e.status === 410) { $("#mapaCard").hidden = true; $("#resto").innerHTML = ""; $("#topo").innerHTML = `<div class="card erro"><h2>${e.status === 410 ? "Link expirado" : e.status === 404 ? "Link não encontrado" : "Sem conexão"}</h2><p class="cap">${esc(e.message)}</p></div>`; return; } }
  if (S.d && S.d.empresa) { $("#emp").textContent = S.d.empresa; $("#empSep").hidden = false; document.title = "Sua entrega · " + S.d.empresa; }
  if (!S.form) render(); else mapa(S.d && S.d.mapa);
}
const DESF = { entregue: ["Entregue", "p-ok"], retorno: ["Não entregue", "p-bad"], parcial: ["Entregue em parte", "p-warn"] };
function render() {
  const d = S.d; if (!d) return;
  const pend = d.pedidos.filter(p => !p.desfecho), chegou = pend.find(p => p.chegou);
  const viz = (pend.find(p => p.vizinho) || {}).vizinho;
  const palavras = [...new Set(pend.map(p => p.palavra).filter(Boolean))];
  let situ = "";
  if (!pend.length) situ = `<div class="fase"><i>✅</i><span>Entrega concluída.</span></div>`;
  else if (chegou) situ = `<div class="km vermelho"><b>📍</b><span>O motorista chegou ao seu endereço às ${hora(chegou.chegou)}.</span></div>`;
  else if (d.fase === "rua" && d.km != null) situ = `<div class="km ${d.km_cor === "normal" ? "" : esc(d.km_cor)}"><b id="kmNum">${d.mapa ? mTxt(d.mapa.dist_m) : kmTxt(d.km)}</b>
      <span>${d.km_cor === "vermelho" ? "O motorista está bem perto!" : d.km_cor === "laranja" ? "O motorista está se aproximando." : "Distância do motorista até o seu endereço"}</span>
      <small class="cap" style="color:inherit;opacity:.85">em linha reta${d.km_aprox ? " · aproximada" : ""}${d.pos_ha_seg != null ? " · atualizado " + haQuanto(d.pos_ha_seg) : ""}</small></div>`;
  else if (d.fase === "rua") situ = `<div class="fase"><i>🚚</i><span>Sua entrega saiu para a rota. A distância aparece aqui assim que tivermos a localização do motorista.</span></div>`;
  else situ = `<div class="fase"><i>📦</i><span>Sua entrega${d.data ? ` de ${dataBR(d.data)}` : ""} está sendo preparada. A distância aparece quando o motorista iniciar a rota.</span></div>`;
  $("#topo").innerHTML = `<div class="card"><h1 style="font-size:26px">Olá${d.nome ? ", " + esc(d.nome) : ""}!</h1>
      <p class="cap">${esc(d.endereco)}${d.cep ? " · CEP " + esc(d.cep) : ""}</p>${situ}</div>`;
  mapa(chegou ? null : d.mapa);
  $("#resto").innerHTML = `${pend.length && palavras.length ? `<div class="palavra"><span class="cap" style="color:var(--ink-2)">Sua palavra-chave — diga ao motorista na entrega</span>${palavras.map(w => `<b>${esc(w)}</b>`).join("")}<span class="cap">Não compartilhe com ninguém além do motorista.</span></div>` : ""}
    ${pend.length && viz ? `<div class="viz"><b>🏠 Entrega ao vizinho</b><span>Casa/apto <b>${esc(viz.numero)}</b>${viz.tel ? " · tel. " + esc(viz.tel) : ""}</span>
        <span>${viz.nome ? `O vizinho <b>${esc(viz.nome)}</b> deve dizer o próprio nome ao motorista.` : "Sem palavra-chave: o motorista entrega ao vizinho sem pedir palavra."}</span>
        ${d.pode_vizinho ? `<button type="button" class="ghost" id="vzCanc" style="justify-self:start">Cancelar — vou receber eu mesmo</button>` : ""}</div>` : ""}
    ${d.pode_vizinho && !viz ? (S.form ? formVizinho() : `<button type="button" id="vzAbrir">🏠 Entregar ao vizinho</button>`) : ""}
    <div class="card"><b>Seu pedido${d.pedidos.length > 1 ? "s" : ""}</b>
      ${d.pedidos.map(p => `<div style="display:grid;gap:4px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="cap">Pedido #${esc(p.numero)}</span>
        ${p.desfecho ? `<span class="pill ${DESF[p.desfecho][1]}">${DESF[p.desfecho][0]} ${hora(p.em)}</span>` : p.chegou ? '<span class="pill p-aco">Motorista no local</span>' : d.fase === "rua" ? '<span class="pill p-warn">A caminho</span>' : '<span class="pill p-aco">Preparando</span>'}</div>
        ${p.pecas.map(x => `<div class="it"><span>${esc(x.desc)}</span><b>${x.qtd}</b></div>`).join("")}</div>`).join("")}</div>
    <p class="cap" style="text-align:center">Esta página atualiza sozinha. Dúvidas? Fale com a nossa central.</p>`;
  const ab = $("#vzAbrir"); if (ab) ab.onclick = () => { S.form = true; S.erro = ""; render(); const n = $("#vzNum"); if (n) n.focus(); };
  const vc = $("#vzCanc"); if (vc) vc.onclick = () => enviar({ cancelar: true });
  const fc = $("#vzFechar"); if (fc) fc.onclick = () => { S.form = false; render(); };
  const ok = $("#vzOk"); if (ok) ok.onclick = () => enviar({ nome: $("#vzNome").value, tel: $("#vzTel").value, numero: $("#vzNum").value });
}
function formVizinho() {
  return `<div class="card"><h2 style="font-size:20px">🏠 Entregar ao vizinho</h2>
    <label class="f">Número da casa ou apartamento do vizinho *<input id="vzNum" autocomplete="off" placeholder="Ex.: 125 ou apto 42"></label>
    <label class="f">Nome do vizinho <small>Vira a palavra-chave: o vizinho diz o nome ao motorista. Em branco = entrega sem palavra-chave.</small><input id="vzNome" autocomplete="off"></label>
    <label class="f">Telefone do vizinho <small>(opcional)</small><input id="vzTel" type="tel" inputmode="tel" autocomplete="off" placeholder="(11) 90000-0000"></label>
    <p class="msg" id="vzMsg">${esc(S.erro)}</p>
    <button type="button" class="pri" id="vzOk"${S.enviando ? " disabled" : ""}>Confirmar entrega ao vizinho</button>
    <button type="button" class="ghost" id="vzFechar">Voltar</button></div>`;
}
async function enviar(corpo) {
  if (!corpo.cancelar && !String(corpo.numero || "").trim()) { S.erro = "Informe o número da casa ou apartamento do vizinho."; const m = $("#vzMsg"); if (m) m.textContent = S.erro; return; }
  S.enviando = true;
  try { S.d = await api(`/api/entrega/${encodeURIComponent(TOKEN)}/vizinho`, corpo); S.form = false; S.erro = ""; S.enviando = false; render(); }
  catch (e) { S.enviando = false; S.erro = e.message;
    if (corpo.cancelar || !S.form) { alert(e.message); return; }
    const m = $("#vzMsg"); if (m) m.textContent = e.message; }   // mantém o que o cliente digitou
}
/* ── MAPA: triângulo = motorista (aponta para onde vai), balão preto = endereço do cliente ── */
const M = { L: null, map: null, cam: null, bal: null, anim: null, ajustado: false, mexeu: false };
const SVG_CAM = '<svg viewBox="0 0 24 24"><path d="M12 2 21 21 12 16 3 21Z" fill="#f59e0b" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const SVG_BAL = '<svg viewBox="0 0 30 40"><path d="M15 39C15 39 2 23 2 14a13 13 0 0 1 26 0c0 9-13 25-13 25Z" fill="#111"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>';
function leaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, er) => {
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(c);
    const s = document.createElement("script"); s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload = ok; s.onerror = er; document.head.appendChild(s);
  });
}
function deslizar(marker, para, ms = 1800) {   // o triângulo anda até a nova posição (sem pular)
  cancelAnimationFrame(M.anim);
  const de = marker.getLatLng(), t0 = performance.now();
  const passo = (t) => { const k = Math.min(1, (t - t0) / ms), e = k * (2 - k);
    marker.setLatLng([de.lat + (para[0] - de.lat) * e, de.lng + (para[1] - de.lng) * e]); if (k < 1) M.anim = requestAnimationFrame(passo); };
  M.anim = requestAnimationFrame(passo);
}
async function mapa(m) {
  const card = $("#mapaCard");
  if (!m) { card.hidden = true; return; }
  try { await leaflet(); } catch (_) { card.hidden = true; return; }
  card.hidden = false;
  const cam = [m.motorista.lat, m.motorista.lng], dest = [m.destino.lat, m.destino.lng];
  if (!M.map) {
    M.map = L.map("mapa", { zoomControl: true, attributionControl: true });
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap", maxZoom: 19 }).addTo(M.map);
    M.bal = L.marker(dest, { icon: L.divIcon({ className: "ic-bal", html: SVG_BAL, iconSize: [30, 40], iconAnchor: [15, 39] }), keyboard: false }).addTo(M.map).bindTooltip("Seu endereço");
    M.cam = L.marker(cam, { icon: L.divIcon({ className: "ic-cam", html: SVG_CAM, iconSize: [34, 34], iconAnchor: [17, 17] }), keyboard: false, zIndexOffset: 500 }).addTo(M.map).bindTooltip("Motorista");
    M.map.on("dragstart", () => { M.mexeu = true; });   // o cliente arrastou: para de recentralizar sozinho
  } else {
    M.bal.setLatLng(dest);
    deslizar(M.cam, cam);
  }
  const svg = M.cam.getElement() && M.cam.getElement().querySelector("svg");
  if (svg) svg.style.transform = `rotate(${m.motorista.rumo ?? 0}deg)`;
  setTimeout(() => M.map.invalidateSize(), 50);
  if (!M.mexeu) { M.map.fitBounds([cam, dest], { padding: [40, 40], maxZoom: 17 }); M.ajustado = true; }
  $("#mapaAtu").textContent = m.motorista.aprox ? "posição aproximada" : "ao vivo";
}

/* atualiza sozinha: a cada 10 s com o mapa aberto (motorista perto), senão a cada 30 s */
async function ciclo() {
  if (document.visibilityState === "visible") await carregar();
  setTimeout(ciclo, S.d && S.d.mapa ? 10000 : 30000);
}
ciclo();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") carregar(); });
</script>
</body>
</html>
