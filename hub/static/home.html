<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110b">
<title>Lila Closet · Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
═══════════════════════════════════════════════════════════════════════════════
 home.html — Hub Lila Closet (Menu Túnel)
───────────────────────────────────────────────────────────────────────────────
 Estrutura deste arquivo:
   1. TOKENS ........ cores, medidas e sombras (mude o visual só aqui)
   2. LAYOUT ........ grade: menu lateral | (barra de abas + palco)
   3. MENU LATERAL .. marca, busca, grupos, itens, rodapé
   4. ABAS .......... barra superior com abas persistentes
   5. PALCO ......... painéis (Início + 1 iframe por aba aberta)
   6. INÍCIO ........ boas-vindas + cartões de todos os módulos
   7. RESPONSIVO .... celular: menu vira gaveta
   8. JS ............ catálogo → menu → abas → iframes → atalhos

 Comportamento:
   • O menu vem de /api/modulos (main.py descobre os .html sozinho).
   • Cada módulo aberto vira uma ABA com seu próprio iframe, que fica VIVO
     enquanto a aba existir (trocar de aba não recarrega nada).
   • O iframe só é criado na 1ª vez que a aba é ativada (abas restauradas
     não pesam até você clicar nelas).
   • As abas abertas são lembradas neste navegador.
   • Link direto: /#/medidas abre já no módulo "medidas".

 Atalhos:  /  buscar · Alt+1…9 trocar de aba · Alt+W fechar · Alt+R recarregar
           clique do meio na aba também fecha.

 Módulos podem conversar com o túnel (mesma origem):
   parent.postMessage({hub:"abrir",  id:"medidas"}, "*")   abre outro módulo
   parent.postMessage({hub:"titulo", texto:"Cliente X"}, "*") renomeia a aba
   parent.postMessage({hub:"aviso",  texto:"Salvo!"}, "*")   mostra um aviso
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
/* ═════════ 1. TOKENS ═════════ */
:root{
  --sb-bg:#17110b;   --sb-bg2:#211810;  --sb-hover:#2c2014; --sb-borda:#33281a;
  --sb-txt:#d9cdbb;  --sb-fraco:#8a7355;
  --ouro:#c9a227;    --ouro-esc:#8a6200; --ouro-claro:#fff8e1;
  --marrom:#3d1f10;  --marrom2:#6b3a22;  --marrom-esc:#1a0f0a;
  --fundo:#f4f1ee;   --papel:#ffffff;    --creme:#fdf6ee; --borda:#ecdfc9;
  --txt:#2a1a10;     --txt-fraco:#8b7355;
  --azul:#1565c0;    --azul-fundo:#e3f2fd;

  --sb-w:252px; --sb-w-mini:70px; --topo-h:50px;
  --raio:12px; --raio-p:8px;
  --sombra:0 2px 12px rgba(61,31,16,.07);
  --sombra-forte:0 10px 28px rgba(61,31,16,.16);
  --trans:.18s ease;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--fundo);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═════════ 2. LAYOUT ═════════ */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);height:100vh;height:100dvh;transition:grid-template-columns var(--trans)}
.app.mini{grid-template-columns:var(--sb-w-mini) minmax(0,1fr)}
.principal{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ═════════ 3. MENU LATERAL ═════════ */
.sb{background:var(--sb-bg);color:var(--sb-txt);border-right:1px solid var(--sb-borda);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sb-topo{display:flex;align-items:center;gap:8px;padding:14px 12px 12px 14px;border-bottom:1px solid var(--sb-borda)}
.sb-marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;border-radius:var(--raio-p);padding:2px}
.sb-logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:1.25rem;
  background:linear-gradient(135deg,var(--marrom),var(--marrom2));box-shadow:inset 0 0 0 1px rgba(201,162,39,.35)}
.sb-nome{min-width:0;line-height:1.15}
.sb-nome b{display:block;font-family:var(--serif);font-size:1.08rem;color:#f5e6d3;white-space:nowrap}
.sb-nome small{display:block;font-size:.64rem;letter-spacing:1.4px;text-transform:uppercase;color:#a98c3d;margin-top:3px}
.sb-mini-btn{width:28px;height:28px;border-radius:7px;color:var(--sb-fraco);display:grid;place-items:center;flex:none;transition:var(--trans)}
.sb-mini-btn:hover{background:var(--sb-hover);color:#f5e6d3}
.sb-mini-btn svg{transition:transform var(--trans)}
.app.mini .sb-mini-btn svg{transform:rotate(180deg)}

.sb-busca{padding:12px 12px 6px;position:relative}
.sb-busca input{width:100%;background:var(--sb-bg2);border:1px solid var(--sb-borda);border-radius:var(--raio-p);
  color:#f5e6d3;padding:8px 30px 8px 32px;font-size:.82rem;outline:none;transition:border-color var(--trans)}
.sb-busca input::placeholder{color:var(--sb-fraco)}
.sb-busca input:focus{border-color:var(--ouro)}
.sb-busca .lupa{position:absolute;left:23px;top:50%;transform:translateY(-35%);color:var(--sb-fraco);pointer-events:none}
.sb-busca kbd{position:absolute;right:20px;top:50%;transform:translateY(-35%);font:600 .66rem var(--sans);color:var(--sb-fraco);
  border:1px solid var(--sb-borda);border-radius:4px;padding:1px 5px}

.sb-nav{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:thin;scrollbar-color:#3a2d1c transparent}
.sb-grupo{font-size:.64rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--sb-fraco);margin:16px 6px 6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin-bottom:3px;border-radius:10px;
  text-align:left;color:var(--sb-txt);font-size:.86rem;font-weight:600;border:1px solid transparent;transition:background var(--trans),border-color var(--trans)}
.nav-item:hover{background:var(--sb-hover);border-color:var(--sb-borda);color:#f5e6d3}
.nav-item .ico{width:22px;text-align:center;font-size:1.02rem;flex:none}
.nav-item .rot{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .vivo{width:7px;height:7px;border-radius:50%;background:var(--ouro);flex:none;opacity:0;transition:opacity var(--trans)}
.nav-item.aberto .vivo{opacity:1}
.nav-item.ativo{background:linear-gradient(135deg,var(--ouro),var(--ouro-esc));color:var(--marrom-esc);border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.nav-item.ativo .vivo{background:var(--marrom-esc)}
.sb-vazio{font-size:.78rem;color:var(--sb-fraco);padding:10px 8px}

.sb-rodape{border-top:1px solid var(--sb-borda);padding:10px 14px;font-size:.7rem;color:var(--sb-fraco);display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
.sb-rodape #relogio{color:var(--sb-txt);font-variant-numeric:tabular-nums}

/* modo recolhido (só ícones) */
.app.mini .sb-nome,.app.mini .sb-busca,.app.mini .sb-grupo,.app.mini .nav-item .rot,.app.mini .sb-rodape #versao{display:none}
.app.mini .sb-topo{flex-direction:column;padding:12px 8px}
.app.mini .sb-marca{justify-content:center;flex:none}
.app.mini .sb-nav{padding:10px 8px}
.app.mini .nav-item{justify-content:center;padding:10px 0;position:relative}
.app.mini .nav-item .vivo{position:absolute;top:6px;right:8px}
.app.mini .sb-grupo-sep{display:block}
.sb-grupo-sep{display:none;height:1px;background:var(--sb-borda);margin:10px 6px}
.app.mini .sb-rodape{justify-content:center}

/* ═════════ 4. ABAS ═════════ */
.topo{height:var(--topo-h);flex:none;display:flex;align-items:flex-end;gap:6px;padding:0 10px 0 6px;
  background:var(--creme);border-bottom:1px solid var(--borda);position:relative;z-index:2}
.hamb{display:none;width:38px;height:38px;margin-bottom:6px;border-radius:9px;place-items:center;color:var(--marrom)}
.hamb:hover{background:#f3e8d8}
.abas{flex:1;min-width:0;display:flex;align-items:flex-end;gap:3px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-top:8px}
.abas::-webkit-scrollbar{display:none}
.aba{display:flex;align-items:center;gap:7px;height:38px;padding:0 8px 0 12px;max-width:220px;min-width:0;flex:none;
  border-radius:10px 10px 0 0;border:1px solid transparent;border-bottom:0;color:var(--txt-fraco);font-size:.82rem;font-weight:600;
  position:relative;transition:background var(--trans),color var(--trans)}
.aba:hover{background:#f6ecdd;color:var(--marrom)}
.aba .ico{font-size:.95rem;flex:none}
.aba .rot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aba .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;color:inherit;opacity:.55;font-size:.95rem;line-height:1}
.aba .x:hover{background:rgba(61,31,16,.1);opacity:1}
.aba.ativa{background:var(--fundo);color:var(--marrom);border-color:var(--borda);z-index:1}
.aba.ativa::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--fundo)}
.aba.ativa::before{content:"";position:absolute;left:10px;right:10px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:var(--ouro)}
.aba.fixa{padding-right:12px}
.aba .carregando-pt{width:6px;height:6px;border-radius:50%;background:var(--ouro);animation:pulsar 1s infinite ease-in-out;flex:none}

.topo-acoes{display:flex;gap:4px;margin-bottom:7px;flex:none}
.btn-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--marrom);border:1px solid var(--borda);background:var(--papel);transition:var(--trans)}
.btn-ic:hover:not(:disabled){border-color:var(--ouro);color:var(--ouro-esc);box-shadow:var(--sombra)}
.btn-ic:disabled{opacity:.35;cursor:default}

/* ═════════ 5. PALCO ═════════ */
.palco{flex:1;position:relative;min-height:0;background:var(--fundo)}
.painel{position:absolute;inset:0;visibility:hidden;pointer-events:none;z-index:0}
.painel.ativo{visibility:visible;pointer-events:auto;z-index:1}
.painel iframe{width:100%;height:100%;border:0;display:block;background:var(--papel)}

.carregando{position:absolute;inset:0;display:grid;place-items:center;background:var(--fundo);z-index:2;transition:opacity .25s ease}
.carregando.some{opacity:0;pointer-events:none}
.carregando-box{text-align:center;max-width:340px;padding:0 20px}
.carregando .ico-grande{font-size:2.2rem;margin-bottom:12px;animation:flutuar 1.6s ease-in-out infinite}
.carregando h3{font-family:var(--serif);color:var(--marrom);margin:0 0 6px;font-size:1.12rem}
.carregando p{color:var(--txt-fraco);font-size:.82rem;margin:0;line-height:1.5}
.carregando .barra{height:3px;border-radius:3px;background:var(--borda);margin:16px auto 0;width:160px;overflow:hidden}
.carregando .barra i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--ouro),var(--marrom2));animation:correr 1.1s infinite ease-in-out}
.carregando .dica{margin-top:16px;display:none}
.carregando .dica.mostra{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:.8rem;font-weight:600;
  background:linear-gradient(135deg,var(--marrom),var(--marrom2));color:#f5e6d3;margin-top:10px;text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.claro{background:var(--papel);color:var(--marrom);border:1px solid var(--borda)}

/* ═════════ 6. INÍCIO ═════════ */
.inicio{height:100%;overflow-y:auto;padding:26px clamp(16px,3vw,40px) 40px}
.hero{background:linear-gradient(135deg,var(--marrom-esc) 0%,var(--marrom) 50%,var(--marrom2) 100%);border-radius:16px;
  padding:22px 26px;color:#f5e6d3;display:flex;align-items:center;gap:18px;box-shadow:0 6px 22px rgba(0,0,0,.16);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  border:1px solid rgba(201,162,39,.25);box-shadow:0 0 0 30px rgba(201,162,39,.05)}
.hero-ico{font-size:2rem;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(201,162,39,.4)}
.hero h1{font-family:var(--serif);font-size:1.45rem;margin:0;line-height:1.2}
.hero p{margin:4px 0 0;font-size:.82rem;color:#c9a882}
.hero .data{font-size:.66rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--ouro);font-weight:700;margin-bottom:4px}

.resumo{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--papel);border:1px solid var(--borda);border-radius:20px;padding:6px 12px;font-size:.76rem;color:var(--txt-fraco);box-shadow:var(--sombra)}
.chip b{color:var(--marrom)}

.grupo-titulo{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:.7rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-fraco)}
.grupo-titulo::after{content:"";flex:1;height:1px;background:var(--borda)}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cartao{position:relative;text-align:left;background:var(--papel);border:1px solid var(--borda);border-left:4px solid var(--ouro);
  border-radius:var(--raio);padding:16px 16px 14px;box-shadow:var(--sombra);transition:transform var(--trans),box-shadow var(--trans),border-color var(--trans);
  display:flex;flex-direction:column;gap:8px;min-height:128px}
.cartao:hover{transform:translateY(-2px);box-shadow:var(--sombra-forte);border-color:#e0cba5;border-left-color:var(--marrom2)}
.cartao .topo-c{display:flex;align-items:center;gap:10px}
.cartao .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.25rem;background:var(--creme);border:1px solid var(--borda);flex:none}
.cartao h3{font-family:var(--serif);font-size:1rem;margin:0;color:var(--marrom-esc);line-height:1.2}
.cartao p{margin:0;font-size:.78rem;color:var(--txt-fraco);line-height:1.45;flex:1}
.cartao .pe{display:flex;align-items:center;justify-content:space-between;gap:8px}
.selo{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.64rem;font-weight:700;letter-spacing:.3px}
.selo.externo{background:var(--azul-fundo);color:var(--azul)}
.selo.interno{background:var(--ouro-claro);color:var(--ouro-esc)}
.cartao .aberto-tag{font-size:.68rem;color:var(--marrom2);font-weight:600;display:none}
.cartao.aberto .aberto-tag{display:inline}

.vazio{background:var(--creme);border:1.5px dashed var(--borda);border-radius:14px;padding:22px;color:var(--txt-fraco);font-size:.84rem;line-height:1.6;margin-top:14px}
.vazio code{background:var(--papel);border:1px solid var(--borda);border-radius:5px;padding:1px 6px;font-size:.78rem;color:var(--marrom)}
.erro{border-color:#e9b4ae;background:#fff3f2;color:#7a1a1a}

/* aviso flutuante */
.aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--marrom-esc);color:#f5e6d3;padding:10px 16px;border-radius:10px;
  font-size:.82rem;box-shadow:var(--sombra-forte);opacity:0;transition:var(--trans);z-index:50;pointer-events:none;border-left:3px solid var(--ouro)}
.aviso.mostra{opacity:1;transform:translate(-50%,0)}

.veu{display:none}

@keyframes pulsar{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes correr{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═════════ 7. RESPONSIVO ═════════ */
@media (max-width:860px){
  .app,.app.mini{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;inset:0 auto 0 0;width:min(84vw,290px);z-index:40;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--sombra-forte)}
  .app.gaveta .sb{transform:none}
  .veu{display:block;position:fixed;inset:0;background:rgba(26,15,10,.45);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
  .app.gaveta .veu{opacity:1;pointer-events:auto}
  .sb-mini-btn{display:none}
  /* no celular nunca usa o modo recolhido */
  .app.mini .sb-nome,.app.mini .sb-busca,.app.mini .sb-grupo,.app.mini .nav-item .rot,.app.mini .sb-rodape #versao{display:revert}
  .app.mini .sb-topo{flex-direction:row;padding:14px 12px 12px 14px}
  .app.mini .nav-item{justify-content:flex-start;padding:9px 10px}
  .app.mini .nav-item .vivo{position:static}
  .app.mini .sb-grupo-sep{display:none}
  .hamb{display:grid}
  .aba{max-width:160px}
  .topo-acoes #btnNovaAba{display:none}
  .hero{padding:18px}
  .hero h1{font-size:1.2rem}
  .hero-ico{width:46px;height:46px;font-size:1.6rem}
  .sb-busca kbd{display:none}
}
</style>
</head>

<body>
<div class="app" id="app">

  <!-- ═════════ MENU LATERAL ═════════ -->
  <aside class="sb" id="sb" aria-label="Menu de módulos">
    <div class="sb-topo">
      <button class="sb-marca" id="btnMarca" title="Início">
        <span class="sb-logo" aria-hidden="true">🧵</span>
        <span class="sb-nome"><b>Lila Closet</b><small>Atelier · Hub</small></span>
      </button>
      <button class="sb-mini-btn" id="btnMini" title="Recolher / expandir menu" aria-label="Recolher menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <div class="sb-busca">
      <label for="busca" class="sr">Buscar módulo</label>
      <svg class="lupa" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar módulo…" autocomplete="off">
      <kbd>/</kbd>
    </div>

    <nav class="sb-nav" id="nav"></nav>

    <div class="sb-rodape">
      <span id="relogio">--:--</span>
      <span id="versao">hub</span>
    </div>
  </aside>

  <!-- ═════════ ÁREA PRINCIPAL ═════════ -->
  <main class="principal">
    <header class="topo">
      <button class="hamb" id="btnHamb" aria-label="Abrir menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="abas" id="abas" role="tablist" aria-label="Abas abertas"></div>
      <div class="topo-acoes">
        <button class="btn-ic" id="btnRecarregar" title="Recarregar aba (Alt+R)" aria-label="Recarregar aba">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="btn-ic" id="btnNovaAba" title="Abrir em nova aba do navegador" aria-label="Abrir em nova aba">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
        </button>
      </div>
    </header>

    <section class="palco" id="palco">
      <!-- Painel fixo: INÍCIO -->
      <div class="painel ativo" id="painel-inicio" role="tabpanel">
        <div class="inicio">
          <div class="hero">
            <div class="hero-ico" aria-hidden="true">🧵</div>
            <div>
              <div class="data" id="heroData"></div>
              <h1 id="heroSaudacao">Bem-vinda ao Lila Closet</h1>
              <p>Tudo do atelier num só lugar. Abra um módulo — ele fica vivo em uma aba enquanto você trabalha nos outros.</p>
            </div>
          </div>
          <div class="resumo" id="resumo"></div>
          <div id="catalogo"></div>
        </div>
      </div>
      <!-- painéis das abas são criados aqui pelo JS -->
    </section>
  </main>

  <div class="veu" id="veu"></div>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
/* ═════════ 8. JS ═════════ */
(() => {
  "use strict";

  const INICIO = "inicio";
  const CHAVE = { abas: "lilahub.abas", ativa: "lilahub.ativa", mini: "lilahub.mini" };
  const TZ = "America/Sao_Paulo";

  const $ = (s) => document.querySelector(s);
  const el = {
    app: $("#app"), nav: $("#nav"), busca: $("#busca"), abas: $("#abas"), palco: $("#palco"),
    catalogo: $("#catalogo"), resumo: $("#resumo"), versao: $("#versao"), relogio: $("#relogio"),
    heroData: $("#heroData"), heroSaud: $("#heroSaudacao"), aviso: $("#aviso"),
    btnRecarregar: $("#btnRecarregar"), btnNovaAba: $("#btnNovaAba"),
  };

  /** Estado único do túnel */
  const estado = {
    itens: [],              // catálogo vindo de /api/modulos
    porId: new Map(),       // id → item
    abas: [],               // [{id, titulo, painel, iframe, carregado}]
    ativa: INICIO,
    filtro: "",
  };

  /* ---------- utilitários ---------- */
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const semAcento = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
  const ler = (k, padrao) => {
    try { const v = localStorage.getItem(k); return v === null ? padrao : JSON.parse(v); }
    catch (_) { return padrao; }
  };

  let timerAviso;
  function avisar(texto) {
    el.aviso.textContent = texto;
    el.aviso.classList.add("mostra");
    clearTimeout(timerAviso);
    timerAviso = setTimeout(() => el.aviso.classList.remove("mostra"), 2600);
  }

  const abaDe = (id) => estado.abas.find((a) => a.id === id);
  const ehCelular = () => matchMedia("(max-width:860px)").matches;

  /** URL efetiva do iframe. Módulos internos recebem ?hub=1 (sabem que estão no túnel). */
  function urlDo(item) {
    if (item.tipo !== "interno") return item.url;
    return item.url + (item.url.includes("?") ? "&" : "?") + "hub=1";
  }

  /* ---------- catálogo ---------- */
  async function carregarCatalogo() {
    el.catalogo.innerHTML = '<div class="vazio">Carregando módulos…</div>';
    try {
      const r = await fetch("/api/modulos", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const dados = await r.json();
      estado.itens = dados.itens || [];
      estado.porId = new Map(estado.itens.map((i) => [i.id, i]));
      el.versao.textContent = "hub v" + (dados.versao || "?");
      return true;
    } catch (e) {
      el.catalogo.innerHTML =
        `<div class="vazio erro">Não consegui carregar a lista de módulos (${esc(e.message)}).<br>
         Se o servidor acabou de acordar, tente de novo em alguns segundos.<br>
         <button class="btn" id="btnTentar">⟳ Tentar de novo</button></div>`;
      $("#btnTentar").onclick = iniciar;
      return false;
    }
  }

  /** Agrupa respeitando a menor "ordem" de cada grupo */
  function agrupados(itens) {
    const mapa = new Map();
    for (const i of itens) {
      if (!mapa.has(i.grupo)) mapa.set(i.grupo, []);
      mapa.get(i.grupo).push(i);
    }
    return [...mapa.entries()].sort((a, b) => {
      const oa = Math.min(...a[1].map((i) => i.ordem)), ob = Math.min(...b[1].map((i) => i.ordem));
      return oa - ob || a[0].localeCompare(b[0], "pt-BR");
    });
  }

  function filtrados() {
    const f = semAcento(estado.filtro.trim());
    if (!f) return estado.itens;
    return estado.itens.filter((i) => semAcento(`${i.titulo} ${i.descricao} ${i.grupo}`).includes(f));
  }

  /* ---------- render: menu lateral ---------- */
  function renderNav() {
    const lista = filtrados();
    if (!lista.length) {
      el.nav.innerHTML = `<div class="sb-vazio">${estado.itens.length ? "Nada encontrado." : "Nenhum módulo ainda."}</div>`;
      return;
    }
    let h = `<button class="nav-item ${estado.ativa === INICIO ? "ativo" : ""}" data-id="${INICIO}" title="Início">
               <span class="ico">🏠</span><span class="rot">Início</span><span class="vivo"></span></button>`;
    for (const [grupo, itens] of agrupados(lista)) {
      h += `<div class="sb-grupo">${esc(grupo)}</div><div class="sb-grupo-sep"></div>`;
      for (const i of itens) {
        const cls = [estado.ativa === i.id && "ativo", abaDe(i.id) && "aberto"].filter(Boolean).join(" ");
        h += `<button class="nav-item ${cls}" data-id="${esc(i.id)}" title="${esc(i.titulo)}">
                <span class="ico">${esc(i.icone)}</span><span class="rot">${esc(i.titulo)}</span><span class="vivo"></span></button>`;
      }
    }
    el.nav.innerHTML = h;
  }

  /* ---------- render: Início (cartões) ---------- */
  function renderInicio() {
    const lista = filtrados();
    const nInt = estado.itens.filter((i) => i.tipo === "interno").length;
    const nExt = estado.itens.length - nInt;
    el.resumo.innerHTML =
      `<span class="chip">📦 <b>${estado.itens.length}</b> módulos</span>
       <span class="chip">🌐 <b>${nExt}</b> sistemas hospedados</span>
       <span class="chip">🧩 <b>${nInt}</b> módulos HTML</span>
       <span class="chip">🗂️ <b>${estado.abas.length}</b> abas abertas</span>`;

    let h = "";
    for (const [grupo, itens] of agrupados(lista)) {
      h += `<div class="grupo-titulo">${esc(grupo)}</div><div class="cartoes">`;
      for (const i of itens) {
        h += `<button class="cartao ${abaDe(i.id) ? "aberto" : ""}" data-id="${esc(i.id)}">
                <div class="topo-c"><span class="ico">${esc(i.icone)}</span><h3>${esc(i.titulo)}</h3></div>
                <p>${esc(i.descricao || "—")}</p>
                <div class="pe">
                  <span class="selo ${i.tipo}">${i.tipo === "externo" ? "hospedado" : "HTML"}</span>
                  <span class="aberto-tag">● aberto</span>
                </div>
              </button>`;
      }
      h += `</div>`;
    }
    if (!lista.length && estado.filtro) h = `<div class="vazio">Nenhum módulo com “${esc(estado.filtro)}”.</div>`;
    if (nInt === 0 && !estado.filtro) {
      h += `<div class="vazio"><b>Como adicionar módulos novos:</b> coloque um arquivo
            <code>.html</code> em <code>hub/modulos/</code> (ex.: <code>painel-do-dia.html</code>) ou uma pasta com
            <code>index.html</code>, faça o push — ele aparece aqui sozinho, sem mexer no <code>main.py</code>.
            Ícone, grupo e ordem vêm de <code>&lt;meta name="hub-icone"&gt;</code>, <code>hub-grupo</code> e <code>hub-ordem</code>.</div>`;
    }
    el.catalogo.innerHTML = h;
  }

  /* ---------- render: barra de abas ---------- */
  function renderAbas() {
    let h = `<button class="aba fixa ${estado.ativa === INICIO ? "ativa" : ""}" role="tab" data-id="${INICIO}"
               aria-selected="${estado.ativa === INICIO}" title="Início (Alt+1)"><span class="ico">🏠</span><span class="rot">Início</span></button>`;
    estado.abas.forEach((a, n) => {
      const item = estado.porId.get(a.id) || {};
      const at = estado.ativa === a.id;
      const atalho = n + 2 <= 9 ? ` (Alt+${n + 2})` : "";
      h += `<div class="aba ${at ? "ativa" : ""}" role="tab" tabindex="0" data-id="${esc(a.id)}" aria-selected="${at}" title="${esc(a.titulo)}${atalho}">
              ${a.iframe && !a.carregado ? '<span class="carregando-pt"></span>' : `<span class="ico">${esc(item.icone || "📄")}</span>`}
              <span class="rot">${esc(a.titulo)}</span>
              <button class="x" data-fechar="${esc(a.id)}" title="Fechar (Alt+W)" aria-label="Fechar ${esc(a.titulo)}">×</button>
            </div>`;
    });
    el.abas.innerHTML = h;
    el.abas.querySelector(".aba.ativa")?.scrollIntoView({ block: "nearest", inline: "nearest" });
    const naInicio = estado.ativa === INICIO;
    el.btnRecarregar.disabled = naInicio;
    el.btnNovaAba.disabled = naInicio;
  }

  function renderTudo() { renderNav(); renderInicio(); renderAbas(); }

  /* ---------- painel + iframe de uma aba ---------- */
  function montarPainel(aba) {
    const item = estado.porId.get(aba.id);
    const p = document.createElement("div");
    p.className = "painel";
    p.setAttribute("role", "tabpanel");
    p.innerHTML =
      `<div class="carregando">
         <div class="carregando-box">
           <div class="ico-grande">${esc(item.icone)}</div>
           <h3>Abrindo ${esc(item.titulo)}…</h3>
           <p>${item.tipo === "externo" ? "Sistema hospedado — na primeira abertura do dia ele pode levar até ~1 minuto para acordar." : "Carregando módulo."}</p>
           <div class="barra"><i></i></div>
           <div class="dica">
             <p>Está demorando? Alguns sistemas não deixam abrir dentro de outra página.</p>
             <a class="btn claro" href="${esc(item.url)}" target="_blank" rel="noopener">↗ Abrir em nova aba</a>
           </div>
         </div>
       </div>`;
    const f = document.createElement("iframe");
    f.title = item.titulo;
    f.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation");
    f.addEventListener("load", () => {
      aba.carregado = true;
      p.querySelector(".carregando").classList.add("some");
      renderAbas();
    });
    p.appendChild(f);
    el.palco.appendChild(p);
    aba.painel = p;
    aba.iframe = f;
    aba.carregado = false;
    setTimeout(() => { if (!aba.carregado) p.querySelector(".dica")?.classList.add("mostra"); }, 12000);
    f.src = urlDo(item);
  }

  /* ---------- ações principais ---------- */
  function ativar(id) {
    if (id !== INICIO && !abaDe(id)) return abrir(id);
    estado.ativa = id;
    const aba = abaDe(id);
    if (aba && !aba.painel) montarPainel(aba);       // iframe preguiçoso
    document.querySelectorAll(".palco > .painel").forEach((p) => p.classList.remove("ativo"));
    (id === INICIO ? $("#painel-inicio") : aba.painel).classList.add("ativo");
    history.replaceState(null, "", id === INICIO ? location.pathname : "#/" + id);
    document.title = (id === INICIO ? "Início" : aba.titulo) + " · Lila Closet";
    el.app.classList.remove("gaveta");
    salvar();
    renderTudo();
  }

  function abrir(id) {
    if (id === INICIO) return ativar(INICIO);
    const item = estado.porId.get(id);
    if (!item) { avisar("Módulo não encontrado: " + id); return; }
    if (!abaDe(id)) estado.abas.push({ id, titulo: item.titulo, painel: null, iframe: null, carregado: false });
    ativar(id);
  }

  function fechar(id) {
    const n = estado.abas.findIndex((a) => a.id === id);
    if (n < 0) return;
    const [aba] = estado.abas.splice(n, 1);
    aba.painel?.remove();                            // libera memória do iframe
    if (estado.ativa === id) {
      const vizinha = estado.abas[n] || estado.abas[n - 1];
      ativar(vizinha ? vizinha.id : INICIO);
    } else { salvar(); renderTudo(); }
  }

  function recarregar() {
    const aba = abaDe(estado.ativa);
    if (!aba?.iframe) return;
    aba.carregado = false;
    aba.painel.querySelector(".carregando").classList.remove("some");
    aba.iframe.src = urlDo(estado.porId.get(aba.id));
    renderAbas();
  }

  function novaAbaNavegador() {
    const item = estado.porId.get(estado.ativa);
    if (item) window.open(item.url, "_blank", "noopener");
  }

  function salvar() {
    guardar(CHAVE.abas, estado.abas.map((a) => a.id));
    guardar(CHAVE.ativa, estado.ativa);
  }

  /* ---------- eventos ---------- */
  el.nav.addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]"); if (b) abrir(b.dataset.id);
  });
  el.catalogo.addEventListener("click", (e) => {
    const b = e.target.closest(".cartao[data-id]"); if (b) abrir(b.dataset.id);
  });
  el.abas.addEventListener("click", (e) => {
    const x = e.target.closest("[data-fechar]");
    if (x) { e.stopPropagation(); return fechar(x.dataset.fechar); }
    const a = e.target.closest(".aba[data-id]"); if (a) ativar(a.dataset.id);
  });
  el.abas.addEventListener("auxclick", (e) => {     // clique do meio fecha
    const a = e.target.closest(".aba[data-id]");
    if (e.button === 1 && a && a.dataset.id !== INICIO) { e.preventDefault(); fechar(a.dataset.id); }
  });
  el.abas.addEventListener("keydown", (e) => {
    const a = e.target.closest(".aba[data-id]");
    if (a && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ativar(a.dataset.id); }
  });
  el.abas.addEventListener("wheel", (e) => {        // rolar abas com a roda do mouse
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.abas.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });

  el.busca.addEventListener("input", () => { estado.filtro = el.busca.value; renderNav(); renderInicio(); });
  el.busca.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const p = filtrados()[0]; if (p) { abrir(p.id); el.busca.value = ""; estado.filtro = ""; renderTudo(); } }
    if (e.key === "Escape") { el.busca.value = ""; estado.filtro = ""; el.busca.blur(); renderTudo(); }
  });

  $("#btnMarca").onclick = () => ativar(INICIO);
  $("#btnMini").onclick = () => { el.app.classList.toggle("mini"); guardar(CHAVE.mini, el.app.classList.contains("mini")); };
  $("#btnHamb").onclick = () => el.app.classList.add("gaveta");
  $("#veu").onclick = () => el.app.classList.remove("gaveta");
  el.btnRecarregar.onclick = recarregar;
  el.btnNovaAba.onclick = novaAbaNavegador;

  document.addEventListener("keydown", (e) => {
    const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if (e.key === "/" && !digitando) {
      e.preventDefault();
      if (ehCelular()) el.app.classList.add("gaveta");
      el.busca.focus();
      return;
    }
    if (!e.altKey) return;
    if (/^[1-9]$/.test(e.key)) {
      e.preventDefault();
      const n = +e.key;
      if (n === 1) ativar(INICIO); else if (estado.abas[n - 2]) ativar(estado.abas[n - 2].id);
    } else if (e.key.toLowerCase() === "w" && estado.ativa !== INICIO) { e.preventDefault(); fechar(estado.ativa); }
    else if (e.key.toLowerCase() === "r" && estado.ativa !== INICIO) { e.preventDefault(); recarregar(); }
  });

  window.addEventListener("hashchange", () => {
    const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    if (id && id !== estado.ativa) abrir(id);
  });

  /* Mensagens dos módulos (só da MESMA origem — módulos HTML do hub) */
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const d = e.data;
    if (!d || typeof d !== "object" || !d.hub) return;
    const origem = estado.abas.find((a) => a.iframe && a.iframe.contentWindow === e.source);
    if (d.hub === "abrir" && d.id) abrir(String(d.id));
    else if (d.hub === "titulo" && origem && d.texto) { origem.titulo = String(d.texto).slice(0, 60); renderAbas(); if (estado.ativa === origem.id) document.title = origem.titulo + " · Lila Closet"; }
    else if (d.hub === "aviso" && d.texto) avisar(String(d.texto).slice(0, 140));
    else if (d.hub === "fechar" && origem) fechar(origem.id);
  });

  /* ---------- relógio + saudação (horário de Brasília) ---------- */
  function relogio() {
    const agora = new Date();
    el.relogio.textContent = agora.toLocaleTimeString("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
    el.heroData.textContent = agora.toLocaleDateString("pt-BR", { timeZone: TZ, weekday: "long", day: "2-digit", month: "long" });
    const h = +agora.toLocaleString("pt-BR", { timeZone: TZ, hour: "2-digit", hour12: false });
    el.heroSaud.textContent = (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + " · Lila Closet Atelier";
  }

  /* ---------- início ---------- */
  async function iniciar() {
    if (ler(CHAVE.mini, false)) el.app.classList.add("mini");
    relogio(); setInterval(relogio, 30000);

    if (!(await carregarCatalogo())) { renderNav(); renderAbas(); return; }

    // restaura abas (sem criar iframe — só quando você clicar nelas)
    for (const id of ler(CHAVE.abas, [])) {
      const item = estado.porId.get(id);
      if (item && !abaDe(id)) estado.abas.push({ id, titulo: item.titulo, painel: null, iframe: null, carregado: false });
    }
    const doLink = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const salva = ler(CHAVE.ativa, INICIO);
    if (doLink && estado.porId.has(doLink)) abrir(doLink);
    else if (salva !== INICIO && abaDe(salva)) ativar(salva);
    else ativar(INICIO);
  }

  iniciar();
})();
</script>
</body>
</html>
