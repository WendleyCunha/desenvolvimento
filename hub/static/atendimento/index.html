<script>/* EMPRESAS: aberto como /<empresa>/atendimento/ → as chamadas /api/… vão para /<empresa>/api/… */
(function () { var m = location.pathname.match(/^\/([a-z0-9][a-z0-9-]{1,30})\/atendimento(\/|$)/); if (m && m[1] === "atendimento") m = null; window.HUB_BASE = m ? "/" + m[1] : "";
  if (!m) return; var f = window.fetch; window.fetch = function (u, o) { return f.call(this, typeof u === "string" && u.indexOf("/api/") === 0 ? window.HUB_BASE + u : u, o); };
  document.addEventListener("DOMContentLoaded", function () { document.querySelectorAll('link[rel="manifest"]').forEach(function (l) { l.setAttribute("href", window.HUB_BASE + l.getAttribute("href")); }); }); })();</script>

<!--
═══════════════════════════════════════════════════════════════════════════════
 static/atendimento/index.html — LINK DE ATENDIMENTO (servido em /atendimento/)
 Bot de boas-vindas → CPF → 2 perguntas do cadastro do ERP → chat com a central.
 Só atendimento: sem pedidos, sem chamados (isso é o app, /cliente/).
 Textos do bot: Atendimento › Ajustes › Wwhat. API: /api/cliente/atendimento/*
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--noite);color:var(--txt);font-size:15px;-webkit-tap-highlight-color:transparent}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
.topo{margin:max(10px,env(safe-area-inset-top)) 12px 0;padding:10px 12px;border-radius:20px;display:flex;align-items:center;gap:12px;flex:none}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.88),rgba(8,10,16,.82))}
html[data-claro] .topo.vidro{background:rgba(255,255,255,.82)}
.topo .tx{min-width:0;flex:1}
.topo b{display:block;font:700 1rem/1.25 var(--titulo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt2)}
.topo small i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.topo .btn-ic{flex:none}
.fio{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.bolha{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:.94rem;line-height:1.5;animation:entra .22s var(--suave)}
.bolha.bot,.bolha.central{align-self:flex-start;border-bottom-left-radius:6px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--vidro-borda);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
html[data-claro] .bolha.bot,html[data-claro] .bolha.central{background:rgba(255,255,255,.85)}
.bolha.cli{align-self:flex-end;border-bottom-right-radius:6px;background:var(--grad-ouro);color:#1a1206;font-weight:500;box-shadow:0 12px 28px -14px rgba(var(--ouro-rgb),.9),inset 0 1px 0 rgba(255,255,255,.35)}
.bolha.pend{opacity:.7}
.bolha small{display:block;font-size:.68rem;opacity:.65;margin-top:4px}
.bolha .quem{display:block;font:600 .64rem var(--titulo);letter-spacing:.12em;text-transform:uppercase;color:var(--ouro2);margin-bottom:3px}
.bolha.central .quem{color:var(--ciano)}
.bolha.erro{border-color:rgba(251,113,133,.45)}
.digitando{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;border-radius:18px;border-bottom-left-radius:6px;border:1px solid var(--vidro-borda);background:rgba(255,255,255,.04)}
.digitando i{width:7px;height:7px;border-radius:50%;background:var(--txt3);animation:pula 1s infinite}
.digitando i:nth-child(2){animation-delay:.15s}.digitando i:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bolha,.opcoes,.digitando i{animation:none}}
.opcoes{display:flex;flex-direction:column;gap:8px;align-self:stretch;animation:entra .22s var(--suave)}
.op{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--vidro-borda);color:var(--txt);font:inherit;cursor:pointer;transition:.22s var(--suave)}
html[data-claro] .op{background:rgba(255,255,255,.75)}
.op:hover,.op:focus-visible{border-color:rgba(var(--ouro-rgb),.55);box-shadow:0 0 24px -8px rgba(var(--ouro-rgb),.6)}
.op .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;font:700 .86rem var(--titulo);color:var(--ouro2);background:rgba(var(--ouro-rgb),.12);border:1px solid rgba(var(--ouro-rgb),.35)}
.op[disabled]{opacity:.45;cursor:default;box-shadow:none}
.passo{align-self:center;font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);border:1px solid var(--vidro-borda);border-radius:20px;padding:3px 10px;background:rgba(255,255,255,.03)}
.app-conv{align-self:stretch;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1px dashed rgba(var(--ouro-rgb),.45);background:rgba(var(--ouro-rgb),.06);font-size:.82rem;color:var(--txt2);text-decoration:none}
.app-conv b{color:var(--ouro2)}
.compor{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.compor .caixa{display:flex;gap:8px;align-items:flex-end;padding:6px 6px 6px 14px;border-radius:22px;background:linear-gradient(135deg,rgba(14,17,26,.94),rgba(8,10,16,.9))}
html[data-claro] .compor .caixa{background:rgba(255,255,255,.92)}
.compor textarea{flex:1;border:0;outline:none;background:transparent;resize:none;max-height:120px;min-height:24px;padding:8px 0;line-height:1.4;color:var(--txt);font:inherit}
.compor textarea::placeholder{color:var(--txt3)}
.compor .btn{width:42px;height:42px;padding:0;border-radius:50%;flex:none}
.compor .btn[disabled]{opacity:.35;transform:none;box-shadow:none;cursor:default}
.compor.oculto{display:none}
.recomecar{align-self:center}
.oculto{display:none!important}
.compor textarea.senha{-webkit-text-security:disc;letter-spacing:4px}
</style>
</head>
<body>
<div class="app">
  <header class="topo vidro"><span id="logo"></span><div class="tx"><b id="emp">Atendimento</b><small><i></i><span id="sub">Online</span></small></div>
    <button type="button" class="btn-ic oculto" id="sair" title="Sair deste aparelho"></button></header>
  <div class="fio" id="fio" aria-live="polite"></div>
  <div class="compor" id="compor"><div class="caixa vidro"><textarea id="txt" rows="1" placeholder="Digite aqui…" autocomplete="off"></textarea><button type="button" class="btn p" id="env" disabled aria-label="Enviar"></button></div></div>
</div>
<script src="/static/aurora.js?v=6"></script>
<script src="/static/chatfmt.js?v=1"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, $ = (s) => document.querySelector(s);
A.fundo();
$("#logo").outerHTML = A.atomo(34);
$("#env").innerHTML = A.svg("seta");
$("#sair").innerHTML = A.svg("sair");
const API = "/api/cliente/atendimento";
/* o mesmo acesso guardado no aparelho: se o navegador (ex.: o do WhatsApp) apagar o cookie ao fechar a aba,
   reabrir o link continua a conversa sem validar de novo (vale 12 h, como o cookie) */
const CHAVE_TK = "wd.atend.tk" + (window.HUB_BASE || "");
const tkGet = () => { try { return localStorage.getItem(CHAVE_TK) || ""; } catch (_) { return ""; } };
const tkSet = (v) => { try { v ? localStorage.setItem(CHAVE_TK, v) : localStorage.removeItem(CHAVE_TK); } catch (_) {} };
async function api(url, { method = "GET", body } = {}) {
  const h = body !== undefined ? { "Content-Type": "application/json" } : {}; const tk = tkGet(); if (tk) h["X-Atend-Token"] = tk;
  const r = await fetch(url, { method, credentials: "same-origin", cache: "no-store", headers: h, body: body !== undefined ? JSON.stringify(body) : undefined });
  let d = null; try { d = await r.json(); } catch (_) {}
  if (!r.ok) { if (r.status === 401) tkSet(""); const e = new Error((d && d.detail) || "Não foi possível agora. Tente de novo."); e.status = r.status; throw e; }
  return d;
}
const fio = $("#fio"), txt = $("#txt"), env = $("#env");
const hora = (s) => String(s || "").slice(11, 16);
const agora = () => { const d = new Date(), z = (n) => String(n).padStart(2, "0"); return `${z(d.getHours())}:${z(d.getMinutes())}`; };
const novoReq = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 32);
const fmt = (t) => window.ChatFmt ? ChatFmt.fmt(t) : esc(t);
const S = { fase: "cpf", conversa: "", errosCpf: 0, pergunta: null, ocupado: false, chatAtivo: false, ultimas: "", pend: [], timer: 0 };

/* ── desenho ── */
const fim = () => requestAnimationFrame(() => { fio.scrollTop = fio.scrollHeight; });
function bolha(classe, html) { const d = document.createElement("div"); d.className = "bolha " + classe; d.innerHTML = html; fio.appendChild(d); fim(); return d; }
const bot = (t, extra = "") => bolha("bot " + extra, `<span class="quem">Assistente</span>${fmt(t)}<small>${agora()}</small>`);
const eu = (t) => bolha("cli", `${esc(t)}<small>${agora()}</small>`);
function digitando(ms = 650) { const d = document.createElement("div"); d.className = "digitando"; d.innerHTML = "<i></i><i></i><i></i>"; fio.appendChild(d); fim();
  return new Promise((r) => setTimeout(() => { d.remove(); r(); }, ms)); }
function marca(t) { const d = document.createElement("div"); d.className = "passo"; d.textContent = t; fio.appendChild(d); fim(); }
function modo(placeholder, numerico) { txt.placeholder = placeholder; txt.inputMode = numerico ? "numeric" : "text"; txt.value = ""; env.disabled = true; $("#compor").classList.remove("oculto"); }
function opcoes(lista) {
  const box = document.createElement("div"); box.className = "opcoes";
  box.innerHTML = lista.map((o, i) => `<button type="button" class="op" data-op="${i + 1}"><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`).join("");
  box.querySelectorAll("[data-op]").forEach((b) => (b.onclick = () => { if (S.ocupado) return; box.querySelectorAll("button").forEach((x) => (x.disabled = true)); responder(b.dataset.op, lista[+b.dataset.op - 1]); }));
  fio.appendChild(box); fim();
}
function mascaraCpf(v) { const d = v.replace(/\D/g, ""); return d.length === 11 ? `***.***.${d.slice(6, 9)}-${d.slice(9)}` : v; }

/* ── validação ── */
async function perguntar(p, passo, total) {
  S.pergunta = p;
  await digitando();
  if (passo) marca(`Confirmação ${passo} de ${total}`);
  bot(p.texto);
  if (p.opcoes) { opcoes(p.opcoes); modo("Toque numa opção ou digite o número", true); }
  else modo("Digite só os números", true);   // toda confirmação se responde com números
  txt.focus();
}
async function enviarCpf(v) {
  eu(mascaraCpf(v)); S.ocupado = true;
  try { const r = await api(API + "/cpf", { method: "POST", body: { cpf: v } }); S.conversa = r.conversa; S.fase = "pergunta"; await perguntar(r.pergunta, r.passo, r.total); }
  catch (e) {
    await digitando(500);
    if (e.status === 404 || e.status === 422) {   // CPF não achado (ou digitado errado): mais 3 chances, com calma
      S.errosCpf++;
      const fala = ["Dessa vez eu não achei 🤔 Vamos tentar pela segunda vez?", "Humm, ainda não achei. Vamos tentar mais uma vez?",
        "Uau! Algo digitado não está correto ou esse CPF não tem cadastro. Vamos tentar a última vez?"][S.errosCpf - 1];
      if (fala) { bot(fala); modo("CPF (só números)", true); txt.focus(); return; }
      return semIdentificacao("Tudo bem, acontece! 😊 Vou te passar para o atendimento mesmo assim.");
    }
    if (e.status === 409) return semIdentificacao("Não consigo confirmar seus dados por aqui, mas tudo bem — vou te passar para o atendimento. 😊");
    bot(e.message || "Não consegui agora. Tente de novo.", "erro"); if (e.status === 429 || e.status === 503) acabou(); else modo("CPF (só números)", true);
  }
  finally { S.ocupado = false; }
}
async function semIdentificacao(fala) {
  bot(fala); S.fase = "nome";
  await digitando(600); bot("Como posso te chamar?"); modo("Seu nome", false); txt.focus();
}
async function enviarNome(v) {
  eu(v); S.ocupado = true;
  try { const r = await api(API + "/visitante", { method: "POST", body: { nome: v } }); tkSet(r.tk); await digitando(); bot(r.direcionando); S.visitante = true; entrarNoChat(r.nome, false); }
  catch (e) { await digitando(400); bot(e.message || "Não consegui agora. Tente de novo.", "erro"); if (e.status === 429 || e.status === 503) acabou(); else modo("Seu nome", false); }
  finally { S.ocupado = false; }
}
async function responder(v, rotulo) {
  eu(rotulo || v); S.ocupado = true;
  try {
    const r = await api(API + "/resposta", { method: "POST", body: { conversa: S.conversa, resposta: v } });
    if (r.validado) { tkSet(r.tk); await digitando();
      if (r.continua) bot(`Pronto, ${r.nome}! ✅ Você já está em atendimento${r.continua.atendente ? " com " + r.continua.atendente : ""} — vou continuar a mesma conversa. 👇`);
      else bot(r.direcionando);
      entrarNoChat(r.nome, !r.continua); return; }
    if (r.fim) { await digitando(); bot(r.msg, "erro"); acabou(); return; }
    if (r.msg) { await digitando(400); bot(r.msg, "erro"); }
    await perguntar(r.pergunta, r.passo, r.total);
  } catch (e) { await digitando(400); bot(e.message || "Não consegui agora. Tente de novo.", "erro"); if (e.status === 410) recomecar(); else acabou(); }
  finally { S.ocupado = false; }
}
function acabou() {
  $("#compor").classList.add("oculto");
  const b = document.createElement("button"); b.type = "button"; b.className = "btn v recomecar"; b.textContent = "Começar de novo";
  b.onclick = () => { b.remove(); recomecar(); }; fio.appendChild(b); fim();
}
async function recomecar() { S.fase = "cpf"; S.conversa = ""; S.errosCpf = 0; await digitando(); bot(S.info.pedir_cpf); modo("CPF (só números)", true); txt.focus(); }

/* ── chat com a central ── */
function entrarNoChat(nome, agoraMesmo) {
  S.fase = "chat"; $("#sub").textContent = nome ? `Olá, ${nome}` : "Online";
  $("#sair").classList.remove("oculto");
  const fn = S.info && S.info.funcionamento;
  if (fn && fn.aberto === false) bot("🕘 " + (fn.msg || "Estamos fora do horário de atendimento."));   // Ajustes › Wwhat
  if (!S.visitante) oferecerApp();
  oferecerAvisos();
  S.areaChat = document.createElement("div"); S.areaChat.style.cssText = "display:flex;flex-direction:column;gap:10px";
  fio.appendChild(S.areaChat);
  modo("Escreva sua mensagem…", false);
  atualizar(); clearInterval(S.timer); S.timer = setInterval(() => document.visibilityState === "visible" && atualizar(), 5000);
}
async function atualizar() {
  try {
    const r = await api(API + "/chat");
    S.pend = S.pend.filter((p) => !r.mensagens.some((m) => m.de === "cliente" && m.texto === p.texto));
    const chave = JSON.stringify([r.id, r.mensagens.length, S.pend.length]);
    if (S.chatAtivo && !r.ativo) { S.ultimas = ""; S.chatAtivo = false; S.areaChat = null; bot("Este atendimento foi encerrado pela central. Se precisar de mais alguma coisa, é só escrever aqui. 😉");
      S.areaChat = document.createElement("div"); S.areaChat.style.cssText = "display:flex;flex-direction:column;gap:10px"; fio.appendChild(S.areaChat); return; }
    S.chatAtivo = r.ativo;
    if (chave === S.ultimas) return; S.ultimas = chave;
    S.areaChat.innerHTML = r.mensagens.map((m) => `<div class="bolha ${m.de === "cliente" ? "cli" : "central"}">${m.de !== "cliente" ? `<span class="quem">${esc(m.autor ? m.autor + " · Central" : "Central")}</span>` : ""}${fmt(m.texto)}${window.ChatFmt ? ChatFmt.anexos(m.anexos, (id) => `${window.HUB_BASE || ""}${API}/anexo/${id}`) : ""}<small>${hora(m.data)}</small></div>`).join("")
      + S.pend.map((p) => `<div class="bolha cli pend">${esc(p.texto)}<small>enviando…</small></div>`).join("");
    fim();
  } catch (e) { if (e.status === 401) { clearInterval(S.timer); bot(e.message, "erro"); S.fase = "cpf"; $("#sair").classList.add("oculto"); recomecar(); } }
}
async function enviarMsg(v) {
  const p = { texto: v, req: novoReq() }; S.pend.push(p); S.ultimas = ""; await atualizar();
  try { await api(API + "/mensagem", { method: "POST", body: p }); }
  catch (e) { S.pend = S.pend.filter((x) => x !== p); bot(e.message || "Não consegui enviar. Tente de novo.", "erro"); if (e.status === 401) return; txt.value = v; env.disabled = false; }
  S.ultimas = ""; atualizar();
}

/* ── instalar o app: com a validação feita aqui, o cliente cria uma SENHA e este aparelho fica conectado ao app
   (entra direto por 30 dias; depois pede a senha). Em outro aparelho: CPF + senha. ── */
function oferecerApp() {
  if (S.ofereceuApp) return; S.ofereceuApp = true;
  const b = document.createElement("button"); b.type = "button"; b.className = "app-conv"; b.style.cssText = "cursor:pointer;font:inherit;text-align:left;width:100%";
  b.innerHTML = `<span style="font-size:1.3rem">📲</span><span>Quer acompanhar seus pedidos, a entrega e os cupons pelo app? <b>Instalar o app</b> — você cria uma senha e este celular fica conectado.</span>`;
  b.onclick = async () => { b.remove(); S.faseAntes = S.fase; S.fase = "senha1"; await digitando(400);
    bot("Ótimo! 🔐 Crie uma senha para o app — pode ser 6 números. Não use datas nem sequências (123456)."); modo("Sua nova senha", true); txt.classList.add("senha"); txt.focus(); };
  fio.appendChild(b); fim();
}
async function senhaApp(v) {
  eu("••••••");
  if (S.fase === "senha1") {
    if (v.length < 6) { await digitando(300); bot("A senha precisa ter pelo menos 6 caracteres. Tente de novo:", "erro"); modo("Sua nova senha", true); return; }
    S.senhaNova = v; S.fase = "senha2"; await digitando(300); bot("Digite a mesma senha de novo, para confirmar:"); modo("Repita a senha", true); return;
  }
  if (v !== S.senhaNova) { S.fase = "senha1"; await digitando(300); bot("As senhas não bateram. Vamos de novo — crie a senha:", "erro"); modo("Sua nova senha", true); return; }
  S.ocupado = true;
  try {
    const r = await api(API + "/instalar", { method: "POST", body: { senha: v } });
    txt.classList.remove("senha"); S.senhaNova = ""; await digitando();
    bot("Pronto! ✅ Senha criada e este celular está conectado ao app. Vou abrir o app — lá, toque em 📲 para colocar na tela inicial.");
    const a = document.createElement("a"); a.className = "app-conv"; a.href = r.url; a.innerHTML = `<span style="font-size:1.3rem">📲</span><span><b>Abrir o app</b> — pedidos, entrega, chamados e cupons.</span>`;
    fio.appendChild(a); fim(); S.fase = S.faseAntes || "chat"; modo("Escreva sua mensagem…", false);
    setTimeout(() => { location.href = r.url; }, 1800);
  } catch (e) { await digitando(300); bot(e.message || "Não consegui criar a senha agora.", "erro"); S.fase = "senha1"; modo("Sua nova senha", true); }
  finally { S.ocupado = false; }
}

/* ── avisos no celular: a central pode CHAMAR o cliente (botão Chamar do CX/ERP) ── */
const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent), instalado = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const pushOk = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64u = (s) => { const p = "=".repeat((4 - (s.length % 4)) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map((c) => c.charCodeAt(0))); };
async function inscrever(silencioso) {
  try {
    const base = window.HUB_BASE || "", reg = await navigator.serviceWorker.register(base + "/atendimento/sw.js", { scope: base + "/atendimento/" });
    await navigator.serviceWorker.ready;
    const { publica } = await api("/api/cliente/push/chave");
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(publica) }));
    await api(API + "/push", { method: "POST", body: { inscricao: sub.toJSON() } });
    if (!silencioso) bot("Pronto! 🔔 Se a central te chamar, você recebe um aviso neste celular — mesmo com esta página fechada.");
  } catch (e) { if (!silencioso) bot("Não consegui ativar os avisos neste navegador. Sem problema: a conversa continua aqui.", "erro"); }
}
function oferecerAvisos() {
  if (S.ofereceu) return; S.ofereceu = true;
  if (!pushOk()) { if (ehIOS && !instalado) bot("Dica: no iPhone, para receber avisos quando a central te chamar, toque em Compartilhar › Adicionar à Tela de Início e abra por lá."); return; }
  if (Notification.permission === "granted") { inscrever(true); return; }
  if (Notification.permission === "denied") return;
  const b = document.createElement("button"); b.type = "button"; b.className = "app-conv"; b.style.cssText = "cursor:pointer;font:inherit;text-align:left;width:100%";
  b.innerHTML = `<span style="font-size:1.3rem">🔔</span><span>Quer ser avisado quando a central te chamar? <b>Ativar avisos</b></span>`;
  b.onclick = async () => { b.remove(); const perm = await Notification.requestPermission(); if (perm === "granted") inscrever(false); else bot("Tudo bem! Sem avisos — é só voltar neste link quando quiser."); };
  fio.appendChild(b); fim();
}

/* ── caixa de digitar ── */
txt.oninput = () => { env.disabled = !txt.value.trim() || S.ocupado; txt.style.height = "auto"; txt.style.height = Math.min(txt.scrollHeight, 120) + "px"; };
txt.onkeydown = (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); enviar(); } };
env.onclick = enviar;
function enviar() {
  const v = txt.value.trim(); if (!v || S.ocupado) return;
  txt.value = ""; txt.style.height = "auto"; env.disabled = true;
  if (S.fase === "cpf") enviarCpf(v);
  else if (S.fase === "nome") enviarNome(v);
  else if (S.fase === "senha1" || S.fase === "senha2") senhaApp(v);
  else if (S.fase === "pergunta") { const op = S.pergunta && S.pergunta.opcoes; const n = parseInt(v, 10); if (op && op[n - 1]) { fio.querySelectorAll(".opcoes button").forEach((x) => (x.disabled = true)); responder(String(n), op[n - 1]); } else responder(v); }
  else enviarMsg(v);
}
$("#sair").onclick = async () => { if (!confirm("Sair deste aparelho? Para falar de novo, o assistente vai confirmar seus dados.")) return; try { await api(API + "/sair", { method: "POST" }); } catch (_) {} tkSet(""); location.reload(); };

/* ── teclado do celular: a conversa encolhe para caber acima dele e a última mensagem fica visível ── */
const vv = window.visualViewport, appEl = document.querySelector(".app");
function encaixar() { if (!vv) return; appEl.style.height = Math.round(vv.height) + "px"; window.scrollTo(0, 0); fim(); }
if (vv) { vv.addEventListener("resize", encaixar); vv.addEventListener("scroll", () => { if (window.scrollY) window.scrollTo(0, 0); }); }
txt.addEventListener("focus", () => { setTimeout(encaixar, 120); setTimeout(encaixar, 450); });
new MutationObserver(fim).observe(fio, { childList: true, subtree: true });   // bolha nova (do bot ou da central) → rola até ela

/* ── início ── */
(async () => {
  try {
    const i = S.info = await api(API + "/info");
    $("#emp").textContent = i.empresa || "Atendimento"; document.title = (i.empresa || "Atendimento") + " · Atendimento";
    if (!i.ativo) { $("#compor").classList.add("oculto"); $("#sub").textContent = "Pausado"; bot("O atendimento por aqui está pausado no momento. Tente mais tarde. 🙏"); return; }
    if (i.validado) { S.visitante = !!i.visitante; bot(i.continua ? `Oi de novo, ${i.nome}! 👋 Seu atendimento${i.continua.atendente ? " com " + i.continua.atendente : ""} continua aqui — é só escrever.`
      : `Oi de novo, ${i.nome}! 👋 Pode escrever — um atendente já te responde.`); entrarNoChat(i.nome, false); return; }
    await digitando(500); bot(i.saudacao);
    await digitando(700); bot(i.pedir_cpf); modo("CPF (só números)", true); txt.focus();
  } catch (e) { $("#compor").classList.add("oculto"); bot("Não conseguimos carregar o atendimento agora. Verifique sua internet e recarregue a página.", "erro"); }
})();
})();
</script>
