<style>
html,body{min-height:100%}
body{margin:0;background:var(--noite);color:var(--txt);font-size:15px;-webkit-tap-highlight-color:transparent}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.oculto{display:none!important}
svg.i{width:20px;height:20px}

/* topo de vidro */
.topo{position:sticky;top:0;z-index:20;margin:max(10px,env(safe-area-inset-top)) 12px 0;padding:10px 12px;border-radius:20px;display:flex;align-items:center;gap:12px}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.88),rgba(8,10,16,.82))}
html[data-claro] .topo.vidro{background:rgba(255,255,255,.82)}
.topo .tx{min-width:0;flex:1}
.topo b{display:block;font:700 1rem/1.25 var(--titulo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{display:block;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{flex:1;padding:16px 14px calc(92px + env(safe-area-inset-bottom))}
main.chat-modo{padding-bottom:calc(160px + env(safe-area-inset-bottom))}

/* abas de baixo (vidro) */
.abas{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;width:calc(100% - 24px);max-width:536px;padding:5px;border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.abas.vidro{background:linear-gradient(135deg,rgba(14,17,26,.92),rgba(8,10,16,.88))}
html[data-claro] .abas.vidro{background:rgba(255,255,255,.88)}
.abas button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:15px;color:var(--txt3);font:600 .7rem var(--sans);transition:.2s}
.abas button.ativo{color:var(--txt);background:linear-gradient(135deg,rgba(var(--ouro-rgb),.24),rgba(var(--ouro-rgb),.08));box-shadow:inset 0 0 0 1px rgba(var(--ouro-rgb),.45)}
.abas button.ativo svg.i{color:var(--ouro2);filter:drop-shadow(0 0 6px rgba(var(--ouro-rgb),.7))}
.abas em{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rosa);color:#fff;font:700 .66rem/18px var(--sans);font-style:normal;box-shadow:0 0 12px var(--rosa)}

/* entrar */
.entrar{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;width:100%}
.entrar .marca{text-align:center;margin-bottom:14px}
.entrar .marca .atomo{margin:0 auto 6px}
.entrar h1{font:700 1.6rem/1.15 var(--titulo);margin:6px 0 4px;letter-spacing:-.01em;text-align:center}
.entrar .sub{color:var(--txt2);margin:0 0 18px;text-align:center;font-size:.9rem}
.entrar .cartao{padding:20px 18px;border-radius:24px;display:flex;flex-direction:column;gap:14px}
.entrar .campo input{padding:13px 14px;font-size:1rem}
.btn.grande{width:100%;padding:14px 18px;font-size:1rem;border-radius:14px}
.erro{color:#fecdd3;background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);border-radius:14px;padding:11px 13px;font-size:.86rem;line-height:1.45}
html[data-claro] .erro{color:var(--rosa)}
.nota{font-size:.76rem;color:var(--txt3);text-align:center;margin:14px 0 0;display:flex;gap:6px;justify-content:center;align-items:center}
.nota svg.i{width:14px;height:14px;color:var(--ouro2)}

/* conversa (URA e chamado) */
.fio{display:flex;flex-direction:column;gap:10px}
.bolha{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:.92rem;line-height:1.5;animation:entra .2s var(--suave)}
.bolha.bot,.bolha.central{align-self:flex-start;border-bottom-left-radius:6px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid var(--vidro-borda);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
html[data-claro] .bolha.bot,html[data-claro] .bolha.central{background:rgba(255,255,255,.85)}
.bolha.cli{align-self:flex-end;border-bottom-right-radius:6px;background:var(--grad-ouro);color:#1a1206;font-weight:500;box-shadow:0 12px 28px -14px rgba(var(--ouro-rgb),.9),inset 0 1px 0 rgba(255,255,255,.35)}
.bolha small{display:block;font-size:.68rem;opacity:.65;margin-top:4px}
.bolha .quem{display:block;font:600 .64rem var(--titulo);letter-spacing:.12em;text-transform:uppercase;color:var(--ouro2);margin-bottom:3px}
.bolha.central .quem{color:var(--ciano)}
.dia{align-self:center;font-size:.66rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);border:1px solid var(--vidro-borda);border-radius:20px;padding:3px 10px;background:rgba(255,255,255,.03)}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bolha,.opcoes{animation:none}}
.opcoes{display:flex;flex-direction:column;gap:8px;align-self:stretch;animation:entra .22s var(--suave)}
.op{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--vidro-borda);transition:.22s var(--suave)}
html[data-claro] .op{background:rgba(255,255,255,.75)}
.op:hover,.op:focus-visible{border-color:rgba(var(--ouro-rgb),.55);box-shadow:0 0 24px -8px rgba(var(--ouro-rgb),.6);transform:translateY(-1px)}
.op .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font:700 .86rem var(--titulo);color:var(--ouro2);background:rgba(var(--ouro-rgb),.12);border:1px solid rgba(var(--ouro-rgb),.35)}
.op b{display:block;font:600 .95rem/1.3 var(--titulo)}
.op small{display:block;color:var(--txt3);font-size:.78rem}
.op.leve{padding:8px 12px;border-style:dashed;background:transparent}
.op.leve .n{background:transparent;border-color:var(--vidro-borda);color:var(--txt3)}
.op.leve b{font:600 .85rem var(--sans);color:var(--txt2)}

/* compositor (fixo, acima das abas) */
.compor{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;width:calc(100% - 24px);max-width:536px}
.compor .caixa{display:flex;gap:8px;align-items:flex-end;padding:6px 6px 6px 14px;border-radius:22px;background:linear-gradient(135deg,rgba(14,17,26,.94),rgba(8,10,16,.9))}
html[data-claro] .compor .caixa{background:rgba(255,255,255,.92)}
.compor textarea{flex:1;border:0;outline:none;background:transparent;resize:none;max-height:120px;min-height:24px;padding:8px 0;line-height:1.4;color:var(--txt)}
.compor textarea::placeholder{color:var(--txt3)}
.compor .btn{width:42px;height:42px;padding:0;border-radius:50%;flex:none}
.compor .btn[disabled]{opacity:.35;transform:none;box-shadow:none;cursor:default}

/* cartões */
h2.tit{font:700 1.12rem var(--titulo);margin:4px 2px 12px}
.cartao{border-radius:20px;padding:14px 16px;margin-bottom:12px}
button.cartao{display:block;width:100%;text-align:left;transition:.22s var(--suave)}
button.cartao:hover{transform:translateY(-2px);border-color:rgba(var(--ouro-rgb),.4)}
.cartao .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cartao .l1 b{font:700 1rem var(--titulo)}
.cartao .l1 .dir{margin-left:auto}
.cartao p{margin:6px 0 0;color:var(--txt2);font-size:.86rem}
.cartao p.min{font-size:.72rem;color:var(--txt3)}
.etq{--c:var(--ouro);display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;font-size:.68rem;font-weight:650;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.etq.ok{--c:var(--verde)} .etq.alerta{--c:var(--laranja)} .etq.ruim{--c:var(--rosa)} .etq.cinza{--c:var(--txt3)} .etq.azul{--c:var(--azul)}
.ponto{width:9px;height:9px;border-radius:50%;background:var(--ciano);box-shadow:0 0 10px var(--ciano);display:inline-block;animation:aurRespira 1.2s infinite}
.entrega{display:flex;gap:12px;align-items:center;margin-top:12px;padding:12px;border-radius:14px;background:rgba(var(--ouro-rgb),.08);border:1px solid rgba(var(--ouro-rgb),.3)}
.entrega svg.i{width:24px;height:24px;color:var(--ouro2);flex:none;filter:drop-shadow(0 0 6px rgba(var(--ouro-rgb),.6))}
.entrega b{display:block;font:700 .98rem var(--titulo);text-transform:capitalize}
.entrega small{color:var(--txt2);font-size:.8rem}
.trilha{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 6px;position:relative}
.trilha::before{content:"";position:absolute;left:12.5%;right:12.5%;top:9px;height:3px;background:var(--vidro-borda-forte);border-radius:2px}
.trilha .barra{position:absolute;left:12.5%;top:9px;height:3px;background:linear-gradient(90deg,var(--ouro),var(--verde));border-radius:2px;box-shadow:0 0 10px rgba(52,211,153,.6)}
.trilha span{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.66rem;color:var(--txt3);text-align:center;font-weight:600}
.trilha span i{width:21px;height:21px;border-radius:50%;background:var(--noite);border:3px solid var(--vidro-borda-forte);display:block}
.trilha span.feito i{background:var(--verde);border-color:var(--verde);box-shadow:0 0 10px var(--verde)}
.trilha span.feito{color:var(--txt2)}
.trilha span.agora i{border-color:var(--ouro);box-shadow:0 0 0 4px rgba(var(--ouro-rgb),.18),0 0 14px rgba(var(--ouro-rgb),.7)}
.trilha span.agora{color:var(--txt)}
.itens{margin:0;padding:0;list-style:none;font-size:.88rem;color:var(--txt2)}
.itens li{padding:7px 0;border-top:1px solid var(--vidro-borda);display:flex;gap:8px}
.itens li:first-child{border-top:0}
.itens li b{color:var(--ouro2);min-width:26px}
.total{display:flex;justify-content:space-between;margin-top:8px;padding-top:10px;border-top:1px solid var(--vidro-borda);font-size:.9rem;color:var(--txt2)}
.total b{font:700 1rem var(--titulo);color:var(--txt)}
.notif{display:flex;flex-direction:column;gap:12px}
.pref{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:18px 14px 14px;border-radius:18px;font:inherit;color:var(--txt);transition:.35s var(--suave)}
.pref .ic{font-size:1.5rem;flex:none}.pref .tx{flex:1}.pref b{display:block;font-size:.95rem}.pref small{display:block;font-size:.76rem;color:var(--txt2);margin-top:2px}
.pref.on,.pref.fixo{background:linear-gradient(135deg,rgba(96,165,250,.22),rgba(139,92,246,.14));border:1px solid rgba(96,165,250,.55);box-shadow:0 0 28px -10px rgba(96,165,250,.9),inset 0 1px 0 rgba(255,255,255,.08)}
.pref.on{animation:prefBrilho 3.2s ease-in-out infinite}
@keyframes prefBrilho{0%,100%{box-shadow:0 0 26px -12px rgba(96,165,250,.9),inset 0 1px 0 rgba(255,255,255,.08)}50%{box-shadow:0 0 34px -6px rgba(96,165,250,.95),inset 0 1px 0 rgba(255,255,255,.12)}}
.pref.off{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.42)}.pref.off small{color:#fda4af}.pref.off .ic{filter:grayscale(.4)}
.pref .selo{position:absolute;top:-9px;left:14px;padding:2px 10px;border-radius:20px;font:800 .6rem var(--sans);letter-spacing:1.4px}
.selo.on{background:linear-gradient(135deg,#60a5fa,#8b5cf6);color:#fff;box-shadow:0 0 12px rgba(96,165,250,.7)}.selo.off{background:#f43f5e;color:#fff;box-shadow:0 0 12px rgba(244,63,94,.5)}
html[data-claro] .pref.off small{color:#be123c}
.instalar{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;margin-bottom:16px;border:1px solid rgba(var(--ouro-rgb),.45);background:linear-gradient(135deg,rgba(var(--ouro-rgb),.16),rgba(var(--ouro-rgb),.04))}
.instalar .ic{font-size:1.6rem}.instalar .tx{flex:1}.instalar b{display:block}.instalar small{font-size:.76rem;color:var(--txt2)}
.instalado{font-size:.76rem;color:var(--verde);margin:0 2px 14px;font-weight:600}
.btn-ic.inst{font-size:1.05rem}
.passos{display:flex;flex-direction:column;gap:10px}.passo{display:flex;gap:12px;align-items:flex-start}.passo span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--grad-ouro);color:#111;font-weight:800;flex:none}.passo p{margin:3px 0 0}
.chave{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--vidro-borda);background:rgba(255,255,255,.03)}
.chave span{flex:1}.chave b{display:block;font-size:.9rem}.chave small{font-size:.74rem;color:var(--txt3)}
.chave input{appearance:none;width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:.2s;flex:none}
.chave input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.chave input:checked{background:var(--verde)}.chave input:checked::after{left:21px}
.vale{position:relative;overflow:hidden;border-left:4px solid var(--c)}
.vale .big{font:800 1.5rem var(--titulo);color:var(--c);margin:6px 0 2px}
.vale.usado,.vale.vencido{opacity:.55;filter:saturate(.3)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrbox .qr{background:#fff;padding:14px;border-radius:18px;width:min(72vw,280px)}.qrbox .qr svg{width:100%;height:auto;display:block}
.qrbox .cod{font:800 1.5rem var(--titulo);letter-spacing:3px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:.62rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--vidro-borda),transparent)}
.vazio{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--txt3);padding:40px 16px;font-size:.88rem}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}
.aviso{font-size:.84rem;border-radius:14px;padding:11px 13px;color:var(--ouro2);background:rgba(var(--ouro-rgb),.07);border:1px solid rgba(var(--ouro-rgb),.3);margin-bottom:12px;line-height:1.5}
.aviso a{color:var(--ouro2);font-weight:700}
.carregando{display:grid;place-items:center;min-height:80vh}
.rodape{text-align:center;font-size:.7rem;color:var(--txt3);margin-top:18px;line-height:1.6}

/* sem internet / fila */
.faixa{position:sticky;top:calc(76px + env(safe-area-inset-top));z-index:18;margin:8px 12px 0;padding:8px 12px;border-radius:14px;font-size:.8rem;display:flex;gap:8px;align-items:center;
  color:var(--laranja);background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.35);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.faixa.ok{color:var(--verde);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35)}
.faixa svg.i{width:16px;height:16px}
.bolha.pend{opacity:.72;border:1px dashed rgba(26,18,6,.5)}
.bolha.pend small{opacity:.9}
.cartao.pend{border-style:dashed;opacity:.85}
/* formulário de chamado */
.form{display:flex;flex-direction:column;gap:12px}
.form .campo select,.form .campo textarea{font-size:.95rem}
.form textarea{min-height:120px}
.dica{font-size:.76rem;color:var(--txt3);margin:0;line-height:1.5}
.sol-cli{border-left:4px solid var(--c)}
.def{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:10px 0 0;font-size:.84rem}
.def dt{color:var(--txt3);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}.def dd{margin:0;color:var(--txt)}
.atualiz{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--vidro-borda)}
.atualiz .at{padding:8px 10px;border-radius:12px;font-size:.86rem;white-space:pre-wrap;background:rgba(255,255,255,.04);border:1px solid var(--vidro-borda)}
.atualiz .at.central{border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.08)}
.atualiz .at small{display:block;font-size:.68rem;color:var(--txt3);margin-bottom:2px}
.palavra{text-align:center}.palavra b{font:700 1.6rem var(--titulo);letter-spacing:4px;color:var(--ouro2);text-shadow:0 0 18px rgba(var(--ouro-rgb),.5)}
.sols{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sol{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:12px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.sol b{font:600 .88rem var(--titulo);flex:1;min-width:0}
.sol small{width:100%;color:var(--txt3);font-size:.72rem}
.bolha.central{border-left:4px solid var(--c,var(--vidro-borda))}
.bolha.cli[style*="--c"]{box-shadow:inset -4px 0 0 var(--c),0 12px 28px -14px rgba(var(--ouro-rgb),.9)}
.bolha .tag{font-style:normal;display:inline-block;padding:0 6px;border-radius:6px;font-size:.6rem;letter-spacing:.04em;text-transform:none;color:var(--c);background:rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);margin-right:4px}
.bolha.cli .tag{background:rgba(0,0,0,.18)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:650;color:var(--ouro2);background:rgba(var(--ouro-rgb),.1);border:1px solid rgba(var(--ouro-rgb),.35)}
</style>

<body>
<div class="app" id="app"><div class="carregando"><span id="logo0"></span></div></div>

<script src="/static/aurora.js?v=3"></script>
<script src="/static/vendor/qrcode.js" defer></script>
<script>
(() => {
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   APP DO CLIENTE
   Atendimento = UM chat (a URA pergunta o assunto uma vez) · Pedidos ·
   Chamados (o cliente abre com Motivo › Submotivo).
   Sem internet: mostra o que já foi carregado e guarda o que o cliente
   escreve numa FILA — envia sozinho quando a internet volta / ao logar.
   ═══════════════════════════════════════════════════════════════════════ */
const A = Aurora, svg = A.svg, esc = A.esc, $ = (s, r = document) => r.querySelector(s);
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }, del(k) { try { localStorage.removeItem(k); } catch (_) {} } };
A.fundo();
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;
{ const l = $("#logo0"); if (l) l.outerHTML = A.atomo(72); }
const ICO = { chat: svg("mensagem"), caixa: svg("caixa"), lista: svg("lista"), enviar: svg("seta"), voltar: svg("voltar"), cal: svg("calendario"),
  escudo: svg("escudo"), sair: svg("sair"), estrela: svg("estrela"), sino: svg("sino"), mais: svg("mais"), onda: svg("onda"), atencao: svg("atencao"), relogio: svg("relogio") };
const SEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const dataBR = (s) => { s = String(s || ""); return s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : ""; };
const dataLonga = (s) => { if (!s || s.length < 10) return ""; const d = new Date(s.slice(0, 10) + "T12:00:00"); return `${SEM[d.getDay()]}, ${dataBR(s)}`; };
const hora = (s) => String(s || "").slice(11, 16);
const brl = (v) => v == null ? "" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const agoraLocal = () => { const d = new Date(), z = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
const novoReq = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 32);
const ST_COR = { confirmado: "azul", agendado: "", em_carga: "azul", em_rota: "ok", entregue: "ok", reagendar: "alerta", cancelado: "cinza", recusado: "ruim" };
const TK_COR = { aberto: "", em_andamento: "azul", aguardando: "alerta", resolvido: "ok", finalizado: "cinza", cancelado: "cinza" };

/* ── rede ── */
const SEM_REDE = "sem_rede";
async function api(url, op = {}) {
  try { return await A.api(url, op); }
  catch (e) {
    if (!e.status) { const x = new Error("Sem internet agora."); x.status = 0; x.codigo = SEM_REDE; throw x; }
    if (/^HTTP \d/.test(e.message)) e.message = "Não foi possível agora. Tente de novo.";
    throw e;
  }
}
function toast(t, cor = "var(--rosa)") { A.toast(esc(t), [], { cor, duracao: 5000 }); }

/* ── estado ── */
const S = { eu: null, aba: ls.get("cli.aba", "atendimento"), sub: null, versao: null, offline: false, assunto: null, rascunho: "" };
// sub: null | {tela:"pedido", id} | {tela:"chamado", id} | {tela:"novo"}
const app = $("#app");

/* ═══════════ CACHE (para abrir sem internet) ═══════════ */
const cache = {
  eu: () => ls.get("cli.eu", null), salvarEu: (e) => ls.set("cli.eu", e),
  ch: (id) => (ls.get("cli.chs", {})[id] || null),
  salvarCh: (c) => { const m = ls.get("cli.chs", {}); m[c.id] = { ...c, _em: Date.now() };
    const ks = Object.keys(m).sort((a, b) => m[b]._em - m[a]._em); ks.slice(12).forEach((k) => delete m[k]); ls.set("cli.chs", m); },
  limpar: () => ["cli.eu", "cli.chs", "cli.fila", "cli.visto"].forEach(ls.del),
};

/* ═══════════ FILA (o que foi escrito sem internet) ═══════════ */
const fila = {
  itens: () => ls.get("cli.fila", []),
  por: (i) => { const l = fila.itens(); l.push(i); ls.set("cli.fila", l); },
  tirar: (req) => ls.set("cli.fila", fila.itens().filter((x) => x.req !== req)),
  enviando: false,
};
async function enviarFila() {
  if (fila.enviando || !fila.itens().length) return;
  fila.enviando = true;
  let enviou = 0;
  try {
    for (const it of fila.itens()) {
      try { await api(it.url, { method: "POST", body: it.body }); fila.tirar(it.req); enviou++; }
      catch (e) {
        if (e.codigo === SEM_REDE || e.status === 429 || e.status >= 500) break;   // tenta de novo depois
        if (e.status === 401) { break; }                                           // precisa entrar — a fila espera
        fila.tirar(it.req); toast(`Não deu para enviar “${it.resumo}”: ${e.message}`);   // recusado de vez (ex.: chamado duplicado)
      }
    }
  } finally { fila.enviando = false; }
  if (enviou) { toast(enviou === 1 ? "Mensagem pendente enviada ✓" : `${enviou} mensagens pendentes enviadas ✓`, "var(--verde)"); await atualizar(); }
}
/* Envia agora; sem internet, guarda na fila e devolve {fila:true}. */
async function enviar(url, body, resumo) {
  const it = { req: novoReq(), url, resumo: String(resumo || "").slice(0, 40) };
  it.body = { ...body, req: it.req };
  try { const r = await api(url, { method: "POST", body: it.body }); return r; }
  catch (e) {
    if (e.codigo !== SEM_REDE) throw e;
    it.body.escrito_em = agoraLocal(); it.quando = it.body.escrito_em;
    fila.por(it); S.offline = true;
    return { fila: true, item: it };
  }
}

  const cpf = $("#cpf");

/* ═══════════ CARREGAR ═══════════ */
async function carregar() {
  try {
    S.eu = await api("/api/cliente/eu"); S.versao = S.eu.versao; S.offline = false; cache.salvarEu(S.eu);
  } catch (e) {
    if (e.status === 401) { telaEntrar(); return; }
    const c = cache.eu();
    if (e.codigo === SEM_REDE && c) { S.eu = c; S.offline = true; }
    else { app.innerHTML = `<div class="vazio" style="padding-top:30vh">${A.orbe("atencao", "var(--rosa)")}<b>${e.codigo === SEM_REDE ? "Sem internet" : "Não conseguimos carregar"}</b>${esc(e.codigo === SEM_REDE ? "Conecte-se para entrar pela primeira vez." : e.message)}<button class="btn v" onclick="location.reload()">Tentar de novo</button></div>`; return; }
  }
  render();
  enviarFila();
}
async function atualizar() {
  try {
    S.eu = await api("/api/cliente/eu"); S.versao = S.eu.versao; S.offline = false; cache.salvarEu(S.eu);
    if (S.sub?.tela === "chamado") { const c = await api("/api/cliente/chamado/" + encodeURIComponent(S.sub.id)); cache.salvarCh(c); }
    if (S.aba === "vantagens") await carregarVantagens();
  } catch (e) { if (e.status === 401) { telaEntrar(); return; } if (e.codigo === SEM_REDE) S.offline = true; }
  if (!(document.activeElement && document.activeElement.id === "txt" && document.activeElement.value)) render();
  else marcarAbas();
}

/* ═══════════ CASCA ═══════════ */
function naoLidos() { const visto = ls.get("cli.visto", {}), ch = S.eu?.chamado; return ch && ch.resposta_nova_em && ch.resposta_nova_em > (visto.chamado || "") ? 1 : 0; }
function marcarVisto(c) { if (!c) return; const v = ls.get("cli.visto", {}); v[c.id] = c.resposta_nova_em || c.atualizado_em || ""; ls.set("cli.visto", v); }
function ir(aba, sub = null) { S.aba = aba; S.sub = sub; ls.set("cli.aba", aba); render(); scrollTo(0, 0); }

    <main id="main"></main>

/* ═══════════ VANTAGENS: notificações no celular + carteira de cupons e brindes (QR) ═══════════ */
const pushOk = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), instalado = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
/* ── Instalar o app: Android/Chrome com o pedido do próprio navegador; iPhone com o passo a passo ── */
let pedidoInstalar = null;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); pedidoInstalar = e; if (S.eu) render(); });
addEventListener("appinstalled", () => { pedidoInstalar = null; ls.set("cli.instalado", 1); toast("App instalado! 🎉", "var(--verde)"); if (pushOk() && Notification.permission === "default") ativarPush(); });
const estaInstalado = () => instalado || !!ls.get("cli.instalado", 0);
function cartaoInstalar() {
  if (estaInstalado()) return `<div class="instalado">✓ App instalado neste celular</div>`;
  return `<div class="instalar vidro"><span class="ic">📲</span><span class="tx"><b>Instale o app</b><small>Fica na tela inicial, abre mais rápido e recebe cupons exclusivos.</small></span><button type="button" class="btn" data-instalar>Instalar</button></div>`;
}
function ligarInstalar(r) { r.querySelectorAll("[data-instalar]").forEach((b) => (b.onclick = instalarApp)); }
async function instalarApp() {
  if (pedidoInstalar) {
    pedidoInstalar.prompt();
    const { outcome } = await pedidoInstalar.userChoice.catch(() => ({}));
    pedidoInstalar = null;
    if (outcome === "accepted") { ls.set("cli.instalado", 1); if (pushOk() && Notification.permission === "default") await ativarPush(); render(); }
    return;
  }
  const passos = ehIOS
    ? [["1", "Toque em <b>Compartilhar</b> <span style='font-size:1.2em'>⬆️</span>, na barra do Safari."], ["2", "Escolha <b>Adicionar à Tela de Início</b>."], ["3", "Toque em <b>Adicionar</b>."], ["4", "Abra o app pelo novo ícone e toque em <b>Ativar notificações</b> em Vantagens."]]
    : [["1", "Abra o menu do navegador <b>⋮</b> (canto de cima)."], ["2", "Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>."], ["3", "Confirme. O app aparece na sua tela inicial."]];
  A.modal({ titulo: "Instalar o app", icone: "estrela", cor: "var(--ouro)", largura: 420,
    html: `<div class="passos">${passos.map(([n, t]) => `<div class="passo"><span>${n}</span><p>${t}</p></div>`).join("")}</div>${ehIOS ? `<p class="min" style="margin-top:10px">No iPhone, use o <b>Safari</b>. As notificações só funcionam com o app instalado.</p>` : ""}`,
    botoes: [{ rotulo: "Entendi", principal: true }] });
}
function valesNovos() { const vs = (S.vant && S.vant.vales) || [], visto = ls.get("cli.vales", ""); return vs.filter((v) => v.status === "valido" && v.criado_em > visto).length; }
async function carregarVantagens() { try { S.vant = await api("/api/cliente/vantagens"); cache.salvarVant && cache.salvarVant(S.vant); } catch (_) {} }
const b64u = (s) => { const p = "=".repeat((4 - (s.length % 4)) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map((c) => c.charCodeAt(0))); };
async function ativarPush(avisos = true, promocoes = true) {
  if (!pushOk()) { toast(ehIOS && !instalado ? "No iPhone, adicione o app à Tela de Início (Compartilhar › Adicionar à Tela de Início) e abra por lá." : "Este navegador não recebe notificações."); return; }
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { toast("Notificações bloqueadas. Libere nas configurações do navegador para receber."); render(); return; }
  try {
    const reg = await navigator.serviceWorker.ready, { publica } = await api("/api/cliente/push/chave");
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(publica) }));
    await api("/api/cliente/push", { method: "POST", body: { inscricao: sub.toJSON(), avisos: true, promocoes } });
    toast("Pronto! Você vai receber os avisos neste celular.", "var(--verde)");
  } catch (e) { toast("Não deu para ativar: " + e.message); }
  await carregarVantagens(); render();
}
function telaVantagens(m) {
  const v = S.vant;
  if (!v) { m.innerHTML = `<div class="vazio">${A.orbe("estrela", "var(--ouro)")}<b>Carregando…</b></div>`; carregarVantagens().then(() => S.aba === "vantagens" && render()); return; }
  const perm = pushOk() ? Notification.permission : "indisponivel";
  const ativo = v.inscrito && perm === "granted";
  const notif = ativo ? `<div class="notif">
      <div class="pref fixo"><span class="selo on">ATIVADO</span><span class="ic">🔔</span><span class="tx"><b>Avisos do meu pedido</b><small>entrega, agendamento e atendimento · sempre ativo</small></span></div>

        <span class="tx"><b>Promoções e cupons</b><small>${v.promocoes ? "Você recebe cupons, brindes e ofertas exclusivas. 🎉" : "Você está deixando de receber cupons e brindes exclusivos. Toque para reativar."}</small></span></button></div>`
    : perm === "indisponivel" ? `<div class="aviso">${ehIOS && !instalado ? "No iPhone, as notificações funcionam com o app instalado na Tela de Início. Toque em <b>Instalar app</b> acima para ver como." : "Este navegador não recebe notificações. Seus cupons continuam guardados aqui."}</div>`
    : perm === "denied" ? `<div class="aviso">As notificações estão bloqueadas neste celular. Libere nas configurações do navegador para receber cupons e avisos.</div>`
    : `<button class="btn grande" id="ativar">${ICO.sino} Ativar notificações</button><p class="min" style="margin:8px 2px 0">Receba os avisos do seu pedido e cupons exclusivos neste celular.</p>`;
  const cor = { cupom: "var(--ouro)", brinde: "var(--rosa)" };
  const card = (x) => `<button class="cartao vidro vale ${x.status}" data-vale="${esc(x.codigo)}" style="--c:${cor[x.tipo] || "var(--ciano)"}">
      <div class="l1"><b>${esc(x.titulo)}</b><span class="etq dir">${x.status === "usado" ? "usado" : x.status === "vencido" ? "vencido" : x.tipo === "brinde" ? "🎁 brinde" : "🏷 cupom"}</span></div>
      <div class="big">${esc(x.tipo === "cupom" ? x.percentual + "% OFF" : x.beneficio)}</div>
      <p class="min">${x.status === "usado" ? "Usado em " + dataBR(x.usado_em) + (x.usado_local ? " · " + esc(x.usado_local) : "") : "Válido até " + esc(dataLonga(x.validade)) + " · toque para mostrar o QR code"}</p></button>`;
  const vs = v.vales || [], ok = vs.filter((x) => x.status === "valido"), out = vs.filter((x) => x.status !== "valido");
  m.innerHTML = `${cartaoInstalar()}<h2 class="tit">Notificações neste celular</h2>${notif}
    <div class="sec">Minha carteira</div>
    ${ok.length ? ok.map(card).join("") : `<div class="vazio" style="padding:22px 10px">${A.orbe("estrela", "var(--ouro)")}<b>Nenhum cupom por enquanto</b>Quando a loja mandar um cupom ou brinde, ele fica guardado aqui.</div>`}
    ${out.length ? `<div class="sec">Usados e vencidos</div>${out.map(card).join("")}` : ""}`;
  if (vs.length) ls.set("cli.vales", vs.reduce((a, x) => (x.criado_em > a ? x.criado_em : a), ""));
  const at = $("#ativar"); if (at) at.onclick = () => ativarPush();
  ligarInstalar(m);
  const pp = $("#prefPromo"); if (pp) pp.onclick = async () => {
    const novo = !v.promocoes;
    if (!novo && !(await A.confirmar("Desativar promoções e cupons? Você deixa de receber <b>cupons, brindes e ofertas exclusivas</b>.", { perigo: true, rotulo: "Desativar" }))) return;

function mostrarVale(x) {

/* ═══════════ bolhas e compositor ═══════════ */
function bolhas(msgs, pendentes = []) {
  let dia = "";
  const sep = (d) => { d = String(d || "").slice(0, 10); if (!d || d === dia) return ""; dia = d; return `<div class="dia">${esc(dataLonga(d))}</div>`; };
  return msgs.map((x) => sep(x.data) + `<div class="bolha ${x.de === "cliente" ? "cli" : "central"}">${x.de !== "cliente" ? `<span class="quem">${esc(x.autor ? x.autor + " · Central" : "Central")}</span>` : ""}${esc(x.texto)}<small>${hora(x.data)}</small></div>`).join("")
    + pendentes.map((it) => `<div class="bolha cli pend">${esc(it.body.texto)}<small>⏳ aguardando internet · ${hora(it.quando)}</small></div>`).join("");
}
function compositor(ph) { return `<div class="compor"><div class="caixa vidro vidro-borda-viva"><textarea id="txt" rows="1" maxlength="2000" placeholder="${esc(ph)}" aria-label="Mensagem"></textarea><button class="btn" id="env" aria-label="Enviar" disabled>${ICO.enviar}</button></div></div>`; }
function ligarCompositor(enviarFn) {
  const t = $("#txt"), b = $("#env");
  if (S.rascunho) { t.value = S.rascunho; S.rascunho = ""; }
  const ajusta = () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; b.disabled = !t.value.trim(); };
  t.oninput = ajusta; ajusta();
  const vai = async () => { const v = t.value.trim(); if (!v || b.disabled) return; b.disabled = true; t.disabled = true;
    try { await enviarFn(v); } catch (e) { toast(e.message); t.disabled = false; b.disabled = false; if (e.status === 401) telaEntrar(); } };
  b.onclick = vai;
  t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); vai(); } };
}
function rolar() { requestAnimationFrame(() => scrollTo({ top: document.body.scrollHeight, behavior: "smooth" })); }

/* ═══════════ ATENDIMENTO = UM CHAT ═══════════ */
function telaAtendimento(m) {
  const eu = S.eu, chat = eu.chat;
  const pendChat = fila.itens().filter((it) => it.url === "/api/cliente/chat" || (chat && it.url === `/api/cliente/chamado/${chat.id}/mensagem`));
  m.classList.add("chat-modo");
  if (chat) {   // já há conversa → é só ela, sem menu
    marcarVisto(chat);
    const msgs = chat.mensagens || [];
    m.innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><span class="etq ${TK_COR[chat.status] || ""}">${esc(chat.rotulo)}</span><span class="dica">Só a central encerra este atendimento.</span></div>
      <div class="fio">${bolhas(msgs, pendChat)}
      ${chat.status === "aberto" && msgs.every((x) => x.de === "cliente") ? `<div class="bolha bot"><span class="quem">Atendimento automático</span>Recebemos sua mensagem. Um atendente vai responder aqui em breve — você não precisa ficar com o app aberto.</div>` : ""}</div>
      ${chat.status === "aguardando" ? `<div class="aviso" style="margin-top:12px">A central está aguardando sua resposta.</div>` : ""}
      ${compositor("Escreva sua mensagem…")}`;
    ligarCompositor(async (texto) => {
      const r = await enviar(`/api/cliente/chamado/${encodeURIComponent(chat.id)}/mensagem`, { texto }, texto);
      if (r.fila) { render(); return; }
      await atualizar();
    });
    rolar(); return;
  }
  // sem chat ativo: a URA pergunta UMA vez
  const fechado = (eu.chamados || []).find((c) => c.tipo === "chat" && !c.aberto);
  const saud = String(eu.saudacao || "Sobre o que você quer falar?").replace(/^Olá!?/, `Olá, ${eu.nome}!`);
  const op = S.assunto ? eu.ura.find((u) => u.id === S.assunto) : null;
  const pendNovo = fila.itens().filter((it) => it.url === "/api/cliente/chat");
  const opAssunto = op || (pendNovo.length ? eu.ura.find((u) => u.id === pendNovo[0].body.opcao) : null);
  m.innerHTML = `<div class="fio">
      ${fechado && fechado.atualizado_em && Date.now() - new Date(fechado.atualizado_em.replace(" ", "T")).getTime() < 864e5 ? `<div class="dia">Seu último atendimento foi encerrado pela central</div>` : ""}
      <div class="bolha bot"><span class="quem">Atendimento automático</span>${esc(saud)}</div>
      ${opAssunto ? `<div class="bolha cli">${esc(opAssunto.rotulo)}</div>
        <div class="bolha bot"><span class="quem">Atendimento automático</span>Certo! Escreva sua mensagem com o máximo de detalhes — um atendente da central vai continuar a conversa aqui.</div>
        ${bolhas([], pendNovo)}
        ${!pendNovo.length ? `<div class="opcoes"><button class="op leve" id="trocarAssunto"><span class="n">↩</span><span><b>Escolher outro assunto</b></span></button></div>` : ""}`
      : `<div class="opcoes">${eu.ura.map((o, i) => `<button class="op" data-assunto="${esc(o.id)}"><span class="n">${i + 1}</span><span><b>${esc(o.rotulo)}</b>${o.descricao ? `<small>${esc(o.descricao)}</small>` : ""}</span></button>`).join("")}</div>`}
    </div>
    ${opAssunto ? compositor("Escreva sua mensagem…") : ""}`;
  m.querySelectorAll("[data-assunto]").forEach((b) => (b.onclick = () => { S.assunto = b.dataset.assunto; render(); rolar(); setTimeout(() => $("#txt")?.focus(), 50); }));
  const ta = $("#trocarAssunto"); if (ta) ta.onclick = () => { S.assunto = null; render(); };
  if (opAssunto) ligarCompositor(async (texto) => {
    const r = await enviar("/api/cliente/chat", { opcao: opAssunto.id, texto }, texto);
    S.assunto = null;
    if (r.fila) { S.assunto = opAssunto.id; render(); return; }
    await atualizar();
  });
  if (!opAssunto) m.classList.remove("chat-modo");
  rolar();
}

const corSol = (i) => (i == null || i < 0) ? "var(--ciano)" : COR_SOL[i % COR_SOL.length];

    ${c.status === "aguardando" ? `<div class="aviso">A central está aguardando sua resposta.</div>` : ""}
    <div class="fio">${bolhas(c.mensagens || [], pend) || `<div class="vazio" style="padding:20px">Este atendimento foi aberto pela nossa central.${c.pode_escrever ? " Se quiser, escreva abaixo." : ""}</div>`}</div>
    ${c.pode_escrever ? compositor(c.status === "resolvido" ? "Ainda precisa de ajuda? Escreva aqui…" : "Escreva sua mensagem…")
      : `<div class="aviso" style="margin-top:14px">Encerrado pela central.${c.tipo === "chat" ? " Para falar de novo, use a aba Atendimento." : " Precisa de algo mais? Abra um novo chamado."}</div>`}`;
  if (c.pode_escrever) ligarCompositor(async (texto) => {
    const r = await enviar(`/api/cliente/chamado/${encodeURIComponent(c.id)}/mensagem`, { texto }, texto);
    if (r.fila) { render(); return; }
    await atualizar();
  });
  rolar();
}

/* ═══════════ novidades e volta da internet ═══════════ */
setInterval(async () => {
  if (document.visibilityState !== "visible" || !S.eu) return;
  if (fila.itens().length) { await enviarFila(); return; }
  try {
    const n = await api("/api/cliente/novidades");
    if (S.offline) { S.offline = false; await atualizar(); return; }
    if (n.versao !== S.versao) await atualizar();
  } catch (e) { if (e.status === 401) telaEntrar(); else if (e.codigo === SEM_REDE && !S.offline) { S.offline = true; render(); } }
}, 15000);
addEventListener("online", () => { if (S.eu) { S.offline = false; enviarFila().then(atualizar); } });
addEventListener("offline", () => { if (S.eu) { S.offline = true; render(); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/cliente/sw.js", { scope: "/cliente/" }).catch(() => {});
{ const q = new URLSearchParams(location.search);
  if (q.get("aba") === "vantagens") { S.aba = "vantagens"; ls.set("cli.aba", "vantagens"); }
  if (q.get("d")) S.abrirDisparo = q.get("d");
  if (q.get("v")) S.abrirVale = q.get("v");
  if (q.toString()) history.replaceState(null, "", location.pathname); }
carregar().then(async () => {
  if (!S.eu) return;
  if (S.abrirDisparo) { api("/api/cliente/push/aberto", { method: "POST", body: { disparo: S.abrirDisparo } }).catch(() => {}); S.abrirDisparo = null; }
  await carregarVantagens(); if (S.eu) render();
  if (S.abrirVale) { mostrarVale((S.vant?.vales || []).find((x) => x.codigo === S.abrirVale)); S.abrirVale = null; }
});
navigator.serviceWorker && navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.tipo === "abrir") location.href = e.data.url; });
})();
</script>
