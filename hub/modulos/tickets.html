<!--
═══════════════════════════════════════════════════════════════════════════════
 tickets.html — ATENDIMENTO (cópia do Concierge) · módulo do hub
───────────────────────────────────────────────────────────────────────────────
 Meu dia · Caixa (filas + abas + lote) · Atendimento em 3 colunas
 (conversa · tabulação/andamento/pendências · cliente + PEDIDOS DO ERP) ·
 Abrir chamado por setor · Pedidos de ajuda (cada setor vê o seu) · Gestão · Ajustes.
 Diferença para o Concierge: aqui o ERP é o nosso — agendar/reagendar, cancelar
 e gerar troca saem do próprio atendimento, e a baixa com avaria/recusa/ausência
 no ERP abre o ticket sozinha.
 API: /api/tickets (hub/tickets.py) · ERP: /api/erp (hub/erp.py)
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto}
.congelado{position:sticky;top:0;z-index:40;margin:-14px -14px 0;padding:14px 14px 6px;background:var(--noite);box-shadow:0 10px 14px -12px rgba(0,0,0,.35)}
.congelado:has(#abasTk:empty){padding-bottom:0}
.topo{position:relative;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:20px;flex-wrap:wrap}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.9),rgba(8,10,16,.85))}
.marca{display:flex;align-items:center;gap:10px;margin-right:6px}
.marca b{display:block;font:700 1.02rem var(--titulo)}
.marca small{display:block;font-size:.56rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav button{padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:650;color:var(--txt2);position:relative}
.nav button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav button.ativo{color:var(--ouro2);background:rgba(var(--ouro-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--ouro-rgb),.4)}
.nav button em{font-style:normal;font-size:.62rem;font-weight:700;margin-left:5px;padding:1px 6px;border-radius:9px;background:var(--rosa);color:#1a0a0e}
.busca-topo{display:flex;gap:6px}
.busca-topo .entrada{width:190px;padding:8px 10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro)} .sync.erro i{background:var(--rosa)}
main{margin-top:10px}
.painel{border-radius:22px;padding:16px}
.sec{display:flex;align-items:center;gap:8px;margin:16px 2px 10px;font-size:.64rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.sec:first-child{margin-top:0}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--vidro-borda),transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{position:relative;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);--c:var(--azul);text-align:left;overflow:hidden}
button.kpi{cursor:pointer;width:100%;font:inherit;color:inherit}
button.kpi:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.kpi small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.45rem/1.1 var(--titulo);margin-top:6px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:3px}
.frase{font:600 1.05rem/1.5 var(--titulo);color:var(--txt2);margin:2px 0 14px;max-width:70ch}
.frase b{color:var(--ouro2)}
.vazio{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--txt3);font-size:.84rem;padding:30px 10px}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}

/* caixa */
.caixa{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.filas{border-radius:20px;padding:12px;position:sticky;top:calc(var(--alt-cong,74px) + 8px);max-height:calc(100vh - var(--alt-cong,74px) - 20px);overflow:auto}
.filas h4{margin:12px 6px 6px;font-size:.6rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3)}
.filas h4:first-child{margin-top:2px}
.filas button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:10px;font-size:.8rem;color:var(--txt2)}
.filas button:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.filas button.ativo{background:rgba(var(--ouro-rgb),.12);color:var(--ouro2)}
.filas button i{width:8px;height:8px;border-radius:3px;background:var(--c,var(--txt3));flex:none}
.filas button em{margin-left:auto;font-style:normal;font-size:.7rem;color:var(--txt3)}
.abas-caixa{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.abas-caixa button{padding:7px 11px;border-radius:10px;font-size:.78rem;font-weight:650;color:var(--txt2);border:1px solid transparent}
.abas-caixa button:hover{background:rgba(255,255,255,.05)}
.abas-caixa button.ativo{color:var(--txt);border-color:var(--vidro-borda-forte);background:rgba(255,255,255,.06)}
.abas-caixa button em{font-style:normal;color:var(--txt3);margin-left:4px;font-weight:600}
.abas-caixa button.venc em{color:var(--rosa)}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.barra .dir{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.barra select.entrada{width:auto;padding:7px 10px}
.tab{width:100%;border-collapse:collapse;font-size:.8rem}
.tab th{font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);text-align:left;padding:8px;border-bottom:1px solid var(--vidro-borda);white-space:nowrap}
.tab td{padding:9px 8px;border-bottom:1px solid var(--vidro-borda);vertical-align:top}
.tab tr.linha{cursor:pointer;transition:background .15s}
.tab tr.linha:hover{background:rgba(255,255,255,.04)}
.tab tr.linha.alerta td:first-child{box-shadow:inset 3px 0 0 var(--ciano)}
.tab .ass b{display:block;font-weight:600;color:var(--txt)}
.tab .ass small{color:var(--txt3);font-size:.7rem;line-height:1.45}
.tab input[type=checkbox]{accent-color:var(--ouro);width:16px;height:16px}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:7px;font-size:.64rem;font-weight:650;color:var(--txt2);background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda);white-space:nowrap}
.mini.c{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sla{font-weight:700;font-size:.74rem;white-space:nowrap}
.sla.venc{color:var(--rosa)} .sla.hoje,.sla.warn{color:var(--ouro2)} .sla.ok{color:var(--verde)} .sla.cumprido{color:var(--txt3)} .sla.perdido{color:var(--rosa);opacity:.7}
.pisca{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ciano);box-shadow:0 0 10px var(--ciano);animation:aurRespira 1.2s infinite;margin-right:4px;vertical-align:middle}
.paginas{display:flex;gap:6px;justify-content:center;margin-top:12px;align-items:center;font-size:.78rem;color:var(--txt3)}

/* atendimento */
.at-cab{border-radius:20px;padding:14px 16px;margin-bottom:12px}
.at-cab h1{margin:0 0 8px;font:700 1.25rem/1.25 var(--titulo)}
.at-cab .linha1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--txt2)}
.at-cab .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.at{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.col{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col h3{margin:0;font:700 .92rem var(--titulo);display:flex;align-items:center;gap:8px}
.col h3 small{margin-left:auto;font:500 .7rem var(--sans);color:var(--txt3)}
.conversa{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;padding-right:4px}
.msg{padding:9px 12px;border-radius:13px;font-size:.83rem;line-height:1.5;background:rgba(255,255,255,.04);border:1px solid var(--vidro-borda);white-space:pre-wrap;word-break:break-word}
.msg .q{display:block;font-size:.68rem;color:var(--txt3);margin-bottom:3px;white-space:normal}
.msg.cliente{border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.07)}
.msg.nota{border-color:rgba(var(--ouro-rgb),.3);background:rgba(var(--ouro-rgb),.06)}
.msg.sistema{font-size:.74rem;color:var(--txt3);background:transparent;border-style:dashed;padding:6px 10px}
.msg.pendencia{border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.07)}
.msg.contato{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}
.msg.app{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08);margin-right:18%}
.msg.resposta{border-color:rgba(232,179,61,.5);background:rgba(232,179,61,.1);margin-left:18%}
.msg .q b{color:var(--ciano)} .msg.resposta .q b{color:var(--ouro2)}
.link-app{display:flex;gap:6px;align-items:center}.link-app code{flex:1;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ura-it{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.8fr) auto;gap:5px;align-items:center}.ura-it input,.ura-it select{padding:6px 8px;font-size:.76rem}
.resp textarea{min-height:90px}
.resp .tipos{display:flex;gap:4px;flex-wrap:wrap}
.campo{margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ficha{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.8rem}
.ficha dt{color:var(--txt3);font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;padding-top:2px}
.ficha dd{margin:0;word-break:break-word}
.ped{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);font-size:.8rem;--c:var(--azul)}
.ped .t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ped .t1 b{font:700 .9rem var(--titulo)}
.ped ul{margin:6px 0 0;padding-left:16px;color:var(--txt2);font-size:.76rem}
.ped .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.trava{padding:10px 12px;border-radius:12px;font-size:.8rem;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.35);color:#fecdd3}
.aviso{font-size:.8rem;padding:10px 12px;border-radius:12px;line-height:1.5}
.aviso.ouro{color:var(--ouro2);background:rgba(var(--ouro-rgb),.07);border:1px solid rgba(var(--ouro-rgb),.3)}
.aviso.mal{color:#fecdd3;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3)}
.dica{font-size:.72rem;color:var(--txt3);line-height:1.5;margin:0}
.pend-it{padding:8px 10px;border-radius:11px;font-size:.78rem;background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.3)}
.pend-it.ok{background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.25)}

/* abrir chamado */
.setores{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.setor{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);transition:.2s;--c:var(--ouro)}
.setor:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent);transform:translateY(-2px)}
.setor .sig{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 .9rem var(--titulo);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);flex:none}
.setor b{display:block;font:700 .95rem var(--titulo)}
.setor small{color:var(--txt3);font-size:.74rem}

/* ajustes */
.cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.cartao{border-radius:20px;padding:16px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:10px}
.cartao h3{margin:0;font:700 .96rem var(--titulo);display:flex;gap:8px;align-items:center}
.filho.leg{margin:0 0 2px;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);font-weight:700}
.chk-cod{font-size:.7rem;color:var(--txt2);display:flex;gap:4px;align-items:center;white-space:nowrap}
.arvore{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.pai{border-radius:12px;border:1px solid var(--vidro-borda);padding:8px 10px}
.pai>b{font-size:.85rem}
.filho{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1.6fr) 92px 28px;gap:6px;align-items:center;margin-top:5px}
.filho input{padding:6px 8px;font-size:.78rem}
.oculto{display:none!important}
/* chamado único: cada solicitação tem sua cor (faixa lateral no balão, chip, cartão) */
.msg{border-left:4px solid var(--sol,var(--vidro-borda))}
.tag-sol{font-style:normal;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:6px;font-size:.62rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);margin-right:2px}
.chip-sol{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;font-size:.68rem;font-weight:650;color:var(--txt);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);white-space:nowrap}
.chip-sol::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.chip-sol.alvo{cursor:pointer;opacity:.6}.chip-sol.alvo.ativo{opacity:1;box-shadow:0 0 0 2px var(--c)}
.legenda,.alvos{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sol-card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 11px 9px 13px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);border-left:4px solid var(--c);transition:.15s;width:100%}
.sol-card:hover{background:rgba(255,255,255,.06)}
.sol-card.sel{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent);border-left-color:var(--c)}
.sol-card.chat{--c:var(--ciano)}
.sol-card .t1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sol-card .fim{margin-left:auto;font-size:.68rem;font-weight:600;color:var(--txt3);white-space:nowrap;font-variant-numeric:tabular-nums}.sol-card .t1 b{font-size:.84rem}
.sol-card small{color:var(--txt3);font-size:.7rem}
.barra-sol{position:sticky;top:-2px;z-index:3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--vidro-borda);background:color-mix(in srgb,var(--noite2) 88%,transparent);backdrop-filter:blur(8px)}
.barra-sol .qual{font-size:.72rem;color:var(--txt3);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.barra-sol .esp{flex:1}
.ic-sol{position:relative;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:10px;border:1px solid var(--vidro-borda);background:rgba(255,255,255,.04);color:var(--txt);font:600 .74rem var(--sans,Inter),sans-serif;cursor:pointer;transition:.15s}
.ic-sol:hover{border-color:var(--violeta);background:rgba(139,92,246,.1)}
.ic-sol.tem{border-color:rgba(139,92,246,.6);box-shadow:0 0 12px -4px rgba(139,92,246,.8)}
.ic-sol b{min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--violeta);color:#fff;font-size:.66rem;display:inline-flex;align-items:center;justify-content:center}
.setores{display:flex;flex-wrap:wrap;gap:6px}.setores label{cursor:pointer}.setores input{display:none}
.setores span{display:inline-block;padding:6px 11px;border-radius:20px;border:1px solid var(--vidro-borda);font-size:.78rem;transition:.15s}
.setores input:checked+span{background:var(--violeta);border-color:var(--violeta);color:#fff}
.painel-sol{display:flex;flex-direction:column;gap:9px;margin-top:6px;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 5%,transparent)}
.at-cab{border-left:4px solid var(--c,transparent)}
.tab tr.linha.app td:first-child{box-shadow:inset 3px 0 0 var(--ciano)}
.tab tr.linha.app{background:rgba(34,211,238,.04)}
.cab-cli{position:relative;display:flex;align-items:center;gap:8px;padding:6px 10px;margin:8px 0 2px;border-radius:14px;font-size:.78rem;white-space:nowrap;overflow-x:auto;
  border-left:4px solid var(--c);background:linear-gradient(135deg,rgba(14,17,26,.94),rgba(8,10,16,.9))}
.cab-cli .num{font:700 .82rem var(--titulo);color:var(--txt)} .cab-cli .nome{font:700 .92rem var(--titulo);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.cab-cli .dado{color:var(--txt3)} .cab-cli .dado b{color:var(--txt2)} .cab-cli .esp{flex:1;min-width:8px}
.cab-cli select.entrada{width:auto;padding:5px 8px;font-size:.76rem} .cab-cli .btn.p{padding:5px 10px}
#gradeCli .wg-corpo{display:flex;flex-direction:column;gap:9px}
#gradeCli .conversa{max-height:none;flex:1;min-height:60px}
.painel-cli.min .wg-corpo,.painel-cli.min .wg-redim{display:none}
.registro{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;padding-right:3px}
.tab th.ordenavel{cursor:pointer;user-select:none}.tab th.ordenavel:hover{color:var(--txt)}.tab th.ordenavel i{font-style:normal;opacity:.5;margin-left:2px}.tab th.ordenavel.on{color:var(--ouro2)}.tab th.ordenavel.on i{opacity:1}
@media (max-width:800px){.congelado{position:relative}}
#gradeCli .wg{animation:none!important}                       /* sem animação de entrada: a tela não "pisca" */
#gradeCli.montando .wg{transition:none!important}
#gradeCli .wg[data-wg="conversa"] .wg-corpo{overflow:hidden}     /* a conversa rola por dentro; o campo de resposta fica fixo embaixo */
#gradeCli .wg[data-wg="conversa"] .conversa{flex:1 1 auto;min-height:40px;overflow:auto}
#gradeCli .wg[data-wg="conversa"] .resp{flex:none}
#gradeCli #txtChat{min-height:46px!important;height:46px}
.filtros>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;margin:12px 6px 4px;font-size:.6rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--txt3)}

<body>
<div class="app">
  <div class="congelado" id="congelado">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca"><span id="logo"></span><span><b>Atendimento</b><small>Concierge · hub</small></span></div>

    <form class="busca-topo" id="fBusca"><input class="entrada" id="qTopo" placeholder="Nº, cliente, pedido…"><button class="btn-ic" type="submit" title="Buscar" id="btBusca"></button></form>
    <button type="button" class="btn-ic oculto" id="btPalavra" title="Palavra-chave dos pedidos (app do cliente)"></button>
    <span class="sync" id="sync"><i></i><span>…</span></span>
  </header>

  </div>
  <main id="main"><div class="vazio"><b>Carregando…</b></div></main>
</div>

<script src="/static/aurora.js?v=3"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg, $ = (s, r = document) => r.querySelector(s);
A.fundo();
$("#logo").outerHTML = A.orbe("mensagem", "#e8b33d");
$("#btBusca").innerHTML = svg("busca");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;
const API = "/api/tickets";
const ST_INFO = { aberto: ["Aberto", "#fbbf24"], em_andamento: ["Em andamento", "#60a5fa"], aguardando: ["Aguardando cliente", "#fb923c"], resolvido: ["Resolvido", "#34d399"], finalizado: ["Finalizado", "#a8a29e"], cancelado: ["Cancelado", "#6b7183"] };
const PRIO = { urgente: ["Urgente", "#fb7185"], alta: ["Alta", "#fb923c"], normal: ["Normal", "#34d399"], baixa: ["Baixa", "#94a3b8"] };
const ERP_ST = { rascunho: ["Rascunho", "#94a3b8"], confirmado: ["Confirmado", "#60a5fa"], agendado: ["Agendado", "#8b5cf6"], em_carga: ["Em carga", "#22d3ee"], em_rota: ["Em rota", "#22d3ee"], reagendar: ["Reagendar", "#fb923c"], entregue: ["Entregue", "#34d399"], cancelado: ["Cancelado", "#6b7183"], recusado: ["Recusado", "#fb7185"] };
const ABERTOS = ["aberto", "em_andamento", "aguardando"];
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const S = { e: null, sec: ls.get("wd.tk.sec", "meudia"), aba: ls.get("wd.tk.aba", "meus"), fila: "", ord: ls.get("wd.tk.ord", "urgencia") === "prioridade" ? "urgencia" : ls.get("wd.tk.ord", "urgencia"),
  q: "", pag: 0, sel: new Set(), atend: "", aberto: null, det: null, setorAbrir: "" };
const pode = (a) => !!S.e?.perm?.acoes?.[a];
S.abas = (() => { try { return JSON.parse(ls.get("wd.tk.abas", "[]")) || []; } catch (_) { return []; } })();
S.rasc = {};   // texto não enviado de cada aba (ao alternar, nada se perde)
const nomeU = (u) => S.e?.usuarios.find((x) => x.usuario === u)?.nome || u || "";
const dh = (s) => { s = String(s || ""); return s.length >= 16 ? `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 16)}` : s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "—"; };
const d10 = (s) => { s = String(s || ""); return s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "—"; };
const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const etq = (txt, cor) => `<span class="mini c" style="--c:${cor}">${esc(txt)}</span>`;
const etqSt = (s) => etq((ST_INFO[s] || [s])[0], (ST_INFO[s] || ["", "#888"])[1]);
const curto = (id) => String(id || "").split("#").pop().slice(0, 6).toUpperCase();
function slaTxt(sla) {
  if (!sla) return "";
  if (sla.estado === "cumprido") return `<span class="sla cumprido">no prazo</span>`;
  if (sla.estado === "perdido") return `<span class="sla perdido">fora do prazo</span>`;
  if (sla.min == null) return "";
  const m = Math.abs(sla.min), h = Math.floor(m / 60), txt = h >= 48 ? `${Math.floor(h / 24)}d ${h % 24}h` : h ? `${h}h${String(m % 60).padStart(2, "0")}` : `${m}min`;
  return sla.min <= 0 ? `<span class="sla venc">vencido há ${txt}</span>` : `<span class="sla ${sla.estado}">vence em ${txt}</span>`;
}
function sync(estado, txt) { const el = $("#sync"); el.className = "sync " + (estado || ""); el.lastElementChild.textContent = txt; }
async function chamar(url, op = {}, msg = "salvando…") {
  sync("salvando", msg);
  try { const r = await A.api(url.startsWith("/api/") ? url : API + url, op); sync("", "atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })); return r; }
  catch (e) { sync("erro", "erro"); if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); } throw e; }
}
const falha = (e) => A.toast("⚠ " + esc(e.message), [], { cor: "var(--rosa)", duracao: 9000 });
const ok = (t) => A.toast(t, [], { cor: "var(--verde)", duracao: 3500 });
const tidUrl = (id) => "/ticket/" + encodeURIComponent(id);
const DICA_TIPO = { resposta: "O cliente recebe esta mensagem no app (aba Chamados).", nota: "Nota interna: o cliente não vê.", contato: "“Registrar contato” = você falou com o cliente por telefone/WhatsApp (o cliente não vê)." };

/* ══════ PALAVRA-CHAVE (só quem tem a permissão) ══════ */
function consultaPalavra() {
  A.modal({ titulo: "Palavra-chave dos pedidos", icone: "cadeado", largura: 560,
    html: `<p class="dica" style="margin-bottom:8px">Gerada quando o pedido é criado no ERP. O cliente usa no login do app (se estiver exigida em Ajustes). Só passe ao próprio cliente.</p>
      <input class="entrada" id="pq" placeholder="Nome, código, CPF ou telefone do cliente…" autofocus><div id="pres" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"></div>`,
    botoes: [{ rotulo: "Fechar" }] });
  let tm;
  $("#pq").oninput = (e) => { clearTimeout(tm); tm = setTimeout(async () => {
    const q = e.target.value.trim(); if (q.length < 2) { $("#pres").innerHTML = ""; return; }
    try { const r = await chamar("/app/palavras?q=" + encodeURIComponent(q), {}, "buscando…");
      $("#pres").innerHTML = r.clientes.map((c) => `<div class="ped"><div class="t1"><b>${esc(c.nome)}</b><span class="dica">cód. ${esc(c.codigo || "—")}</span></div>
        ${c.pedidos.length ? `<ul>${c.pedidos.map((p) => `<li>Pedido #${p.numero} · ${esc((ERP_ST[p.status] || [p.status])[0])} — ${p.palavra_chave ? `<b style="color:var(--ouro2);letter-spacing:1px">${esc(p.palavra_chave)}</b>` : "<i>sem palavra</i>"}</li>`).join("")}</ul>` : `<p class="dica">Nenhum pedido.</p>`}</div>`).join("") || `<p class="dica">Nenhum cliente encontrado.</p>`;
    } catch (er) { falha(er); } }, 300); };
}

/* ══════ CARREGAR ══════ */
async function carregar() {
  try { novoEstado(await chamar("/estado", {}, "carregando…")); carregarAjuda(); }
  catch (e) {
    $("#main").innerHTML = e.message === "sem_banco_tickets" ? `<div class="vazio">${A.orbe("atencao", "var(--rosa)")}<b>Banco não configurado</b>Falta FIRESTORE_CREDS no Render.</div>`
      : `<div class="vazio">${A.orbe("atencao", "var(--rosa)")}<b>Não foi possível carregar</b>${esc(e.message)}</div>`;
    return;
  }
  const bp = $("#btPalavra"); bp.classList.toggle("oculto", !pode("palavra_chave")); bp.innerHTML = svg("cadeado"); bp.onclick = consultaPalavra;
  rota();
}
function rota() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h === "ajuda") { history.replaceState(null, "", location.pathname + location.search); ir("internos"); return; }
  if (h.startsWith("t=") || h.startsWith("c=")) { S.sec = "caixa"; const id = h.slice(2); if (id.includes("#")) S.solSel = id; S.aberto = cidDe(id); if (!S.abas.includes(S.aberto)) { S.abas.push(S.aberto); salvarAbas(); } }
  render();
}
addEventListener("hashchange", rota);
function ir(sec) { S.sec = sec; S.aberto = null; S.det = null; ls.set("wd.tk.sec", sec); if (location.hash) history.replaceState(null, "", location.pathname + location.search); render(); scrollTo(0, 0); }

/* ══════ CHAMADO ÚNICO: a unidade é o CLIENTE (código) ══════
   Cada cliente aparece UMA vez: "atendimento" (chat do app ativo) ou "ticket" (solicitações abertas).
   Os problemas são SOLICITAÇÕES dentro do chamado, cada uma com sua cor. */
const COR_SOL = ["#fb923c", "#f472b6", "#a3e635", "#e879f9", "#2dd4bf", "#818cf8"];
const corSol = (i) => (i == null || i < 0) ? "var(--ciano)" : COR_SOL[i % COR_SOL.length];
const cidDe = (id) => { id = String(id || ""); const i = id.lastIndexOf("#"); return i < 0 ? id : id.slice(0, i); };
const ESTADO = { atendimento: ["📱 Em atendimento (app)", "#22d3ee"], ticket: ["Ticket pendente", "#a3a9b8"], concluido: ["Concluído", "#34d399"] };
const tipoMsg = (c) => c.tipo || (String(c.texto || "").startsWith("📨") || String(c.texto || "").startsWith("✅ Setor") ? "pendencia" : "nota");
function clientes() {
  if (S._cliDe === S.e) return S._cli;
  const g = {}, pr = Object.keys(PRIO);
  for (const t of S.e.tickets) { if (t.interno) continue; const c = t.cid || cidDe(t.id); (g[c] = g[c] || []).push(t); }   // solicitação interna (sem cliente) não entra na Caixa
  S._cli = Object.entries(g).map(([cid, ts]) => {
    const vivos = ts.filter((t) => ABERTOS.includes(t.status));
    const chat = vivos.find((t) => t.chat) || null;
    const sols = ts.filter((t) => !t.chat), solsAb = sols.filter((t) => ABERTOS.includes(t.status));
    const estado = chat ? "atendimento" : solsAb.length ? "ticket" : "concluido";
    const comSla = vivos.filter((t) => t.sla && t.sla.min != null).sort((a, b) => a.sla.min - b.sla.min);
    const recente = ts.slice().sort((a, b) => String(b.atualizado_em).localeCompare(String(a.atualizado_em)))[0];
    const base = chat || solsAb[0] || recente, dono = vivos.find((t) => t.atribuido_para);
    const st = vivos.map((t) => t.status);
    return { id: cid, cid, estado, chat, sols, solsAb, todos: ts,
      status: estado === "concluido" ? recente.status : chat ? chat.status : st.includes("em_andamento") ? "em_andamento" : st.includes("aberto") ? "aberto" : "aguardando",
      sla: (comSla[0] || base).sla, cliente_nome: base.cliente_nome, cliente_codigo: base.cliente_codigo, cliente_telefone: base.cliente_telefone,
      atribuido_para: dono?.atribuido_para || "", atendentes: dono?.atendentes || [],
      meu: vivos.some((t) => t.meu), sem_dono: vivos.length > 0 && vivos.every((t) => t.sem_dono), nao_visto: vivos.some((t) => t.nao_visto), app_pendente: vivos.some((t) => t.app_pendente),
      pendencias: [...new Set(vivos.flatMap((t) => t.pendencias || []))],
      departamentos: [...new Set(vivos.map((t) => t.departamento || "—"))], motivos: [...new Set(vivos.map((t) => t.motivo_pai || "— sem motivo —"))],
      // filtro (popup): motivo › submotivo, etapa — dos abertos; cliente concluído usa as solicitações dele
      tabs: (vivos.length ? vivos : ts).filter((t) => !t.chat).map((t) => ({ pai: t.motivo_pai || "— sem motivo —", filho: t.motivo_filho || "sem submotivo", etapa: t.etapa_atual ? String(t.etapa_atual).split(" › ").pop() : "sem etapa" })),
      erp: vivos.some((t) => (t.origem || "").startsWith("erp")),
      prioridade: vivos.map((t) => t.prioridade || "normal").sort((a, b) => pr.indexOf(a) - pr.indexOf(b))[0] || "normal",

/* ══════ CAIXA (uma linha por cliente) ══════ */
function filtrar() {
  const me = S.e.eu;
  const porAba = { meus: (c) => c.meu && vivo(c), equipe: vivo, novos: (c) => vivo(c) && c.sem_dono, hoje: (c) => vivo(c) && c.sla?.estado === "hoje",
    venc: (c) => vivo(c) && c.sla?.estado === "venc", espera: (c) => vivo(c) && c.status === "aguardando", app: (c) => vivo(c) && c.app_pendente,
    atend: (c) => c.estado === "atendimento", concl: (c) => !vivo(c), todos: () => true, abertos_por_mim: (c) => c.aberto_por.includes(me.usuario) };
  let l = clientes().filter(porAba[S.aba] || porAba.equipe);
  if (S.fila) {
    const [tipo, val] = S.fila.split(":");
    l = l.filter((c) => tipo === "dep" ? c.departamentos.includes(val) : tipo === "mot" ? c.motivos.includes(val) : tipo === "pend" ? c.pendencias.includes(val)
      : tipo === "erp" ? c.erp : tipo === "app" ? (val === "pend" ? c.app_pendente : c.estado === "atendimento")
      : tipo === "com" ? (val === "_ninguem" ? c.sem_dono : c.atendentes.includes(val) || c.atribuido_para === val) : true);
  }
  if (S.q) { const q = norm(S.q); l = l.filter((c) => c.busca.includes(q)); }
  l = l.filter((c) => passaFiltro(c));
  const sm = (c) => c.sla?.min ?? 1e12;
  if (S.ordCol) {   // clique no cabeçalho: A-Z / Z-A
    const chave = { codigo: (c) => String(c.cliente_codigo || c.cid), nome: (c) => norm(c.cliente_nome), desde: (c) => String(c.criado_em || ""),
      dono: (c) => c.sem_dono ? "\uffff" : norm(nomeU(c.atribuido_para)), sla: (c) => vivo(c) ? sm(c) : 1e13 }[S.ordCol];
    const d = S.ordDir || 1;
    return l.sort((a, b) => { const x = chave(a), y = chave(b); return d * (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR", { numeric: true })); });
  }
  const ordem = { urgencia: (a, b) => (b.app_pendente - a.app_pendente) || sm(a) - sm(b), prioridade: (a, b) => Object.keys(PRIO).indexOf(a.prioridade) - Object.keys(PRIO).indexOf(b.prioridade) || sm(a) - sm(b),
    antigo: (a, b) => String(a.criado_em).localeCompare(String(b.criado_em)), recente: (a, b) => String(b.atualizado_em).localeCompare(String(a.atualizado_em)),
    atendente: (a, b) => nomeU(a.atribuido_para).localeCompare(nomeU(b.atribuido_para)) };
  return l.sort(ordem[S.ord] || ordem.urgencia);

/* minimizar/mostrar a conversa SEM remontar a tela */
function alternarConversa() {

  else { if (it.h > 2) S.convH = it.h; it.minH = 1; it.h = 1; it.el.classList.add("min"); }
  bt.innerHTML = svg(S.convAberta ? "minimizar" : "maximizar"); bt.title = S.convAberta ? "Minimizar" : "Mostrar a conversa";
  G.resolver(it); caberNaTela();

}
/* os painéis ocupam a altura da janela (em qualquer zoom) — a rolagem fica dentro de cada painel */
function caberNaTela() {
  const G = S.gradeCli; if (!G || !document.body.contains(G.area)) return;
  G.medir();
  if (!G.uma) {
    const linhas = Math.max(...G.itens.map((it) => it.y + it.h));
    const livre = innerHeight - (G.area.getBoundingClientRect().top + scrollY) - 14;   // do começo dos painéis até o fim da janela
    G.linha = Math.max(12, Math.min(90, Math.floor(livre / linhas) - G.espaco));
  }
  G.aplicar();
}

  } catch (_) { }
}
function bolhasAjuda(v, me) {
  return v.conversa.map((x) => { const meu = x.de === me.usuario;
    return `<div class="msg ${meu ? "resposta" : "cliente"}" style="--sol:${meu ? "var(--azul)" : "var(--violeta)"};${meu ? "margin-left:auto" : ""}"><span class="q"><b>${esc(x.setor || "—")}</b> · ${esc(x.nome || "")} · ${dh(x.em)}${x.encerrou ? " · ✅ encerrou" : ""}</span>${esc(x.texto || "")}</div>`; }).join("");
}
function chatAjuda(v, buscar) {   // buscar(pid) → visão atualizada (pendências da solicitação); sem ele usa a lista do /ajuda
  const me = (S.aj && S.aj.eu) || S.e.eu, aberto = v.status === "aberto";
  const md = A.modal({ titulo: `Pedido de ajuda · ${v.setor_origem} → ${v.setor_destino}`, icone: "mensagem", cor: "var(--violeta)", largura: 640,
    html: `<p class="dica" style="margin-bottom:8px">Cliente <b>${esc(v.cliente_nome || "")}</b> (${esc(v.cliente_codigo || "")}) · ${esc(v.assunto || "")} · pedido por ${esc(v.solicitado_por_nome || "")} em ${dh(v.solicitado_em)}</p>
      <div class="registro" id="ajConv" style="max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px">${bolhasAjuda(v, me)}</div>
      ${aberto ? `<textarea class="entrada" id="ajTxt" placeholder="Escreva no chat… (Ctrl+Enter envia)" style="margin-top:10px;min-height:64px" autofocus></textarea>` : `<p class="dica" style="margin-top:8px">✅ Pedido encerrado.</p>`}`,
    esquerda: buscar ? [] : [{ rotulo: "Abrir o atendimento", classe: "btn v", acao: () => { S.sec = "caixa"; abrirTicket(v.tid); } }],
    botoes: aberto ? [{ rotulo: "✅ Finalizar", classe: "btn v", acao: () => enviar(true) }, { rotulo: "Enviar", classe: "btn", principal: true, acao: () => enviar(false) }] : [{ rotulo: "Fechar" }] });
  const cv = md.el.querySelector("#ajConv"); cv.scrollTop = cv.scrollHeight;
  async function enviar(encerrar) {
    const tx = md.el.querySelector("#ajTxt"), texto = tx.value.trim();
    if (!texto && !encerrar) { A.toast("Escreva a mensagem."); return false; }   // finalizar pode ir sem mensagem
    try { await A.api(API + "/ajuda/mensagem", { method: "POST", body: { tid: v.tid, pid: v.id, texto, encerrar } }); ok(encerrar ? "Pedido de ajuda encerrado." : "Mensagem enviada."); }
    catch (e) { falha(e); return false; }

    tx.value = ""; tx.focus();
    return false;
  }
}
/* fila do meu setor: chats e solicitações ABERTOS com departamento = setor */
function filaSetor(setor) { return setor ? S.e.tickets.filter((t) => ABERTOS.includes(t.status) && norm(t.departamento) === norm(setor)) : []; }
const assuntoAbertura = (t) => t.chat ? "📱 " + (t.assunto || "Chat do app") : (t.interno ? "🔧 " : "") + (t.motivo_pai || "— sem motivo —");
function telaAjuda(m) {
  if (!S.aj) { m.innerHTML = `<div class="vazio"><b>Carregando…</b></div>`; carregarAjuda(true); return; }
  const aj = S.aj, l = aj.pedidos, f = S.ajFiltro || "setor", setor = aj.setor;
  const grupos = { recebidos: l.filter((v) => v.papel === "recebido" && v.status === "aberto"), enviados: l.filter((v) => v.papel === "enviado" && v.status === "aberto"), resolvidos: l.filter((v) => v.status !== "aberto") };

  fila.forEach((t) => (porAss[assuntoAbertura(t)] = porAss[assuntoAbertura(t)] || []).push(t));

  const cor = (x) => { let h = 0; for (const ch of String(x)) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 70% 62%)`; };

  const linha = (t) => `<tr class="linha${t.chat ? " app" : ""}${t.app_pendente ? " alerta" : ""}" data-tk="${esc(t.id)}">
      <td>${t.app_pendente ? `<span class="pisca" title="Cliente respondeu"></span>` : ""}<b>${t.interno ? "🔧 interna" : (t.chat ? "📱" : "#") + esc(t.cliente_codigo || "")}</b></td>
      <td class="ass"><b>${esc(t.interno ? (nomeU(t.aberto_por) || t.cliente_nome || "") : t.cliente_nome || "(sem nome)")}</b>${t.interno ? ` <small class="dica">· ${esc(t.assunto || "")}</small>` : ""}<br><small class="dica">${t.chat ? "chat do app" : esc(t.motivo_filho || t.assunto || "")}${t.erp_pedido_numero ? " · pedido #" + esc(t.erp_pedido_numero) : ""}</small></td>
      <td class="so-largo">${dh(t.criado_em)}</td>
      <td>${t.sem_dono ? `<span class="dica">— sem dono —</span>` : esc(nomeU(t.atribuido_para).split(" ")[0])}</td>
      <td>${slaTxt(t.sla)}<br>${etqSt(t.status)}</td></tr>`;
  const blocos = (ass ? [[ass, porAss[ass]]] : assuntos).map(([a, ts]) => `<tr><td colspan="5" style="padding:12px 8px 6px;border-bottom:1px solid var(--vidro-borda)"><b style="color:${cor(a)}">${esc(a)}</b> <span class="dica">${ts.length}</span></td></tr>${ts.slice().sort(ordSla).map(linha).join("")}`).join("");
  const card = (v) => { const ult = v.conversa[v.conversa.length - 1];
    return `<button type="button" class="sol-card" data-aj="${esc(v.id)}" style="--c:${v.status === "aberto" ? (v.papel === "recebido" ? "var(--violeta)" : "var(--azul)") : "var(--verde)"};width:100%;text-align:left">
      <span class="t1"><b>${esc(v.setor_origem)} → ${esc(v.setor_destino)}</b>${etq(v.status === "aberto" ? (v.papel === "recebido" ? "aguardando meu setor" : "aguardando " + v.setor_destino) : "encerrado", v.status === "aberto" ? "#8b5cf6" : "#34d399")}<span class="dica" style="margin-left:auto">${dh(v.ultima_em)}</span></span>
      <small><b>${esc(v.cliente_nome || "")}</b> · ${esc(v.cliente_codigo || "")} · ${esc(v.assunto || "")} · ${v.conversa.length} mensagem(ns)</small>
      <small style="display:block;margin-top:3px">💬 ${esc(ult.nome || "")}: ${esc(String(ult.texto || "").slice(0, 160))}</small></button>`; };
  m.innerHTML = `<div class="caixa">
    <aside class="filas vidro">
      ${aj.departamentos.length ? `<select class="entrada" id="ajSetor" style="width:100%;padding:6px 9px;margin-bottom:6px"><option value="">Meu setor${aj.eu.depto ? " (" + esc(aj.eu.depto) + ")" : ""}</option>${aj.departamentos.map((d) => `<option${S.ajSetor === d ? " selected" : ""}>${esc(d)}</option>`).join("")}</select>` : ""}
      <h4>Aberto no setor${setor ? " · " + esc(setor) : ""}</h4>
      ${bt("setor", "", "Tudo aberto no setor", fila.length, "var(--ouro)")}
      ${assuntos.length ? `<h4>Por assunto de abertura</h4>${assuntos.map(([a, ts]) => bt("setor", a, a, ts.length, cor(a))).join("")}` : ""}
      ${minhas.length || f === "minhas" ? `<h4>Solicitações internas</h4>${bt("minhas", "", "Que eu abri", minhas.length, "var(--violeta)")}` : ""}
      <h4>Pedidos de ajuda</h4>
      ${Object.keys(grupos).map((k2) => bt(k2, "", nomes[k2], grupos[k2].length, k2 === "recebidos" ? "var(--violeta)" : k2 === "enviados" ? "var(--azul)" : "var(--verde)")).join("")}
      <p class="dica" style="padding:10px 6px 2px">Chats e tickets abertos para o seu setor, agrupados pelo assunto com que foram abertos. Os pedidos de ajuda também chegam num balão de chat no topo do hub.</p>
    </aside>
    <section class="painel vidro">

      ${f === "minhas" ? `<h3 style="margin:0 0 10px">Solicitações internas que eu abri</h3>${minhas.length ? `<table class="tab"><thead><tr><th>Chamado</th><th>Quem / assunto</th><th class="so-largo">Desde</th><th>Dono</th><th>SLA / situação</th></tr></thead><tbody>${minhas.map(linha).join("")}</tbody></table>` : `<div class="vazio">${A.orbe("check", "var(--verde)")}<b>Nenhuma aberta</b></div>`}`

        ${fila.length ? `<table class="tab" style="margin-top:8px"><thead><tr><th>Chamado</th><th>Cliente</th><th class="so-largo">Desde</th><th>Dono</th><th>SLA / situação</th></tr></thead><tbody>${blocos}</tbody></table>` : `<div class="vazio">${A.orbe("check", "var(--verde)")}<b>Nada aberto no setor</b></div>`}`
      : `<h3 style="margin:0 0 10px">${nomes[f]}</h3><div style="display:flex;flex-direction:column;gap:8px">${grupos[f].map(card).join("") || `<div class="vazio">${A.orbe("check", "var(--verde)")}<b>Nada aqui</b></div>`}</div>`}
    </section></div>`;
  m.querySelectorAll("[data-ajf]").forEach((b) => (b.onclick = () => { S.ajFiltro = b.dataset.ajf; S.ajAss = b.dataset.ajass || ""; render(); }));
  m.querySelectorAll("[data-aj]").forEach((b) => (b.onclick = () => chatAjuda(l.find((x) => x.id === b.dataset.aj))));
  m.querySelectorAll("[data-tk]").forEach((r) => (r.onclick = () => { S.sec = "caixa"; abrirTicket(r.dataset.tk); }));
  const ss = $("#ajSetor"); if (ss) ss.onchange = () => { S.ajSetor = ss.value; S.ajAss = ""; S.aj = null; render(); };
}

/* ══════ GESTÃO ══════ */
function telaGestao(m) {
  const ts = S.e.tickets, cs = clientes(), cab = cs.filter(vivo), c = contagens();
  const solsAb = ts.filter((t) => !t.chat && ABERTOS.includes(t.status));
  const d7 = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const abertas7 = ts.filter((t) => !t.chat && String(t.criado_em) >= d7).length, concl7 = ts.filter((t) => !t.chat && !ABERTOS.includes(t.status) && String(t.atualizado_em) >= d7).length;
  const chats7 = ts.filter((t) => t.chat && String(t.criado_em) >= d7).length;
  const por = (f, l) => { const o = {}; l.forEach((t) => { const k = f(t); o[k] = (o[k] || 0) + 1; }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const k = (r, v, s2, cor) => `<div class="kpi" style="--c:${cor}"><small>${r}</small><b>${v}</b><span>${s2 || ""}</span></div>`;
  const barras = (l) => { const max = Math.max(1, ...l.map((x) => x[1])); return l.slice(0, 12).map(([n, v]) => `<div style="display:grid;grid-template-columns:160px 1fr 40px;gap:8px;align-items:center;font-size:.78rem;margin-bottom:5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span style="height:8px;border-radius:5px;background:rgba(255,255,255,.06)"><i style="display:block;height:100%;width:${v / max * 100}%;border-radius:5px;background:var(--ouro)"></i></span><b style="text-align:right">${v}</b></div>`).join(""); };
  const porAt = {}; cab.forEach((x) => { const a = x.atribuido_para || "_"; porAt[a] = porAt[a] || { n: 0, at: 0, sols: 0, venc: 0, hoje: 0 }; const v = porAt[a]; v.n++; if (x.estado === "atendimento") v.at++; v.sols += x.solsAb.length; if (x.sla?.estado === "venc") v.venc++; if (x.sla?.estado === "hoje") v.hoje++; });
  m.innerHTML = `<section class="painel vidro"><h2 style="margin:0 0 4px;font:700 1.25rem var(--titulo)">Painel de gestão</h2>
    <p class="dica" style="margin-bottom:12px">Cada cliente conta uma vez: está em <b>atendimento</b> (chat do app ativo) ou é um <b>ticket pendente</b>. As solicitações são os problemas dentro dos tickets.</p>
    <div class="kpis">${k("Atendimentos agora", c.atend, "chats do app ativos", "var(--ciano)")}${k("Tickets pendentes", c.tks, "clientes com solicitação aberta", "var(--azul)")}${k("Solicitações abertas", solsAb.length, `média ${c.tks ? (solsAb.length / Math.max(1, cab.filter((x) => x.solsAb.length).length)).toFixed(1) : 0} por cliente`, "var(--violeta)")}${k("Sem dono", c.novos, "clientes", "var(--ouro)")}${k("Vencidos", c.venc, "clientes", "var(--rosa)")}${k("Solicitações (7 dias)", abertas7, `${concl7} concluídas · ${chats7} chats`, "var(--verde)")}</div>
    <div class="cartoes" style="margin-top:14px">
      <div class="cartao"><h3>Solicitações abertas por motivo</h3>${barras(por((t) => t.motivo_pai || "— sem motivo —", solsAb))}</div>
      <div class="cartao"><h3>Solicitações abertas por setor</h3>${barras(por((t) => t.departamento || "—", solsAb))}</div>
      <div class="cartao"><h3>Clientes por pessoa</h3><table class="tab"><thead><tr><th>Atendente</th><th>Clientes</th><th>Em atendimento</th><th>Solicitações</th><th>Vencem hoje</th><th>Vencidos</th></tr></thead><tbody>
        ${Object.entries(porAt).sort((a, b) => b[1].n - a[1].n).map(([a, v]) => `<tr><td>${a === "_" ? "— sem dono —" : esc(nomeU(a))}</td><td>${v.n}</td><td>${v.at}</td><td>${v.sols}</td><td>${v.hoje}</td><td style="color:${v.venc ? "var(--rosa)" : ""}">${v.venc}</td></tr>`).join("")}</tbody></table></div>
    </div></section>`;
}

          ${arvSetor && !kProp ? `<span class="dica">${esc(arvSetor)} ainda usa a árvore geral. Monte a dele abaixo ou <a href="#" id="copiarGeral">comece copiando a geral</a>.</span>` : arvSetor ? `<span class="dica">Ao abrir chamado para <b>${esc(arvSetor)}</b>, só aparecem estes motivos. Apagar todos = volta a usar a geral.</span>` : ""}</div>
        <div class="filho leg"><span>Submotivo</span><span>SLA (dias)</span><span>Etapas (separadas por vírgula)</span><span>Código cliente</span><span>Ativo</span></div>

        <p class="dica" style="margin-top:-4px">Sem “exige código” = <b>solicitação interna</b> (ex.: Manutenção › torneira, TI › trocar mouse): abre sem cliente, não entra na Caixa e cai só em Pedidos de ajuda do setor.</p>

        <label class="campo">Setores (para abrir chamado e pedir ajuda) — separados por vírgula<input id="deps" value="${esc(deps.join(", "))}"></label>

  };
  const redesenhar = () => { $("#arv").innerHTML = pais(); ligarArv(); };
  const ligarArv = () => m.querySelectorAll("[data-delpai]").forEach((b) => (b.onclick = () => { lerArv(); delete arv[b.dataset.delpai]; redesenhar(); }));
  ligarArv();
  $("#addPai").onclick = () => { lerArv(); const v = $("#novoPai").value.trim(); if (v && !arv[v]) arv[v] = {}; $("#novoPai").value = ""; redesenhar(); };
  m.querySelectorAll("[data-novofilho]").forEach((i) => (i.onkeydown = (ev) => { if (ev.key === "Enter") { lerArv(); redesenhar(); } }));
  $("#salvarArv").onclick = async () => { lerArv(); try { await chamar("/config/motivos", { method: "PUT", body: { motivos: arv, setor: arvSetor, departamentos: $("#deps").value.split(",").map((x) => x.trim()).filter(Boolean) } }); ok(arvSetor ? `Motivos de ${arvSetor} salvos.` : "Motivos e setores salvos."); await carregar(); } catch (er) { falha(er); } };
  $("#arvSetor").onchange = (ev) => { S.arvSetor = ev.target.value; render(); };
  const cg = $("#copiarGeral"); if (cg) cg.onclick = (ev) => { ev.preventDefault(); arv = JSON.parse(JSON.stringify(e.motivos)); redesenhar(); };
  $("#salvarErp").onclick = async () => { const auto = {}; m.querySelectorAll("[data-auto]").forEach((c) => (auto[c.dataset.auto] = c.checked));
    try { await chamar("/config", { method: "PUT", body: { auto_erp: auto, depto_erp: $("#dErp").value, motivo_pai_erp: $("#mErp").value, sla_erp_dias: +$("#sErp").value || 0 } }); ok("Salvo."); await carregar(); } catch (er) { falha(er); } };
  const ss = $("#salvarSetores"); if (ss) ss.onclick = async () => { const mapa = {}, perfis = {}; m.querySelectorAll("[data-setoru]").forEach((s2) => { if (s2.value) mapa[s2.dataset.setoru] = s2.value; });
    m.querySelectorAll("[data-perfilu]").forEach((s2) => { if (s2.value) perfis[s2.dataset.perfilu] = s2.value; });
    const body = { perfis }; if (e.banco === "hub") body.setor_usuarios = mapa;
    try { await chamar("/config", { method: "PUT", body }); ok("Setores e perfis salvos."); await carregar(); } catch (er) { falha(er); } };
  const desenhaUra = () => { $("#uraLista").innerHTML = ura.map((o, i) => `<div class="ura-it"><input class="entrada" data-ura="${i}|rotulo" value="${esc(o.rotulo || "")}" placeholder="Opção (ex.: Troca)"><input class="entrada" data-ura="${i}|descricao" value="${esc(o.descricao || "")}" placeholder="Descrição curta">
      <select class="entrada" data-ura="${i}|motivo_pai"><option value="">motivo —</option>${Object.keys(arv).map((p2) => `<option${p2 === o.motivo_pai ? " selected" : ""}>${esc(p2)}</option>`).join("")}</select>
      <select class="entrada" data-ura="${i}|departamento"><option value="">setor —</option>${deps.map((d) => `<option${d === o.departamento ? " selected" : ""}>${esc(d)}</option>`).join("")}</select>
      <button type="button" class="btn-ic p" data-uradel="${i}" title="Tirar opção">${svg("lixo")}</button></div>`).join("");
    m.querySelectorAll("[data-ura]").forEach((x) => (x.oninput = x.onchange = () => { const [i, k2] = x.dataset.ura.split("|"); ura[+i][k2] = x.value; }));
    m.querySelectorAll("[data-uradel]").forEach((b) => (b.onclick = () => { ura.splice(+b.dataset.uradel, 1); desenhaUra(); })); };
  desenhaUra();
  $("#uraAdd").onclick = () => { ura.push({ id: "", rotulo: "", descricao: "", motivo_pai: "", departamento: "" }); desenhaUra(); };
  const gp = $("#gerarPalavras"); if (gp) gp.onclick = async () => { try { const r = await chamar("/app/palavras/gerar", { method: "POST" }, "gerando…"); ok(`${r.feitos} pedido(s) ganharam palavra-chave.`); await carregar(); } catch (er) { falha(er); } };
  $("#copiarLink").onclick = async () => { try { await navigator.clipboard.writeText($("#linkApp").textContent); ok("Link copiado."); } catch (_) { A.toast("Selecione e copie o link."); } };
  $("#salvarApp").onclick = async () => {
    const lista = ura.filter((o) => String(o.rotulo || "").trim()).map((o) => ({ ...o, id: o.id || norm(o.rotulo).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) }));
    if (!lista.length) { A.toast("Deixe ao menos uma opção no menu."); return; }
    try { await chamar("/config", { method: "PUT", body: { app_cliente: { ativo: $("#appAtivo").checked, exigir_palavra: $("#appPalavra").checked, empresa: $("#appEmp").value, saudacao: $("#appSaud").value, ura: lista } } }); ok("App do cliente salvo."); await carregar(); } catch (er) { falha(er); } };
  $("#recarregar").onclick = async () => { try { await chamar("/recarregar", { method: "POST" }, "relendo…"); await carregar(); ok("Relido."); } catch (er) { falha(er); } };
}

/* ══════ INÍCIO ══════ */
carregar();
/* com um atendimento aberto: se o cliente escreveu pelo app, a conversa atualiza sozinha (sem perder o que você está digitando) */
setInterval(() => { if (document.visibilityState !== "visible" || !S.aberto || document.querySelector(".aur-modal-fundo") || $("#txt")?.value || $("#txtChat")?.value) return;
  A.api(API + "/estado").then((e) => { if (e.versao !== S.e?.versao) { guardarRascunho(); recarregarCliente(); } }).catch(() => {}); }, 20000);   // busca por trás e só troca o conteúdo — a tela não pisca
setInterval(() => { if (document.visibilityState === "visible") carregarAjuda(); }, 20000);
setInterval(() => { if (document.visibilityState === "visible" && S.sec === "meudia" && !S.aberto) carregarEquipe(); }, 30000);   // painel da equipe (online / produtividade)   // pedidos de ajuda do meu setor (contador da aba + lista)
setInterval(() => { if (document.visibilityState === "visible" && !S.aberto && !document.querySelector(".aur-modal-fundo")) A.api(API + "/estado").then((e) => { if (e.versao !== S.e?.versao) { novoEstado(e); if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); } }).catch(() => {}); }, 30000);
})();
</script>
</body>
