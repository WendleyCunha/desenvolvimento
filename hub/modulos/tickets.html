<!--
═══════════════════════════════════════════════════════════════════════════════
 tickets.html — ATENDIMENTO (cópia do Concierge) · módulo do hub
───────────────────────────────────────────────────────────────────────────────
 Meu dia · Caixa (filas + abas + lote) · Atendimento em 3 colunas
 (conversa · tabulação/andamento/pendências · cliente + PEDIDOS DO ERP) ·
 Abrir chamado por setor · Tickets internos (entre setores) · Gestão · Ajustes.
 Diferença para o Concierge: aqui o ERP é o nosso — agendar/reagendar, cancelar
 e gerar troca saem do próprio atendimento, e a baixa com avaria/recusa/ausência
 no ERP abre o ticket sozinha.
 API: /api/tickets (hub/tickets.py) · ERP: /api/erp (hub/erp.py)
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:20px;flex-wrap:wrap}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.9),rgba(8,10,16,.85))}
.marca{display:flex;align-items:center;gap:10px;margin-right:6px}
.marca b{display:block;font:700 1.02rem var(--titulo)}
.marca small{display:block;font-size:.56rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav button{padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:650;color:var(--txt2);position:relative}
.nav button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav button.ativo{color:var(--ouro2);background:rgba(var(--ouro-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--ouro-rgb),.4)}
.nav button em{font-style:normal;font-size:.62rem;font-weight:700;margin-left:5px;padding:1px 6px;border-radius:9px;background:var(--rosa);color:#1a0a0e}
.busca-topo{display:flex;gap:6px}
.busca-topo .entrada{width:190px;padding:8px 10px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro)} .sync.erro i{background:var(--rosa)}
main{margin-top:14px}
.painel{border-radius:22px;padding:16px}
.sec{display:flex;align-items:center;gap:8px;margin:16px 2px 10px;font-size:.64rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.sec:first-child{margin-top:0}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--vidro-borda),transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{position:relative;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);--c:var(--azul);text-align:left;overflow:hidden}
button.kpi{cursor:pointer;width:100%;font:inherit;color:inherit}
button.kpi:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.kpi small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.45rem/1.1 var(--titulo);margin-top:6px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:3px}
.frase{font:600 1.05rem/1.5 var(--titulo);color:var(--txt2);margin:2px 0 14px;max-width:70ch}
.frase b{color:var(--ouro2)}
.vazio{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--txt3);font-size:.84rem;padding:30px 10px}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}

/* caixa */
.caixa{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.filas{border-radius:20px;padding:12px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.filas h4{margin:12px 6px 6px;font-size:.6rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3)}
.filas h4:first-child{margin-top:2px}
.filas button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:10px;font-size:.8rem;color:var(--txt2)}
.filas button:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.filas button.ativo{background:rgba(var(--ouro-rgb),.12);color:var(--ouro2)}
.filas button i{width:8px;height:8px;border-radius:3px;background:var(--c,var(--txt3));flex:none}
.filas button em{margin-left:auto;font-style:normal;font-size:.7rem;color:var(--txt3)}
.abas-caixa{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.abas-caixa button{padding:7px 11px;border-radius:10px;font-size:.78rem;font-weight:650;color:var(--txt2);border:1px solid transparent}
.abas-caixa button:hover{background:rgba(255,255,255,.05)}
.abas-caixa button.ativo{color:var(--txt);border-color:var(--vidro-borda-forte);background:rgba(255,255,255,.06)}
.abas-caixa button em{font-style:normal;color:var(--txt3);margin-left:4px;font-weight:600}
.abas-caixa button.venc em{color:var(--rosa)}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.barra .dir{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.barra select.entrada{width:auto;padding:7px 10px}
.tab{width:100%;border-collapse:collapse;font-size:.8rem}
.tab th{font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);text-align:left;padding:8px;border-bottom:1px solid var(--vidro-borda);white-space:nowrap}
.tab td{padding:9px 8px;border-bottom:1px solid var(--vidro-borda);vertical-align:top}
.tab tr.linha{cursor:pointer;transition:background .15s}
.tab tr.linha:hover{background:rgba(255,255,255,.04)}
.tab tr.linha.alerta td:first-child{box-shadow:inset 3px 0 0 var(--ciano)}
.tab .ass b{display:block;font-weight:600;color:var(--txt)}
.tab .ass small{color:var(--txt3);font-size:.7rem;line-height:1.45}
.tab input[type=checkbox]{accent-color:var(--ouro);width:16px;height:16px}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:7px;font-size:.64rem;font-weight:650;color:var(--txt2);background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda);white-space:nowrap}
.mini.c{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.sla{font-weight:700;font-size:.74rem;white-space:nowrap}
.sla.venc{color:var(--rosa)} .sla.hoje,.sla.warn{color:var(--ouro2)} .sla.ok{color:var(--verde)} .sla.cumprido{color:var(--txt3)} .sla.perdido{color:var(--rosa);opacity:.7}
.pisca{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ciano);box-shadow:0 0 10px var(--ciano);animation:aurRespira 1.2s infinite;margin-right:4px;vertical-align:middle}
.paginas{display:flex;gap:6px;justify-content:center;margin-top:12px;align-items:center;font-size:.78rem;color:var(--txt3)}

/* atendimento */
.at-cab{border-radius:20px;padding:14px 16px;margin-bottom:12px}
.at-cab h1{margin:0 0 8px;font:700 1.25rem/1.25 var(--titulo)}
.at-cab .linha1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--txt2)}
.at-cab .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.at{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.col{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col h3{margin:0;font:700 .92rem var(--titulo);display:flex;align-items:center;gap:8px}
.col h3 small{margin-left:auto;font:500 .7rem var(--sans);color:var(--txt3)}
.conversa{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto;padding-right:4px}
.msg{padding:9px 12px;border-radius:13px;font-size:.83rem;line-height:1.5;background:rgba(255,255,255,.04);border:1px solid var(--vidro-borda);white-space:pre-wrap;word-break:break-word}
.msg .q{display:block;font-size:.68rem;color:var(--txt3);margin-bottom:3px;white-space:normal}
.msg.cliente{border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.07)}
.msg.nota{border-color:rgba(var(--ouro-rgb),.3);background:rgba(var(--ouro-rgb),.06)}
.msg.sistema{font-size:.74rem;color:var(--txt3);background:transparent;border-style:dashed;padding:6px 10px}
.msg.pendencia{border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.07)}
.msg.contato{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}
.msg.app{border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08);margin-right:18%}
.msg.resposta{border-color:rgba(232,179,61,.5);background:rgba(232,179,61,.1);margin-left:18%}
.msg .q b{color:var(--ciano)} .msg.resposta .q b{color:var(--ouro2)}
.link-app{display:flex;gap:6px;align-items:center}.link-app code{flex:1;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ura-it{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.8fr) auto;gap:5px;align-items:center}.ura-it input,.ura-it select{padding:6px 8px;font-size:.76rem}
.resp textarea{min-height:90px}
.resp .tipos{display:flex;gap:4px;flex-wrap:wrap}
.campo{margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ficha{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.8rem}
.ficha dt{color:var(--txt3);font-size:.66rem;letter-spacing:.8px;text-transform:uppercase;padding-top:2px}
.ficha dd{margin:0;word-break:break-word}
.ped{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);font-size:.8rem;--c:var(--azul)}
.ped .t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ped .t1 b{font:700 .9rem var(--titulo)}
.ped ul{margin:6px 0 0;padding-left:16px;color:var(--txt2);font-size:.76rem}
.ped .acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.trava{padding:10px 12px;border-radius:12px;font-size:.8rem;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.35);color:#fecdd3}
.aviso{font-size:.8rem;padding:10px 12px;border-radius:12px;line-height:1.5}
.aviso.ouro{color:var(--ouro2);background:rgba(var(--ouro-rgb),.07);border:1px solid rgba(var(--ouro-rgb),.3)}
.aviso.mal{color:#fecdd3;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3)}
.dica{font-size:.72rem;color:var(--txt3);line-height:1.5;margin:0}
.pend-it{padding:8px 10px;border-radius:11px;font-size:.78rem;background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.3)}
.pend-it.ok{background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.25)}

/* abrir chamado */
.setores{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.setor{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);transition:.2s;--c:var(--ouro)}
.setor:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent);transform:translateY(-2px)}
.setor .sig{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:700 .9rem var(--titulo);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);flex:none}
.setor b{display:block;font:700 .95rem var(--titulo)}
.setor small{color:var(--txt3);font-size:.74rem}

/* ajustes */
.cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.cartao{border-radius:20px;padding:16px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:10px}
.cartao h3{margin:0;font:700 .96rem var(--titulo);display:flex;gap:8px;align-items:center}
.arvore{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.pai{border-radius:12px;border:1px solid var(--vidro-borda);padding:8px 10px}
.pai>b{font-size:.85rem}
.filho{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1.6fr) auto;gap:6px;align-items:center;margin-top:5px}
.filho input{padding:6px 8px;font-size:.78rem}
.oculto{display:none!important}
/* chamado único: cada solicitação tem sua cor (faixa lateral no balão, chip, cartão) */
.msg{border-left:4px solid var(--sol,var(--vidro-borda))}
.tag-sol{font-style:normal;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:6px;font-size:.62rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);margin-right:2px}
.chip-sol{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;font-size:.68rem;font-weight:650;color:var(--txt);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);white-space:nowrap}
.chip-sol::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.chip-sol.alvo{cursor:pointer;opacity:.6}.chip-sol.alvo.ativo{opacity:1;box-shadow:0 0 0 2px var(--c)}
.legenda,.alvos{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sol-card{display:flex;flex-direction:column;gap:3px;text-align:left;padding:9px 11px 9px 13px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);border-left:4px solid var(--c);transition:.15s;width:100%}
.sol-card:hover{background:rgba(255,255,255,.06)}
.sol-card.sel{background:color-mix(in srgb,var(--c) 12%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent);border-left-color:var(--c)}
.sol-card.chat{--c:var(--ciano)}
.sol-card .t1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sol-card .t1 b{font-size:.84rem}
.sol-card small{color:var(--txt3);font-size:.7rem}
.painel-sol{display:flex;flex-direction:column;gap:9px;margin-top:6px;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 5%,transparent)}
.at-cab{border-left:4px solid var(--c,transparent)}
.tab tr.linha.app td:first-child{box-shadow:inset 3px 0 0 var(--ciano)}
.tab tr.linha.app{background:rgba(34,211,238,.04)}
.resumo-real{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--txt2);margin:0 2px 10px}
.resumo-real b{font:700 1.05rem var(--titulo);color:var(--txt);margin-right:3px}
/* abas de atendimento (tipo navegador): app à esquerda (cor), tickets à direita (neutros) */
.abas-tk{position:sticky;top:76px;z-index:35;display:flex;align-items:flex-end;gap:6px;margin:12px 0 -6px;padding:6px 6px 0;border-radius:16px 16px 0 0;overflow-x:auto;scrollbar-width:thin}
.abas-tk:empty{display:none}
.abas-tk .grupo{display:flex;gap:4px;align-items:flex-end;flex:none}
.abas-tk .meio{flex:1;min-width:12px;align-self:center;height:1px}
.abas-tk .rot{font-size:.56rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3);padding:0 4px 9px;white-space:nowrap}
.aba-tk{position:relative;display:flex;align-items:center;gap:6px;max-width:220px;padding:8px 8px 8px 11px;border-radius:12px 12px 0 0;font-size:.76rem;font-weight:600;color:var(--txt2);
  background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);border-bottom:0;transition:.15s;flex:none}
.aba-tk:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.aba-tk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aba-tk .nm small{color:var(--txt3);font-weight:600;margin-right:4px}
.aba-tk .x{display:grid;place-items:center;width:18px;height:18px;border-radius:6px;color:var(--txt3);font-size:13px;line-height:1;flex:none}
.aba-tk .x:hover{background:rgba(251,113,133,.18);color:var(--rosa)}
.aba-tk.ativo{color:var(--txt);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border-color:var(--vidro-borda-forte);box-shadow:0 -2px 0 var(--txt2) inset}
.aba-tk.app{color:var(--ciano);background:rgba(34,211,238,.07);border-color:rgba(34,211,238,.35)}
.aba-tk.app .nm small{color:rgba(34,211,238,.7)}
.aba-tk.app.ativo{background:linear-gradient(180deg,rgba(34,211,238,.22),rgba(34,211,238,.08));color:var(--txt);border-color:rgba(34,211,238,.6);box-shadow:0 -3px 0 var(--ciano) inset}
.aba-tk.pend{border-color:var(--rosa);color:var(--txt)}
.aba-tk.pend::after{content:attr(data-sinal);position:absolute;top:-8px;right:6px;padding:0 6px;border-radius:8px;font:700 .56rem/15px var(--sans);letter-spacing:.4px;text-transform:uppercase;background:var(--rosa);color:#fff;box-shadow:0 0 12px var(--rosa)}
.aba-tk.pend .pisca{background:var(--rosa);box-shadow:0 0 10px var(--rosa)}
.aba-caixa{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px 12px 0 0;font-size:.78rem;font-weight:700;color:var(--txt2);border:1px solid var(--vidro-borda);border-bottom:0;background:rgba(255,255,255,.03);flex:none}
.aba-caixa.ativo{color:var(--ouro2);background:rgba(var(--ouro-rgb),.12);border-color:rgba(var(--ouro-rgb),.45);box-shadow:0 -3px 0 var(--ouro) inset}
.aba-caixa svg.i{width:15px;height:15px}
@media (max-width:800px){.abas-tk{top:0}}
@media (max-width:1100px){.at{grid-template-columns:1fr 1fr}.at .col.cli{grid-column:1/-1}}
@media (max-width:800px){.caixa,.at{grid-template-columns:1fr}.filas{position:relative;top:0;max-height:none}.topo{position:relative;top:0}.tab .so-largo{display:none}.busca-topo .entrada{width:130px}}
</style>
</head>
<body>
<div class="app">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca"><span id="logo"></span><span><b>Atendimento</b><small>Concierge · hub</small></span></div>
    <nav class="nav" id="nav"></nav>
    <form class="busca-topo" id="fBusca"><input class="entrada" id="qTopo" placeholder="Nº, cliente, pedido…"><button class="btn-ic" type="submit" title="Buscar" id="btBusca"></button></form>
    <button type="button" class="btn-ic oculto" id="btPalavra" title="Palavra-chave dos pedidos (app do cliente)"></button>
    <span class="sync" id="sync"><i></i><span>…</span></span>

<script src="/static/aurora.js?v=3"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg, $ = (s, r = document) => r.querySelector(s);
A.fundo();
$("#logo").outerHTML = A.orbe("mensagem", "#e8b33d");
$("#btBusca").innerHTML = svg("busca");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;
const API = "/api/tickets";
const ST_INFO = { aberto: ["Aberto", "#fbbf24"], em_andamento: ["Em andamento", "#60a5fa"], aguardando: ["Aguardando cliente", "#fb923c"], resolvido: ["Resolvido", "#34d399"], finalizado: ["Finalizado", "#a8a29e"], cancelado: ["Cancelado", "#6b7183"] };

const ABERTOS = ["aberto", "em_andamento", "aguardando"];
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const S = { e: null, sec: ls.get("wd.tk.sec", "meudia"), aba: ls.get("wd.tk.aba", "meus"), fila: "", ord: ls.get("wd.tk.ord", "urgencia"),
  q: "", pag: 0, sel: new Set(), atend: "", aberto: null, det: null, setorAbrir: "" };
const pode = (a) => !!S.e?.perm?.acoes?.[a];
S.abas = (() => { try { return JSON.parse(ls.get("wd.tk.abas", "[]")) || []; } catch (_) { return []; } })();
S.rasc = {};   // texto não enviado de cada aba (ao alternar, nada se perde)
const nomeU = (u) => S.e?.usuarios.find((x) => x.usuario === u)?.nome || u || "";
const dh = (s) => { s = String(s || ""); return s.length >= 16 ? `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 16)}` : s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "—"; };
const d10 = (s) => { s = String(s || ""); return s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "—"; };
const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const etq = (txt, cor) => `<span class="mini c" style="--c:${cor}">${esc(txt)}</span>`;
const etqSt = (s) => etq((ST_INFO[s] || [s])[0], (ST_INFO[s] || ["", "#888"])[1]);
const curto = (id) => String(id || "").split("#").pop().slice(0, 6).toUpperCase();
function slaTxt(sla) {
  if (!sla) return "";
  if (sla.estado === "cumprido") return `<span class="sla cumprido">no prazo</span>`;
  if (sla.estado === "perdido") return `<span class="sla perdido">fora do prazo</span>`;
  if (sla.min == null) return "";
  const m = Math.abs(sla.min), h = Math.floor(m / 60), txt = h >= 48 ? `${Math.floor(h / 24)}d ${h % 24}h` : h ? `${h}h${String(m % 60).padStart(2, "0")}` : `${m}min`;
  return sla.min <= 0 ? `<span class="sla venc">vencido há ${txt}</span>` : `<span class="sla ${sla.estado}">vence em ${txt}</span>`;
}
function sync(estado, txt) { const el = $("#sync"); el.className = "sync " + (estado || ""); el.lastElementChild.textContent = txt; }
async function chamar(url, op = {}, msg = "salvando…") {
  sync("salvando", msg);
  try { const r = await A.api(url.startsWith("/api/") ? url : API + url, op); sync("", "atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })); return r; }
  catch (e) { sync("erro", "erro"); if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); } throw e; }
}
const falha = (e) => A.toast("⚠ " + esc(e.message), [], { cor: "var(--rosa)", duracao: 9000 });
const ok = (t) => A.toast(t, [], { cor: "var(--verde)", duracao: 3500 });
const tidUrl = (id) => "/ticket/" + encodeURIComponent(id);
const DICA_TIPO = { resposta: "O cliente recebe esta mensagem no app (aba Chamados).", nota: "Nota interna: o cliente não vê.", contato: "“Registrar contato” = você falou com o cliente por telefone/WhatsApp (o cliente não vê)." };

/* ══════ PALAVRA-CHAVE (só quem tem a permissão) ══════ */
function consultaPalavra() {
  A.modal({ titulo: "Palavra-chave dos pedidos", icone: "cadeado", largura: 560,
    html: `<p class="dica" style="margin-bottom:8px">Gerada quando o pedido é criado no ERP. O cliente usa no login do app (se estiver exigida em Ajustes). Só passe ao próprio cliente.</p>
      <input class="entrada" id="pq" placeholder="Nome, código, CPF ou telefone do cliente…" autofocus><div id="pres" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"></div>`,
    botoes: [{ rotulo: "Fechar" }] });
  let tm;
  $("#pq").oninput = (e) => { clearTimeout(tm); tm = setTimeout(async () => {
    const q = e.target.value.trim(); if (q.length < 2) { $("#pres").innerHTML = ""; return; }
    try { const r = await chamar("/app/palavras?q=" + encodeURIComponent(q), {}, "buscando…");
      $("#pres").innerHTML = r.clientes.map((c) => `<div class="ped"><div class="t1"><b>${esc(c.nome)}</b><span class="dica">cód. ${esc(c.codigo || "—")}</span></div>
        ${c.pedidos.length ? `<ul>${c.pedidos.map((p) => `<li>Pedido #${p.numero} · ${esc((ERP_ST[p.status] || [p.status])[0])} — ${p.palavra_chave ? `<b style="color:var(--ouro2);letter-spacing:1px">${esc(p.palavra_chave)}</b>` : "<i>sem palavra</i>"}</li>`).join("")}</ul>` : `<p class="dica">Nenhum pedido.</p>`}</div>`).join("") || `<p class="dica">Nenhum cliente encontrado.</p>`;
    } catch (er) { falha(er); } }, 300); };
}

/* ══════ CARREGAR ══════ */
async function carregar() {
  try { novoEstado(await chamar("/estado", {}, "carregando…")); }
  catch (e) {
    $("#main").innerHTML = e.message === "sem_banco_tickets" ? `<div class="vazio">${A.orbe("atencao", "var(--rosa)")}<b>Banco não configurado</b>Falta FIRESTORE_CREDS no Render.</div>`
      : `<div class="vazio">${A.orbe("atencao", "var(--rosa)")}<b>Não foi possível carregar</b>${esc(e.message)}</div>`;
    return;
  }
  const bp = $("#btPalavra"); bp.classList.toggle("oculto", !pode("palavra_chave")); bp.innerHTML = svg("cadeado"); bp.onclick = consultaPalavra;
  rota();
}
function rota() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h.startsWith("t=") || h.startsWith("c=")) { S.sec = "caixa"; const id = h.slice(2); if (id.includes("#")) S.solSel = id; S.aberto = cidDe(id); if (!S.abas.includes(S.aberto)) { S.abas.push(S.aberto); salvarAbas(); } }
  render();
}
addEventListener("hashchange", rota);
function ir(sec) { S.sec = sec; S.aberto = null; S.det = null; ls.set("wd.tk.sec", sec); if (location.hash) history.replaceState(null, "", location.pathname + location.search); render(); scrollTo(0, 0); }

/* ══════ CHAMADO ÚNICO: a unidade é o CLIENTE (código) ══════
   Cada cliente aparece UMA vez: "atendimento" (chat do app ativo) ou "ticket" (solicitações abertas).
   Os problemas são SOLICITAÇÕES dentro do chamado, cada uma com sua cor. */
const COR_SOL = ["#fb923c", "#f472b6", "#a3e635", "#e879f9", "#2dd4bf", "#818cf8"];
const corSol = (i) => (i == null || i < 0) ? "var(--ciano)" : COR_SOL[i % COR_SOL.length];
const cidDe = (id) => { id = String(id || ""); const i = id.lastIndexOf("#"); return i < 0 ? id : id.slice(0, i); };
const ESTADO = { atendimento: ["📱 Em atendimento (app)", "#22d3ee"], ticket: ["Ticket pendente", "#a3a9b8"], concluido: ["Concluído", "#34d399"] };
const tipoMsg = (c) => c.tipo || (String(c.texto || "").startsWith("📨") || String(c.texto || "").startsWith("✅ Setor") ? "pendencia" : "nota");
function clientes() {
  if (S._cliDe === S.e) return S._cli;
  const g = {}, pr = Object.keys(PRIO);
  for (const t of S.e.tickets) { const c = t.cid || cidDe(t.id); (g[c] = g[c] || []).push(t); }
  S._cli = Object.entries(g).map(([cid, ts]) => {
    const vivos = ts.filter((t) => ABERTOS.includes(t.status));
    const chat = vivos.find((t) => t.chat) || null;
    const sols = ts.filter((t) => !t.chat), solsAb = sols.filter((t) => ABERTOS.includes(t.status));
    const estado = chat ? "atendimento" : solsAb.length ? "ticket" : "concluido";
    const comSla = vivos.filter((t) => t.sla && t.sla.min != null).sort((a, b) => a.sla.min - b.sla.min);
    const recente = ts.slice().sort((a, b) => String(b.atualizado_em).localeCompare(String(a.atualizado_em)))[0];
    const base = chat || solsAb[0] || recente, dono = vivos.find((t) => t.atribuido_para);
    const st = vivos.map((t) => t.status);
    return { id: cid, cid, estado, chat, sols, solsAb, todos: ts,
      status: estado === "concluido" ? recente.status : chat ? chat.status : st.includes("em_andamento") ? "em_andamento" : st.includes("aberto") ? "aberto" : "aguardando",
      sla: (comSla[0] || base).sla, cliente_nome: base.cliente_nome, cliente_codigo: base.cliente_codigo, cliente_telefone: base.cliente_telefone,
      atribuido_para: dono?.atribuido_para || "", atendentes: dono?.atendentes || [],
      meu: vivos.some((t) => t.meu), sem_dono: vivos.length > 0 && vivos.every((t) => t.sem_dono), nao_visto: vivos.some((t) => t.nao_visto), app_pendente: vivos.some((t) => t.app_pendente),
      pendencias: [...new Set(vivos.flatMap((t) => t.pendencias || []))],
      departamentos: [...new Set(vivos.map((t) => t.departamento || "—"))], motivos: [...new Set(vivos.map((t) => t.motivo_pai || "— sem motivo —"))],
      erp: vivos.some((t) => (t.origem || "").startsWith("erp")),
      prioridade: vivos.map((t) => t.prioridade || "normal").sort((a, b) => pr.indexOf(a) - pr.indexOf(b))[0] || "normal",
      aberto_por: ts.map((t) => t.aberto_por), criado_em: ts.map((t) => String(t.criado_em || "")).sort()[0], atualizado_em: recente.atualizado_em,
      busca: norm(ts.map((t) => `${t.id} ${curto(t.id)} ${t.assunto} ${t.cliente_nome} ${t.cliente_codigo} ${t.cliente_telefone} ${t.erp_pedido_numero || ""} ${t.motivo_pai} ${t.motivo_filho}`).join(" ")) };
  });
  S._cliDe = S.e;
  return S._cli;
}
const cliDe = (cid) => clientes().find((c) => c.cid === cid);
const vivo = (c) => c.estado !== "concluido";
const etqEstado = (c) => etq(ESTADO[c.estado][0], ESTADO[c.estado][1]);

function salvarAbas() { ls.set("wd.tk.abas", JSON.stringify(S.abas.slice(0, 20))); }
S.abas = [...new Set(S.abas.map(cidDe))];   // abas antigas (por solicitação) viram abas do cliente
function fecharAba(cid) {
  const i = S.abas.indexOf(cid); if (i < 0) return;
  S.abas.splice(i, 1); salvarAbas(); delete S.rasc[cid];
  if (S.aberto === cid) { const prox = S.abas[i] || S.abas[i - 1]; S.det = null; if (prox) abrirTicket(prox); else ir("caixa"); }
  else renderAbas();
}
/* faixa de abas: Caixa · [em atendimento no app — ciano, quem respondeu primeiro] ……… [tickets — neutros] */
function renderAbas() {
  const el = $("#abasTk");
  if (!S.e || S.sec !== "caixa" || !S.abas.length) { el.innerHTML = ""; return; }
  const info = (cid) => cliDe(cid) || (S.det?.cid === cid ? { cid, estado: "ticket", cliente_nome: S.det.cliente.nome, solsAb: [] } : { cid, estado: "concluido", solsAb: [] });
  const ehApp = (cid) => info(cid).estado === "atendimento";
  const sinal = (c) => c.app_pendente ? "respondeu" : c.nao_visto ? "novo" : "";
  const aba = (cid) => { const c = info(cid), sn = sinal(c), nome = String(c.cliente_nome || cid).split(" ")[0];
    return `<button type="button" class="aba-tk${ehApp(cid) ? " app" : ""}${S.aberto === cid ? " ativo" : ""}${sn ? " pend" : ""}" data-aba-tk="${esc(cid)}" data-sinal="${sn}" title="${esc((c.cliente_nome || "") + " · chamado " + (c.cliente_codigo || cid))}">
      ${sn ? `<span class="pisca"></span>` : ""}<span class="nm"><small>${ehApp(cid) ? "📱" : "#"}${esc(String(c.cliente_codigo || cid).slice(0, 8))}</small>${esc(nome)}${(c.solsAb || []).length > 1 ? ` <small>· ${c.solsAb.length}</small>` : ""}</span><span class="x" data-fechar="${esc(cid)}" title="Fechar aba">×</span></button>`; };
  const app = S.abas.filter(ehApp).sort((a, b) => (sinal(info(b)) ? 1 : 0) - (sinal(info(a)) ? 1 : 0));   // quem respondeu vem primeiro
  const tks = S.abas.filter((cid) => !ehApp(cid));
  el.innerHTML = `<button type="button" class="aba-caixa${!S.aberto ? " ativo" : ""}" id="abaCaixa">${svg("voltar")} Caixa</button>
    ${app.length ? `<div class="grupo"><span class="rot">Atendimento app</span>${app.map(aba).join("")}</div>` : ""}
    <span class="meio"></span>
    ${tks.length ? `<div class="grupo"><span class="rot">Tickets</span>${tks.map(aba).join("")}</div>` : ""}`;
  $("#abaCaixa").onclick = () => { guardarRascunho(); ir("caixa"); };
  el.querySelectorAll("[data-aba-tk]").forEach((b) => {
    b.onclick = (ev) => {
      const f = ev.target.closest("[data-fechar]");
      if (f) { ev.stopPropagation(); fecharAba(f.dataset.fechar); return; }
      if (S.aberto === b.dataset.abaTk) return;
      guardarRascunho(); abrirTicket(b.dataset.abaTk);
    };
    b.onauxclick = (ev) => { if (ev.button === 1) { ev.preventDefault(); fecharAba(b.dataset.abaTk); } };   // botão do meio fecha, como no navegador
  });
}
function guardarRascunho() { const t = $("#txt"); if (t && S.aberto) S.rasc[S.aberto] = t.value; }
/* cliente respondeu no app → aviso na hora (prioridade) */
function novoEstado(e) {
  const antes = new Set(S.e ? clientes().filter((c) => c.app_pendente).map((c) => c.cid) : []), primeira = !S.e;
  S.e = e;
  const cs = clientes();
  if (!primeira) {
    const chegaram = cs.filter((c) => c.app_pendente && vivo(c) && !antes.has(c.cid) && (c.meu || c.sem_dono || S.abas.includes(c.cid)));
    chegaram.slice(0, 3).forEach((c) => A.toast(`📱 <b>${esc(c.cliente_nome || "Cliente")}</b> escreveu no app`,
      [{ rotulo: "Atender", acao: () => { S.sec = "caixa"; ls.set("wd.tk.sec", "caixa"); guardarRascunho(); abrirTicket(c.cid); } }], { cor: "var(--ciano)", duracao: 12000 }));
    if (chegaram.length) { try { A.som && A.som(); } catch (_) {} }
  }
  const n = cs.filter((c) => c.app_pendente && vivo(c)).length;
  document.title = (n ? `(${n}) ` : "") + "Atendimento";
}
/* abre o CLIENTE (aceita o id de uma solicitação "cliente#sid": abre o cliente com ela selecionada) */
function abrirTicket(id) {
  const cid = cidDe(id);
  if (String(id).includes("#")) { S.solSel = id; S.alvo = null; }
  if (!S.abas.includes(cid)) { S.abas.push(cid); salvarAbas(); }
  if (S.aberto !== cid) { S.det = null; if (!String(id).includes("#")) { S.solSel = null; S.alvo = null; } }
  S.aberto = cid; history.replaceState(null, "", "#c=" + encodeURIComponent(cid)); render(); scrollTo(0, 0);
}

/* ══════ NAV ══════ */
function contagens() {
  const cs = clientes(), ab = cs.filter(vivo);
  return {
    meus: ab.filter((c) => c.meu).length, equipe: ab.length, novos: ab.filter((c) => c.sem_dono).length,
    hoje: ab.filter((c) => c.sla?.estado === "hoje").length, venc: ab.filter((c) => c.sla?.estado === "venc").length,
    espera: ab.filter((c) => c.status === "aguardando").length, concl: cs.filter((c) => !vivo(c)).length, todos: cs.length,
    alerta: ab.filter((c) => c.nao_visto || c.app_pendente).length, app: ab.filter((c) => c.app_pendente).length,
    internos: S.e.tickets.filter((t) => ABERTOS.includes(t.status) && (t.pendencias || []).length).length,
    atend: ab.filter((c) => c.estado === "atendimento").length, tks: ab.filter((c) => c.estado === "ticket").length,
    sols: S.e.tickets.filter((t) => !t.chat && ABERTOS.includes(t.status)).length,
  };
}
function nav() {
  const c = contagens();
  const itens = [["meudia", "Meu dia"], ["caixa", "Caixa", c.alerta], ["abrir", "Abrir chamado", 0, "abrir"], ["internos", "Tickets internos", c.internos],
    ["gestao", "Gestão", 0, "gestao"], ["ajustes", "Ajustes", 0, "configurar"]];
  $("#nav").innerHTML = itens.filter((i) => !i[3] || pode(i[3])).map((i) => `<button type="button" data-sec="${i[0]}" class="${S.sec === i[0] ? "ativo" : ""}">${i[1]}${i[2] ? `<em>${i[2]}</em>` : ""}</button>`).join("");
  $("#nav").querySelectorAll("[data-sec]").forEach((b) => (b.onclick = () => ir(b.dataset.sec)));
}
$("#fBusca").onsubmit = (e) => { e.preventDefault(); S.q = $("#qTopo").value.trim(); S.aba = "todos"; S.fila = ""; S.pag = 0; ir("caixa"); };
function render() {
  if (!S.e) return;
  nav();
  renderAbas();
  const m = $("#main");
  if (S.sec === "caixa" && S.aberto) return telaCliente(m, S.aberto);
  ({ meudia: telaMeuDia, caixa: telaCaixa, abrir: telaAbrir, internos: telaInternos, gestao: telaGestao, ajustes: telaAjustes }[S.sec] || telaMeuDia)(m);
}
const assumirCliente = (cid, alvo) => chamar(`/cliente/${encodeURIComponent(cid)}/dono`, { method: "POST", body: { atribuir: alvo } });

/* ══════ MEU DIA ══════ */
const FRASES = ["Fazer acontecer é responder “estou verificando” em dois minutos em vez de nada em duas horas.",
  "Ticket que volta é o primeiro atendimento que não resolveu.", "Quem promete data, cumpre data — o prazo da etapa é a palavra dada ao cliente."];
function telaMeuDia(m) {
  const e = S.e, me = e.eu, c = contagens(), cs = clientes();
  const h = new Date().getHours();
  const meusAb = cs.filter((x) => x.meu && vivo(x));
  const concl30 = e.tickets.filter((t) => !t.chat && !ABERTOS.includes(t.status) && t.meu).length;
  const prox = cs.filter((x) => vivo(x) && x.sem_dono).sort((a, b) => (b.app_pendente - a.app_pendente) || ((a.sla?.min ?? 1e9) - (b.sla?.min ?? 1e9)))[0];
  const k = (r, v, s, c2, acao) => `<button type="button" class="kpi" style="--c:${c2}" ${acao ? `data-ir="${acao}"` : ""}><small>${r}</small><b>${v}</b><span>${s}</span></button>`;
  m.innerHTML = `<section class="painel vidro">
    <p class="dica" style="text-transform:uppercase;letter-spacing:2px;font-weight:700">${new Date().toLocaleDateString("pt-BR", { weekday: "long" })}</p>
    <h1 style="margin:2px 0 6px;font:700 1.6rem var(--titulo)">${h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"}, ${esc(me.nome.split(" ")[0])}</h1>
    <p class="frase">${FRASES[new Date().getDate() % FRASES.length]}</p>
    <div class="sec">O que precisa de você agora</div>
    ${meusAb.length ? `<div class="kpis">${k("Clientes comigo", meusAb.length, `${meusAb.filter((x) => x.estado === "atendimento").length} em atendimento · ${meusAb.filter((x) => x.estado === "ticket").length} tickets`, "var(--azul)", "meus")}${k("Vencem hoje", meusAb.filter((x) => x.sla?.estado === "hoje").length, "dos meus", "var(--ouro)", "hoje")}${k("Vencidos", meusAb.filter((x) => x.sla?.estado === "venc").length, "dos meus", "var(--rosa)", "venc")}${k("Aguardando o cliente", meusAb.filter((x) => x.status === "aguardando").length, "dos meus", "var(--laranja)", "espera")}${k("Cliente respondeu", meusAb.filter((x) => x.app_pendente || x.nao_visto).length, "priorize", "var(--ciano)", "meus")}</div>`

        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn p" id="enviar">Enviar</button>
          ${ABERTOS.includes(alvo.status) ? `<select class="entrada" id="stDepois" style="width:auto;padding:6px 9px"><option value="">e manter situação</option><option value="aguardando">e aguardar o cliente</option>${pode("encerrar") && !alvo.chat ? `<option value="resolvido">e concluir esta solicitação</option>` : ""}</select>` : ""}
          <span class="dica" id="dicaTipo">${DICA_TIPO[tipoSel]}</span></div>
      </div>` : ""}
    </section>

    <section class="col vidro">
      <h3>${svg("lista")} Solicitações <small>${abertas.length} aberta(s)</small></h3>
      ${chat ? cartao(chat) : ""}
      ${abertas.map(cartao).join("") || (!chat ? `<p class="dica">Nenhuma solicitação aberta.</p>` : `<p class="dica">Nenhum ticket aberto — só o chat.</p>`)}
      ${fechadas.length ? `<details${fechadas.some((s) => s.id === sel.id) ? " open" : ""}><summary class="dica" style="cursor:pointer">Concluídas (${fechadas.length})</summary><div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${fechadas.map(cartao).join("")}</div></details>` : ""}
      <div class="painel-sol" style="--c:${corSol(sel.cor)}">
        <div class="sec" style="margin-top:4px;color:${corSol(sel.cor)}">${esc(rot(sel))}</div>
        <div class="acoes" style="display:flex;gap:6px;flex-wrap:wrap">
          ${pode("atender") && !sel.chat ? `<select class="entrada" id="prio" style="width:auto;padding:6px 9px">${Object.entries(PRIO).map(([k2, [r]]) => `<option value="${k2}"${(sel.prioridade || "normal") === k2 ? " selected" : ""}>Prioridade: ${r}</option>`).join("")}</select>` : ""}
          ${selAberta && pode("atender") ? `<button type="button" class="btn v p" data-st="${sel.status === "aguardando" ? "em_andamento" : "aguardando"}">${sel.status === "aguardando" ? "Retomar" : "Aguardar o cliente"}</button>` : ""}
          ${selAberta && pode("encerrar") ? (sel.chat ? `<button type="button" class="btn p" id="concluirChat">${svg("check")} Concluir chat</button>` : `<button type="button" class="btn p" data-st="resolvido">${svg("check")} Concluir</button><button type="button" class="btn perigo p" data-st="cancelado">Cancelar</button>`) : ""}
          ${!selAberta && pode("atender") && !sel.chat ? `<button type="button" class="btn v p" data-st="em_andamento">Reabrir</button>` : ""}
          ${sel.status === "resolvido" && pode("encerrar") && !sel.chat ? `<button type="button" class="btn v p" data-st="finalizado">Finalizar</button>` : ""}
        </div>
        ${sel.chat ? `<p class="dica">Chat do app (${esc(sel.assunto || "")}). Ao concluir, você escolhe: anexar a conversa ao chamado ou transformá-la numa solicitação.</p>`
        : sel.etapa_travada ? `<div class="trava">🔒 <b>${esc(sel.motivo_pai || "")} › ${esc(sel.etapa_atual || "")}</b><br>Prazo combinado: <b>${d10(sel.etapa_data_prevista)}</b> · travado por ${esc(sel.etapa_definida_por || "")} em ${dh(sel.etapa_definida_em)}.</div>`
        : pode("atender") ? `
          <label class="campo">Motivo<select id="mPai"><option value="">Escolha…</option>${Object.keys(arv).map((p) => `<option${p === sel.motivo_pai ? " selected" : ""}>${esc(p)}</option>`).join("")}</select></label>
          <label class="campo">Submotivo<select id="mFilho"><option value="">Escolha…</option>${filhos(sel).map(([f, i]) => `<option value="${esc(f)}"${f === sel.motivo_filho ? " selected" : ""}>${esc(f)}${i.sla != null ? ` · SLA ${i.sla}d` : ""}</option>`).join("")}</select></label>
          <label class="campo">Etapa${sel.etapa_atual ? ` <small class="dica">· atual: ${esc(caminho.slice(1).join(" › ") || "—")}</small>` : ""}<select id="mEtapa"></select></label>
          <label class="campo">Prazo combinado com o cliente <small class="dica">(opcional — trava a trilha)</small><input type="date" id="mData"></label>
          <button type="button" class="btn p" id="classificar">Salvar etapa</button>` : `<p class="dica">${esc(sel.motivo_pai || "não classificado")} ${sel.etapa_atual ? "› " + esc(sel.etapa_atual) : ""}</p>`}
        ${(sel.historico_etapas || []).length ? `<details><summary class="dica" style="cursor:pointer">Trilha de etapas (${sel.historico_etapas.length})</summary>${sel.historico_etapas.slice().reverse().map((h) => `<p class="dica">${dh(h.quando)} · ${esc(h.etapa)} · ${esc(h.por || "")}${h.vermelha ? ` · prazo ${d10(h.data_prevista)}` : ""}</p>`).join("")}</details>` : ""}
        ${!sel.chat ? `<div class="sec">Pendências com outros setores</div>
        ${pedidosAb.length ? pedidosAb.map((p) => { const r = resp[p.id]; return `<div class="pend-it ${r ? "ok" : ""}"><b>${esc(p.setor_origem)} → ${esc(p.setor_destino)}</b> · ${dh(p.solicitado_em)} · ${esc(p.solicitado_por_nome || "")}<br>${esc(p.mensagem || "")}
          ${r ? `<p class="dica" style="margin-top:4px">✅ ${esc(r.respondido_por_nome || "")} · ${dh(r.respondido_em)}: ${esc(r.resposta || "")}</p>` : pode("atender") ? `<div style="display:flex;gap:6px;margin-top:6px"><input class="entrada" data-resp="${esc(p.id)}" placeholder="Responder pelo setor ${esc(p.setor_destino)}…" style="padding:6px 9px"><button type="button" class="btn v p" data-respbt="${esc(p.id)}">Responder</button></div>` : ""}</div>`; }).join("") : `<p class="dica">Nenhuma pendência.</p>`}
        ${selAberta && pode("atender") ? `<div class="g2"><select class="entrada" id="pSetor"><option value="">Pedir ajuda a…</option>${S.e.departamentos.map((d) => `<option>${esc(d)}</option>`).join("")}</select><input class="entrada" id="pMsg" placeholder="O que precisa do setor?"></div><button type="button" class="btn v p" id="pedir">Pedir ajuda</button>` : ""}` : ""}
      </div>
    </section>

    <section class="col cli vidro">
      <h3>${svg("usuario")} Cliente</h3>
      <dl class="ficha"><dt>Nome</dt><dd>${esc(D.cliente.nome || "—")}</dd><dt>Chamado</dt><dd>nº ${esc(D.cliente.codigo || "—")}</dd><dt>Telefone</dt><dd>${esc(D.cliente.telefone || "não informado")}</dd><dt>Dono</dt><dd>${temDono ? esc(nomeU(D.dono[0])) : "ninguém"}</dd></dl>
      ${erpBloco(sel, D.erp)}
    </section>
  </div>`;
  ligarCliente(m, D, sel, alvo, chat, abertas);
}

function erpBloco(t, erp) {
  if (!erp) return "";
  if (erp.sem_acesso) return `<div class="sec">Pedidos (ERP)</div><p class="dica">Sem acesso ao ERP.</p>`;
  const ac = (p) => {
    const b = [];
    if (["confirmado", "agendado", "reagendar"].includes(p.status) && erp.pode.agendar) b.push(`<button type="button" class="btn v p" data-erp-agendar="${p.id}">${svg("calendario")} ${p.status === "agendado" ? "Reagendar" : "Agendar"}</button>`);
    if (p.status === "entregue" && erp.pode.pedidos && pode("atender")) b.push(`<button type="button" class="btn v p" data-erp-troca="${p.id}">${svg("repetir")} Gerar troca</button>`);
    if (!["em_rota", "entregue", "cancelado", "recusado"].includes(p.status) && erp.pode.cancelar) b.push(`<button type="button" class="btn perigo p" data-erp-cancelar="${p.id}">Cancelar pedido</button>`);
    b.push(`<button type="button" class="btn v p" data-erp-ver="${p.id}">Ver no ERP ↗</button>`);
    return b.join("");
  };
  return `<div class="sec">Pedidos no ERP (${erp.pedidos.length})</div>
    ${erp.clientes.length ? `<p class="dica">Cliente no ERP: ${erp.clientes.map((c) => `<b>${esc(c.nome)}</b>${c.codigo ? " (" + esc(c.codigo) + ")" : ""}`).join(", ")}${pode("atender") ? ` · <a href="#" id="trocaCli">trocar</a>` : ""}</p>`
      : `<div class="aviso ouro">Não achei este cliente no ERP pelo código, telefone ou nome.${pode("atender") ? ` <a href="#" id="trocaCli">Vincular cliente do ERP</a>` : ""}</div>`}
    ${erp.pedidos.map((p) => `<div class="ped" style="--c:${(ERP_ST[p.status] || ["", "#888"])[1]}">
      <div class="t1"><b>${p.tipo === "troca" ? "Troca" : "Pedido"} #${p.numero}</b>${etq((ERP_ST[p.status] || [p.status])[0], (ERP_ST[p.status] || ["", "#888"])[1])}${p.pendencia === "ausente" ? etq("ausente — reagendar", "#fb923c") : ""}${p.pendencia === "reposicao" ? etq("reposição de avaria", "#fb7185") : ""}${p.sem_estoque ? etq("sem estoque", "#fb7185") : ""}</div>
      ${erp.pode.palavra && p.status !== "rascunho" ? `<p class="dica" style="margin-top:4px">🔑 Palavra-chave: ${p.palavra_chave ? `<b style="color:var(--ouro2);letter-spacing:1px">${esc(p.palavra_chave)}</b>` : "<i>sem palavra</i>"} · <a href="#" data-nova-palavra="${p.id}">${p.palavra_chave ? "gerar outra" : "gerar"}</a></p>` : ""}
      <p class="dica" style="margin-top:3px">${d10(p.criado_em)}${p.agendamento ? ` · entrega ${d10(p.agendamento.data)} ${esc(p.agendamento.janela || "")}` : ""}${p.carga ? ` · carga ${esc(p.carga)}` : ""}</p>
      <ul>${p.itens.map((i) => `<li>${i.qtd}× ${esc(i.nome)}</li>`).join("")}</ul>
      ${p.tentativas.length ? `<p class="dica">Tentativas: ${p.tentativas.map((x) => `${x.n}ª ${esc(x.resultado)} ${d10(x.data)}${x.motivo ? " (" + esc(x.motivo) + ")" : ""}`).join(" · ")}</p>` : ""}
      <div class="acoes">${ac(p)}</div></div>`).join("") || `<p class="dica">Nenhum pedido encontrado.</p>`}`;
}

/* modal: motivo › submotivo (+ pedido) — usado em "Nova solicitação" e em "Concluir chat → virar solicitação" */
function camposMotivo(prefixo, D, extra = "") {
  const arv = S.e.motivos, peds = (D.erp?.pedidos || []).filter((p) => p.status !== "rascunho");
  return `<div class="g2"><label class="campo">Motivo<select id="${prefixo}Pai"><option value="">Escolha…</option>${Object.keys(arv).map((p) => `<option>${esc(p)}</option>`).join("")}</select></label>
    <label class="campo">Submotivo<select id="${prefixo}Filho"><option value="">Escolha o motivo</option></select></label></div>
    ${peds.length ? `<label class="campo" style="margin-top:8px">Pedido (opcional)<select id="${prefixo}Ped"><option value="">Não é sobre um pedido</option>${peds.map((p) => `<option value="${esc(p.id)}" data-num="${esc(p.numero)}">Pedido #${p.numero} · ${esc((ERP_ST[p.status] || [p.status])[0])}</option>`).join("")}</select></label>` : ""}${extra}`;
}
function ligarMotivo(prefixo) {
  const arv = S.e.motivos, mp = $("#" + prefixo + "Pai"), mf = $("#" + prefixo + "Filho");
  mp.onchange = () => { mf.innerHTML = `<option value="">Escolha…</option>` + Object.entries(arv[mp.value] || {}).filter(([, i]) => i.ativo !== false).map(([f, i]) => `<option value="${esc(f)}">${esc(f)}${i.sla != null ? ` · SLA ${i.sla}d` : ""}</option>`).join(""); };
}

function ligarCliente(m, D, sel, alvo, chat, abertas) {
  const cid = D.cid, recarregarDet = async () => { S.det = null; await carregar(); };
  { const tx = $("#txt"); if (tx) { if (S.rasc[cid]) tx.value = S.rasc[cid]; tx.addEventListener("input", () => { S.rasc[cid] = tx.value; }); } }
  const pm = $("#paraMim"); if (pm) pm.onclick = async () => { try { await assumirCliente(cid, S.e.eu.usuario); ok("O cliente agora está com você."); await recarregarDet(); } catch (e) { falha(e); } };
  const tr = $("#transf"); if (tr) tr.onchange = async () => { if (!tr.value) return; const a2 = tr.value === "__ninguem" ? "" : tr.value; try { await assumirCliente(cid, a2); ok("Cliente transferido."); await recarregarDet(); } catch (e) { falha(e); } };
  const pr = $("#prio"); if (pr) pr.onchange = async () => { try { await chamar(tidUrl(sel.id) + "/alterar", { method: "POST", body: { prioridade: pr.value } }); await recarregarDet(); } catch (e) { falha(e); } };
  m.querySelectorAll("[data-sol]").forEach((b) => (b.onclick = () => { guardarRascunho(); S.solSel = b.dataset.sol; const s = D.solicitacoes.find((x) => x.id === S.solSel); if (s && (ABERTOS.includes(s.status) || !S.alvo)) S.alvo = s.id; render(); }));
  m.querySelectorAll("[data-alvo]").forEach((b) => (b.onclick = () => { guardarRascunho(); S.alvo = b.dataset.alvo; S.tipoMsg = null; render(); }));
  m.querySelectorAll("[data-st]").forEach((b) => (b.onclick = async () => {
    const st = b.dataset.st;
    if (st === "cancelado" && !(await A.confirmar("Cancelar esta solicitação?", { perigo: true, rotulo: "Cancelar solicitação" }))) return;
    try { await chamar(tidUrl(sel.id) + "/alterar", { method: "POST", body: { status: st } }); ok("Situação: " + (ST_INFO[st] || [st])[0]); await recarregarDet(); } catch (e) { falha(e); }
  }));
  let tipo = m.querySelector("[data-tipo].ativo")?.dataset.tipo || "nota";
  m.querySelectorAll("[data-tipo]").forEach((b) => (b.onclick = () => { tipo = b.dataset.tipo; S.tipoMsg = { alvo: alvo.id, tipo }; m.querySelectorAll("[data-tipo]").forEach((x) => x.classList.toggle("ativo", x === b)); const d = $("#dicaTipo"); if (d) d.textContent = DICA_TIPO[tipo]; }));
  const env = $("#enviar");
  if (env) {
    const enviar = async () => { const txt = $("#txt").value.trim(); if (!txt) return; const body = { texto: txt, tipo }; const sd = $("#stDepois")?.value; if (sd) body.status = sd;
      try { await chamar(tidUrl(alvo.id) + "/comentar", { method: "POST", body }); delete S.rasc[cid]; await recarregarDet(); } catch (e) { falha(e); } };
    env.onclick = enviar; $("#txt").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) enviar(); };
  }
  const conv = $("#conversa"); if (conv) conv.scrollTop = conv.scrollHeight;
  // tabulação da solicitação selecionada
  const mp = $("#mPai"), mf = $("#mFilho"), me2 = $("#mEtapa");
  if (mp) {
    const arv = S.e.motivos, atual = String(sel.etapa_atual || "").split(" › ")[1] || "";
    const etapas = () => { const info = (arv[mp.value] || {})[mf.value] || {}; me2.innerHTML = `<option value="">— sem etapa —</option>` + (info.etapas || []).map((x) => `<option${x === atual ? " selected" : ""}>${esc(x)}</option>`).join(""); };
    mp.onchange = () => { mf.innerHTML = `<option value="">Escolha…</option>` + Object.entries(arv[mp.value] || {}).filter(([, i]) => i.ativo !== false).map(([f, i]) => `<option value="${esc(f)}">${esc(f)}${i.sla != null ? ` · SLA ${i.sla}d` : ""}</option>`).join(""); etapas(); };
    mf.onchange = etapas; etapas();
    $("#classificar").onclick = async () => {
      if (!mp.value || !mf.value) { A.toast("Escolha motivo e submotivo."); return; }
      const data = $("#mData").value;
      if (data && !(await A.confirmar(`Travar a trilha com prazo em <b>${d10(data)}</b>? Depois disso ela não pode mais ser mudada.`, { rotulo: "Travar prazo" }))) return;
      try { await chamar(tidUrl(sel.id) + "/classificar", { method: "POST", body: { motivo_pai: mp.value, motivo_filho: mf.value, etapa: me2.value, data_prevista: data } }); ok("Etapa salva."); await recarregarDet(); } catch (e) { falha(e); }
    };
  }
  const pd = $("#pedir"); if (pd) pd.onclick = async () => { const setor = $("#pSetor").value, msg = $("#pMsg").value.trim(); if (!setor || !msg) { A.toast("Escolha o setor e escreva o pedido."); return; }
    try { await chamar(tidUrl(sel.id) + "/pendencia", { method: "POST", body: { setor, mensagem: msg } }); ok("Pedido enviado ao setor " + setor + "."); await recarregarDet(); } catch (e) { falha(e); } };
  m.querySelectorAll("[data-respbt]").forEach((b) => (b.onclick = async () => { const v = m.querySelector(`[data-resp="${CSS.escape(b.dataset.respbt)}"]`).value.trim(); if (!v) return;
    try { await chamar(tidUrl(sel.id) + "/pendencia", { method: "POST", body: { responder: b.dataset.respbt, mensagem: v } }); await recarregarDet(); } catch (e) { falha(e); } }));
  // concluir o chat: anexar ao chamado OU virar solicitação
  const cc = $("#concluirChat"); if (cc) cc.onclick = () => {
    const md = A.modal({ titulo: "Concluir o chat do app", icone: "check", largura: 560,
      html: `<p class="dica" style="margin-bottom:10px">Só a central encerra. O cliente vê o chat encerrado e passa a acompanhar tudo pelo chamado nº <b>${esc(D.cliente.codigo || cid)}</b>.</p>
        <label class="chk"><input type="radio" name="modo" value="anexar" checked> <b>Anexar a conversa ao chamado</b> — fica no histórico, sem abrir solicitação</label>
        <label class="chk" style="margin-top:6px"><input type="radio" name="modo" value="solicitacao"> <b>Transformar em solicitação</b> — vira mais um problema do chamado, com motivo e SLA</label>
        <div id="ccSol" class="oculto" style="margin-top:10px">${camposMotivo("cc", D)}</div>`,
      botoes: [{ rotulo: "Voltar" }, { rotulo: "Concluir chat", classe: "btn", principal: true, acao: async () => {
        const modo = document.querySelector('input[name="modo"]:checked').value, body = { modo };
        if (modo === "solicitacao") { body.motivo_pai = $("#ccPai").value; body.motivo_filho = $("#ccFilho").value; body.pedido_id = $("#ccPed")?.value || ""; if (!body.motivo_pai || !body.motivo_filho) { A.toast("Escolha motivo e submotivo."); return false; } }
        try { await chamar(tidUrl(chat.id) + "/concluir-chat", { method: "POST", body }); ok(modo === "anexar" ? "Chat concluído e anexado ao chamado." : "Chat virou solicitação do chamado."); S.solSel = modo === "solicitacao" ? chat.id : null; S.alvo = null; await recarregarDet(); }
        catch (e) { falha(e); return false; } } }] });
    document.querySelectorAll('input[name="modo"]').forEach((r) => (r.onchange = () => $("#ccSol").classList.toggle("oculto", document.querySelector('input[name="modo"]:checked').value !== "solicitacao")));
    ligarMotivo("cc");
  };
  // nova solicitação no MESMO chamado
  const ns = $("#novaSol"); if (ns) ns.onclick = () => {
    A.modal({ titulo: `Nova solicitação · chamado nº ${D.cliente.codigo || cid}`, icone: "mais", largura: 600,
      html: `<p class="dica" style="margin-bottom:10px">Entra no chamado do cliente (não abre outro). Mesmo motivo + mesmo pedido já aberto não é permitido.</p>
        <label class="campo">Setor<select id="nsDep">${S.e.departamentos.map((d) => `<option>${esc(d)}</option>`).join("")}</select></label>
        <div style="margin-top:8px">${camposMotivo("ns", D)}</div>
        <label class="campo" style="margin-top:8px">Descrição<textarea id="nsDesc" rows="4"></textarea></label>`,
      botoes: [{ rotulo: "Cancelar" }, { rotulo: "Adicionar ao chamado", classe: "btn", principal: true, acao: async () => {
        const pai = $("#nsPai").value, filho = $("#nsFilho").value, desc = $("#nsDesc").value.trim(), pedSel = $("#nsPed");
        if (!pai || !filho || !desc) { A.toast("Escolha motivo, submotivo e descreva."); return false; }
        const body = { cliente_codigo: D.cliente.codigo, cliente_nome: D.cliente.nome, cliente_telefone: D.cliente.telefone, departamento: $("#nsDep").value,
          motivo_pai: pai, motivo_filho: filho, assunto: filho, descricao: desc, erp_cliente_id: D.erp?.clientes?.[0]?.id || "" };
        if (pedSel && pedSel.value) { body.erp_pedido_id = pedSel.value; body.erp_pedido_numero = +pedSel.selectedOptions[0].dataset.num || pedSel.selectedOptions[0].dataset.num; body.assunto += " · pedido #" + body.erp_pedido_numero; }
        try { const r = await chamar("/tickets", { method: "POST", body }); ok("Solicitação adicionada ao chamado nº " + (r.chamado || D.cliente.codigo) + "."); S.solSel = r.id; S.alvo = r.id; await recarregarDet(); }
        catch (e) { falha(e); return false; } } }] });
    ligarMotivo("ns");
  };
  // ERP (ações registradas na solicitação selecionada — ou na primeira aberta)
  const tidErp = (!sel.chat && ABERTOS.includes(sel.status) ? sel : abertas[0] || sel).id;
  const tc = $("#trocaCli"); if (tc) tc.onclick = (e) => { e.preventDefault(); vincularCliente({ id: tidErp }); };
  const abrirErp = () => { try { (window.top || window).postMessage({ hub: "abrir", id: "erp" }, location.origin); } catch (_) {} };
  m.querySelectorAll("[data-erp-ver]").forEach((b) => (b.onclick = abrirErp));
  m.querySelectorAll("[data-nova-palavra]").forEach((a) => (a.onclick = async (ev) => { ev.preventDefault();
    if (!(await A.confirmar("Gerar uma <b>nova palavra-chave</b> para este pedido? A antiga deixa de valer no app do cliente.", { rotulo: "Gerar nova" }))) return;
    try { const r = await chamar(`/app/palavra/${a.dataset.novaPalavra}/nova`, { method: "POST" }); ok("Nova palavra-chave: " + r.palavra_chave); await recarregarDet(); } catch (e) { falha(e); } }));
  const erp = D.erp;

/* ══════ ABRIR CHAMADO ══════ */
const DESC_SETOR = { TI: "Sistema, rede, acesso, equipamento.", CX: "Cliente, pedido, troca, assistência técnica.", "Logística": "Entrega, carga, agendamento, endereço.",
  "Jurídico": "Contrato, notificação, processo.", "Manutenção": "Prédio, mobiliário, instalação, reparo.", Financeiro: "Pagamento, nota, reembolso, cobrança.", Compras: "Estoque, fornecedor, peças." };
function telaAbrir(m) {
  const cores = ["#60a5fa", "#e8b33d", "#34d399", "#8b5cf6", "#fb923c", "#22d3ee", "#fb7185"];
  if (!S.setorAbrir) {
    m.innerHTML = `<section class="painel vidro"><h2 style="margin:0 0 4px;font:700 1.3rem var(--titulo)">Abrir chamado</h2><p class="dica" style="margin-bottom:14px">Para qual setor? Escolheu errado? Sem problema — quem recebe encaminha para o setor certo.</p>
      <div class="setores">${S.e.departamentos.map((d, i) => `<button type="button" class="setor" data-setor="${esc(d)}" style="--c:${cores[i % cores.length]}"><span class="sig">${esc(d.slice(0, 2).toUpperCase())}</span><span><b>${esc(d)}</b><small>${esc(DESC_SETOR[d] || "")}</small></span></button>`).join("")}</div></section>`;
    m.querySelectorAll("[data-setor]").forEach((b) => (b.onclick = () => { S.setorAbrir = b.dataset.setor; render(); }));
    return;
  }
  const arv = S.e.motivos;
  m.innerHTML = `<section class="painel vidro" style="max-width:820px;margin:0 auto">
    <button type="button" class="btn v p" id="trocaSetor">${svg("voltar")} Setores</button>
    <h2 style="margin:10px 0 12px;font:700 1.3rem var(--titulo)">Novo chamado · ${esc(S.setorAbrir)}</h2>
    <div class="g2"><label class="campo">Código do cliente *<input id="nCod" placeholder="digite o código ou o nome" autocomplete="off"></label><label class="campo">Nome do cliente *<input id="nNome" autocomplete="off"></label></div>
    <div id="nBusca" style="margin-top:6px"></div>
    <div class="g2" style="margin-top:8px"><label class="campo">Telefone<input id="nTel"></label><label class="campo">Prioridade<select id="nPrio">${Object.entries(PRIO).map(([k, [r]]) => `<option value="${k}"${k === "normal" ? " selected" : ""}>${r}</option>`).join("")}</select></label></div>
    <div class="g2" style="margin-top:8px"><label class="campo">Motivo<select id="nPai"><option value="">—</option>${Object.keys(arv).map((p) => `<option>${esc(p)}</option>`).join("")}</select></label><label class="campo">Submotivo<select id="nFilho"><option value="">—</option></select></label></div>
    <label class="campo" style="margin-top:8px">Assunto *<input id="nAss"></label>
    <label class="campo" style="margin-top:8px">Descrição *<textarea id="nDesc" rows="5"></textarea></label>
    <div id="nHist" style="margin-top:8px"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap"><button type="button" class="btn" id="nCriar">${svg("check")} Abrir chamado</button>
      ${pode("atender") ? `<label class="chk"><input type="checkbox" id="nMeu"> já deixar comigo</label>` : ""}</div>
  </section>`;
  $("#trocaSetor").onclick = () => { S.setorAbrir = ""; render(); };
  $("#nPai").onchange = () => { $("#nFilho").innerHTML = `<option value="">—</option>` + Object.entries(arv[$("#nPai").value] || {}).filter(([, i]) => i.ativo !== false).map(([f, i]) => `<option value="${esc(f)}">${esc(f)}${i.sla != null ? ` · SLA ${i.sla}d` : ""}</option>`).join(""); };
  /* digitar o nome ou o código → busca o cliente no ERP; escolhendo, preenche código, nome e telefone e liga o ticket ao cliente */
  let tmB = null, nCli = "";
  const buscarErp = (q) => { clearTimeout(tmB); if (String(q || "").trim().length < 2) { $("#nBusca").innerHTML = ""; return; }
    tmB = setTimeout(async () => { try { const r = await chamar("/erp/clientes?q=" + encodeURIComponent(q.trim()), {});
      $("#nBusca").innerHTML = r.clientes.length ? `<div class="vidro" style="border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px"><small class="dica" style="padding:2px 6px">Clientes no ERP — clique para usar</small>${r.clientes.slice(0, 8).map((c) =>
        `<button type="button" class="btn v" data-ncli="${esc(c.id)}" style="justify-content:flex-start;gap:10px"><b>${esc(c.codigo || "sem código")}</b> ${esc(c.nome)} <small class="dica">${esc(c.telefone || "")} ${esc(c.cidade || "")}</small></button>`).join("")}</div>`
        : `<p class="dica">Nenhum cliente do ERP com “${esc(q.trim())}”. Pode abrir assim mesmo.</p>`;
      $("#nBusca").querySelectorAll("[data-ncli]").forEach((b) => (b.onclick = async () => { const c = r.clientes.find((x) => x.id === b.dataset.ncli);
        let cod = c.codigo; if (!cod) { try { cod = (await chamar(`/erp/clientes/${c.id}/codigo`, { method: "POST", body: {} })).codigo; } catch (e) { falha(e); return; } }
        $("#nCod").value = cod; $("#nNome").value = c.nome || ""; if (c.telefone && !$("#nTel").value) $("#nTel").value = c.telefone; nCli = c.id;
        $("#nBusca").innerHTML = `<p class="dica">✓ Ligado ao cliente <b>${esc(c.nome)}</b> do ERP (código ${esc(cod)}).</p>`; $("#nCod").onchange(); }));
    } catch (_) { } }, 300); };
  $("#nCod").oninput = () => { nCli = ""; buscarErp($("#nCod").value); };
  $("#nNome").oninput = () => { nCli = ""; buscarErp($("#nNome").value); };
  $("#nCod").onchange = () => { const cod = norm($("#nCod").value); const h = S.e.tickets.filter((t) => norm(t.cliente_codigo) === cod);
    if (h.length && !$("#nNome").value) $("#nNome").value = h[0].cliente_nome || "";
    const hab = h.filter((t) => ABERTOS.includes(t.status) && !t.chat);
    $("#nHist").innerHTML = hab.length ? `<div class="aviso ouro">Este cliente já tem o <b>chamado nº ${esc(hab[0].cliente_codigo)}</b> com ${hab.length} solicitação(ões) aberta(s): ${hab.slice(0, 4).map((t) => esc(t.motivo_filho || t.assunto || "")).join(" · ")}. O que você abrir agora entra nele como mais uma solicitação.</div>`
      : h.length ? `<p class="dica">Histórico do cliente: ${h.length} solicitação(ões) já concluída(s) — a nova reabre o chamado nº ${esc(h[0].cliente_codigo)}.</p>` : ""; };
  $("#nCriar").onclick = async () => {
    const body = { departamento: S.setorAbrir, cliente_codigo: $("#nCod").value.trim(), cliente_nome: $("#nNome").value.trim(), cliente_telefone: $("#nTel").value.trim(),
      prioridade: $("#nPrio").value, motivo_pai: $("#nPai").value, motivo_filho: $("#nFilho").value, assunto: $("#nAss").value.trim(), descricao: $("#nDesc").value.trim(), atribuir_a_mim: !!$("#nMeu")?.checked };
    if (nCli) body.erp_cliente_id = nCli;
    if (!body.cliente_codigo || !body.cliente_nome || !body.assunto || !body.descricao) { A.toast("Preencha código e nome do cliente, assunto e descrição."); return; }
    try { const r = await chamar("/tickets", { method: "POST", body }); ok(r.agrupado ? `Agrupado ao chamado nº ${r.chamado} do cliente — virou mais uma solicitação.` : `Chamado nº ${r.chamado} aberto.`); S.setorAbrir = ""; await carregar(); S.sec = "caixa"; abrirTicket(r.id); } catch (e) { falha(e); }
  };
}

/* ══════ TICKETS INTERNOS (entre setores) ══════ */
function telaInternos(m) {
  const me = S.e.eu, ab = S.e.tickets.filter((t) => ABERTOS.includes(t.status) && (t.pendencias || []).length);
  const meuSetor = me.depto ? ab.filter((t) => (t.pendencias || []).some((p) => norm(p) === norm(me.depto))) : [];
  const porSetor = {}; ab.forEach((t) => t.pendencias.forEach((p) => (porSetor[p] = porSetor[p] || []).push(t)));
  const linha = (t) => `<tr class="linha" data-t="${esc(t.id)}"><td><b>${curto(t.id)}</b></td><td class="ass"><b>${esc(t.assunto || "")}</b><small>${esc(t.departamento || "—")} pediu a: ${t.pendencias.map(esc).join(", ")}</small></td><td>${esc(t.cliente_nome || "")}</td><td>${t.sem_dono ? "— sem dono —" : esc(nomeU(t.atribuido_para).split(" ")[0])}</td><td>${slaTxt(t.sla)}</td></tr>`;
  const tab = (l) => l.length ? `<table class="tab"><thead><tr><th>#</th><th>Assunto</th><th>Cliente</th><th>Dono</th><th>SLA</th></tr></thead><tbody>${l.map(linha).join("")}</tbody></table>` : `<p class="dica">Nada aqui.</p>`;
  m.innerHTML = `<section class="painel vidro"><h2 style="margin:0 0 4px;font:700 1.25rem var(--titulo)">Tickets internos</h2><p class="dica">Pedidos de um setor para outro — ficam no MESMO atendimento, com a pendência visível até o setor responder.</p>
    ${me.depto ? `<div class="sec">Pediram ao meu setor (${esc(me.depto)}) · ${meuSetor.length}</div>${tab(meuSetor)}` : `<div class="aviso ouro" style="margin-top:10px">Seu usuário está sem setor — defina em Ajustes para ver o que pediram ao seu setor.</div>`}
    ${Object.entries(porSetor).sort((a, b) => b[1].length - a[1].length).map(([s, l]) => `<div class="sec">${esc(s)} · ${l.length}</div>${tab(l)}`).join("")}</section>`;
  m.querySelectorAll("tr.linha").forEach((tr) => (tr.onclick = () => { S.sec = "caixa"; abrirTicket(tr.dataset.t); }));
}

/* ══════ GESTÃO ══════ */
function telaGestao(m) {
  const ts = S.e.tickets, cs = clientes(), cab = cs.filter(vivo), c = contagens();
  const solsAb = ts.filter((t) => !t.chat && ABERTOS.includes(t.status));
  const d7 = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const abertas7 = ts.filter((t) => !t.chat && String(t.criado_em) >= d7).length, concl7 = ts.filter((t) => !t.chat && !ABERTOS.includes(t.status) && String(t.atualizado_em) >= d7).length;
  const chats7 = ts.filter((t) => t.chat && String(t.criado_em) >= d7).length;
  const por = (f, l) => { const o = {}; l.forEach((t) => { const k = f(t); o[k] = (o[k] || 0) + 1; }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const k = (r, v, s2, cor) => `<div class="kpi" style="--c:${cor}"><small>${r}</small><b>${v}</b><span>${s2 || ""}</span></div>`;
  const barras = (l) => { const max = Math.max(1, ...l.map((x) => x[1])); return l.slice(0, 12).map(([n, v]) => `<div style="display:grid;grid-template-columns:160px 1fr 40px;gap:8px;align-items:center;font-size:.78rem;margin-bottom:5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span style="height:8px;border-radius:5px;background:rgba(255,255,255,.06)"><i style="display:block;height:100%;width:${v / max * 100}%;border-radius:5px;background:var(--ouro)"></i></span><b style="text-align:right">${v}</b></div>`).join(""); };
  const porAt = {}; cab.forEach((x) => { const a = x.atribuido_para || "_"; porAt[a] = porAt[a] || { n: 0, at: 0, sols: 0, venc: 0, hoje: 0 }; const v = porAt[a]; v.n++; if (x.estado === "atendimento") v.at++; v.sols += x.solsAb.length; if (x.sla?.estado === "venc") v.venc++; if (x.sla?.estado === "hoje") v.hoje++; });
  m.innerHTML = `<section class="painel vidro"><h2 style="margin:0 0 4px;font:700 1.25rem var(--titulo)">Painel de gestão</h2>
    <p class="dica" style="margin-bottom:12px">Cada cliente conta uma vez: está em <b>atendimento</b> (chat do app ativo) ou é um <b>ticket pendente</b>. As solicitações são os problemas dentro dos tickets.</p>
    <div class="kpis">${k("Atendimentos agora", c.atend, "chats do app ativos", "var(--ciano)")}${k("Tickets pendentes", c.tks, "clientes com solicitação aberta", "var(--azul)")}${k("Solicitações abertas", solsAb.length, `média ${c.tks ? (solsAb.length / Math.max(1, cab.filter((x) => x.solsAb.length).length)).toFixed(1) : 0} por cliente`, "var(--violeta)")}${k("Sem dono", c.novos, "clientes", "var(--ouro)")}${k("Vencidos", c.venc, "clientes", "var(--rosa)")}${k("Solicitações (7 dias)", abertas7, `${concl7} concluídas · ${chats7} chats`, "var(--verde)")}</div>
    <div class="cartoes" style="margin-top:14px">
      <div class="cartao"><h3>Solicitações abertas por motivo</h3>${barras(por((t) => t.motivo_pai || "— sem motivo —", solsAb))}</div>
      <div class="cartao"><h3>Solicitações abertas por setor</h3>${barras(por((t) => t.departamento || "—", solsAb))}</div>
      <div class="cartao"><h3>Clientes por pessoa</h3><table class="tab"><thead><tr><th>Atendente</th><th>Clientes</th><th>Em atendimento</th><th>Solicitações</th><th>Vencem hoje</th><th>Vencidos</th></tr></thead><tbody>
        ${Object.entries(porAt).sort((a, b) => b[1].n - a[1].n).map(([a, v]) => `<tr><td>${a === "_" ? "— sem dono —" : esc(nomeU(a))}</td><td>${v.n}</td><td>${v.at}</td><td>${v.sols}</td><td>${v.hoje}</td><td style="color:${v.venc ? "var(--rosa)" : ""}">${v.venc}</td></tr>`).join("")}</tbody></table></div>
    </div></section>`;
}

        <p class="dica">No cadastro de cliente do ERP há o campo <b>Código do cliente</b> — é ele que liga o atendimento aos pedidos (também casa por telefone ou nome).</p>
        <button type="button" class="btn p" id="salvarErp">Salvar</button></div>
      <div class="cartao" style="grid-column:1/-1"><h3>${svg("mensagem")} App do cliente</h3>
        <p class="dica">Link geral para enviar aos clientes. Eles entram com <b>CPF + e-mail do cadastro do ERP</b>, veem os pedidos e prazos, abrem chamados pela URA e conversam com a central — tudo cai aqui na Caixa (fila “App do cliente”).</p>
        <div class="link-app"><code id="linkApp">${esc(location.origin + "/cliente/")}</code><button type="button" class="btn v p" id="copiarLink">Copiar</button><a class="btn v p" href="/cliente/" target="_blank" rel="noopener">Abrir ↗</a></div>
        <label class="chk"><input type="checkbox" id="appAtivo"${ap.ativo === false ? "" : " checked"}> Atendimento pelo app ligado</label>
        <div class="aviso ouro" style="display:flex;flex-direction:column;gap:6px"><label class="chk"><input type="checkbox" id="appPalavra"${ap.exigir_palavra ? " checked" : ""}> <b>Exigir palavra-chave no login</b> (CPF + e-mail + palavra-chave do pedido)</label>
          <span>A palavra-chave nasce com o pedido no ERP e só aparece para quem tem a permissão “Ver a palavra-chave” (no atendimento, no pedido do cliente, e no botão 🔒 do topo).${ap.pedidos_sem_palavra ? ` <b>${ap.pedidos_sem_palavra}</b> pedido(s) antigos ainda estão sem palavra.` : ""}</span>
          ${ap.pedidos_sem_palavra ? `<button type="button" class="btn v p" id="gerarPalavras" style="align-self:flex-start">Gerar palavra-chave nos pedidos antigos</button>` : ""}</div>
        <div class="g2"><label class="campo">Nome no topo do app<input id="appEmp" value="${esc(ap.empresa || "")}"></label><label class="campo">Saudação da URA<input id="appSaud" value="${esc(ap.saudacao || "")}"></label></div>
        <p class="dica">Assuntos que a URA pergunta (uma vez só) antes de virar chat — cada um define motivo e setor. Na aba Chamados do app, o cliente abre pela árvore de motivos acima.</p>
        <div id="uraLista" style="display:flex;flex-direction:column;gap:5px"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn v p" id="uraAdd">+ opção</button><button type="button" class="btn p" id="salvarApp">Salvar app do cliente</button></div></div>
      <div class="cartao"><h3>${svg("usuarios")} Setor de cada pessoa</h3>
        <p class="dica">Define o que cada um vê em “Tickets internos” e quem tem permissão de “ver o próprio setor”.${e.banco === "hub" ? "" : " (No bancowendley o setor vem do cadastro de usuários do Streamlit.)"}</p>
        <div style="max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:5px">${e.usuarios.map((u) => `<div class="g2" style="align-items:center"><span style="font-size:.82rem">${esc(u.nome)} <small class="dica">@${esc(u.usuario)}</small></span>
          <select class="entrada" data-setoru="${esc(u.usuario)}" style="padding:6px 8px"${e.banco === "hub" ? "" : " disabled"}><option value="">—</option>${deps.map((d) => `<option${norm(d) === norm(u.depto) ? " selected" : ""}>${esc(d)}</option>`).join("")}</select></div>`).join("")}</div>
        ${e.banco === "hub" ? `<button type="button" class="btn p" id="salvarSetores">Salvar setores</button>` : ""}
        <button type="button" class="btn v p" id="recarregar">${svg("repetir")} Recarregar tudo do banco</button></div>
    </div></section>`;
  const lerArv = () => {
    m.querySelectorAll("[data-sla]").forEach((i) => { const [p, f] = i.dataset.sla.split("|"); arv[p][f].sla = i.value === "" ? null : +i.value; });
    m.querySelectorAll("[data-et]").forEach((i) => { const [p, f] = i.dataset.et.split("|"); arv[p][f].etapas = i.value.split(",").map((x) => x.trim()).filter(Boolean); });
    m.querySelectorAll("[data-at]").forEach((i) => { const [p, f] = i.dataset.at.split("|"); arv[p][f].ativo = i.checked; });
    m.querySelectorAll("[data-novofilho]").forEach((i) => { const v = i.value.trim(); if (v) arv[i.dataset.novofilho][v] = { sla: 2, ativo: true, etapas: ["Apurar"] }; });
  };
  const redesenhar = () => { $("#arv").innerHTML = pais(); ligarArv(); };
  const ligarArv = () => m.querySelectorAll("[data-delpai]").forEach((b) => (b.onclick = () => { lerArv(); delete arv[b.dataset.delpai]; redesenhar(); }));
  ligarArv();
  $("#addPai").onclick = () => { lerArv(); const v = $("#novoPai").value.trim(); if (v && !arv[v]) arv[v] = {}; $("#novoPai").value = ""; redesenhar(); };
  m.querySelectorAll("[data-novofilho]").forEach((i) => (i.onkeydown = (ev) => { if (ev.key === "Enter") { lerArv(); redesenhar(); } }));
  $("#salvarArv").onclick = async () => { lerArv(); try { await chamar("/config/motivos", { method: "PUT", body: { motivos: arv, departamentos: $("#deps").value.split(",").map((x) => x.trim()).filter(Boolean) } }); ok("Motivos e setores salvos."); await carregar(); } catch (er) { falha(er); } };
  $("#salvarErp").onclick = async () => { const auto = {}; m.querySelectorAll("[data-auto]").forEach((c) => (auto[c.dataset.auto] = c.checked));
    try { await chamar("/config", { method: "PUT", body: { auto_erp: auto, depto_erp: $("#dErp").value, motivo_pai_erp: $("#mErp").value, sla_erp_dias: +$("#sErp").value || 0 } }); ok("Salvo."); await carregar(); } catch (er) { falha(er); } };
  const ss = $("#salvarSetores"); if (ss) ss.onclick = async () => { const mapa = {}; m.querySelectorAll("[data-setoru]").forEach((s2) => { if (s2.value) mapa[s2.dataset.setoru] = s2.value; });
    try { await chamar("/config", { method: "PUT", body: { setor_usuarios: mapa } }); ok("Setores salvos."); await carregar(); } catch (er) { falha(er); } };
  const desenhaUra = () => { $("#uraLista").innerHTML = ura.map((o, i) => `<div class="ura-it"><input class="entrada" data-ura="${i}|rotulo" value="${esc(o.rotulo || "")}" placeholder="Opção (ex.: Troca)"><input class="entrada" data-ura="${i}|descricao" value="${esc(o.descricao || "")}" placeholder="Descrição curta">
      <select class="entrada" data-ura="${i}|motivo_pai"><option value="">motivo —</option>${Object.keys(arv).map((p2) => `<option${p2 === o.motivo_pai ? " selected" : ""}>${esc(p2)}</option>`).join("")}</select>
      <select class="entrada" data-ura="${i}|departamento"><option value="">setor —</option>${deps.map((d) => `<option${d === o.departamento ? " selected" : ""}>${esc(d)}</option>`).join("")}</select>
      <button type="button" class="btn-ic p" data-uradel="${i}" title="Tirar opção">${svg("lixo")}</button></div>`).join("");
    m.querySelectorAll("[data-ura]").forEach((x) => (x.oninput = x.onchange = () => { const [i, k2] = x.dataset.ura.split("|"); ura[+i][k2] = x.value; }));
    m.querySelectorAll("[data-uradel]").forEach((b) => (b.onclick = () => { ura.splice(+b.dataset.uradel, 1); desenhaUra(); })); };
  desenhaUra();
  $("#uraAdd").onclick = () => { ura.push({ id: "", rotulo: "", descricao: "", motivo_pai: "", departamento: "" }); desenhaUra(); };
  const gp = $("#gerarPalavras"); if (gp) gp.onclick = async () => { try { const r = await chamar("/app/palavras/gerar", { method: "POST" }, "gerando…"); ok(`${r.feitos} pedido(s) ganharam palavra-chave.`); await carregar(); } catch (er) { falha(er); } };
  $("#copiarLink").onclick = async () => { try { await navigator.clipboard.writeText($("#linkApp").textContent); ok("Link copiado."); } catch (_) { A.toast("Selecione e copie o link."); } };
  $("#salvarApp").onclick = async () => {
    const lista = ura.filter((o) => String(o.rotulo || "").trim()).map((o) => ({ ...o, id: o.id || norm(o.rotulo).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) }));
    if (!lista.length) { A.toast("Deixe ao menos uma opção no menu."); return; }
    try { await chamar("/config", { method: "PUT", body: { app_cliente: { ativo: $("#appAtivo").checked, exigir_palavra: $("#appPalavra").checked, empresa: $("#appEmp").value, saudacao: $("#appSaud").value, ura: lista } } }); ok("App do cliente salvo."); await carregar(); } catch (er) { falha(er); } };
  $("#recarregar").onclick = async () => { try { await chamar("/recarregar", { method: "POST" }, "relendo…"); await carregar(); ok("Relido."); } catch (er) { falha(er); } };
}

/* ══════ INÍCIO ══════ */
carregar();
/* com um atendimento aberto: se o cliente escreveu pelo app, a conversa atualiza sozinha (sem perder o que você está digitando) */
setInterval(() => { if (document.visibilityState !== "visible" || !S.aberto || document.querySelector(".aur-modal-fundo") || $("#txt")?.value) return;
  A.api(API + "/estado").then((e) => { if (e.versao !== S.e?.versao) { guardarRascunho(); novoEstado(e); S.det = null; if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); } }).catch(() => {}); }, 20000);
setInterval(() => { if (document.visibilityState === "visible" && !S.aberto && !document.querySelector(".aur-modal-fundo")) A.api(API + "/estado").then((e) => { if (e.versao !== S.e?.versao) { novoEstado(e); if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render(); } }).catch(() => {}); }, 30000);
})();
</script>
</body>
</html>
