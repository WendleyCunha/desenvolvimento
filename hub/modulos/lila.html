<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
═══════════════════════════════════════════════════════════════════════════════
 lila.html — TAREFAS · módulo do hub Wendley Desenvolvimento (kit Aurora Glass)
───────────────────────────────────────────────────────────────────────────────
 Controle de tarefas no padrão de mercado:
   • cadastro completo (prioridade P1–P4, status, prazo/hora, lista, responsável,
     subtarefas, repetição, anotações de andamento)
   • captura rápida em português: "Ligar fornecedor amanhã 14h !1 #trabalho @Ana"
   • lembretes com som, notificação do navegador e aviso no túnel do hub,
     com adiar (+10 min, +1 h, amanhã) e concluir direto do aviso
   • pendências do dia (atrasadas + vencendo hoje), quadro Kanban, próximos 7 dias,
     calendário, todas as tarefas com filtros, listas e concluídas
   • WIDGETS: arraste pelo título para mover, pelo canto para redimensionar,
     ⤢ para expandir, ✕ para remover; botão "Widgets" adiciona/restaura.
 Dados: neste navegador (localStorage) — use "Dados → Exportar backup".
        Próximo passo: gravar no Firestore pelo hub (mesma interface).
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto}

/* ── topo ── */
.topo{position:sticky;top:10px;z-index:40;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:10px 12px 10px 14px;border-radius:20px}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca b{display:block;font:700 1.08rem var(--titulo);letter-spacing:-.01em}
.marca small{display:block;font-size:.6rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.captura{position:relative;max-width:640px;width:100%;justify-self:center}
.captura .entrada{padding:12px 44px 12px 42px;border-radius:14px;font-size:.92rem}
.captura>svg.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ouro)}
.captura kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
kbd{font:600 .64rem var(--sans);color:var(--txt3);border:1px solid var(--vidro-borda-forte);border-bottom-width:2px;border-radius:6px;padding:2px 6px;background:rgba(255,255,255,.03)}
.previa{position:absolute;left:0;right:0;top:calc(100% + 8px);padding:12px 14px;border-radius:16px;display:none;z-index:5}
.previa.on{display:block;animation:aurEntra .25s var(--suave)}
.previa .tit{font-weight:600;margin-bottom:8px}
.previa .tit i{font-style:normal;color:var(--txt3);font-weight:400}
.previa .chips{display:flex;flex-wrap:wrap;gap:6px}
.previa .dica{margin-top:10px;font-size:.72rem;color:var(--txt3);line-height:1.6}
.previa code{color:var(--ouro2);background:rgba(255,255,255,.05);border-radius:5px;padding:0 5px}
.acoes-topo{display:flex;gap:8px;align-items:center}
.exemplo{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;color:var(--txt2);padding:6px 6px 6px 12px;border-radius:999px;border:1px dashed rgba(232,179,61,.4);background:rgba(232,179,61,.06)}
.exemplo button{color:var(--ouro2);font-weight:600;padding:2px 8px;border-radius:999px}
.exemplo button:hover{background:rgba(232,179,61,.15)}
#btSino.on{color:var(--ouro2);border-color:rgba(232,179,61,.5)}
main{margin-top:16px}

/* ── cartão de tarefa ── */
.tf{--pc:var(--ouro);position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:start;padding:10px 12px 10px 11px;margin-bottom:7px;
  border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);cursor:pointer;transition:background .2s,border-color .2s,transform .25s var(--mola),box-shadow .25s}
.tf::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--pc);box-shadow:0 0 10px var(--pc);opacity:.85}
.tf:hover{background:rgba(255,255,255,.06);border-color:color-mix(in srgb,var(--pc) 35%,transparent);transform:translateX(2px);box-shadow:0 10px 26px -16px var(--pc)}
.tf.atras{border-color:rgba(251,113,133,.3);background:linear-gradient(90deg,rgba(251,113,133,.07),rgba(255,255,255,.03))}
.tf-check{width:22px;height:22px;margin-top:1px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--pc);color:transparent;transition:.25s var(--mola)}
.tf-check svg.i{width:13px;height:13px;stroke-width:3}
.tf-check:hover{color:var(--pc);box-shadow:0 0 14px -2px var(--pc);transform:scale(1.1)}
.tf.concl .tf-check{background:var(--verde);border-color:var(--verde);color:#06120c}
.tf-tit{font-weight:560;font-size:.88rem;line-height:1.4;word-break:break-word}
.tf.concl .tf-tit{text-decoration:line-through;color:var(--txt3)}
.tf-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tf-prio{font:700 .62rem var(--titulo);padding:3px 7px;border-radius:7px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);border:1px solid color-mix(in srgb,var(--pc) 30%,transparent)}
.tf.saindo{animation:tfSai .5s var(--suave) forwards;pointer-events:none}
.tf.saindo .tf-check{background:var(--verde);border-color:var(--verde);color:#06120c;transform:scale(1.2);box-shadow:0 0 22px var(--verde)}
@keyframes tfSai{60%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(24px);height:0;margin:0;padding-top:0;padding-bottom:0}}
.sec{display:flex;align-items:center;gap:8px;margin:12px 2px 8px;font-size:.66rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.sec:first-child{margin-top:4px}
.sec b{color:var(--c,var(--txt2));font-weight:700}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--vidro-borda),transparent)}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--txt3);font-size:.82rem;padding:22px 10px;min-height:100%}
.vazio b{color:var(--txt);font:600 .95rem var(--titulo)}

/* ── visão do dia ── */
.resumo{display:flex;gap:18px;align-items:center;height:100%;flex-wrap:wrap}
.anel-prog{position:relative;width:118px;height:118px;flex:none}
.anel-prog svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel-prog .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.anel-prog .val b{display:block;font:700 1.6rem/1 var(--titulo)}
.anel-prog .val small{font-size:.62rem;color:var(--txt3);letter-spacing:1px;text-transform:uppercase}
.anel-prog circle{transition:stroke-dashoffset 1s var(--suave)}
.kpis{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{position:relative;text-align:left;padding:13px 14px;border-radius:15px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);transition:.25s}
.kpi:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 26px -10px var(--c);transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%)}
.kpi .r{display:flex;align-items:center;gap:7px;font-size:.66rem;font-weight:650;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3)}
.kpi .r svg.i{width:14px;height:14px;color:var(--c)}
.kpi b{display:block;font:700 1.75rem/1 var(--titulo);margin-top:9px;color:var(--txt)}
.kpi.alerta b{color:var(--c)}

/* ── quadro ── */
.quadro{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:10px;height:100%;overflow-x:auto}
.col{display:flex;flex-direction:column;min-height:0;border-radius:15px;background:rgba(5,6,10,.28);border:1px solid var(--vidro-borda);transition:.2s}
.col.sobre{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c),0 0 26px -10px var(--c);background:color-mix(in srgb,var(--c) 7%,rgba(5,6,10,.3))}
.col-cab{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;font-size:.78rem;font-weight:650}
.col-cab i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.col-cab span{margin-left:auto;color:var(--txt3);font-weight:600}
.col-lista{flex:1;overflow-y:auto;padding:2px 8px 8px;min-height:60px}
.col .tf{cursor:grab}
.col .tf.arrastado{opacity:.4}

/* ── lembretes / semana ── */
.lem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 10px;border-radius:13px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda)}
.lem .hr{text-align:center;min-width:52px}
.lem .hr b{display:block;font:700 1.05rem/1 var(--titulo);color:var(--c,var(--violeta))}
.lem .hr small{font-size:.64rem;color:var(--txt3)}
.lem .t{font-size:.84rem;font-weight:550;cursor:pointer;line-height:1.35}
.lem .t:hover{color:var(--ouro2)}
.lem .bts{display:flex;gap:4px}
.lem.vencido{border-color:rgba(251,113,133,.35);--c:var(--rosa)}
.dia-cab{display:flex;align-items:baseline;gap:8px;margin:12px 2px 7px;font:600 .82rem var(--titulo)}
.dia-cab:first-child{margin-top:2px}
.dia-cab small{font:500 .7rem var(--sans);color:var(--txt3)}
.dia-livre{font-size:.75rem;color:var(--txt3);padding:2px 4px 6px;opacity:.7}

/* ── calendário ── */
.cal-nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-nav b{flex:1;text-align:center;font:600 .9rem var(--titulo);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .sem{text-align:center;font-size:.62rem;font-weight:700;color:var(--txt3);letter-spacing:1px;padding:2px 0 4px}
.cal .d{position:relative;aspect-ratio:1;max-height:44px;border-radius:10px;display:grid;place-items:center;font-size:.8rem;font-weight:550;color:var(--txt2);transition:.2s;border:1px solid transparent}
.cal .d:hover{background:rgba(255,255,255,.06);color:var(--txt)}
.cal .d.fora{opacity:.25}
.cal .d.hoje{color:var(--ouro2);border-color:rgba(232,179,61,.6);box-shadow:0 0 16px -6px var(--ouro)}
.cal .d.sel{background:var(--grad-ouro);color:#1a1206;font-weight:700}
.cal .d .pt{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .d .pt i{width:4px;height:4px;border-radius:50%;background:var(--ciano);box-shadow:0 0 6px var(--ciano)}
.cal .d .pt i.r{background:var(--rosa);box-shadow:0 0 6px var(--rosa)}
.cal-dia{margin-top:12px}

/* ── todas / listas ── */
.barra-filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;position:sticky;top:-4px;z-index:2;padding:4px 0 8px;background:linear-gradient(180deg,rgba(14,16,22,.92),rgba(14,16,22,.7));backdrop-filter:blur(10px)}
.barra-filtros .entrada{width:auto;flex:1;min-width:150px;padding:8px 12px;font-size:.82rem}
.barra-filtros select.entrada{flex:0 1 auto;min-width:120px}
.lst{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer;transition:.2s}
.lst:hover{background:rgba(255,255,255,.05)}
.lst .nm{font-weight:600;font-size:.84rem}
.lst .n{font-size:.75rem;color:var(--txt3)}
.lst .barra{grid-column:1/-1;height:5px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.lst .barra i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,transparent));box-shadow:0 0 10px var(--c)}

/* ── editor ── */
.ed-tit{font:600 1.15rem var(--titulo)!important;padding:13px 14px!important}
.ed-notas{margin-top:10px;min-height:64px;resize:vertical}
.ed-linha{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.ed-linha .rot,.ed-bloco .rot{display:block;font-size:.72rem;font-weight:650;color:var(--txt3);margin-bottom:7px;letter-spacing:.3px}
.ed-grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.ed-rap{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ed-bloco{margin-top:18px}
.sub{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px}
.sub:hover{background:rgba(255,255,255,.04)}
.sub input[type=checkbox]{width:17px;height:17px;accent-color:var(--verde)}
.sub span{flex:1;font-size:.86rem}
.sub.feito span{text-decoration:line-through;color:var(--txt3)}
.hist{margin:0;padding:0;list-style:none;max-height:150px;overflow:auto}
.hist li{font-size:.8rem;color:var(--txt2);padding:6px 0;border-bottom:1px solid var(--vidro-borda)}
.hist li b{color:var(--txt3);font-weight:600;margin-right:6px}
.tremer{animation:tremer .35s}
@keyframes tremer{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.wg-lista{display:flex;flex-direction:column;gap:8px}
.wg-op{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda)}
.wg-op .t{flex:1;min-width:0}
.wg-op .t b{display:block;font-size:.88rem}
.wg-op .t small{color:var(--txt3);font-size:.75rem}

@media (max-width:980px){
  .topo{grid-template-columns:1fr auto;gap:10px}
  .captura{grid-column:1/-1;grid-row:2;max-width:none}
  .exemplo span{display:none}
}
@media (max-width:640px){
  body{padding:8px}
  .acoes-topo .btn span{display:none}
  .ed-grade{grid-template-columns:1fr 1fr}
  .quadro{grid-template-columns:repeat(4,minmax(220px,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca" id="marca"><span id="logo"></span><span><b>Tarefas</b><small>Wendley Desenvolvimento</small></span></div>

    <div class="captura">
      <svg viewBox="0 0 24 24" class="i"><path d="M12 5v14M5 12h14"/></svg>
      <input class="entrada" id="rapido" autocomplete="off" spellcheck="false" placeholder='Nova tarefa… ex.: "Ligar fornecedor amanhã 14h !1 #trabalho"'>
      <kbd>Enter</kbd>
      <div class="previa vidro" id="previa"></div>
    </div>

    <div class="acoes-topo">
      <span class="exemplo" id="exemplo" hidden><span>Dados de exemplo</span><button type="button" id="btLimparEx">limpar</button></span>
      <button type="button" class="btn-ic" id="btSino" title="Notificações"></button>
      <button type="button" class="btn v" id="btWidgets" title="Adicionar ou remover widgets"></button>

      <button type="button" class="btn" id="btNova"></button>
    </div>
  </header>

  <main><div id="area"></div></main>
</div>
<input type="file" id="arqImport" accept=".json,application/json" hidden>

<script src="/static/aurora.js?v=1"></script>
<script>
(() => {
"use strict";
const A = Aurora, { svg, esc } = A;
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;
A.fundo();
document.getElementById("logo").outerHTML = A.atomo(42);

/* ══════════════ CONSTANTES ══════════════ */
const PRIO = { P1: { nome: "Urgente", cor: "#fb7185" }, P2: { nome: "Alta", cor: "#60a5fa" }, P3: { nome: "Média", cor: "#e8b33d" }, P4: { nome: "Baixa", cor: "#a78bfa" } };
const STATUS = {
  afazer: { nome: "A fazer", cor: "#94a3b8", ic: "lista" }, andamento: { nome: "Em andamento", cor: "#60a5fa", ic: "raio" },
  aguardando: { nome: "Aguardando", cor: "#e8b33d", ic: "relogio" }, concluida: { nome: "Concluída", cor: "#34d399", ic: "check" },
};
const RECOR = { nenhuma: "Não repete", diaria: "Todo dia", uteis: "Dias úteis", semanal: "Toda semana", mensal: "Todo mês" };
const K = { dados: "wd.tarefas.v1", layout: "wd.tarefas.layout.v1", avisos: "wd.tarefas.avisos.v1" };
const CORES_LISTA = ["#e8b33d", "#22d3ee", "#a78bfa", "#34d399", "#fb7185", "#60a5fa", "#fb923c"];

/* ══════════════ DATAS (horário local) ══════════════ */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoje = () => iso(new Date());
const somaDias = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const agoraHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const localDe = (d) => iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
const agoraLocal = () => localDe(new Date());
const diaSem = (s) => new Date(s + "T12:00:00").getDay();
const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const SEM_LONGO = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const semAcento = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function rotuloData(s) {
  if (!s) return "";
  const h = hoje();
  if (s === h) return "Hoje"; if (s === somaDias(h, 1)) return "Amanhã"; if (s === somaDias(h, -1)) return "Ontem";
  const d = new Date(s + "T12:00:00");
  return `${SEM[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
}
const rotuloLembrete = (l) => (l ? `${rotuloData(l.slice(0, 10))} ${l.slice(11, 16)}` : "");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ══════════════ DADOS ══════════════
   Hoje: localStorage (este navegador). Para ir para o Firestore, basta trocar
   carregar() e persistir() por chamadas ao hub — o resto não muda.        */
let DB = { tarefas: [], listas: ["Geral", "Trabalho", "Pessoal"] };
const nova = (d = {}) => ({ id: uid(), titulo: "", notas: "", prioridade: "P3", status: "afazer", prazo: "", hora: "", lembrete: "", lista: "Geral",
  quem: "", subtarefas: [], recorrencia: "nenhuma", andamento: [], criado_em: agoraLocal(), concluido_em: "", ...d });
function carregar() {
  try { const j = JSON.parse(localStorage.getItem(K.dados) || "null"); if (j && Array.isArray(j.tarefas)) { DB = j; DB.listas = DB.listas || ["Geral"]; return; } } catch (_) {}
  semear();
}
function persistir() {
  try { localStorage.setItem(K.dados, JSON.stringify(DB)); }
  catch (e) { A.toast("Não consegui salvar neste navegador: " + esc(e.message), [], { cor: "var(--rosa)" }); }
}
function mudou() { persistir(); renderTudo(); }
const porId = (id) => DB.tarefas.find((t) => t.id === id);
const abertas = () => DB.tarefas.filter((t) => t.status !== "concluida");
const atrasada = (t) => t.status !== "concluida" && !!t.prazo && (t.prazo < hoje() || (t.prazo === hoje() && !!t.hora && t.hora < agoraHM()));
const ehHoje = (t) => t.status !== "concluida" && (t.prazo === hoje() || (!!t.lembrete && t.lembrete.slice(0, 10) === hoje()));
const pendHoje = () => abertas().filter((t) => atrasada(t) || ehHoje(t));
const concluidasHoje = () => DB.tarefas.filter((t) => t.status === "concluida" && String(t.concluido_em).slice(0, 10) === hoje());
const ordem = (a, b) => a.prioridade.localeCompare(b.prioridade) ||
  ((a.prazo || "9999") + (a.hora || "99")).localeCompare((b.prazo || "9999") + (b.hora || "99")) || String(a.criado_em).localeCompare(b.criado_em);

function proximaData(base, rec) {
  if (rec === "diaria") return somaDias(base, 1);
  if (rec === "semanal") return somaDias(base, 7);
  if (rec === "uteis") { let d = somaDias(base, 1); while ([0, 6].includes(diaSem(d))) d = somaDias(d, 1); return d; }
  if (rec === "mensal") {
    const d = new Date(base + "T12:00:00"), dia = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + 1);
    d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return iso(d);
  }
  return "";
}
function proximaOcorrencia(t) {
  const base = t.prazo || hoje();
  let prox = proximaData(base, t.recorrencia);
  while (prox < hoje()) prox = proximaData(prox, t.recorrencia);
  const delta = Math.round((new Date(prox + "T12:00:00") - new Date(base + "T12:00:00")) / 864e5);
  let lemb = "";
  if (t.lembrete) lemb = somaDias(t.lembrete.slice(0, 10), delta) + t.lembrete.slice(10);
  return nova({ titulo: t.titulo, notas: t.notas, prioridade: t.prioridade, prazo: prox, hora: t.hora, lembrete: lemb, lista: t.lista, quem: t.quem,
    recorrencia: t.recorrencia, subtarefas: (t.subtarefas || []).map((s) => ({ ...s, id: uid(), feito: false })), exemplo: t.exemplo });
}
function concluir(id, el) {
  const t = porId(id); if (!t) return;
  if (t.status === "concluida") { t.status = "afazer"; t.concluido_em = ""; mudou(); A.toast(`↺ <b>${esc(t.titulo)}</b> reaberta.`); return; }
  const antes = JSON.stringify(DB);
  t.status = "concluida"; t.concluido_em = agoraLocal();
  let msg = `✓ <b>${esc(t.titulo)}</b> concluída.`;
  if (t.recorrencia !== "nenhuma") { const p = proximaOcorrencia(t); DB.tarefas.push(p); msg += ` Próxima: ${rotuloData(p.prazo)}.`; }
  const fim = () => { mudou(); A.toast(msg, [["Desfazer", () => { DB = JSON.parse(antes); mudou(); }]], { cor: "var(--verde)", duracao: 6000 }); };
  if (el) { el.classList.add("saindo"); setTimeout(fim, 480); } else fim();
}
function moverStatus(id, st) {

function verificar(inicial = false) {
  const agora = agoraLocal(), limite = localDe(new Date(Date.now() - 6 * 3600e3));
  let perdidos = 0, houve = false;
  for (const t of abertas()) {
    if (!t.lembrete || t.lembrete > agora) continue;
    const k = t.id + "|" + t.lembrete;
    if (AVISOS[k]) continue;
    AVISOS[k] = Date.now(); houve = true;
    if (inicial && t.lembrete < limite) perdidos++; else disparar(t);
  }
  if (houve) { salvarAvisos(); renderTudo(); }
  if (perdidos) A.toast(`Você tem <b>${perdidos}</b> lembrete(s) de mais de 6 horas atrás — veja no widget Lembretes.`, [], { cor: "var(--violeta)", duracao: 9000 });
}

/* ══════════════ CAPTURA RÁPIDA (português) ══════════════ */
function interpretar(txt) {
  let s = " " + txt + " ";
  const r = { prioridade: "", lista: "", quem: "", prazo: "", hora: "", lembrete: "", recorrencia: "nenhuma" };
  const tira = (re, fn) => { s = s.replace(re, (...m) => { fn(m); return " "; }); };
  const h = hoje();
  tira(/\s!p?([1-4])(?=\s)/i, (m) => (r.prioridade = "P" + m[1]));
  tira(/\s#([\wÀ-ÿ-]+)/, (m) => {
    const ex = listas().find((l) => semAcento(l) === semAcento(m[1]));
    r.lista = ex || m[1].charAt(0).toUpperCase() + m[1].slice(1);
  });
  tira(/\s@([\wÀ-ÿ.-]+)/, (m) => (r.quem = m[1]));
  tira(/\s(dias [úu]teis|todo dia [úu]til)(?=\s)/i, () => (r.recorrencia = "uteis"));
  tira(/\s(todo dia|todos os dias|diariamente)(?=\s)/i, () => (r.recorrencia = "diaria"));
  tira(/\s(toda semana|semanalmente)(?=\s)/i, () => (r.recorrencia = "semanal"));
  tira(/\s(todo m[êe]s|mensalmente)(?=\s)/i, () => (r.recorrencia = "mensal"));
  tira(/\s(?:[àa]s\s)?(\d{1,2})(?:h(\d{2})?|:(\d{2}))(?=\s)/i, (m) => {
    const hh = +m[1], mm = +(m[2] || m[3] || 0); if (hh < 24 && mm < 60) r.hora = pad(hh) + ":" + pad(mm);
  });
  tira(/\s(depois de amanh[ãa])(?=\s)/i, () => (r.prazo = somaDias(h, 2)));
  tira(/\s(amanh[ãa])(?=\s)/i, () => (r.prazo = somaDias(h, 1)));
  tira(/\s(hoje)(?=\s)/i, () => (r.prazo = h));
  tira(/\s(?:na |no |pr[óo]xim[ao] )?(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(?:-feira)?(?=\s)/i, (m) => {
    const idx = SEM_LONGO.findIndex((d) => semAcento(d) === semAcento(m[1]));
    let d = somaDias(h, 1); while (diaSem(d) !== idx) d = somaDias(d, 1); r.prazo = d;
  });
  tira(/\s(?:em |dia )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, (m) => {
    const a = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
    let d = `${a}-${pad(m[2])}-${pad(m[1])}`; if (!m[3] && d < h) d = `${a + 1}-${pad(m[2])}-${pad(m[1])}`; r.prazo = d;
  });
  tira(/\s(?:em|daqui a) (\d{1,3}) dias?(?=\s)/i, (m) => (r.prazo = somaDias(h, +m[1])));
  if (r.hora && !r.prazo) r.prazo = r.hora > agoraHM() ? h : somaDias(h, 1);
  if (r.hora) r.lembrete = r.prazo + "T" + r.hora;
  r.titulo = s.replace(/\s+/g, " ").trim();
  return r;
}
const elRapido = document.getElementById("rapido"), elPrevia = document.getElementById("previa");
function desenharPrevia() {

  if (r.lembrete) ch.push(`<span class="etq" style="--c:#a78bfa">${svg("sino")}lembrete ${r.hora}</span>`);
  if (r.prioridade) ch.push(`<span class="etq" style="--c:${PRIO[r.prioridade].cor}">${r.prioridade} · ${PRIO[r.prioridade].nome}</span>`);
  if (r.lista) ch.push(`<span class="etq" style="--c:${corLista(r.lista)}">#${esc(r.lista)}</span>`);

  elPrevia.classList.add("on");

function criarRapido(abrirCompleto) {
  const v = elRapido.value.trim();
  if (!v) { if (abrirCompleto) editor(); return; }
  const r = interpretar(v);
  if (!r.titulo) { elRapido.classList.add("tremer"); setTimeout(() => elRapido.classList.remove("tremer"), 400); return; }
  const dados = { titulo: r.titulo, prioridade: r.prioridade || "P3", prazo: r.prazo, hora: r.hora, lembrete: r.lembrete, lista: r.lista || "Geral", quem: r.quem, recorrencia: r.recorrencia };
  elRapido.value = ""; desenharPrevia();
  if (abrirCompleto) return editor(null, dados);
  if (dados.lista && !DB.listas.includes(dados.lista)) DB.listas.push(dados.lista);
  const t = nova(dados); DB.tarefas.push(t); mudou();
  A.toast(`＋ <b>${esc(t.titulo)}</b> criada${t.prazo ? " para " + rotuloData(t.prazo).toLowerCase() : ""}.`, [["Abrir", () => editor(t.id)]], { cor: PRIO[t.prioridade].cor });
}
elRapido.addEventListener("input", desenharPrevia);

function cartao(t, { data = true, arrastar = false } = {}) {
  const p = PRIO[t.prioridade] || PRIO.P3, at = atrasada(t), c = t.status === "concluida", subs = t.subtarefas || [], m = [];
  if (data && t.prazo) m.push(`<span class="etq" style="--c:${at ? "#fb7185" : "#a3a9b8"}">${svg("calendario")}${at ? "Atrasada · " : ""}${rotuloData(t.prazo)}${t.hora ? " " + t.hora : ""}</span>`);
  else if (t.hora) m.push(`<span class="etq" style="--c:${at ? "#fb7185" : "#a3a9b8"}">${svg("relogio")}${t.hora}</span>`);
  if (!c && t.status !== "afazer") m.push(`<span class="etq" style="--c:${STATUS[t.status].cor}">${svg(STATUS[t.status].ic)}${STATUS[t.status].nome}</span>`);
  if (!c && t.lembrete) m.push(`<span class="etq" style="--c:#a78bfa">${svg("sino")}${rotuloLembrete(t.lembrete)}</span>`);
  if (t.lista && t.lista !== "Geral") m.push(`<span class="etq" style="--c:${corLista(t.lista)}">#${esc(t.lista)}</span>`);
  if (t.quem) m.push(`<span class="etq" style="--c:#22d3ee">${svg("usuario")}${esc(t.quem)}</span>`);
  if (subs.length) m.push(`<span class="etq">${svg("lista")}${subs.filter((s) => s.feito).length}/${subs.length}</span>`);
  if (t.recorrencia && t.recorrencia !== "nenhuma") m.push(`<span class="etq" style="--c:#34d399" title="${RECOR[t.recorrencia]}">${svg("repetir")}</span>`);
  return `<div class="tf${c ? " concl" : ""}${at ? " atras" : ""}" data-abrir="${t.id}" tabindex="0" role="button" style="--pc:${p.cor}"${arrastar ? ` draggable="true" data-arr="${t.id}"` : ""}>
    <button type="button" class="tf-check" data-concluir="${t.id}" aria-label="${c ? "Reabrir" : "Concluir"}">${svg("check")}</button>
    <div><div class="tf-tit">${esc(t.titulo)}</div>${m.length ? `<div class="tf-meta">${m.join("")}</div>` : ""}</div>
    <span class="tf-prio" title="${p.nome}">${t.prioridade}</span></div>`;
}

function editor(id, pre = {}) {

  };
  A.modal({
    titulo: "Widgets", icone: "widgets", largura: 560,
    html: `<p style="margin:0 0 14px;color:var(--txt2);font-size:.84rem">Arraste um widget pelo título para mover, pelo canto inferior direito para redimensionar. A posição fica salva neste navegador.</p><div class="wg-lista" id="wgLista"></div>`,
    esquerda: [{ rotulo: "Restaurar layout padrão", classe: "btn v p", icone: "repetir", acao: () => { montar(PADRAO); grade.salvar(); A.toast("Layout padrão restaurado."); } }],
    botoes: [{ rotulo: "Pronto", classe: "btn", principal: true }],
    aoAbrir(cx) {
      desenhar(cx);
      cx.querySelector("#wgLista").onclick = (e) => {
        const b = e.target.closest("[data-tg]"); if (!b) return;
        const id = b.dataset.tg;
        if (grade.itens.some((i) => i.id === id)) grade.remover(id);
        else { adicionarWidget({ id }); grade.salvar(); renderTudo(); setTimeout(() => grade.itens.find((i) => i.id === id)?.el.scrollIntoView({ behavior: "smooth", block: "center" }), 350); }
        setTimeout(() => desenhar(cx), 280);
      };
    },
  });
}
btWidgets.onclick = gerenciarWidgets;

function baixar(nome, texto) {
  const u = URL.createObjectURL(new Blob([texto], { type: "application/json" })), a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500);
}
btDados.onclick = () => A.modal({
  titulo: "Dados e backup", icone: "camadas", cor: "#22d3ee", largura: 520,
  html: `<p style="margin:0 0 16px;color:var(--txt2);font-size:.84rem;line-height:1.6">As tarefas ficam guardadas <b>neste navegador</b>. Faça backup de vez em quando — ou para levar para outro computador.
    <br><span style="color:var(--txt3)">${DB.tarefas.length} tarefa(s) · ${abertas().length} em aberto</span></p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button type="button" class="btn v" id="dxExp">${svg("baixar")}Exportar backup</button>
      <button type="button" class="btn v" id="dxImp">${svg("subir")}Importar backup</button>
      <button type="button" class="btn v" id="dxEx">${svg("lixo")}Limpar exemplos</button>
      <button type="button" class="btn perigo" id="dxTudo">${svg("atencao")}Apagar tudo</button></div>`,
  botoes: [{ rotulo: "Fechar" }],
  aoAbrir(cx) {
    cx.querySelector("#dxExp").onclick = () => { baixar(`tarefas-backup-${hoje()}.json`, JSON.stringify({ versao: 1, exportado_em: agoraLocal(), ...DB }, null, 2)); A.toast("⬇ Backup baixado."); };
    cx.querySelector("#dxImp").onclick = () => document.getElementById("arqImport").click();
    cx.querySelector("#dxEx").onclick = limparExemplos;
    cx.querySelector("#dxTudo").onclick = async () => {
      if (!(await A.confirmar("Apagar <b>todas</b> as tarefas deste navegador? Faça um backup antes.", { titulo: "Apagar tudo", rotulo: "Apagar tudo", perigo: true }))) return;
      DB = { tarefas: [], listas: ["Geral", "Trabalho", "Pessoal"] }; mudou(); A.toast("Tudo apagado.", [], { cor: "var(--rosa)" });
    };
  },
});
document.getElementById("arqImport").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j || !Array.isArray(j.tarefas)) throw new Error("arquivo sem a lista de tarefas");
    if (!(await A.confirmar(`Substituir as tarefas atuais pelas <b>${j.tarefas.length}</b> do backup?`, { titulo: "Importar backup", rotulo: "Importar" }))) return;
    DB = { tarefas: j.tarefas, listas: j.listas || ["Geral"] }; mudou(); A.toast(`⬆ ${j.tarefas.length} tarefa(s) importada(s).`, [], { cor: "var(--verde)" });
  } catch (err) { A.toast("Não consegui importar: " + esc(err.message), [], { cor: "var(--rosa)" }); }
};
async function limparExemplos() {
  const n = DB.tarefas.filter((t) => t.exemplo).length; if (!n) return;
  if (!(await A.confirmar(`Remover as <b>${n}</b> tarefas de exemplo? As suas continuam.`, { titulo: "Limpar exemplos", rotulo: "Remover" }))) return;
  DB.tarefas = DB.tarefas.filter((t) => !t.exemplo); mudou();
}
document.getElementById("btLimparEx").onclick = limparExemplos;

function sino() {
  if (!("Notification" in window)) { btSino.hidden = true; return; }
  const p = Notification.permission;
  btSino.innerHTML = svg("sino");
  btSino.classList.toggle("on", p === "granted");
  btSino.title = p === "granted" ? "Notificações do navegador ativas" : p === "denied" ? "Notificações bloqueadas no navegador (libere no cadeado da barra de endereço)" : "Ativar notificações do navegador";
}
btSino.onclick = async () => {
  if (Notification.permission === "default") { try { await Notification.requestPermission(); } catch (_) {} sino(); }
  if (Notification.permission === "granted") { A.som(); A.toast("🔔 Notificações ativas — os lembretes aparecem mesmo com a aba em segundo plano (com a página aberta).", [], { cor: "var(--violeta)" }); }
  else if (Notification.permission === "denied") A.toast("As notificações estão bloqueadas. Libere no cadeado ao lado do endereço do site.", [], { cor: "var(--rosa)", duracao: 8000 });
};

/* ══════════════ EVENTOS GERAIS ══════════════ */
document.addEventListener("click", (e) => {
  const q = (s) => e.target.closest(s);
  let b;
  if ((b = q("[data-concluir]"))) { e.stopPropagation(); concluir(b.dataset.concluir, b.closest(".tf")); return; }
  if ((b = q("[data-adiar]"))) { const [id, m] = b.dataset.adiar.split("|"); m === "amanha" ? adiarAmanha(id) : m === "sem" ? semLembrete(id) : adiar(id, +m); return; }
  if ((b = q("[data-wmax]"))) { const on = grade.max(b.dataset.wmax); b.innerHTML = svg(on ? "minimizar" : "maximizar"); b.title = on ? "Voltar" : "Expandir"; return; }
  if ((b = q("[data-wfechar]"))) {
    const id = b.dataset.wfechar, lay = grade.layout().find((l) => l.id === id);
    if (grade.itens.find((i) => i.id === id)?.el.classList.contains("max")) grade.max(id);
    grade.remover(id);
    A.toast(`Widget <b>${WIDGETS[id].titulo}</b> removido.`, [["Desfazer", () => { adicionarWidget(lay); grade.salvar(); renderTudo(); }]]);
    return;
  }
  if ((b = q("[data-cal-nav]"))) {
    const n = +b.dataset.calNav;
    if (!n) { est.cal.ref = hoje().slice(0, 7); est.cal.sel = hoje(); }
    else { const [a, m] = est.cal.ref.split("-").map(Number), d = new Date(a, m - 1 + n, 1); est.cal.ref = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
    renderTudo(); return;
  }
  if ((b = q("[data-cal-dia]"))) { est.cal.sel = b.dataset.calDia; renderTudo(); return; }
  if ((b = q("[data-nova-dia]"))) { editor(null, { prazo: b.dataset.novaDia }); return; }
  if ((b = q("[data-lista]"))) {
    est.td.lista = b.dataset.lista; est.td.status = "abertas";
    if (!grade.itens.some((i) => i.id === "todas")) { adicionarWidget({ id: "todas" }); grade.salvar(); }
    renderTudo(); grade.itens.find((i) => i.id === "todas")?.el.scrollIntoView({ behavior: "smooth", block: "center" }); return;
  }
  if ((b = q("[data-abrir]")) && !q(".aur-modal")) { editor(b.dataset.abrir); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches?.(".tf[data-abrir]")) { editor(e.target.dataset.abrir); return; }
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (!digitando && !A.modalAberto() && (e.key === "n" || e.key === "/")) { e.preventDefault(); elRapido.focus(); }
});

/* ══════════════ INÍCIO ══════════════ */
carregar();
sino();
montar(Array.isArray(layoutSalvo) && layoutSalvo.length ? layoutSalvo : PADRAO);
verificar(true);
setInterval(() => verificar(false), 15000);
setInterval(() => { if (!A.modalAberto() && !document.querySelector(".wg.arrastando,.wg.redimensionando")) renderTudo(); }, 60000);
addEventListener("storage", (e) => { if (e.key === K.dados) { carregar(); renderTudo(); } });
})();
</script>
</body>
</html>
