<!--
═══════════════════════════════════════════════════════════════════════════════
 weduca.html — WEDUCA · a rede de conhecimento da King Star (kit Aurora)
───────────────────────────────────────────────────────────────────────────────
 Rede social: bolinhas/stories (24 h, fora da IA), Seguir, curtir (2 toques), comentar e curtir
 comentário, compartilhar link, conquistas, SHORTS (uma postagem por tela) e Aprendizagem com
 cartaz que rola, Top 10 e ranking do mês.
 Etapa 2 — APRENDIZAGEM: cursos da equipe (aulas de vídeo/leitura/PDF/fotos), progresso,
 avaliação com nota mínima, certificado e turma; aulas + dúvidas entram na base da IA.
 Etapa 1 — FEED: postagens com texto, fotos, PDFs e vídeos do YouTube (canal da
 empresa), curtidas, comentários, salvos, busca e novidades em tempo real.
 Tudo o que é publicado (com os comentários) vira BASE DE CONHECIMENTO da IA do
 topo na hora. Quem publica pode deixar a postagem "só no feed". 👎 numa resposta
 que veio daqui deixa a postagem EM ANÁLISE e cai nas pendências do agente.
 Próximas etapas: Notícias → Pesquisas → Documentos → Resultados → Relatórios.
 API: /api/weduca (hub/weduca.py) · IA: /api/agente (hub/agente.py)
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:0;min-height:100vh}
:root{--sup:color-mix(in srgb,var(--txt) 4%,transparent);--sup2:color-mix(in srgb,var(--txt) 8%,transparent);--linha:var(--vidro-borda);--ou:#f0cb4e}
html[data-claro]{--ou-t:#8f6b08}
html:not([data-claro]){--ou-t:#f0cb4e}
.app{position:relative;z-index:1;max-width:none;margin:0}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:20px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca b{display:block;font:700 1.08rem var(--titulo);letter-spacing:-.01em}
.marca small{display:block;font-size:.6rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;color:var(--ou-t)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 auto}
.nav button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:600;color:var(--txt2);transition:.2s;position:relative}
.nav button svg.i{width:15px;height:15px}
.nav button:hover:not(:disabled){color:var(--txt);background:var(--sup)}
.nav button.ativo{color:#1a1204;background:var(--ou);box-shadow:0 0 20px -4px var(--ou)}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.nav button .breve{font-size:.55rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.dir{display:flex;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro);box-shadow:0 0 8px var(--ouro);animation:aurRespira 1s infinite}
.sync.erro i{background:var(--rosa);box-shadow:0 0 8px var(--rosa)}
main{display:block}
/* mesmo padrão do hub (tema Eduking): largura total, hero com cartão de vidro, fileiras */
.cont{max-width:1600px;margin:0 auto;padding:22px clamp(16px,3vw,48px) 90px}
.edk-hero+.cont{margin-top:-46px;position:relative;z-index:3}
.edk-hero{min-height:min(54vh,480px);padding:34px clamp(16px,3vw,48px) 64px}
.edk-hero .wrap{max-width:1600px}
.edk-hero .carregar{color:var(--txt3)}
.edk-cartao .meta .av{width:28px;height:28px;font-size:.62rem}
.edk-cartao .meta b{color:var(--txt)}
.edk-bt svg.i{width:18px;height:18px}
.cab-sec{display:flex;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.cab-sec h2{margin:0;font:800 clamp(20px,2.2vw,28px) var(--titulo);display:flex;align-items:center;gap:12px}
.cab-sec .btn{margin-left:auto}
.feed-grade{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;margin-top:10px}
.feed-grade>.pilha{max-width:none}
.grade-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding:6px 0}
.grade-cards .edk-card{width:auto}
.edk-fil-cab .btn{margin-left:auto}
.pilha{display:flex;flex-direction:column;gap:14px;min-width:0}
.lado{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow-y:auto}
.caixa{border-radius:22px;padding:16px}
.caixa h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:700 .95rem var(--titulo)}
.caixa h3 small{margin-left:auto;font:600 .72rem var(--sans);color:var(--txt3)}
/* avatar */
.av{--c:#f0cb4e;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 .85rem var(--titulo);color:#1a1204;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));box-shadow:0 0 0 2px var(--noite),0 0 0 3.5px color-mix(in srgb,var(--c) 70%,transparent)}
.av.p{width:32px;height:32px;font-size:.7rem}
/* compositor */
.comp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.comp textarea{width:100%;min-height:52px;max-height:320px;resize:none;border:0;background:none;outline:none;color:var(--txt);font:500 .98rem/1.55 var(--sans);padding:10px 2px}
.comp textarea::placeholder{color:var(--txt3)}
.anexos{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.anexo{position:relative;display:flex;align-items:center;gap:8px;padding:6px 30px 6px 6px;border-radius:12px;background:var(--sup);border:1px solid var(--linha);font-size:.76rem;max-width:240px}
.anexo img{width:46px;height:46px;border-radius:9px;object-fit:cover}
.anexo .pdf{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;background:rgba(251,113,133,.12);color:var(--rosa);font:800 .7rem var(--titulo)}
.anexo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anexo small{display:block;color:var(--txt3)}
.anexo .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--txt3)}
.anexo .x:hover{background:var(--sup2);color:var(--txt)}
.anexo.envio{opacity:.6}.anexo.envio::after{content:"enviando…";position:absolute;inset:auto 8px 4px auto;font-size:.6rem;color:var(--ou-t)}
.video-campos{display:grid;gap:8px;margin-bottom:10px}
.comp-pe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--linha)}
.comp-pe .ferr{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:11px;font-size:.78rem;font-weight:600;color:var(--txt2)}
.comp-pe .ferr:hover{background:var(--sup);color:var(--txt)}
.comp-pe .ferr svg.i{width:16px;height:16px}
.comp-pe .ferr.foto svg{color:#34d399}.comp-pe .ferr.pdfb svg{color:#fb7185}.comp-pe .ferr.vid svg{color:#f87171}
.comp-pe .base{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-size:.74rem;color:var(--txt2);cursor:pointer}
.comp-pe .btn{margin-left:4px}
/* filtros */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filtros .busca{flex:1;min-width:180px;position:relative}
.filtros .busca input{padding-left:36px}
.filtros .busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--txt3)}
.novas{position:sticky;top:12px;z-index:30;align-self:center;display:none;margin:0 auto -6px;padding:9px 16px;border-radius:99px;font-weight:700;font-size:.8rem;color:#1a1204;
  background:linear-gradient(135deg,#f7e6a3,#f0cb4e 45%,#d2ae34);box-shadow:0 10px 30px -8px rgba(240,203,78,.8);animation:sobe .45s cubic-bezier(.16,1,.3,1)}
.novas.on{display:inline-flex;gap:8px;align-items:center}
@keyframes sobe{from{opacity:0;transform:translateY(-10px)}}
/* postagem */
.post{border-radius:22px;padding:16px 16px 10px;animation:entra .5s cubic-bezier(.16,1,.3,1) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}}
.post.brilho{box-shadow:0 0 0 2px var(--ou),0 0 40px -6px var(--ou)!important}
.p-cab{display:flex;align-items:center;gap:11px}
.p-cab .quem{min-width:0;flex:1}
.p-cab b{display:block;font:700 .92rem var(--titulo)}
.p-cab small{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--txt3);font-size:.72rem}
.selo{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:.62rem;font-weight:800;letter-spacing:.04em}
.selo.base{color:var(--ou-t);background:rgba(240,203,78,.13);border:1px solid rgba(240,203,78,.35)}
.selo.feed{color:var(--txt3);background:var(--sup);border:1px solid var(--linha)}
.selo.rev{color:var(--verde);background:color-mix(in srgb,var(--verde) 12%,transparent);border:1px solid color-mix(in srgb,var(--verde) 35%,transparent)}
.selo.ana{color:var(--rosa);background:color-mix(in srgb,var(--rosa) 12%,transparent);border:1px solid color-mix(in srgb,var(--rosa) 35%,transparent)}
.p-texto{margin:12px 2px 4px;font-size:.95rem;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.p-texto.corta{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.p-texto a{color:var(--ou-t);font-weight:600}
.p-texto .tag{color:var(--ou-t);font-weight:700;cursor:pointer}
.mais-txt{font-size:.78rem;font-weight:700;color:var(--txt2);padding:2px}
.correcao{margin:10px 0 2px;padding:10px 12px;border-radius:14px;font-size:.84rem;line-height:1.5;background:rgba(240,203,78,.09);border:1px solid rgba(240,203,78,.32)}
.correcao b{color:var(--ou-t)}
.analise{margin:10px 0 2px;padding:9px 12px;border-radius:14px;font-size:.8rem;background:color-mix(in srgb,var(--rosa) 9%,transparent);border:1px solid color-mix(in srgb,var(--rosa) 32%,transparent)}
.fotos{display:grid;gap:4px;margin-top:12px;border-radius:16px;overflow:hidden}
.fotos.n1{grid-template-columns:1fr}.fotos.n2{grid-template-columns:1fr 1fr}.fotos.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.fotos.n4{grid-template-columns:1fr 1fr}
.fotos.n3 button:first-child{grid-row:1/3}
.fotos button{position:relative;padding:0;display:block;background:var(--sup);min-height:120px}
.fotos img{width:100%;height:100%;object-fit:cover;display:block;max-height:520px;transition:transform .5s}
.fotos.n1 img{object-fit:contain;max-height:560px;background:#000}
.fotos button:hover img{transform:scale(1.03)}
.fotos .resto{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font:800 1.6rem var(--titulo)}
.pdfs{display:grid;gap:8px;margin-top:12px}
.pdf-c{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sup);border:1px solid var(--linha);text-decoration:none;color:inherit;transition:.2s}
.pdf-c:hover{border-color:color-mix(in srgb,var(--rosa) 45%,transparent);transform:translateY(-2px)}
.pdf-c .ic{width:44px;height:52px;border-radius:9px;display:grid;place-items:center;background:rgba(251,113,133,.14);color:var(--rosa);font:800 .7rem var(--titulo);flex:none}
.pdf-c b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-c small{color:var(--txt3);font-size:.72rem}
.pdf-c .ab{margin-left:auto;color:var(--txt3)}
.video{margin-top:12px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;position:relative}
.video button{position:absolute;inset:0;padding:0;display:block;width:100%}
.video img{width:100%;height:100%;object-fit:cover;opacity:.88;transition:.4s}
.video button:hover img{opacity:1;transform:scale(1.03)}
.video .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px;border-radius:14px;background:#f00;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.video .play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.video iframe{width:100%;height:100%;border:0;display:block}
.v-tit{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:700;font-size:.88rem}
.v-tit svg{color:#f87171;flex:none}
details.transc{margin-top:6px;font-size:.84rem;color:var(--txt2)}
details.transc summary{cursor:pointer;font-weight:700;font-size:.76rem;color:var(--txt3)}
details.transc p{white-space:pre-wrap;margin:8px 0 0;line-height:1.55}
.p-barra{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:6px;border-top:1px solid var(--linha)}
.p-barra button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;font-size:.8rem;font-weight:650;color:var(--txt2);transition:.2s}
.p-barra button:hover{background:var(--sup);color:var(--txt)}
.p-barra button svg.i{width:18px;height:18px}
.p-barra button.on.curtir{color:#fb7185}.p-barra button.on.curtir svg{fill:#fb7185;stroke:#fb7185}
.p-barra button.on.salvar{color:var(--ou-t)}.p-barra button.on.salvar svg{fill:var(--ou);stroke:var(--ou)}
.p-barra .salvar{margin-left:auto}
.pop{animation:pop .4s cubic-bezier(.16,1,.3,1)}
@keyframes pop{40%{transform:scale(1.35)}}
.coments{display:flex;flex-direction:column;gap:8px;padding:8px 0 4px}
.com{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start}
.com .bal{padding:8px 12px;border-radius:4px 16px 16px 16px;background:var(--sup);font-size:.86rem;line-height:1.5;position:relative}
.com .bal b{font-size:.8rem;margin-right:6px}
.com .bal small{color:var(--txt3);font-size:.68rem}
.com .bal .xc{position:absolute;top:4px;right:6px;opacity:0;color:var(--txt3);font-size:.9rem;transition:.2s}
.com:hover .xc{opacity:1}
.com .bal p{margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}
.ver-todos{font-size:.78rem;font-weight:700;color:var(--txt3);padding:2px 0;text-align:left}
.ver-todos:hover{color:var(--txt)}
.com-novo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0 4px}
.com-novo input{border-radius:99px;padding:9px 14px}
.carregar{padding:14px;text-align:center;color:var(--txt3);font-size:.82rem}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--txt3);font-size:.88rem;padding:40px 14px;border-radius:22px}
.vazio b{color:var(--txt);font:700 1.05rem var(--titulo)}
/* IA */
.ia-cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ia-orbe{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,#f0cb4e,#fff6cf,#d2ae34,#111,#f0cb4e);box-shadow:0 0 18px rgba(240,203,78,.55);animation:gira 6s linear infinite}
.ia-orbe.pensando{animation-duration:.9s;box-shadow:0 0 26px rgba(240,203,78,.95)}
@keyframes gira{to{transform:rotate(360deg)}}
.ia-cab b{display:block;font:700 .95rem var(--titulo)}
.ia-cab small{color:var(--txt3);font-size:.72rem}
.ia-conv{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;margin-bottom:8px}
.ia-conv:empty{display:none}
.msg{padding:9px 12px;border-radius:14px;font-size:.85rem;line-height:1.55}
.msg.eu{align-self:flex-end;max-width:88%;background:rgba(240,203,78,.16);border:1px solid rgba(240,203,78,.32)}
.msg.ia{background:var(--sup);border:1px solid var(--linha)}
.msg.ia p{margin:0 0 6px}.msg.ia p:last-child{margin:0}
.msg.ia ol,.msg.ia ul{margin:4px 0;padding-left:18px}
.msg .fonte{display:block;margin-top:8px;padding-top:7px;border-top:1px dashed var(--linha);font-size:.72rem;color:var(--txt3)}
.msg .fonte button{color:var(--ou-t);font-weight:700;text-align:left}
.msg .fb{display:flex;gap:6px;margin-top:8px}
.msg .fb button{padding:4px 9px;border-radius:9px;font-size:.72rem;font-weight:700;background:var(--sup2);color:var(--txt2)}
.msg .fb button:hover{color:var(--txt)}
.ia-sug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ia-sug button{padding:5px 10px;border-radius:99px;font-size:.72rem;font-weight:600;background:var(--sup);border:1px solid var(--linha);color:var(--txt2)}
.ia-sug button:hover{border-color:rgba(240,203,78,.5);color:var(--txt)}
.ia-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.ia-in input{border-radius:99px;padding:10px 14px}
.dig span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--txt3);margin:0 2px;animation:dig 1s infinite}
.dig span:nth-child(2){animation-delay:.15s}.dig span:nth-child(3){animation-delay:.3s}
@keyframes dig{50%{transform:translateY(-4px);opacity:.4}}
.num{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num div{padding:10px 12px;border-radius:14px;background:var(--sup);border:1px solid var(--linha)}
.num b{display:block;font:800 1.4rem var(--titulo)}
.num small{color:var(--txt3);font-size:.7rem;font-weight:600}
.pessoa{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--linha);font-size:.84rem}
.pessoa:first-of-type{border-top:0}
.pessoa small{display:block;color:var(--txt3);font-size:.7rem}
.top-post{display:block;width:100%;text-align:left;padding:8px 0;border-top:1px solid var(--linha);font-size:.8rem;color:var(--txt2)}
.top-post:first-of-type{border-top:0}
.top-post:hover{color:var(--txt)}
.top-post b{color:var(--txt);font-size:.76rem}
/* lightbox */
.luz-img{display:grid;place-items:center;min-height:60vh}
.luz-img img{max-width:100%;max-height:78vh;border-radius:14px}
.menu-p{position:relative}
.menu-lista{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:220px;padding:6px;border-radius:16px;display:none}
.menu-lista.on{display:block;animation:sobe .3s cubic-bezier(.16,1,.3,1)}
.menu-lista button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:.82rem;text-align:left}
.menu-lista button:hover{background:var(--sup2)}
.menu-lista button.perigo{color:var(--rosa)}
.menu-lista svg.i{width:16px;height:16px}
/* ═════════ APRENDIZAGEM ═════════ */
.chk{display:flex;gap:8px;align-items:center;font-size:.84rem;cursor:pointer}
.btn.p{padding:6px 10px;font-size:.72rem}
html:not([data-eduking]){--edk-veu:rgba(0,0,0,.8);--edk-vidro-forte:rgba(16,16,20,.9);--edk-l:255,255,255;--edk-sup:#131316;--edk-texto-ouro:#f0cb4e;--edk-vidro:rgba(22,22,26,.6);
  --edk-sombra:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,.25) 55%,rgba(0,0,0,0));--edk-a1:#0b0b0d;--edk-a2:#1a160b;--edk-a3:#09090b}
html:not([data-eduking])[data-claro]{--edk-l:17,17,17;--edk-sup:#fff;--edk-texto-ouro:#8f6b08;--edk-vidro:rgba(255,255,255,.75);
  --edk-sombra:linear-gradient(0deg,rgba(255,255,255,.97),rgba(255,255,255,.6) 55%,rgba(255,255,255,0));--edk-a1:#fffdf6;--edk-a2:#f8e7aa;--edk-a3:#fbf6e6}
.apr{display:block}
.apr-hero{position:relative;border-radius:26px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;margin-bottom:14px}
.apr-hero .edk-arte,.apr-hero .capa-img{position:absolute;inset:0}
.capa-img{width:100%;height:100%;object-fit:cover}
.apr-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--noite) 0%,color-mix(in srgb,var(--noite) 70%,transparent) 45%,transparent),linear-gradient(0deg,var(--noite),transparent 60%)}
.apr-hero .txt{position:relative;z-index:2;padding:26px clamp(18px,3vw,34px);max-width:640px}
.apr-hero .rotulo{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:99px;
  background:linear-gradient(135deg,#f0cb4e,#d2ae34);color:#1a1204}
.apr-hero h2{margin:10px 0 6px;font:800 clamp(22px,2.6vw,34px)/1.1 var(--titulo)}
.apr-hero p{margin:0 0 14px;color:var(--txt2);font-size:.92rem;max-width:560px}
.apr-hero .acoes{display:flex;gap:10px;flex-wrap:wrap}
.barra-prog{height:6px;border-radius:9px;background:rgba(var(--edk-l),.14);overflow:hidden}
.barra-prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#d2ae34,#f0cb4e);box-shadow:0 0 10px rgba(240,203,78,.6);transition:width .5s}
.apr-hero .barra-prog{max-width:360px;margin:-4px 0 14px}
.apr-ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
.apr-ferr .busca{flex:1;min-width:200px;position:relative}
.apr-ferr .busca input{padding-left:36px}
.apr-ferr .busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--txt3)}
.edk-card .cprog{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3;background:rgba(var(--edk-l),.15)}
.edk-card .cprog i{display:block;height:100%;background:#f0cb4e}
.edk-card .capa-img{position:absolute;inset:0}
.nota.ok{color:var(--verde)!important}.nota.obr{color:#fb7185!important}.nota.ras{color:var(--txt2)!important}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cert-c{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;text-align:left;width:100%}
.cert-c .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#f0cb4e,#d2ae34);color:#1a1204;flex:none}
.cert-c b{display:block;font:700 .9rem var(--titulo)}.cert-c small{color:var(--txt3);font-size:.72rem}
/* curso */
.cur-cab{position:relative;border-radius:22px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;margin-bottom:16px}
.cur-cab .edk-arte,.cur-cab .capa-img{position:absolute;inset:0}
.cur-cab::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--noite),color-mix(in srgb,var(--noite) 40%,transparent) 60%,transparent)}
.cur-cab .txt{position:relative;z-index:2;padding:22px}
.cur-cab h2{margin:6px 0;font:800 clamp(22px,2.4vw,32px) var(--titulo)}
.cur-meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--txt2)}
.cur-grade{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cur-desc{white-space:pre-wrap;line-height:1.6;color:var(--txt2);margin:0 0 14px}
.aulas-l{display:flex;flex-direction:column;gap:6px}
.aula-i{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--sup);border:1px solid var(--linha);text-align:left;width:100%;transition:.2s}
.aula-i:hover{border-color:rgba(240,203,78,.45);transform:translateX(3px)}
.aula-i.atual{border-color:#f0cb4e;box-shadow:0 0 0 1px #f0cb4e}
.aula-i .n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:800 .8rem var(--titulo);background:var(--sup2);color:var(--txt2)}
.aula-i.feita .n{background:var(--verde);color:#04140b}
.aula-i b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aula-i small{color:var(--txt3);font-size:.72rem;display:flex;gap:6px;align-items:center}
.aula-i small svg{width:13px;height:13px}
.lado-cur{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.box{border-radius:18px;padding:14px;background:var(--sup);border:1px solid var(--linha)}
.box h4{margin:0 0 8px;font:700 .9rem var(--titulo);display:flex;gap:8px;align-items:center}
.pct-g{font:800 2rem var(--titulo)}
/* player */
.player{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.aula-tit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.aula-tit h3{margin:0;font:800 1.3rem var(--titulo)}
.aula-corpo{font-size:.95rem;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.pdf-v{width:100%;height:70vh;border:0;border-radius:14px;background:#fff}
.aula-pe{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;padding:14px;border-radius:16px;background:var(--sup);border:1px solid var(--linha)}
.aula-pe .esp{flex:1}
.duvidas h4{margin:18px 0 8px;font:700 .95rem var(--titulo);display:flex;gap:8px;align-items:center}
/* avaliação */
.quiz-q{padding:16px;border-radius:18px;background:var(--sup);border:1px solid var(--linha);margin-bottom:12px}
.quiz-q b{display:block;margin-bottom:10px;font:700 .98rem var(--titulo)}
.quiz-q label{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.quiz-q label:hover{background:var(--sup2)}
.quiz-q label:has(input:checked){border-color:#f0cb4e;background:rgba(240,203,78,.1)}
.quiz-q label.certa{border-color:var(--verde)!important;background:color-mix(in srgb,var(--verde) 12%,transparent)!important}
.quiz-q input{accent-color:#f0cb4e;width:18px;height:18px}
.resultado{text-align:center;padding:26px;border-radius:22px;margin-bottom:16px}
.resultado .nota-g{font:800 3.4rem var(--titulo)}
.resultado.ok .nota-g{color:var(--verde)}.resultado.mal .nota-g{color:var(--rosa)}
/* editor */
.ed-grade{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.ed-sec{border-radius:18px;padding:16px;background:var(--sup);border:1px solid var(--linha);margin-bottom:14px}
.ed-sec h4{margin:0 0 12px;font:700 .95rem var(--titulo);display:flex;gap:8px;align-items:center}
.ed-sec h4 .btn,.ed-sec h4 .btn.v{margin-left:auto}
.lin2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.capa-ed{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/7;background:var(--sup2);margin-bottom:8px}
.capa-ed .edk-arte,.capa-ed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capa-ed .bts{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:2}
.aula-ed{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--sup);border:1px solid var(--linha);margin-bottom:6px}
.aula-ed .acs{display:flex;gap:4px}
.aula-ed .acs .btn-ic{width:32px;height:32px}
.perg-ed{padding:12px;border-radius:14px;border:1px solid var(--linha);margin-bottom:10px;background:var(--sup)}
.perg-ed .op{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:6px}
.perg-ed .op input[type=radio]{accent-color:#f0cb4e;width:18px;height:18px}
.seg-tipo{display:flex;gap:6px;margin-bottom:10px}
.seg-tipo button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:10px;border-radius:12px;background:var(--sup);border:1px solid var(--linha);font-weight:700;font-size:.82rem;color:var(--txt2)}
.seg-tipo button.ativo{border-color:#f0cb4e;background:rgba(240,203,78,.13);color:var(--txt)}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{text-align:left;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);padding:8px;border-bottom:1px solid var(--linha)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--linha)}
@media (max-width:1000px){.cur-grade,.player,.ed-grade{grid-template-columns:1fr}.lado-cur{position:static}}
/* ═════════ SHELL DO WEDUCA: a bolinha "E" abre o menu de seções (sidebar só do WEDUCA) ═════════ */
.w-bolinha{position:fixed;top:14px;left:14px;z-index:70;width:48px;height:48px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;
  background:conic-gradient(from 0deg,#f0cb4e,#fff6cf,#d2ae34,#1a1a1a,#f0cb4e);box-shadow:0 0 0 3px rgba(240,203,78,.18),0 10px 30px -6px rgba(240,203,78,.6);
  animation:wGira 9s linear infinite;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.w-bolinha span{width:38px;height:38px;border-radius:50%;background:#0b0b0d;display:grid;place-items:center;font:800 18px var(--titulo);color:#f0cb4e;animation:wGira 9s linear infinite reverse}
.w-bolinha:hover{transform:scale(1.1)}
body.sb-on .w-bolinha{animation-duration:2.5s}
@keyframes wGira{to{transform:rotate(360deg)}}
.w-sb{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:65;display:flex;flex-direction:column;gap:6px;padding:84px 16px 16px;
  background:var(--edk-vidro-forte,rgba(16,16,20,.9));backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);
  border-right:1px solid var(--vidro-borda);clip-path:circle(0 at 38px 38px);transition:clip-path .6s cubic-bezier(.16,1,.3,1);pointer-events:none}
html[data-claro] .w-sb{background:rgba(255,255,255,.94)}
body.sb-on .w-sb{clip-path:circle(160% at 38px 38px);pointer-events:auto}
.w-veu{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .4s}
html[data-claro] .w-veu{background:rgba(0,0,0,.15)}
body.sb-on .w-veu{opacity:1;pointer-events:auto}
.w-marca{position:absolute;top:20px;left:76px}
.w-marca b{display:block;font:800 22px var(--titulo)}
.w-marca small{display:block;font-size:10.5px;letter-spacing:.16em;font-weight:600;color:var(--txt3);text-transform:uppercase}
.w-lista{display:grid;gap:4px;align-content:start;overflow-y:auto;flex:1}
.w-sis{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:14px;color:var(--txt2);font-weight:600;text-align:left;width:100%;
  opacity:0;transform:translateX(-16px);transition:opacity .35s,transform .45s cubic-bezier(.16,1,.3,1),background .2s;transition-delay:calc(var(--i,0) * 40ms)}
body.sb-on .w-sis{opacity:1;transform:none}
.w-sis:hover:not(:disabled){background:rgba(var(--edk-l),.07);color:var(--txt)}
.w-sis .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(var(--edk-l),.06);box-shadow:inset 0 0 0 1px rgba(var(--edk-l),.1)}
.w-sis .ic svg.i{width:19px;height:19px}
.w-sis b{display:block;font-size:.92rem;color:inherit}
.w-sis small{display:block;font-weight:500;font-size:.74rem;color:var(--txt3)}
.w-sis.ativo{background:rgba(240,203,78,.12);color:var(--txt)}
.w-sis.ativo .ic{background:linear-gradient(135deg,#f0cb4e,#d2ae34);color:#000;box-shadow:none}
.w-sis:disabled{cursor:default}.w-sis:disabled .ic,.w-sis:disabled b{opacity:.45}
.w-sis .breve{margin-left:auto;white-space:nowrap;flex:none;font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);padding:2px 7px;border-radius:99px;border:1px solid var(--vidro-borda)}
.w-eu{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;background:rgba(var(--edk-l),.05);border:1px solid rgba(var(--edk-l),.08);text-align:left;width:100%;margin-top:6px}
.w-eu:hover{border-color:rgba(240,203,78,.45)}
.w-eu b{display:block;font-size:.88rem}.w-eu small{display:block;color:var(--txt3);font-size:.72rem}
/* barra de cima do WEDUCA: seção + abas modernas (indicador dourado que desliza) */
.w-nav{position:fixed;top:10px;left:76px;right:14px;z-index:50;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px;border-radius:20px}
.w-secao{display:flex;align-items:center;gap:10px;font:800 18px var(--titulo);white-space:nowrap;color:var(--txt);min-width:0}
.w-secao small{font:600 11px var(--sans);color:var(--edk-texto-ouro);letter-spacing:.14em;text-transform:uppercase}
.w-abas{position:relative;display:flex;gap:2px;padding:4px;margin:0 auto;border-radius:14px;background:rgba(var(--edk-l),.06);border:1px solid rgba(var(--edk-l),.1);overflow-x:auto;max-width:100%}
.w-abas button{position:relative;z-index:1;padding:8px 14px;border-radius:10px;font-weight:600;font-size:.84rem;color:var(--txt3);white-space:nowrap;transition:color .25s}
.w-abas button:hover{color:var(--txt)}
.w-abas button.ativa{color:#000}
.w-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:linear-gradient(135deg,#f7e6a3,#f0cb4e 50%,#d2ae34);box-shadow:0 6px 18px -6px rgba(240,203,78,.8);transition:left .45s cubic-bezier(.16,1,.3,1),width .45s cubic-bezier(.16,1,.3,1)}
.w-dir{display:flex;align-items:center;gap:8px}
.w-av{padding:0;border-radius:50%}
/* conteúdo começa abaixo da barra (o hero passa por baixo dela, como no início do hub) */
#main>.cont:first-child,#main>.apr>.cont:first-child{padding-top:92px}
.edk-hero{padding-top:96px!important}
/* foto no avatar, menções, pessoas e perfil */
.av.foto{padding:0;overflow:hidden;background:var(--sup2)}
.av.foto img{width:100%;height:100%;object-fit:cover;display:block}
[data-perfil]{cursor:pointer}
b[data-perfil]:hover{text-decoration:underline}
.mencao{color:var(--ou-t);font-weight:700;cursor:pointer}
.mencoes{position:fixed;z-index:200;min-width:240px;max-width:320px;padding:6px;border-radius:14px;display:none}
.mencoes.on{display:block}
.mencoes button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:10px;text-align:left;font-size:.84rem}
.mencoes button:hover,.mencoes button.sel{background:var(--sup2)}
.mencoes small{display:block;color:var(--txt3);font-size:.7rem}
.pessoas-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pessoa-c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 16px 16px;border-radius:22px;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s}
.pessoa-c:hover{transform:translateY(-6px);border-color:rgba(240,203,78,.45)!important}
.pessoa-c .av{width:72px;height:72px;font-size:1.2rem}
.pessoa-c b{font:700 1rem var(--titulo)}
.pessoa-c small{color:var(--txt3);font-size:.78rem}
.pessoa-c p{margin:4px 0;color:var(--txt2);font-size:.82rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pessoa-c .nums{font-size:.74rem;color:var(--txt3)}
.pessoa-c .btn{margin-top:6px}
.perfil-cab{position:relative;border-radius:22px;overflow:hidden;height:170px}
.perfil-cab .edk-arte{position:absolute;inset:0}
.perfil-top{display:flex;align-items:flex-end;gap:18px;margin:-56px 0 14px 22px;position:relative;z-index:2;flex-wrap:wrap}
.perfil-top .av{width:112px;height:112px;font-size:1.8rem;box-shadow:0 0 0 5px var(--noite),0 0 0 7px rgba(240,203,78,.7)}
.perfil-top h2{margin:0;font:800 1.7rem var(--titulo)}
.perfil-top .acs{margin-left:auto;margin-right:22px;display:flex;gap:8px}
.perfil-nums{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.perfil-nums span{padding:8px 14px;border-radius:14px;background:var(--sup);border:1px solid var(--linha);font-size:.8rem;color:var(--txt2)}
.perfil-nums b{font:800 1.05rem var(--titulo);color:var(--txt);margin-right:4px}
.foto-ed{display:flex;align-items:center;gap:18px;margin-bottom:14px;padding:14px;border-radius:18px;border:1px dashed var(--linha)}
.mp-av{position:relative;flex:none;width:112px;height:112px;border-radius:50%;overflow:hidden;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(135deg,#f7e6a3,#f0cb4e);box-shadow:0 0 0 4px var(--noite),0 0 0 6px rgba(240,203,78,.7);font:800 1.8rem var(--titulo);color:#1a1204}
.mp-av img{width:100%;height:100%;object-fit:cover;display:block}
.mp-av .mp-cam{position:absolute;inset:auto 0 0 0;height:34%;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .2s}
.mp-av:hover .mp-cam{opacity:1}
.mp-av .mp-cam svg{width:20px;height:20px}
.mp-av.subindo::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:#f0cb4e;animation:gira 1s linear infinite}
.mp-av.subindo img{opacity:.6}
.mp-txt b{display:block;font:700 .95rem var(--titulo)}.mp-txt small{display:block;color:var(--txt3);font-size:.78rem;margin-top:2px}
.btn label,.btn.v{cursor:pointer}
.foto-ed .av{width:84px;height:84px;font-size:1.4rem}
/* ═════════ REDE SOCIAL (como a simulação): bolinhas/stories, compositor, post, Shorts ═════════ */
.arq-in{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.stories-w{position:relative}
.stories{display:flex;gap:16px;overflow-x:auto;padding:6px 4px 14px;scrollbar-width:none;scroll-behavior:smooth}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:80px;display:grid;justify-items:center;gap:7px;font-size:.74rem;color:var(--txt2);transition:transform .3s cubic-bezier(.16,1,.3,1);position:relative}
.story:hover{transform:translateY(-4px) scale(1.05)}
.story>span:last-child{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story .anel-s{width:74px;height:74px;border-radius:50%;padding:3px;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(var(--edk-l),.14)}
.story.tem .anel-s{background:conic-gradient(from 210deg,#f0cb4e,#f7e6a3,#d2ae34,#fff,#f0cb4e);box-shadow:none}
.story.visto .anel-s{background:rgba(var(--edk-l),.22);box-shadow:none}
.story .anel-s .av{width:100%;height:100%;box-shadow:0 0 0 3px var(--noite);font-size:1.05rem}
.story.add .anel-s{background:none;border:2px dashed #d2ae34;box-shadow:none;display:grid;place-items:center;color:#d2ae34}
.story.add .anel-s svg{width:24px;height:24px}
.story .mais-s{position:absolute;top:52px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#f0cb4e;color:#1a1204;box-shadow:0 0 0 3px var(--noite)}
.story .mais-s svg{width:13px;height:13px}
.story.sem-acesso{opacity:.55}
.st-setas{position:absolute;inset:0 -10px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.st-setas button{pointer-events:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:.25s}
.stories-w:hover .st-setas button{opacity:1}

function sync(e, t) { const el = $("#sync"); if (!el) return; el.className = "sync " + (e || ""); el.lastElementChild.textContent = t; }
async function api(url, op = {}) {

  try { const r = await A.api(url.startsWith("/api/") ? url : API + url, op); sync("", "atualizado " + hora()); return r; }
  catch (e) { sync("erro", "erro"); if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); } throw e; }

const hora = (d = new Date()) => d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
function quando(iso) {
  if (!iso) return "";
  const d = new Date(iso), s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "agora";
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  if (s < 7 * 86400) return `há ${Math.floor(s / 86400)} d`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
}
const CORES = ["#f0cb4e", "#fb923c", "#34d399", "#22d3ee", "#a78bfa", "#fb7185", "#60a5fa", "#facc15"];

function avatar(p, pequeno, semLink) {
  const nome = (p && p.nome) || "?", login = p && p.login;
  const foto = (p && p.foto) || ((S.gente || {})[login] || {}).foto;
  const link = login && !semLink ? ` data-perfil="${esc(login)}"` : "";
  return foto ? `<span class="av foto${pequeno ? " p" : ""}"${link} title="${esc(nome)}"><img src="${urlArq(foto)}" alt="" loading="lazy"></span>`

}

function rico(t) {
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)#([\p{L}\p{N}_]{2,40})/gu, '$1<span class="tag" data-tag="$2">#$2</span>')

}

async function trocar(id) {
  const m = $("#main");
  if (m.childElementCount && m.animate) await m.animate([{ opacity: 1, transform: "none", filter: "none" }, { opacity: 0, transform: "scale(.94)", filter: "blur(8px)" }], { duration: 240, easing: "cubic-bezier(.4,0,.2,1)" }).finished.catch(() => {});
  irSub(id);
  m.animate?.([{ opacity: 0, transform: "scale(1.05)", filter: "blur(8px)" }, { opacity: 1, transform: "none", filter: "none" }], { duration: 520, easing: "cubic-bezier(.16,1,.3,1)" });

  };

function fecharMen() { caixaMen.classList.remove("on"); MEN.el = null; }
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.matches("#tx, .com-novo input, #duvIn")) return;
  const antes = el.value.slice(0, el.selectionStart), m = /(^|\s)@([\w.-]{0,30})$/.exec(antes);
  if (!m) return fecharMen();
  const q = m[2].toLowerCase();
  MEN.lista = Object.values(S.gente || {}).filter((p) => !q || p.login.includes(q) || String(p.nome).toLowerCase().includes(q)).slice(0, 6);
  if (!MEN.lista.length) return fecharMen();
  MEN.el = el; MEN.sel = 0; MEN.ini = el.selectionStart - m[2].length - 1;
  caixaMen.innerHTML = MEN.lista.map((p, i) => `<button type="button" class="${i ? "" : "sel"}" data-men="${i}">${avatar(p, true, true)}<span><b>${esc(p.nome)}</b><small>@${esc(p.login)}</small></span></button>`).join("");
  const r = el.getBoundingClientRect();
  Object.assign(caixaMen.style, { left: Math.min(r.left, innerWidth - 330) + "px", top: (r.bottom + 6 + 260 > innerHeight ? r.top - 6 - Math.min(260, MEN.lista.length * 50) : r.bottom + 6) + "px" });
  caixaMen.classList.add("on");
});
function escolherMen(i) {
  const el = MEN.el, p = MEN.lista[i]; if (!el || !p) return;
  const fim = el.selectionStart;
  el.value = el.value.slice(0, MEN.ini) + "@" + p.login + " " + el.value.slice(fim);
  const pos = MEN.ini + p.login.length + 2; el.setSelectionRange(pos, pos); el.focus(); fecharMen();

caixaMen.addEventListener("mousedown", (e) => { const b = e.target.closest("[data-men]"); if (b) { e.preventDefault(); escolherMen(+b.dataset.men); } });
document.addEventListener("keydown", (e) => {
  if (!MEN.el || !caixaMen.classList.contains("on")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); MEN.sel = (MEN.sel + (e.key === "ArrowDown" ? 1 : -1) + MEN.lista.length) % MEN.lista.length; $$("[data-men]", caixaMen).forEach((b, i) => b.classList.toggle("sel", i === MEN.sel)); }
  else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); e.stopImmediatePropagation(); escolherMen(MEN.sel); }
  else if (e.key === "Escape") fecharMen();
}, true);
document.addEventListener("focusout", () => setTimeout(() => { if (!caixaMen.matches(":hover")) fecharMen(); }, 150));

const ICP = (p) => p.video ? "youtube" : (p.midias || []).some((m) => m.kind === "pdf") ? "pdf" : (p.midias || []).some((m) => m.kind === "foto") ? "imagem" : "feed";

function tituloDe(p) {
  if (p.video && p.video.titulo) return p.video.titulo;
  let t = String(p.texto || "").replace(/#[\p{L}\p{N}_]+/gu, "").split(/\n|(?<=[.!?:])\s/).map((x) => x.trim()).find(Boolean) || "";
  t = t.replace(/[.:]$/, "");
  if (t.length > 64) t = t.slice(0, 64).replace(/\s+\S*$/, "") + "…";
  return t || "Publicação";
}

/** foto: reduz para no máx. 1600 px e JPEG ~82% (GIF vai como está) — cabe folgado no banco */
async function comprimir(f, max = 1600) {
  if (f.type === "image/gif" && f.size < 2.8e6) return { blob: f, tipo: f.type };
  const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i);
    i.onerror = () => erro(new Error(/hei[cf]/i.test(f.type + f.name) ? `“${f.name}” está em HEIC (iPhone), que este navegador não abre. Envie em JPG/PNG (ou tire um print).` : `Não consegui abrir “${f.name}” como imagem.`)); i.src = URL.createObjectURL(f); });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
  return { blob, tipo: "image/jpeg", w, h };
}

/** cartaz do topo: rola sozinho a cada 7 s (para quando o mouse está em cima); setas, bolinhas e arrastar */

  const n = t.children.length, idx = () => Math.round(t.scrollLeft / Math.max(1, t.clientWidth));

  t.addEventListener("scroll", () => { const i = idx(); $$(".bill-pontos button").forEach((b, j) => b.classList.toggle("on", j === i)); }, { passive: true });
  $("#bill").addEventListener("click", (e) => {
    const s = e.target.closest("[data-bill]"); if (s) { ir(idx() + +s.dataset.bill); reiniciar(); }
    const p = e.target.closest("[data-bill-i]"); if (p) { ir(+p.dataset.billI); reiniciar(); }
  });
  let parado = false;
  $("#bill").addEventListener("mouseenter", () => (parado = true)); $("#bill").addEventListener("mouseleave", () => (parado = false));
  const reiniciar = () => { clearInterval(AP.giro); if (n > 1) AP.giro = setInterval(() => { if (!parado && !document.hidden && S.sub === "vitrine" && $("#billT")) ir(idx() + 1); }, 7000); };

    try {
      const r = await api(`/cursos/${C.id}/avaliacao`, { method: "POST", body: { respostas: resp } });

      if (r.aprovado) AP.certs = (await api("/certificados")).certificados;

        ${r.aprovado ? `<button type="button" class="btn" data-r="cert">${svg("trofeu")}Ver o certificado</button>` : `<button type="button" class="btn v" data-r="rever">${svg("livro")}Rever as aulas</button> <button type="button" class="btn" data-r="refazer">${svg("repetir")}Refazer</button>`}`;
      box.firstElementChild.prepend(res);
      if (r.gabarito) Object.entries(r.gabarito).forEach(([id, g]) => { const l = box.querySelectorAll(`.quiz-q[data-q="${CSS.escape(id)}"] label`)[g.certa]; l && l.classList.add("certa"); });
      box.querySelectorAll("#quizF input").forEach((x) => { x.disabled = true; });
      box.querySelector("#quizF .aula-pe").hidden = true;
      res.addEventListener("click", (ev) => {
        const k = ev.target.closest("[data-r]")?.dataset.r;

/** envia 1 arquivo (foto já comprimida no navegador). Com prazo: nada fica "enviando…" para sempre. */
async function subirArquivo(f, kind, max = 1600) {
  if (kind === "foto" && f.type && !f.type.startsWith("image/") && !/hei[cf]/i.test(f.name)) throw new Error(`“${f.name}” não é uma imagem.`);
  const corpo = kind === "foto" ? await comprimir(f, max) : { blob: f, tipo: "application/pdf" };
  if (kind === "pdf" && f.size > 15e6) throw new Error("PDF grande demais (máx. 15 MB).");
  const ctl = new AbortController(), prazo = setTimeout(() => ctl.abort(), 120000);
  let r;
  try {
    r = await fetch(`${API}/arquivos`, { method: "POST", credentials: "same-origin", body: corpo.blob, signal: ctl.signal,
      headers: { "Content-Type": corpo.tipo, "X-Nome": encodeURIComponent(f.name), ...(corpo.w ? { "X-Largura": String(corpo.w), "X-Altura": String(corpo.h) } : {}) } });
  } catch (e) { throw new Error(e.name === "AbortError" ? `O envio de “${f.name}” demorou demais. Tente de novo.` : "Sem conexão para enviar o arquivo."); }
  finally { clearTimeout(prazo); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || "Falha no envio");
  return d;
}
const ehPdf = (f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
/** arrastar e soltar arquivos em cima de `el` (mostra o véu "Solte aqui") */
function soltar(el, aoSoltar) {
  if (!el) return;
  let n = 0;
  const tem = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
  el.addEventListener("dragenter", (e) => { if (!tem(e)) return; e.preventDefault(); n++; el.classList.add("arrastando"); });
  el.addEventListener("dragover", (e) => { if (tem(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; } });
  el.addEventListener("dragleave", () => { if (--n <= 0) { n = 0; el.classList.remove("arrastando"); } });
  el.addEventListener("drop", (e) => { if (!tem(e)) return; e.preventDefault(); n = 0; el.classList.remove("arrastando"); const fs = [...e.dataTransfer.files]; if (fs.length) aoSoltar(fs); });
}

      if (!(await A.confirmar("Excluir este curso? Ele some da Aprendizagem e da base da IA (progresso e certificados ficam guardados).", { titulo: "Excluir curso", rotulo: "Excluir", perigo: true }))) return false;
      await api(`/cursos/${cid}`, { method: "DELETE" }); A.toast("Curso excluído."); telaAprender(); } }] : [],
    botoes: [{ rotulo: "Fechar" }, { rotulo: cid ? "Salvar curso" : "Criar e adicionar aulas", icone: "check", classe: "btn", principal: true, acao: () => salvar() }],
    aoFechar: () => { if (S.aba === "aprendizagem") telaAprender(); } });
  const box = md.el.querySelector("#edC");
  const cats = AP.categorias.map((c) => `<option value="${esc(c)}">`).join("");
  box.innerHTML = `<div class="ed-grade"><div>
      <div class="ed-sec"><h4>${svg("livro")}O curso</h4>
        <label class="campo">Título<input id="eTit" maxlength="140" value="${esc(C.titulo)}" placeholder="Ex.: Montagem do palete sem avaria"></label>
        <div class="lin2"><label class="campo">Categoria<input id="eCat" list="eCats" maxlength="60" value="${esc(C.categoria === "Geral" && !cid ? "" : C.categoria)}" placeholder="Ex.: Logística"><datalist id="eCats">${cats}</datalist></label>
          <label class="campo">Situação<select id="eSt">${[["rascunho", "Rascunho (só quem edita vê)"], ["publicado", "Publicado (todos veem)"], ["arquivado", "Arquivado"]].map(([v, r]) => `<option value="${v}" ${C.status === v ? "selected" : ""}>${r}</option>`).join("")}</select></label></div>
        <label class="campo">Descrição<textarea id="eDesc" rows="4" maxlength="4000" placeholder="Para que serve, para quem é, o que a pessoa vai saber fazer no fim">${esc(C.descricao || "")}</textarea></label>
        <label class="chk" style="margin:8px 0"><span class="chave"><input type="checkbox" id="eObr" ${C.obrigatorio ? "checked" : ""}><span class="trilho"></span></span>Obrigatório (aparece em destaque para todos)</label>
        <label class="chk"><span class="chave"><input type="checkbox" id="eBase" ${C.base !== false ? "checked" : ""}><span class="trilho"></span></span>As aulas entram na base de conhecimento da IA</label></div>
      <div class="ed-sec"><h4>${svg("imagem")}Capa</h4><div class="capa-ed" id="eCapa"></div><input type="file" id="eCapaF" class="arq-in" accept=".jpg,.jpeg,.png,.webp,.gif,.heic,.heif,.bmp">
        <small style="color:var(--txt3)">Sem foto, a capa é gerada automaticamente.</small></div>
    </div><div>
      <div class="ed-sec"><h4>${svg("lista")}Aulas ${cid ? `<button type="button" class="btn" id="eNovaAula">${svg("mais")}Aula</button>` : ""}</h4><div id="eAulas"></div></div>
      <div class="ed-sec"><h4>${svg("check")}Avaliação <small style="font-weight:500;color:var(--txt3)">(opcional · não vai para a IA)</small><button type="button" class="btn v" id="eNovaP">${svg("mais")}Pergunta</button></h4>
        <label class="campo" style="max-width:200px">Nota mínima (0–100)<input id="eNota" type="number" min="0" max="100" value="${Q.nota_min}"></label><div id="ePergs"></div></div>
    </div></div>`;
  const desCapa = () => {
    $("#eCapa", box).innerHTML = `${capa ? `<img src="${urlArq(capa)}" alt="">` : arte(cid || "novo", "livro")}<span class="bts"><button type="button" class="btn v p" id="eCapaB">${svg("imagem")}${capa ? "Trocar" : "Enviar foto"}</button>${capa ? `<button type="button" class="btn v p" id="eCapaX">${svg("fechar")}</button>` : ""}</span>`;
    $("#eCapaB", box).onclick = () => $("#eCapaF", box).click();
    $("#eCapaX", box)?.addEventListener("click", () => { capa = null; desCapa(); });
  };
  desCapa();
  const subirCapa = async (f) => { if (!f) return; try { A.toast("Enviando a capa…"); capa = (await subirArquivo(f, "foto")).id; desCapa(); } catch (err) { A.toast("⚠️ " + esc(err.message)); } };
  $("#eCapaF", box).onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; subirCapa(f); };
  soltar($("#eCapa", box), (fs) => subirCapa(fs.find((f) => !ehPdf(f))));
  const desAulas = () => {
    $("#eAulas", box).innerHTML = !cid ? `<small style="color:var(--txt3)">Crie o curso primeiro; depois as aulas são adicionadas aqui.</small>`
      : C.aulas.length ? C.aulas.map((a, k) => `<div class="aula-ed" data-k="${k}"><span class="n" style="font-weight:800;color:var(--txt3)">${k + 1}</span><span style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.titulo)}</b><small style="color:var(--txt3)">${ROT_T[a.tipo]}${a.minutos ? " · " + durTxt(a.minutos) : ""}${a.base === false ? " · fora da IA" : ""}</small></span>
        <span class="acs"><button type="button" class="btn-ic" data-ea="sobe" title="Subir" ${k ? "" : "disabled"}>↑</button><button type="button" class="btn-ic" data-ea="desce" title="Descer" ${k < C.aulas.length - 1 ? "" : "disabled"}>↓</button>
        <button type="button" class="btn-ic" data-ea="edit" title="Editar">${svg("lapis")}</button><button type="button" class="btn-ic" data-ea="del" title="Excluir">${svg("lixo")}</button></span></div>`).join("")
      : `<small style="color:var(--txt3)">Nenhuma aula ainda. Clique em “+ Aula”.</small>`;
  };
  desAulas();
  $("#eAulas", box).addEventListener("click", async (e) => {
    const b = e.target.closest("[data-ea]"); if (!b) return;
    const k = +b.closest("[data-k]").dataset.k, a = C.aulas[k];
    try {
      if (b.dataset.ea === "edit") return editorAula(cid, a, async () => { C = await api(`/cursos/${cid}`); desAulas(); });
      if (b.dataset.ea === "del") {
        if (!(await A.confirmar(`Excluir a aula “${esc(a.titulo)}”?`, { titulo: "Excluir aula", rotulo: "Excluir", perigo: true }))) return;
        await api(`/aulas/${a.id}`, { method: "DELETE" });
      } else {
        const ids = C.aulas.map((x) => x.id), j = b.dataset.ea === "sobe" ? k - 1 : k + 1;
        [ids[k], ids[j]] = [ids[j], ids[k]];
        await api(`/cursos/${cid}/ordem`, { method: "POST", body: { aulas: ids } });
      }
      C = await api(`/cursos/${cid}`); desAulas();
    } catch (err) { A.toast("⚠️ " + esc(err.message)); }
  });
  $("#eNovaAula", box)?.addEventListener("click", () => editorAula(cid, null, async () => { C = await api(`/cursos/${cid}`); desAulas(); }));
  const lerPergs = () => {
    $$(".perg-ed", box).forEach((el, k) => {
      const q = Q.perguntas[k]; q.texto = el.querySelector(".pt").value;
      q.opcoes = [...el.querySelectorAll(".po")].map((x) => x.value);
      const c = el.querySelector("input[type=radio]:checked"); q.correta = c ? +c.value : -1;
    });
  };
  const desPergs = () => {
    $("#ePergs", box).innerHTML = Q.perguntas.length ? Q.perguntas.map((q, k) => `<div class="perg-ed" data-k="${k}"><div style="display:flex;gap:8px;align-items:center"><b style="color:var(--txt3)">${k + 1}.</b>
        <input class="entrada pt" value="${esc(q.texto)}" placeholder="Enunciado da pergunta" maxlength="600"><button type="button" class="btn-ic" data-pq="del" title="Excluir pergunta">${svg("lixo")}</button></div>
        ${q.opcoes.map((o, j) => `<div class="op"><input type="radio" name="pc${k}" value="${j}" ${q.correta === j ? "checked" : ""} title="Esta é a certa"><input class="entrada po" value="${esc(o)}" placeholder="Alternativa ${j + 1}" maxlength="300">
          <button type="button" class="btn-ic" data-pq="delop" data-j="${j}" title="Tirar alternativa" ${q.opcoes.length > 2 ? "" : "disabled"}>${svg("fechar")}</button></div>`).join("")}
        ${q.opcoes.length < 6 ? `<button type="button" class="btn v p" style="margin-top:8px" data-pq="op">${svg("mais")}Alternativa</button>` : ""}<small style="display:block;margin-top:6px;color:var(--txt3)">Marque a bolinha da alternativa certa.</small></div>`).join("")
      : `<small style="color:var(--txt3)">Sem avaliação: o curso termina quando todas as aulas são concluídas.</small>`;
  };
  desPergs();
  $("#eNovaP", box).onclick = () => { lerPergs(); Q.perguntas.push({ texto: "", opcoes: ["", ""], correta: -1 }); desPergs(); $$(".perg-ed .pt", box).pop()?.focus(); };
  $("#ePergs", box).addEventListener("click", (e) => {
    const b = e.target.closest("[data-pq]"); if (!b) return;
    lerPergs();
    const k = +b.closest("[data-k]").dataset.k, q = Q.perguntas[k];
    if (b.dataset.pq === "del") Q.perguntas.splice(k, 1);
    else if (b.dataset.pq === "op") q.opcoes.push("");
    else if (b.dataset.pq === "delop") { const j = +b.dataset.j; q.opcoes.splice(j, 1); if (q.correta === j) q.correta = -1; else if (q.correta > j) q.correta--; }
    desPergs();
  });
  async function salvar() {
    lerPergs();
    const ruim = Q.perguntas.findIndex((q) => !q.texto.trim() || q.opcoes.filter((o) => o.trim()).length < 2 || q.correta < 0 || !String(q.opcoes[q.correta] || "").trim());
    if (ruim >= 0) { A.toast(`Pergunta ${ruim + 1}: escreva o enunciado, pelo menos 2 alternativas e marque a certa.`); return false; }
    const corpo = { titulo: $("#eTit", box).value, categoria: $("#eCat", box).value || "Geral", descricao: $("#eDesc", box).value, capa, obrigatorio: $("#eObr", box).checked,
      status: $("#eSt", box).value, base: $("#eBase", box).checked,
      quiz: { nota_min: +$("#eNota", box).value || 0, perguntas: Q.perguntas.map((q) => { const ops = q.opcoes.map((o, j) => [o.trim(), j]).filter(([o]) => o); return { texto: q.texto, opcoes: ops.map(([o]) => o), correta: ops.findIndex(([, j]) => j === q.correta) }; }) } };
    if (!corpo.titulo.trim()) { $("#eTit", box).focus(); A.toast("Dê um título ao curso."); return false; }
    try {
      const r = await api(cid ? `/cursos/${cid}` : "/cursos", { method: cid ? "PUT" : "POST", body: corpo });
      if (!cid) { A.toast("Curso criado como rascunho. Agora adicione as aulas."); md.fechar(); setTimeout(() => editorCurso(r.id), 380); return false; }
      A.toast(r.status === "publicado" ? "Curso salvo e publicado." : "Curso salvo.");
    } catch (err) { A.toast("⚠️ " + esc(err.message)); return false; }
  }
}
function editorAula(cid, a, depois) {
  const st = { tipo: (a && a.tipo) || "video", midias: [...((a && a.midias) || [])], enviando: 0 };
  const md = A.modal({ titulo: a ? "Editar aula" : "Nova aula", icone: "livro", cor: "#f0cb4e", largura: 860, html: `<div id="edA"></div>`,
    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Salvar aula", icone: "check", classe: "btn", principal: true, acao: () => salvar() }] });
  const box = md.el.querySelector("#edA");
  box.innerHTML = `<div class="seg-tipo">${Object.entries(ROT_T).map(([k, r]) => `<button type="button" data-t="${k}" class="${k === st.tipo ? "ativo" : ""}">${svg(ICT[k])}${r}</button>`).join("")}</div>
    <div class="lin2"><label class="campo">Título da aula<input id="aTit" maxlength="140" value="${esc((a && a.titulo) || "")}" placeholder="Ex.: Como posicionar o colchão"></label>
      <label class="campo">Duração (minutos)<input id="aMin" type="number" min="0" max="600" value="${(a && a.minutos) || ""}" placeholder="opcional"></label></div>
    <div id="aVid"><label class="campo">Link do vídeo no YouTube<input id="aUrl" value="${esc((a && a.video && a.video.url) || "")}" placeholder="https://youtu.be/…"></label>
      <label class="campo">Descrição / transcrição do vídeo (é o que a IA lê)<textarea id="aTr" rows="4">${esc((a && a.transcricao) || "")}</textarea></label></div>
    <label class="campo">Conteúdo / texto da aula<textarea id="aTx" rows="8" placeholder="Escreva o passo a passo, as regras, os cuidados…">${esc((a && a.texto) || "")}</textarea></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0"><button type="button" class="btn v" id="aFoto">${svg("imagem")}Fotos</button><button type="button" class="btn v" id="aPdf">${svg("pdf")}PDF</button>
      <label class="chk" style="margin-left:auto"><span class="chave"><input type="checkbox" id="aBase" ${!a || a.base !== false ? "checked" : ""}><span class="trilho"></span></span>Entra na base da IA</label></div>
    <div class="anexos" id="aAnx"></div><input type="file" id="aFF" class="arq-in" accept=".jpg,.jpeg,.png,.webp,.gif,.heic,.heif,.bmp" multiple><input type="file" id="aPF" class="arq-in" accept="application/pdf,.pdf" multiple>`;
  const tipo = () => { $$(".seg-tipo button", box).forEach((b) => b.classList.toggle("ativo", b.dataset.t === st.tipo)); $("#aVid", box).hidden = st.tipo !== "video"; };
  tipo();
  $(".seg-tipo", box).onclick = (e) => { const b = e.target.closest("[data-t]"); if (b) { st.tipo = b.dataset.t; tipo(); } };
  const anexos = () => { $("#aAnx", box).innerHTML = st.midias.map((m, i) => `<div class="anexo ${m._envio ? "envio" : ""}">${m.kind === "foto" ? `<img src="${m._prev || urlArq(m.id)}" alt="">` : `<span class="pdf">PDF</span>`}<span>${esc(m.nome)}<small>${m.tam ? tam(m.tam) : ""}${m.paginas ? " · " + m.paginas + " pág." : ""}</small></span><button type="button" class="x" data-i="${i}">${svg("fechar")}</button></div>`).join(""); };
  anexos();
  $("#aAnx", box).onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) { st.midias.splice(+b.dataset.i, 1); anexos(); } };
  const enviar = async (fs, kind) => {
    for (const f of fs) {
      const tmp = { kind, nome: f.name, tam: f.size, _envio: true, _prev: kind === "foto" ? URL.createObjectURL(f) : "" };
      st.midias.push(tmp); st.enviando++; anexos();
      try { const d = await subirArquivo(f, kind); Object.assign(tmp, d, { _envio: false }); if (kind === "pdf" && !d.tem_texto) A.toast(`“${esc(f.name)}” parece escaneado: a IA não consegue ler o texto dele.`); }
      catch (err) { st.midias.splice(st.midias.indexOf(tmp), 1); A.toast("⚠️ " + esc(err.message)); }
      st.enviando--; anexos();
    }
  };
  $("#aFoto", box).onclick = () => $("#aFF", box).click(); $("#aPdf", box).onclick = () => $("#aPF", box).click();
  $("#aFF", box).onchange = (e) => { enviar([...e.target.files], "foto"); e.target.value = ""; };
  $("#aPF", box).onchange = (e) => { enviar([...e.target.files], "pdf"); e.target.value = ""; };
  soltar(box, (fs) => { const p = fs.filter(ehPdf), ft = fs.filter((f) => !ehPdf(f)); if (ft.length) enviar(ft, "foto"); if (p.length) enviar(p, "pdf"); });
  async function salvar() {
    if (st.enviando) { A.toast("Espere os anexos terminarem de enviar."); return false; }
    const corpo = { titulo: $("#aTit", box).value, tipo: st.tipo, texto: $("#aTx", box).value, video_url: st.tipo === "video" ? $("#aUrl", box).value.trim() : "",
      transcricao: st.tipo === "video" ? $("#aTr", box).value : "", midias: st.midias.map((m) => m.id), minutos: +$("#aMin", box).value || 0, base: $("#aBase", box).checked };
    try { await api(a ? `/aulas/${a.id}` : `/cursos/${cid}/aulas`, { method: a ? "PUT" : "POST", body: corpo }); A.toast("Aula salva."); depois && depois(); }
    catch (err) { A.toast("⚠️ " + esc(err.message)); return false; }
  }
}

/* ═════════ início ═════════ */
$("#btAtualizar").addEventListener("click", async () => { await carregarGente(); irSub(S.sub); });
(async () => {
  try { S.eu = await api("/me"); }
  catch (e) {
    $("#main").innerHTML = `<div class="cont"><div class="vazio vidro">${svg("cadeado")}<b>${e.status === 403 ? "Sem acesso ao WEDUCA" : "WEDUCA indisponível"}</b>${esc(e.message)}${e.status === 403 ? "<br>Peça ao administrador em Configurações → Usuários." : ""}</div></div>`;
    return;
  }
  await carregarGente();
  const s = new URLSearchParams(location.search).get("s");
  S.aba = s === "aprendizagem" || (!s && /curso=|aula=/.test(location.hash)) ? "aprendizagem" : s === "feed" ? "feed" : lsGet("wd.weduca.aba", "feed");
  if (!SECOES.some((x) => x[0] === S.aba && x[4])) S.aba = "feed";
  irSub("");
  lerHash();
})();
})();
</script>
