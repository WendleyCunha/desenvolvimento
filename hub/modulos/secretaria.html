function fVisita(c) {
  const cfg = S.b.config, hoje = S.b.mes_atual;
  const ultimoFechado = S.b.fechados.length ? S.b.fechados[S.b.fechados.length - 1] : somar(hoje, -1);
  const deP = cfg.visita_ultima ? cfg.visita_ultima.slice(0, 7) : somar(ultimoFechado, -5);
  S.visDe = S.visDe || deP; S.visAte = S.visAte || ultimoFechado;
  const pastas = cfg.pastas || [];
  const tam = S.anexos.reduce((s, a) => s + a.tamanho, 0);
  c.innerHTML = `
  <div class="cartoes">
    <div class="cartao"><h3>${A.orbe("calendario", "var(--ouro)", "p")} Período e opções</h3>
      <div class="g2"><label class="campo">De<input type="month" id="vDe" value="${S.visDe}"></label><label class="campo">Até<input type="month" id="vAte" value="${S.visAte}" max="${hoje}"></label></div>
      <label class="campo">Nome da pasta<input id="vTit" value="${esc(S.visTit || "VISITA " + new Date().toLocaleDateString("pt-BR").replace(/\//g, " "))}"></label>
      <label class="chk"><input type="checkbox" id="vGrupo"${S.visGrupo ? " checked" : ""}> Também separar os cartões por grupo de campo</label>
      <label class="chk"><input type="checkbox" id="vMarca" checked> Marcar hoje como data da última visita</label>
      <p class="dica">O ZIP traz: <b>Registros AAAA</b> (Publicadores, Pioneiros e Inativos — um S-21 por pessoa, no formulário oficial), os cartões de totais (PUBLICADORES, PIONEIROS REGULARES e AUXILIARES), o S-88, o resumo dos fechamentos mensais, as suas <b>pastas personalizadas</b> e a pasta <b>Contas</b> com os anexos.</p>
      ${S.b.triagem.length ? `<div class="aviso mal">${S.b.triagem.length} relatório(s) na triagem não entram nos cartões.</div>` : ""}
    </div>
    <div class="cartao"><h3>${A.orbe("pasta", "var(--ciano)", "p")} Contas e documentos (anexos)</h3>
      <div class="solta" id="solta">Arraste aqui a pasta das contas (S-26, S-30, extratos, cartas) e os documentos da visita<br>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap"><button type="button" class="btn v p" id="btArq">${svg("documento")} Escolher arquivos</button><button type="button" class="btn v p" id="btPasta">${svg("pasta")} Escolher pasta</button></div>
        ${S.anexos.length ? `<div class="arqs">${S.anexos.map((a, i) => `<div><span>${esc(a.caminho)}</span><span>${(a.tamanho / 1024).toFixed(0)} KB <button type="button" class="btn-ic p" data-tira="${i}" style="width:20px;height:20px">${svg("fechar")}</button></span></div>`).join("")}</div><p class="dica">${S.anexos.length} arquivo(s) · ${(tam / 1048576).toFixed(1)} MB · entram em <b>Contas/</b> mantendo as subpastas</p>` : ""}
      </div>
      <p class="dica">Os anexos não ficam guardados no sistema (sem custo de armazenamento) — só entram no ZIP.</p>
    </div>
    <div class="cartao"><h3>${A.orbe("pasta", "var(--violeta)", "p")} Pastas personalizadas</h3>
      <p>Monte pastas do seu jeito (ex.: <b>Dianteira/Família Silva</b>) e escolha quem entra. Os cartões dessas pessoas são copiados para lá.</p>
      ${pastas.length ? pastas.map((p, i) => `<div class="pasta-linha">${svg("pasta")}<b>${esc(p.caminho)}</b><span class="mini">${(p.membros || []).length} pessoa(s)</span>${pode("ajustes") ? `<button type="button" class="btn-ic p" data-edpasta="${i}">${svg("lapis")}</button><button type="button" class="btn-ic p" data-delpasta="${i}">${svg("lixo")}</button>` : ""}</div>`).join("") : `<p class="dica">Nenhuma pasta ainda.</p>`}
      ${pode("ajustes") ? `<button type="button" class="btn v p" id="btNovaPasta">${svg("mais")} Nova pasta</button>` : ""}
    </div>
    <div class="cartao"><h3>${A.orbe("baixar", "var(--verde)", "p")} Gerar</h3>
      <p>Confira o período e gere o arquivo. Pode levar alguns segundos (um PDF por pessoa).</p>
      ${pode("exportar") ? `<button type="button" class="btn" id="btZip">${svg("caixaZip")} Gerar ZIP da visita</button>` : `<p class="dica">Sem permissão para exportar.</p>`}
      <div class="sec">Cartões avulsos</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${pode("exportar") ? [["publicadores", "Publicadores"], ["auxiliares", "Auxiliares"], ["regulares", "Regulares"]].map(([k, t]) => `<button type="button" class="btn v p" data-tot="${k}">${svg("baixar")} ${t} ${anoServico(S.visAte)}</button>`).join("") : ""}</div>
    </div>
  </div>`;
  const lerOpc = () => { S.visDe = $("#vDe").value; S.visAte = $("#vAte").value; S.visTit = $("#vTit").value; S.visGrupo = $("#vGrupo").checked; };
  ["vDe", "vAte", "vTit", "vGrupo"].forEach((k) => ($("#" + k).onchange = lerOpc));
  const addArquivos = async (files, base) => {
    for (const f of files) {
      if (f.size > 25 * 1048576) { A.toast("Arquivo grande demais (máx. 25 MB): " + esc(f.name)); continue; }
      const caminho = (base || "") + (f.webkitRelativePath || f._caminho || f.name);
      S.anexos.push({ caminho, tamanho: f.size, arquivo: f });
    }
    fVisita(c);
  };
  $("#btArq").onclick = () => { const i = $("#arqAnexos"); i.value = ""; i.onchange = () => addArquivos([...i.files]); i.click(); };
  $("#btPasta").onclick = () => { const i = $("#arqPasta"); i.value = ""; i.onchange = () => addArquivos([...i.files]); i.click(); };
  const solta = $("#solta");
  solta.ondragover = (e) => { e.preventDefault(); solta.classList.add("sobre"); };
  solta.ondragleave = () => solta.classList.remove("sobre");
  solta.ondrop = async (e) => {
    e.preventDefault(); solta.classList.remove("sobre");
    const itens = [...(e.dataTransfer.items || [])].map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
    if (!itens.length) return addArquivos([...e.dataTransfer.files]);
    const arquivos = [];
    const ler = (ent, pref) => new Promise((res) => {
      if (ent.isFile) ent.file((f) => { f._caminho = pref + f.name; arquivos.push(f); res(); }, () => res());
      else { const rd = ent.createReader(); const todos = []; const lote = () => rd.readEntries(async (es) => { if (!es.length) { for (const x of todos) await ler(x, pref + ent.name + "/"); res(); } else { todos.push(...es); lote(); } }, () => res()); lote(); }
    });
    for (const ent of itens) await ler(ent, "");
    addArquivos(arquivos);
  };
  c.querySelectorAll("[data-tira]").forEach((x) => (x.onclick = (e) => { e.stopPropagation(); S.anexos.splice(+x.dataset.tira, 1); fVisita(c); }));
  const salvarPastas = async (lista) => { try { await chamar("/config", { method: "PUT", body: { pastas: lista } }); await carregar(); } catch (e) { falha(e); } };
  const editarPasta = (i) => {
    const p = i >= 0 ? pastas[i] : { caminho: "Dianteira/", membros: [] }, sel = new Set(p.membros || []);
    const md = A.modal({ titulo: i >= 0 ? "Editar pasta" : "Nova pasta", icone: "pasta", largura: 560,
      html: `<label class="campo">Caminho da pasta (use / para subpastas)<input id="pC" value="${esc(p.caminho)}"></label>
        <input class="entrada" id="pBusca" placeholder="Buscar nome…" style="margin-top:12px">
        <div class="escolha" id="pLista">${S.b.membros.filter((x) => x.situacao !== "fora").sort((a, b) => norm(a.nome_oficial).localeCompare(norm(b.nome_oficial))).map((x) => `<label data-n="${esc(norm(x.nome_oficial))}"><input type="checkbox" value="${esc(x.id)}"${sel.has(x.id) ? " checked" : ""}> ${esc(x.nome_oficial)}${x.grupo ? ` <span class="mini">${esc(grupoNome(x.grupo))}</span>` : ""}</label>`).join("")}</div>`,
      botoes: [{ rotulo: "Cancelar" }, { rotulo: "Salvar pasta", principal: true, acao: () => {
        const caminho = $("#pC").value.trim().replace(/^\/+|\/+$/g, "");
        if (!caminho) { A.toast("Dê um nome à pasta."); return false; }
        const nova = { caminho, membros: [...md.el.querySelectorAll("#pLista input:checked")].map((x) => x.value) };
        const lista = pastas.slice(); if (i >= 0) lista[i] = nova; else lista.push(nova);
        salvarPastas(lista);
      } }] });
    $("#pBusca").oninput = (e) => { const q = norm(e.target.value); md.el.querySelectorAll("#pLista label").forEach((l) => (l.style.display = l.dataset.n.includes(q) ? "" : "none")); };
  };
  const np = $("#btNovaPasta"); if (np) np.onclick = () => editarPasta(-1);
  c.querySelectorAll("[data-edpasta]").forEach((x) => (x.onclick = () => editarPasta(+x.dataset.edpasta)));
  c.querySelectorAll("[data-delpasta]").forEach((x) => (x.onclick = async () => { if (await A.confirmar("Apagar esta pasta? (os cadastros não mudam)", { perigo: true, rotulo: "Apagar" })) salvarPastas(pastas.filter((_, i) => i !== +x.dataset.delpasta)); }));
  c.querySelectorAll("[data-tot]").forEach((x) => (x.onclick = () => baixar(`${API}/pdf/total/${x.dataset.tot}?ano=${anoServico(S.visAte)}`, `${x.textContent.trim()}.pdf`)));
  const bz = $("#btZip");
  if (bz) bz.onclick = async () => {
    lerOpc();
    if (!S.visDe || !S.visAte || S.visDe > S.visAte) { A.toast("Confira o período."); return; }
    bz.disabled = true;
    try {
      const anexos = [];
      for (const a of S.anexos) {
        const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = rej; fr.readAsDataURL(a.arquivo); });
        anexos.push({ caminho: a.caminho, base64: b64 });
      }
      const titulo = S.visTit || "VISITA";
      await baixar(`${API}/visita/zip`, titulo + ".zip", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ de: S.visDe, ate: S.visAte, titulo, por_grupo: S.visGrupo, marcar_visita: $("#vMarca").checked, anexos }) });
      if ($("#vMarca")?.checked) carregar().catch(() => {});
    } catch (e) { falha(e); }
    finally { bz.disabled = false; }
  };
}

  c.querySelectorAll("[data-copiar]").forEach((x) => (x.onclick = () => copiar(x.dataset.copiar)));
  c.querySelectorAll("[data-m]").forEach((x) => (x.onclick = () => fichaMembro(x.dataset.m)));
  c.querySelectorAll("[data-ano]").forEach((x) => (x.onclick = () => { S.anoAnual = +x.dataset.ano; S.anual = null; fAnual(c); }));
  const bt = $("#btTerr");
  if (bt) bt.onclick = async () => { try { await chamar("/config", { method: "PUT", body: { territorios_total: +$("#tTot").value || 0, territorios_nao_trabalhados: +$("#tNao").value || 0 } }); S.anual = null; await carregar(); ok("Salvo."); } catch (e) { falha(e); } };
}

/* ══════════════════════════════════════════════════════════════════════════
   📖 IT — Instruções Teocráticas (referências do secretário)
   ══════════════════════════════════════════════════════════════════════════ */
function secIT(m) {
  const its = S.b.config.its || [], ed = pode("ajustes");
  const q = norm(S.buscaIT || "");
  const lista = its.map((x, i) => ({ ...x, i })).filter((x) => !q || norm(x.titulo + " " + x.ref + " " + (x.nota || "")).includes(q));
  m.innerHTML = `
  <section class="heroi vidro vidro-borda-viva"><div class="h-top"><div><h1>IT — Instruções Teocráticas</h1><p>Referências que o secretário consulta para tomar decisões (capítulo:parágrafo)</p></div>
    <div class="dir">${ed ? `<button type="button" class="btn" id="btNovaIT">${svg("mais")} Nova referência</button>` : ""}</div></div></section>
  <section class="painel vidro">
    <div class="barra-ferr"><input class="entrada" id="buscaIT" placeholder="Buscar assunto…" value="${esc(S.buscaIT || "")}"></div>
    ${lista.map((x) => `<div class="it"><span class="ref">${esc(x.ref)}</span><span class="t">${esc(x.titulo)}${x.nota ? `<small>${esc(x.nota)}</small>` : ""}</span>
      <span>${ed ? `<button type="button" class="btn-ic p" data-edit="${x.i}">${svg("lapis")}</button>` : ""}</span></div>`).join("") || `<div class="vazio"><b>Nada encontrado</b></div>`}
  </section>`;
  $("#buscaIT").oninput = (e) => { S.buscaIT = e.target.value; const pos = e.target.selectionStart; secIT(m); const i = $("#buscaIT"); i.focus(); i.setSelectionRange(pos, pos); };
  const salvar = async (lista) => { try { await chamar("/config", { method: "PUT", body: { its: lista } }); await carregar(); } catch (e) { falha(e); } };
  const editar = (i) => {
    const x = i >= 0 ? its[i] : { titulo: "", ref: "", nota: "" };
    A.modal({ titulo: i >= 0 ? "Editar referência" : "Nova referência", icone: "livro", largura: 520,
      html: `<div class="g2"><label class="campo">Referência<input id="iR" value="${esc(x.ref)}" placeholder="17:13-15"></label><label class="campo">Assunto<input id="iT" value="${esc(x.titulo)}"></label></div>
        <label class="campo" style="margin-top:10px">Anotação (resumo, como aplicar)<textarea id="iN">${esc(x.nota || "")}</textarea></label>`,
      esquerda: i >= 0 ? [{ rotulo: "Excluir", classe: "btn perigo", icone: "lixo", acao: () => salvar(its.filter((_, k) => k !== i)) }] : [],
      botoes: [{ rotulo: "Cancelar" }, { rotulo: "Salvar", principal: true, acao: () => {
        const n = { ref: $("#iR").value.trim(), titulo: $("#iT").value.trim(), nota: $("#iN").value.trim() };
        if (!n.titulo) { A.toast("Informe o assunto."); return false; }
        const l = its.slice(); if (i >= 0) l[i] = n; else l.push(n); salvar(l);
      } }] });
  };
  const bn = $("#btNovaIT"); if (bn) bn.onclick = () => editar(-1);
  m.querySelectorAll("[data-edit]").forEach((x) => (x.onclick = () => editar(+x.dataset.edit)));
}

/* ══════════════════════════════════════════════════════════════════════════
   ⚙️ AJUSTES
   ══════════════════════════════════════════════════════════════════════════ */
function secAjustes(m) {
  const cfg = S.b.config, ed = pode("ajustes"), dis = ed ? "" : " disabled", sy = S.b.sync;
  const diaSel = (id, v) => `<select id="${id}"${dis}><option value="-1">Não definido</option>${DIAS.map((d, i) => `<option value="${i}"${+v === i ? " selected" : ""}>${d}</option>`).join("")}</select>`;
  m.innerHTML = `
  <section class="heroi vidro vidro-borda-viva"><div class="h-top"><div><h1>Ajustes</h1><p>Regras, grupos e manutenção dos dados</p></div></div></section>
  <div class="cartoes">
    <div class="cartao"><h3>${A.orbe("regua", "var(--ouro)", "p")} Regras do mês</h3>
      <div class="g2"><label class="campo">Horas para virar pioneiro auxiliar<input type="number" min="1" max="100" id="aLim" value="${cfg.limite_aux}"${dis}></label>
      <label class="campo">Dia de corte do relatório<input type="number" min="1" max="28" id="aCorte" value="${cfg.corte_dia}"${dis}></label></div>
      <p class="dica">Quem <b>não é pioneiro regular</b> e relatou ${cfg.limite_aux}h ou mais conta como <b>pioneiro auxiliar</b> no mês. Relatório enviado do dia 1 ao dia ${cfg.corte_dia} vale para o mês anterior.</p>
      <label class="campo">Meta anual de horas do pioneiro regular<input type="number" min="1" max="2000" id="aMeta" value="${cfg.meta_regular || 600}"${dis}></label>
      <div class="g2"><label class="campo">Reunião do meio de semana${diaSel("aMeio", cfg.dia_meio)}</label><label class="campo">Reunião do fim de semana${diaSel("aFim", cfg.dia_fim)}</label></div>
      ${ed ? `<button type="button" class="btn p" id="btRegras">Salvar regras</button>` : ""}
    </div>
    <div class="cartao"><h3>${A.orbe("usuarios", "var(--azul)", "p")} Grupos de campo</h3>
      <div id="gLista">${(cfg.grupos || []).map((g, i) => `<div class="g2" style="margin-bottom:6px;grid-template-columns:1fr 1fr auto"><input class="entrada" data-gn="${i}" value="${esc(g.nome)}" placeholder="Nome do grupo"${dis}><input class="entrada" data-gd="${i}" value="${esc(g.dirigente || "")}" placeholder="Superintendente"${dis}>${ed ? `<button type="button" class="btn-ic" data-gx="${i}">${svg("lixo")}</button>` : ""}</div>`).join("") || `<p class="dica">Nenhum grupo cadastrado.</p>`}</div>
      ${ed ? `<div style="display:flex;gap:8px"><button type="button" class="btn v p" id="gAdd">${svg("mais")} Grupo</button><button type="button" class="btn p" id="gSalvar">Salvar grupos</button></div>` : ""}
      <p class="dica">Depois, escolha o grupo de cada pessoa em Membros. O ZIP da visita pode separar os cartões por grupo.</p>
    </div>
    <div class="cartao"><h3>${A.orbe("repetir", "var(--rosa)", "p")} Corrigir rótulos de mês no banco</h3>
      <p>O formulário público grava setembro–dezembro com o <b>ano civil</b> (“SETEMBRO 2026”), e o Streamlit espera o <b>ano de serviço</b> (“SETEMBRO 2027”). Aqui no hub isso já é resolvido pela data de envio; esta correção ajusta também no banco, para o Streamlit mostrar certo.</p>
      <p><b>${S.b.rotulos_errados}</b> relatório(s) com rótulo a corrigir.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn v p" id="btVerRot">Ver a lista</button>${ed && S.b.rotulos_errados ? `<button type="button" class="btn p" id="btAplRot">Corrigir agora</button>` : ""}</div>
    </div>
    <div class="cartao"><h3>${A.orbe("raio", "var(--verde)", "p")} Sincronização</h3>
      <p>O hub guarda os dados em memória para não gastar a cota grátis do banco. Relatórios novos do formulário aparecem em até 1 min; o mês atual é relido a cada 10 min; tudo é relido a cada 6 h.</p>
      <table class="tabela"><tbody><tr><td>Última leitura completa</td><td>${sy.completa ? new Date(sy.completa * 1000).toLocaleString("pt-BR") : "—"}</td></tr>
        <tr><td>Relatórios em memória</td><td>${sy.total_relatorios}</td></tr><tr><td>Leituras desde que o servidor ligou</td><td>${sy.leituras}</td></tr></tbody></table>
      ${ed ? `<button type="button" class="btn v p" id="btRecarregar">${svg("repetir")} Recarregar tudo agora</button>` : ""}
    </div>
  </div>`;
  const br = $("#btRegras");
  if (br) br.onclick = async () => { try { await chamar("/config", { method: "PUT", body: { limite_aux: +$("#aLim").value, corte_dia: +$("#aCorte").value, meta_regular: +$("#aMeta").value || 600, dia_meio: +$("#aMeio").value, dia_fim: +$("#aFim").value } }); S.assist = null; await carregar(); ok("Regras salvas."); } catch (e) { falha(e); } };
  let grupos = (cfg.grupos || []).map((g) => ({ ...g }));
  const lerG = () => { grupos = grupos.map((g, i) => ({ ...g, nome: m.querySelector(`[data-gn="${i}"]`)?.value ?? g.nome, dirigente: m.querySelector(`[data-gd="${i}"]`)?.value ?? g.dirigente })); };
  const ga = $("#gAdd");
  if (ga) ga.onclick = () => { lerG(); grupos.push({ nome: "", dirigente: "" }); S.b.config.grupos = grupos; secAjustes(m); };
  m.querySelectorAll("[data-gx]").forEach((x) => (x.onclick = () => { lerG(); grupos.splice(+x.dataset.gx, 1); S.b.config.grupos = grupos; secAjustes(m); }));
  const gs = $("#gSalvar");
  if (gs) gs.onclick = async () => { lerG(); try { await chamar("/config", { method: "PUT", body: { grupos } }); await carregar(); ok("Grupos salvos."); } catch (e) { falha(e); } };
  $("#btVerRot").onclick = async () => {
    try {
      const r = await chamar("/relatorios/corrigir-rotulos", { method: "POST", body: { aplicar: false } }, "conferindo…");
      A.modal({ titulo: "Rótulos a corrigir", icone: "repetir", largura: 720,
        html: r.lista.length ? `<div class="rolar"><table class="hist"><thead><tr><th>Nome enviado</th><th>Enviado</th><th>Está</th><th>Fica</th><th>Mês real</th></tr></thead><tbody>${r.lista.map((x) => `<tr><td>${esc(x.nome)}</td><td>${esc((x.data || "").split("-").reverse().join("/"))}</td><td>${esc(x.de)}</td><td>${esc(x.para)}</td><td>${esc(x.mes)}</td></tr>`).join("")}</tbody></table></div>` : "<p>Nenhum rótulo a corrigir. 🎉</p>",
        botoes: [{ rotulo: "Fechar" }] });
    } catch (e) { falha(e); }
  };
  const ar = $("#btAplRot");
  if (ar) ar.onclick = async () => {
    if (!(await A.confirmar(`Corrigir o rótulo de <b>${S.b.rotulos_errados}</b> relatório(s) no banco? Só o campo do mês muda (o valor antigo fica guardado em “rotulo_corrigido_de”).`, { rotulo: "Corrigir" }))) return;
    try { const r = await chamar("/relatorios/corrigir-rotulos", { method: "POST", body: { aplicar: true } }, "corrigindo…"); ok(`${r.corrigidos} rótulo(s) corrigido(s).`); await carregar(); } catch (e) { falha(e); }
  };
  const rc = $("#btRecarregar"); if (rc) rc.onclick = () => carregar(true).catch(falha);
}

/* ══════ INÍCIO ══════ */
$("#btAtualizar").innerHTML = svg("repetir");
$("#btAtualizar").onclick = () => { S.assist = null; S.anual = null; carregar().catch(falha); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.b) carregar().catch(() => {}); });
carregar().catch((e) => {
  $("#main").innerHTML = `<div class="vazio">${svg("atencao")}<b>Não foi possível carregar</b>${esc(e.message)}</div>`;
});
})();
</script>
</body>
</html>
