<!--
═══════════════════════════════════════════════════════════════════════════════
 passagens.html — PASSAGENS (VGP) · módulo do hub Wendley Desenvolvimento
───────────────────────────────────────────────────────────────────────────────
 Mesmo controle do mod_passagens.py (Parque Aliança / Streamlit), no visual
 Aurora Glass, lendo e gravando OS MESMOS DADOS no Firestore
 (eventos / passageiros / cadastro_geral) — o que é feito aqui aparece lá e
 vice-versa. API: /api/passagens (hub/passagens.py), permissões no servidor.
   • Reservas & Pagamentos: nova reserva com busca no cadastro central,
     receber/estornar, troco, pendentes com total em aberto
   • Chamada de Embarque: por dia (ônibus de cada um) ou geral, por grupo,
     busca rápida, quem não pagou marcado — Excel com uma aba por dia
   • Ajustes: novo evento, valores, +ônibus, arquivar, exportar, importar planilha
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1500px;margin:0 auto}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 14px;border-radius:20px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.marca b{display:block;font:700 1.08rem var(--titulo);letter-spacing:-.01em}
.marca small{display:block;font-size:.6rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.topo select.entrada{width:auto;min-width:200px;max-width:340px;padding:9px 12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro);box-shadow:0 0 8px var(--ouro);animation:aurRespira 1s infinite}
.sync.erro i{background:var(--rosa);box-shadow:0 0 8px var(--rosa)}
main{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.88),rgba(8,10,16,.82))}

/* ── herói do evento ── */
.heroi{position:relative;border-radius:26px;padding:22px 22px 20px;overflow:hidden}
.heroi::before{content:"";position:absolute;inset:-40% -10% auto auto;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(96,165,250,.22),transparent 65%);pointer-events:none}
.h-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;position:relative}
.h-top h1{margin:0;font:700 1.55rem/1.15 var(--titulo);letter-spacing:-.02em}
.h-top p{margin:5px 0 0;color:var(--txt2);font-size:.82rem}
.h-top .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px;position:relative}
.kpi{position:relative;padding:13px 14px;border-radius:15px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);transition:.25s;--c:var(--azul)}
.kpi:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 26px -10px var(--c);transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%)}
.kpi small{display:block;font-size:.62rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.45rem/1.1 var(--titulo);margin-top:8px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:4px}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:.64rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--vidro-borda),transparent)}
.frotas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;position:relative}
.frota{padding:11px 13px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);--c:var(--verde)}
.frota .l1{display:flex;justify-content:space-between;align-items:baseline;font-size:.74rem;font-weight:650}
.frota .l1 em{font-style:normal;color:var(--txt3);font-size:.68rem}
.barra{height:7px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0 6px}
.barra i{display:block;height:100%;border-radius:5px;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .8s var(--suave)}
.frota small{font-size:.66rem;color:var(--txt3)}
.frota.lotado{border-color:rgba(251,113,133,.4)}
.frota-add{display:grid;place-items:center;gap:4px;padding:11px;border-radius:14px;border:1px dashed rgba(var(--ouro-rgb),.4);color:var(--ouro2);font-size:.74rem;font-weight:600;background:rgba(var(--ouro-rgb),.04);transition:.2s;text-align:center}
.frota-add:hover{background:rgba(var(--ouro-rgb),.1);box-shadow:0 0 22px -8px rgba(var(--ouro-rgb),.8)}
.frota-add.alerta{border-color:rgba(251,113,133,.6);color:#fda4af;background:rgba(251,113,133,.06);animation:aurRespira 2s infinite}

/* ── abas e painéis ── */
.abas{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.painel{border-radius:24px;padding:18px}
.barra-ferr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.barra-ferr .entrada{max-width:300px}
.barra-ferr .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px}
.pax{--c:var(--verde);position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:11px 12px;border-radius:15px;
  background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);cursor:pointer;text-align:left;transition:background .2s,border-color .2s,transform .25s var(--mola),box-shadow .25s}
.pax::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.pax:hover{background:rgba(255,255,255,.06);border-color:color-mix(in srgb,var(--c) 40%,transparent);transform:translateY(-1px);box-shadow:0 10px 26px -16px var(--c)}
.pax.pend{--c:var(--rosa)}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:700 .78rem var(--titulo);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pax b{display:block;font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pax .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:7px;font-size:.64rem;font-weight:650;color:var(--txt2);background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda)}
.mini.bus{color:#bfdbfe;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08)}
.mini.pend{color:#fecdd3;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.1)}
.mini.ok{color:#bbf7d0;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.1)}
.valor{text-align:right;font:700 .9rem var(--titulo);color:var(--c);white-space:nowrap}
.valor small{display:block;font:500 .64rem var(--sans);color:var(--txt3);margin-top:2px}
.rodape-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:12px 16px;border-radius:14px;font-size:.84rem;
  background:rgba(var(--ouro-rgb),.07);border:1px solid rgba(var(--ouro-rgb),.3)}
.rodape-total b{font:700 1.05rem var(--titulo);color:var(--ouro2)}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--txt3);font-size:.84rem;padding:34px 10px}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}

/* ── chamada ── */
.ch-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.grupo{border-radius:18px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.025);border:1px solid var(--vidro-borda)}
.grupo-cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.grupo-cab b{font:700 .92rem var(--titulo);letter-spacing:.5px;text-transform:uppercase}
.grupo-cab .barra{flex:1;max-width:220px;margin:0}
.grupo-cab span{font-size:.74rem;color:var(--txt3)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col h4{margin:0 0 8px;font-size:.64rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--c)}
.linha{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:11px;margin-bottom:5px;background:rgba(255,255,255,.03);border:1px solid transparent;transition:.2s}
.linha:hover{border-color:var(--vidro-borda-forte);background:rgba(255,255,255,.05)}
.linha .n{flex:1;min-width:0;font-size:.86rem;font-weight:500}
.linha .n .meta{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
.linha.feito .n>span:first-child{text-decoration:line-through;color:var(--txt3)}
.bt-emb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--verde);color:var(--verde);transition:.25s var(--mola);flex:none}
.bt-emb:hover{background:var(--verde);color:#06120c;box-shadow:0 0 18px -2px var(--verde);transform:scale(1.08)}
.bt-emb.volta{border-color:var(--txt3);color:var(--txt3)}
.bt-emb.volta:hover{background:var(--txt3);color:#0b0b0d;box-shadow:none}
.bt-emb svg.i{width:16px;height:16px;stroke-width:2.6}
.bt-emb:disabled{opacity:.3;pointer-events:none}

/* ── ajustes ── */
.ajustes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.cartao{border-radius:20px;padding:16px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:12px}
.cartao h3{margin:0;display:flex;align-items:center;gap:10px;font:700 .98rem var(--titulo)}
.cartao p{margin:0;font-size:.8rem;color:var(--txt2);line-height:1.55}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dias{display:flex;gap:6px;flex-wrap:wrap}

/* ── modais ── */
.mets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.viagem{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:8px}
.viagem select{padding:8px 10px}
.viagem select:disabled{opacity:.35}
.sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sug button{display:flex;justify-content:space-between;gap:10px;padding:8px 11px;border-radius:10px;font-size:.82rem;text-align:left;background:rgba(var(--ouro-rgb),.06);border:1px solid rgba(var(--ouro-rgb),.25)}
.sug button:hover{background:rgba(var(--ouro-rgb),.14)}
.sug small{color:var(--txt3)}
.bloco{margin-top:16px;padding-top:14px;border-top:1px solid var(--vidro-borda)}
.bloco>h4{margin:0 0 10px;font-size:.66rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3)}
.dica{font-size:.74rem;color:var(--txt3);line-height:1.5;margin:6px 0 0}
.aviso{font-size:.78rem;padding:9px 12px;border-radius:11px;margin-top:8px}
.aviso.ok{color:#bbf7d0;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.aviso.mal{color:#fecdd3;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3)}
.travado{opacity:.5;pointer-events:none}
.travado-campo{opacity:.6}
.oculto{display:none!important}
.tabela{width:100%;border-collapse:collapse;font-size:.76rem}
.tabela th,.tabela td{padding:6px 8px;border-bottom:1px solid var(--vidro-borda);text-align:left;white-space:nowrap}
.tabela th{color:var(--txt3);font-weight:650}
.rolar{max-height:260px;overflow:auto;border-radius:12px;border:1px solid var(--vidro-borda)}

@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .ch-kpis{grid-template-columns:1fr 1fr}
  .topo select.entrada{min-width:0;flex:1}
  .h-top .dir{margin-left:0}
  .topo{position:relative;top:0}
}
@media (max-width:520px){
  body{padding:8px}
  .g2,.mets{grid-template-columns:1fr}
  .viagem{grid-template-columns:1fr}
  .lista{grid-template-columns:1fr}
  .heroi,.painel{padding:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca"><span id="logo"></span><span><b>Passagens</b><small>Parque Aliança · VGP</small></span></div>
    <select class="entrada" id="selEvento" title="Evento" hidden></select>
    <span class="sync" id="sync"><i></i><span>conectando…</span></span>
    <span class="somente-leitura" id="chLeitura" hidden></span>
    <button type="button" class="btn-ic" id="btAtualizar" title="Atualizar (puxa o que foi lançado no outro sistema)"></button>
    <button type="button" class="btn" id="btNova" data-perm="acao:reservar" hidden></button>
  </header>
  <main id="main"></main>
</div>
<input type="file" id="arqImport" accept=".xlsx" hidden>

<script src="/static/aurora.js?v=3"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg;
A.ICONES.onibus = A.ICONES.onibus || '<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M9 3v8M15 3v8"/><circle cx="8" cy="15" r=".8"/><circle cx="16" cy="15" r=".8"/><path d="M7 18v3M17 18v3"/>';
A.fundo();
document.getElementById("logo").outerHTML = A.orbe("onibus", "#60a5fa");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;

const API = "/api/passagens";
const K = { ev: "wd.pass.evento", aba: "wd.pass.aba", dia: "wd.pass.dia", filtro: "wd.pass.filtro" };
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const S = {
  eventos: [], evId: null, ev: null, pax: [], perm: { acoes: {}, campos: {} }, cap: 46, grupos: ["Rosas", "Engenho", "Cohab", "Geral"],
  dias: ["Sexta", "Sábado", "Domingo"], custoPadrao: 1770, lidoEm: 0,
  aba: ls.get(K.aba, "reservas"), filtro: ls.get(K.filtro, "pendentes"), busca: "", grupoF: "", dia: ls.get(K.dia, ""), buscaCh: "",
};
const $ = (s, r = document) => r.querySelector(s);
const brl = (v) => "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl0 = (v) => "R$ " + Math.round(Number(v || 0)).toLocaleString("pt-BR");
const abrev = (d) => ({ Sexta: "Sex", "Sábado": "Sáb", Domingo: "Dom" }[d] || d);

/* ── permissões ── */
const pode = (a) => !!S.perm.acoes?.[a];
const nivel = (c) => S.perm.campos?.[c] || "editar";
const vis = (c) => nivel(c) !== "oculto";
const edita = (c) => nivel(c) === "editar";
const podeCampo = (c) => edita(c) && (pode("editar") || (c === "pago" || c === "valor_pago" ? pode("receber") : c === "embarcou" ? pode("embarque") : false));
const fin = () => vis("valor_pago") && vis("valor_total");

/* ── status ── */
function sync(estado, txt) {
  const el = $("#sync"); el.className = "sync " + (estado || "");
  el.lastElementChild.textContent = txt;
}
const marcarLido = () => { S.lidoEm = Date.now(); sync("", "sincronizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })); };
async function chamar(url, op = {}, msg = "salvando…") {
  sync("salvando", msg);
  try { const r = await A.api(API + url, op); marcarLido(); return r; }
  catch (e) {
    sync("erro", "erro");
    if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); }
    throw e;
  }
}
const falha = (e) => A.toast("⚠ " + esc(e.message), [], { cor: "var(--rosa)", duracao: 8000 });

/* ══════ CARREGAR ══════ */
async function carregarEventos(prefer) {
  const d = await chamar("/eventos", {}, "carregando…");
  S.eventos = d.eventos; S.perm = d.perm; S.cap = d.capacidade; S.grupos = d.grupos; S.dias = d.dias; S.custoPadrao = d.custo_padrao;
  const quer = prefer || S.evId || ls.get(K.ev, "");
  S.evId = S.eventos.some((e) => e.id === quer) ? quer : (S.eventos[0]?.id || null);
  montarTopo();
  if (S.evId) await carregarPax(); else { S.ev = null; S.pax = []; render(); }
}
async function carregarPax() {
  if (!S.evId) return;
  ls.set(K.ev, S.evId);
  try {
    const d = await chamar("/eventos/" + encodeURIComponent(S.evId) + "/passageiros", {}, "atualizando…");
    S.ev = d.evento; S.pax = d.passageiros; S.perm = d.perm;
    const i = S.eventos.findIndex((e) => e.id === S.evId); if (i >= 0) S.eventos[i] = d.evento;
  } catch (e) {
    if (e.status === 404) { A.toast("Esse evento não está mais ativo (pode ter sido arquivado no outro sistema).", [], { cor: "var(--ouro)" }); S.evId = null; return carregarEventos(); }
    throw e;
  }
  render();
}
function montarTopo() {
  const sel = $("#selEvento");
  sel.hidden = S.eventos.length < 1;
  sel.innerHTML = S.eventos.map((e) => `<option value="${esc(e.id)}"${e.id === S.evId ? " selected" : ""}>${esc(e.nome)} · ${esc((e.datas || []).map(abrev).join("/"))}</option>`).join("");
  $("#btNova").hidden = !pode("reservar") || !S.evId;
  const so = !["reservar", "editar", "receber", "embarque", "excluir", "eventos"].some(pode);
  const ch = $("#chLeitura"); ch.hidden = !so; ch.innerHTML = svg("cadeado") + " Somente leitura";
}

/* ══════ CÁLCULOS (mesma regra do Streamlit) ══════ */
const totalDe = (p) => Number(p.valor_total || 0) || (p.dias_onibus || []).length * Number(S.ev?.valor || 0);
const saldoDe = (p) => Math.max(totalDe(p) - Number(p.valor_pago || 0), 0);
function numeros() {
  const ev = S.ev || {}, pax = S.pax;
  const total = pax.length, pagos = pax.filter((p) => p.pago).length;
  const arrecadado = pax.reduce((s, p) => s + Number(p.valor_pago || 0), 0);
  const aReceber = pax.filter((p) => !p.pago).reduce((s, p) => s + saldoDe(p), 0);
  const nOnibus = (ev.datas || []).reduce((s, d) => s + Number((ev.frotas || {})[d] || 1), 0);
  const custo = nOnibus * Number(ev.custo_onibus ?? S.custoPadrao);
  return { total, pagos, pend: total - pagos, pct: total ? Math.round(pagos / total * 100) : 0, arrecadado, aReceber, nOnibus, custo, saldo: custo - (arrecadado + aReceber) };
}
function ocupacao(dia, bus) { return S.pax.filter((p) => (p.dias_onibus || []).some((v) => v.dia === dia && Number(v.bus) === bus)).length; }

/* ══════ RENDER ══════ */
function render() {
  const m = $("#main");
  montarTopo();
  if (!S.ev) { m.innerHTML = semEvento(); ligarSemEvento(); return; }
  m.innerHTML = heroi() + `
    <div class="abas">
      <div class="seg" id="abas">
        <button type="button" data-aba="reservas" class="${S.aba === "reservas" ? "ativo" : ""}">${svg("dinheiro")} Reservas & Pagamentos</button>
        <button type="button" data-aba="chamada" class="${S.aba === "chamada" ? "ativo" : ""}" style="--c:var(--verde)">${svg("onibus")} Chamada de Embarque</button>
        <button type="button" data-aba="ajustes" class="${S.aba === "ajustes" ? "ativo" : ""}" style="--c:var(--violeta)">${svg("ajustes")} Ajustes</button>
      </div>
    </div>
    <section class="painel vidro" id="painel"></section>`;
  m.querySelectorAll("[data-aba]").forEach((b) => (b.onclick = () => { S.aba = b.dataset.aba; ls.set(K.aba, S.aba); render(); }));
  m.querySelectorAll("[data-addbus]").forEach((b) => (b.onclick = () => addOnibus(b.dataset.addbus)));
  ({ reservas: pReservas, chamada: pChamada, ajustes: pAjustes }[S.aba] || pReservas)();
}

function heroi() {
  const ev = S.ev, n = numeros(), f = fin();
  const kpi = (r, v, s, c) => `<div class="kpi luz" style="--c:${c}"><small>${r}</small><b>${v}</b><span>${s}</span></div>`;
  let frotas = "";
  (ev.datas || []).forEach((dia) => {
    const nf = Number((ev.frotas || {})[dia] || 1);
    for (let b = 1; b <= nf; b++) {
      const q = ocupacao(dia, b), pc = Math.min(Math.round(q / S.cap * 100), 100);
      const c = q >= S.cap ? "var(--rosa)" : pc > 80 ? "var(--ouro)" : "var(--verde)";
      frotas += `<div class="frota luz${q >= S.cap ? " lotado" : ""}" style="--c:${c}"><div class="l1"><span>${esc(dia)} · Ônibus ${b}</span><em>${pc}%</em></div>
        <div class="barra"><i style="width:${pc}%"></i></div><small>${q} / ${S.cap} passageiros${q >= S.cap ? " · <b style='color:#fda4af'>lotado</b>" : ""}</small></div>`;
    }
    if (pode("eventos")) {
      const lot = ocupacao(dia, nf) >= S.cap;
      frotas += `<button type="button" class="frota-add${lot ? " alerta" : ""}" data-addbus="${esc(dia)}" data-perm="acao:eventos">${svg("mais")}<span>Ônibus ${nf + 1} · ${esc(dia)}</span></button>`;
    }
  });
  return `<section class="heroi vidro vidro-borda-viva">
    <div class="h-top"><div><h1>${esc(ev.nome)}</h1><p>Controle de Passagens · ${esc((ev.datas || []).join(", "))}${f && ev.valor != null ? ` · ${brl(ev.valor)} por dia` : ""}</p></div>
</div>
    <div class="kpis">
      ${kpi("Reservas", n.total, "passageiros", "var(--azul)")}
      ${kpi("Pagos", n.pagos, n.pct + "% confirmados", "var(--verde)")}
      ${kpi("Pendentes", n.pend, "aguardando pagamento", "var(--ouro)")}
      ${f ? kpi("Arrecadado", brl0(n.arrecadado), "recebido", "var(--verde)") : ""}
      ${f ? kpi("A receber", brl0(n.aReceber), "em aberto", "var(--ouro)") : ""}
      ${f ? kpi("Custo da frota", brl0(n.custo), `${n.nOnibus} ônibus × ${brl0(ev.custo_onibus ?? S.custoPadrao)}`, "#cbd5e1") : ""}
      ${f ? kpi("Se fechar hoje", brl0(Math.abs(n.saldo)), n.saldo > 0 ? "do seu bolso" : "de sobra / cobre o custo", n.saldo > 0 ? "var(--rosa)" : "var(--verde)") : ""}
    </div>
    <div class="sec">Ocupação por frota</div>
    <div class="frotas">${frotas}</div>
  </section>`;
}

/* ── aba 1: reservas & pagamentos ── */
function pReservas() {
  const pnl = $("#painel"), f = fin();
  const q = S.busca.toLowerCase().trim();
  let lista = S.pax.filter((p) => (S.filtro === "todos" || (S.filtro === "pagos" ? p.pago : !p.pago))
    && (!S.grupoF || (p.grupo || "Geral") === S.grupoF)
    && (!q || (p.nome + " " + (p.rg || "") + " " + (p.cpf || "")).toLowerCase().includes(q)));
  const cont = { pendentes: S.pax.filter((p) => !p.pago).length, pagos: S.pax.filter((p) => p.pago).length, todos: S.pax.length };
  const emAberto = lista.filter((p) => !p.pago).reduce((s, p) => s + saldoDe(p), 0);
  pnl.innerHTML = `<div class="barra-ferr">
      <input class="entrada" id="busca" placeholder="Buscar por nome, RG ou CPF…" value="${esc(S.busca)}">
      <div class="seg" id="filtro">${[["pendentes", "Pendentes", "var(--rosa)"], ["pagos", "Pagos", "var(--verde)"], ["todos", "Todos", "var(--azul)"]].map(([k, r, c]) =>
        `<button type="button" data-f="${k}" style="--c:${c}" class="${S.filtro === k ? "ativo" : ""}">${r} <small>${cont[k]}</small></button>`).join("")}</div>
      <div class="dias">${["", ...S.grupos].map((g) => `<button type="button" class="chip${S.grupoF === g ? " ativo" : ""}" data-g="${esc(g)}">${g ? esc(g) : "Todos os grupos"}</button>`).join("")}</div>
    </div>
    ${lista.length ? `<div class="lista">${lista.map(cartaoPax).join("")}</div>` :
      `<div class="vazio">${A.orbe(S.filtro === "pendentes" && !q ? "check" : "busca", S.filtro === "pendentes" ? "#34d399" : "#60a5fa")}<b>${S.pax.length ? (S.filtro === "pendentes" && !q && !S.grupoF ? "Todos pagos!" : "Nada encontrado") : "Nenhuma reserva lançada ainda"}</b>
        ${!S.pax.length && pode("reservar") ? `<button type="button" class="btn" id="vNova">${svg("mais")}Nova reserva</button>` : ""}</div>`}
    ${f && emAberto > 0 ? `<div class="rodape-total"><span>Total em aberto${lista.length !== S.pax.length ? " (nesta lista)" : ""}</span><b>${brl(emAberto)}</b></div>` : ""}`;
  const b = $("#busca", pnl);
  b.oninput = () => { S.busca = b.value; const pos = b.selectionStart; pReservas(); const nb = $("#busca"); nb.focus(); nb.setSelectionRange(pos, pos); };
  pnl.querySelectorAll("[data-f]").forEach((x) => (x.onclick = () => { S.filtro = x.dataset.f; ls.set(K.filtro, S.filtro); pReservas(); }));
  pnl.querySelectorAll("[data-g]").forEach((x) => (x.onclick = () => { S.grupoF = x.dataset.g; pReservas(); }));
  pnl.querySelectorAll("[data-pax]").forEach((x) => (x.onclick = () => gerenciar(x.dataset.pax)));
  $("#vNova", pnl)?.addEventListener("click", () => novaReserva());
}
function cartaoPax(p) {
  const f = fin(), s = saldoDe(p);
  return `<button type="button" class="pax luz${p.pago ? "" : " pend"}" data-pax="${esc(p.id)}">
    <span class="av">${A.iniciais(p.nome)}</span>
    <span style="min-width:0"><b>${esc(p.nome)}</b><span class="meta">
      <span class="mini">${esc(p.grupo || "Geral")}</span>

      ${p.embarcou ? `<span class="mini ok">embarcou</span>` : ""}
    </span></span>
    <span class="valor">${f ? (p.pago ? brl(totalDe(p)) : "– " + brl(s)) : ""}${f ? `<small>${p.pago ? "quitado" : Number(p.valor_pago || 0) > 0 ? "pagou " + brl(p.valor_pago) : "em aberto"}</small>` : ""}</span>
  </button>`;
}

/* ── aba 2: chamada de embarque ── */
function pChamada() {
  const pnl = $("#painel"), ev = S.ev;
  if (S.dia && S.dia !== "geral" && !(ev.datas || []).includes(S.dia)) S.dia = "";
  if (!S.dia) S.dia = (ev.datas || [])[0] || "geral";
  const q = S.buscaCh.toLowerCase().trim();
  const base = S.pax.map((p) => {
    const v = (p.dias_onibus || []).find((x) => x.dia === S.dia);
    return { ...p, _bus: v ? Number(v.bus) : null };
  }).filter((p) => S.dia === "geral" || p._bus != null);
  const lista = base.filter((p) => !q || (p.nome + " " + (p.rg || "")).toLowerCase().includes(q));
  const emb = base.filter((p) => p.embarcou).length, naoPg = base.filter((p) => !p.pago).length;
  const podeEmb = (pode("embarque") || pode("editar")) && edita("embarcou");
  const kpi = (r, v, c) => `<div class="kpi luz" style="--c:${c}"><small>${r}</small><b>${v}</b></div>`;
  const grupos = [...new Set(lista.map((p) => p.grupo || "Geral"))].sort();
  pnl.innerHTML = `<div class="barra-ferr">
      <div class="seg" id="diasCh">${[...(ev.datas || []), "geral"].map((d) => `<button type="button" data-d="${esc(d)}" style="--c:var(--verde)" class="${S.dia === d ? "ativo" : ""}">${d === "geral" ? svg("busca") + " Geral" : svg("calendario") + " " + esc(d)}</button>`).join("")}</div>
      <input class="entrada" id="buscaCh" placeholder="Achar na lista…" value="${esc(S.buscaCh)}">
      <div class="dir">${pode("exportar") ? `<button type="button" class="btn v" id="btXlsCh" data-perm="acao:exportar">${svg("baixar")}Lista de chamada (Excel)</button>` : ""}</div>
    </div>
    <div class="ch-kpis">${kpi("Na lista", base.length, "var(--azul)")}${kpi("Embarcados", emb, "var(--verde)")}${kpi("Aguardando", base.length - emb, "var(--ouro)")}${vis("pago") ? kpi("Não pagos", naoPg, "var(--rosa)") : ""}</div>
    ${!lista.length ? `<div class="vazio">${A.orbe("onibus", "#60a5fa")}<b>${base.length ? "Ninguém com esse nome" : S.dia === "geral" ? "Nenhuma reserva para exibir" : "Ninguém embarca em " + esc(S.dia)}</b></div>` :
      grupos.map((g) => {
        const gp = lista.filter((p) => (p.grupo || "Geral") === g), e = gp.filter((p) => p.embarcou).length;
        const linha = (p) => `<div class="linha${p.embarcou ? " feito" : ""}">
          <span class="n"><span>${esc(p.nome)}</span><span class="meta">${p._bus != null ? `<span class="mini bus">Ônibus ${p._bus}</span>` : ""}${vis("pago") && !p.pago ? `<span class="mini pend">💸 pendente</span>` : ""}</span></span>
          ${pode("editar") || pode("receber") ? `<button type="button" class="btn-ic p" data-ed="${esc(p.id)}" title="Editar / pagamento">${svg("lapis")}</button>` : ""}
          <button type="button" class="bt-emb${p.embarcou ? " volta" : ""}" data-emb="${esc(p.id)}" ${podeEmb ? "" : "disabled"} title="${p.embarcou ? "Cancelar embarque" : "Confirmar embarque"}" data-perm="acao:embarque">${svg(p.embarcou ? "voltar" : "check")}</button>
        </div>`;
        return `<div class="grupo luz"><div class="grupo-cab">${A.orbe("usuarios", "#60a5fa")}<b>${esc(g)}</b><div class="barra" style="--c:var(--verde)"><i style="width:${gp.length ? Math.round(e / gp.length * 100) : 0}%"></i></div><span>${e}/${gp.length} embarcados</span></div>
          <div class="cols">
            <div class="col" style="--c:var(--ouro)"><h4>⏳ Aguardando · ${gp.length - e}</h4>${gp.filter((p) => !p.embarcou).map(linha).join("") || `<p class="dica">Todo mundo já embarcou.</p>`}</div>
            <div class="col" style="--c:var(--verde)"><h4>🟢 Embarcados · ${e}</h4>${gp.filter((p) => p.embarcou).map(linha).join("") || `<p class="dica">Ninguém ainda.</p>`}</div>
          </div></div>`;
      }).join("")}
    ${S.dia !== "geral" ? `<p class="dica">O embarque é um só por passageiro (como no Parque Aliança): quem viaja em mais de um dia aparece embarcado nos outros dias também.</p>` : ""}`;
  pnl.querySelectorAll("[data-d]").forEach((x) => (x.onclick = () => { S.dia = x.dataset.d; ls.set(K.dia, S.dia); pChamada(); }));
  const b = $("#buscaCh", pnl);
  b.oninput = () => { S.buscaCh = b.value; const pos = b.selectionStart; pChamada(); const nb = $("#buscaCh"); nb.focus(); nb.setSelectionRange(pos, pos); };
  pnl.querySelectorAll("[data-emb]").forEach((x) => (x.onclick = () => embarcar(x.dataset.emb)));
  pnl.querySelectorAll("[data-ed]").forEach((x) => (x.onclick = () => gerenciar(x.dataset.ed)));
  $("#btXlsCh", pnl)?.addEventListener("click", excelChamada);
}
async function embarcar(id) {
  const p = S.pax.find((x) => x.id === id); if (!p) return;
  const novo = !p.embarcou;
  p.embarcou = novo; render();
  try { await chamar(`/eventos/${encodeURIComponent(S.evId)}/passageiros/${encodeURIComponent(id)}/embarque`, { method: "POST", body: { embarcou: novo } }); }
  catch (e) { p.embarcou = !novo; render(); falha(e); }
}

    if (!(await A.confirmar(`Arquivar <b>${esc(ev.nome)}</b>? Ele sai da lista de eventos ativos aqui e no Parque Aliança.`, { titulo: "Arquivar evento", rotulo: "Arquivar", perigo: true }))) return;
    try { await chamar(`/eventos/${encodeURIComponent(S.evId)}/arquivar`, { method: "POST", body: { confirmacao: conf } }); A.toast("Evento arquivado.", [], { cor: "var(--verde)" }); S.evId = null; ls.set(K.ev, ""); await carregarEventos(); }

const cartaoNovoEvento = () => `<div class="cartao luz"><h3>${A.orbe("mais", "#60a5fa")}Novo evento</h3>
  <label class="campo">Nome do evento<input id="nvNome" placeholder="ex.: Assembleia Março"></label>
  ${fin() ? `<div class="g2"><label class="campo">Passagem por passageiro/dia (R$)<input type="number" id="nvValor" min="0" step="5" value="50"></label>

  <div class="campo">Dias de operação<div class="dias" id="nvDias">${S.dias.map((d) => `<button type="button" class="chip" data-nd="${esc(d)}">${esc(d)}</button>`).join("")}</div></div>
  <button type="button" class="btn" id="btNvEv" data-perm="acao:eventos">${svg("foguete")}Criar evento</button></div>`;

/* ══════ +ÔNIBUS ══════ */

  try { const r = await chamar(`/eventos/${encodeURIComponent(S.evId)}/onibus`, { method: "POST", body: { dia } }); S.ev = r.evento; render(); A.toast(`✓ Ônibus ${nf + 1} adicionado em ${esc(dia)}.`, [], { cor: "var(--verde)" }); }
  catch (e) { falha(e); }
}

/* ══════ VIAGENS (usado nos dois popups) ══════ */
function htmlViagens(atual, idIgnorar) {
  const mapa = Object.fromEntries((atual || []).map((v) => [v.dia, Number(v.bus)]));
  return (S.ev.datas || []).map((dia) => {
    const nf = Number((S.ev.frotas || {})[dia] || 1);
    const ops = Array.from({ length: nf }, (_, i) => i + 1).map((b) => {
      let q = ocupacao(dia, b); if (idIgnorar && mapa[dia] === b) q -= 1;
      return `<option value="${b}"${(mapa[dia] || firstLivre(dia)) === b ? " selected" : ""}>Ônibus ${b} · ${q}/${S.cap}${q >= S.cap ? " (lotado)" : ""}</option>`;
    }).join("");
    return `<div class="viagem"><label class="chave" style="--c:var(--azul)"><input type="checkbox" data-vd="${esc(dia)}"${dia in mapa ? " checked" : ""}><span class="trilho"></span>${esc(dia)}</label>
      <select class="entrada" data-vb="${esc(dia)}"${dia in mapa ? "" : " disabled"}>${ops}</select></div>`;
  }).join("");
}
function firstLivre(dia) {
  const nf = Number((S.ev.frotas || {})[dia] || 1);
  for (let b = 1; b <= nf; b++) if (ocupacao(dia, b) < S.cap) return b;
  return nf;
}
function lerViagens(cx) {
  return [...cx.querySelectorAll("[data-vd]")].filter((c) => c.checked).map((c) => ({ dia: c.dataset.vd, bus: +cx.querySelector(`[data-vb="${CSS.escape(c.dataset.vd)}"]`).value }));
}
function ligarViagens(cx, aoMudar) {
  cx.querySelectorAll("[data-vd]").forEach((c) => (c.onchange = () => { cx.querySelector(`[data-vb="${CSS.escape(c.dataset.vd)}"]`).disabled = !c.checked || c.disabled; aoMudar && aoMudar(); }));
  cx.querySelectorAll("[data-vb]").forEach((s) => (s.onchange = () => aoMudar && aoMudar()));
}
const campoTxt = (k, rot, val, { auto = "", trava = false } = {}) => vis(k)
  ? `<label class="campo${trava ? " travado-campo" : ""}" data-perm="campo:${k}">${rot}${trava ? " 🔒" : ""}<input data-k="${k}" value="${esc(val || "")}" ${trava ? "disabled" : ""} ${auto}></label>` : "";
const segGrupo = (val, trava) => vis("grupo") ? `<div class="campo" data-perm="campo:grupo">Grupo / localização${trava ? " 🔒" : ""}<div class="seg${trava ? " travado" : ""}" id="segGrupo">${S.grupos.map((g) =>
  `<button type="button" data-gr="${esc(g)}" class="${(val || "Geral") === g ? "ativo" : ""}">${esc(g)}</button>`).join("")}</div></div>` : "";
function ligarGrupo(cx) { cx.querySelectorAll("[data-gr]").forEach((b) => (b.onclick = () => cx.querySelectorAll("[data-gr]").forEach((x) => x.classList.toggle("ativo", x === b)))); }
const grupoSel = (cx) => cx.querySelector("[data-gr].ativo")?.dataset.gr || "Geral";

/* ══════ NOVA RESERVA ══════ */

    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Confirmar reserva", classe: "btn", icone: "check", principal: true, acao: async (cx) => {

      const tot = () => { const n = lerViagens(cx).length; cx.querySelector("#nrTot").innerHTML = n && fin() ? `${n} viagem(ns) · total <b style="color:var(--ouro2)">${brl(n * Number(S.ev.valor || 0))}</b>` : ""; };

        tBusca = setTimeout(async () => {

/* ══════ GERENCIAR RESERVA ══════ */

  const f = fin(), total = totalDe(p), pagoAt = Number(p.valor_pago || 0);

  A.modal({

        <div class="kpi" style="--c:${saldoDe(p) > 0 ? "var(--rosa)" : "var(--verde)"}"><small>Saldo pendente</small><b>${brl(total - pagoAt)}</b><span>pago até agora ${brl(pagoAt)}</span></div></div>` : ""}
      ${tags.length ? `<p class="dica" style="margin:0 0 6px">Situação atual: ${tags.join(" · ")} — dá para alterar tudo abaixo (estornar, cancelar embarque, trocar viagens) e salvar.</p>` : ""}
      <div class="bloco" style="margin-top:6px"><h4>Dados</h4>
        ${vis("nome") ? `<label class="campo" data-perm="campo:nome">Nome${ed("nome") ? "" : " 🔒"}<input data-k="nome" value="${esc(p.nome)}" ${ed("nome") ? "" : "disabled"}></label>` : ""}
        <div class="g2" style="margin-top:10px">${campoTxt("rg", "RG", p.rg, { trava: !ed("rg") })}${campoTxt("cpf", "CPF", p.cpf, { trava: !ed("cpf") })}</div>
        <div style="margin-top:10px">${segGrupo(p.grupo, !ed("grupo"))}</div></div>
      ${podeVal && f ? `<div class="bloco" data-perm="campo:valor_pago"><h4>💰 Ajustar pagamento</h4>
        <div class="g2"><label class="campo">Recebido agora (±)<input type="number" id="gRec" step="5" value="0"></label>
          <label class="campo">Dinheiro entregue (troco)<input type="number" id="gEnt" min="0" step="5" value="0"></label></div>
        <div class="dias" style="margin-top:8px">${saldoDe(p) > 0 ? `<button type="button" class="chip" id="gQuitar">Receber saldo (${brl(saldoDe(p))})</button>` : ""}
          ${pagoAt > 0 ? `<button type="button" class="chip" id="gEstornar">Estornar tudo (${brl(pagoAt)})</button>` : ""}</div>
        <div id="gMsg"></div>
        <p class="dica">Positivo registra recebimento; <b>negativo</b> devolve/estorna valor já pago.</p></div>` : ""}
      ${vis("dias_onibus") ? `<div class="bloco${ed("dias_onibus") ? "" : " travado"}" data-perm="campo:dias_onibus"><h4>🗓 Viagens${ed("dias_onibus") ? "" : " 🔒"}</h4>${htmlViagens(p.dias_onibus, p.id)}</div>` : ""}
      <div class="bloco" style="display:flex;gap:22px;flex-wrap:wrap">
        ${vis("pago") ? `<label class="chave" style="--c:var(--verde)" data-perm="campo:pago"><input type="checkbox" id="gPago"${p.pago ? " checked" : ""}${podePg ? "" : " disabled"}><span class="trilho"></span>💰 Pagamento quitado</label>` : ""}
        ${vis("embarcou") ? `<label class="chave" style="--c:var(--azul)" data-perm="campo:embarcou"><input type="checkbox" id="gEmb"${p.embarcou ? " checked" : ""}${podeEmb ? "" : " disabled"}><span class="trilho"></span>🚌 Embarcou</label>` : ""}
      </div>`,
    esquerda: pode("excluir") ? [{ rotulo: "Excluir", classe: "btn perigo", icone: "lixo", acao: async () => {
      if (!(await A.confirmar(`Excluir a reserva de <b>${esc(p.nome)}</b>? Some aqui e no Parque Aliança.`, { titulo: "Excluir reserva", rotulo: "Excluir", perigo: true }))) return false;
      try { await chamar(`/eventos/${encodeURIComponent(S.evId)}/passageiros/${encodeURIComponent(p.id)}`, { method: "DELETE" });
        S.pax = S.pax.filter((x) => x.id !== p.id); render(); A.toast(`Reserva de <b>${esc(p.nome)}</b> excluída.`, [], { cor: "var(--ouro)" }); }
      catch (e) { falha(e); return false; }
    } }] : [],
    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Salvar", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
      const d = {};
      if (ed("nome")) d.nome = cx.querySelector('[data-k="nome"]').value.trim();
      if (ed("rg")) d.rg = cx.querySelector('[data-k="rg"]').value.trim();
      if (ed("cpf")) d.cpf = cx.querySelector('[data-k="cpf"]').value.trim();
      if (ed("grupo")) d.grupo = grupoSel(cx);
      if (ed("dias_onibus")) { d.dias_onibus = lerViagens(cx); if (!d.dias_onibus.length) { A.toast("Selecione ao menos um dia (ou exclua a reserva).", [], { cor: "var(--rosa)" }); return false; } }
      if (podeVal && f) { const rec = +cx.querySelector("#gRec").value || 0; if (rec) d.valor_pago = Math.max(pagoAt + rec, 0); }
      if (podePg && vis("pago")) d.pago = cx.querySelector("#gPago").checked;
      if (podeEmb && vis("embarcou")) d.embarcou = cx.querySelector("#gEmb").checked;
      if (d.nome === "") { A.toast("O nome não pode ficar vazio.", [], { cor: "var(--rosa)" }); return false; }
      try {
        const r = await chamar(`/eventos/${encodeURIComponent(S.evId)}/passageiros/${encodeURIComponent(p.id)}`, { method: "PUT", body: { dados: d } });
        const i = S.pax.findIndex((x) => x.id === p.id); if (i >= 0) S.pax[i] = r.passageiro;
        render(); if (r.mudados.length) A.toast(`✓ Reserva de <b>${esc(r.passageiro.nome)}</b> salva.`, [], { cor: "var(--verde)" });
      } catch (e) { falha(e); return false; }
    } }],
    aoAbrir(cx) {
      ligarGrupo(cx); ligarViagens(cx);
      if (!ed("dias_onibus")) cx.querySelectorAll("[data-vd],[data-vb]").forEach((x) => (x.disabled = true));
      const rec = cx.querySelector("#gRec"), ent = cx.querySelector("#gEnt"), msg = cx.querySelector("#gMsg"), pg = cx.querySelector("#gPago");
      if (!rec) return;
      const att = () => {
        const r = +rec.value || 0, e = +ent.value || 0, novo = Math.max(pagoAt + r, 0);
        let h = "";
        if (r < 0) h += `<div class="aviso mal">Estornando ${brl(Math.abs(r))} → fica pago ${brl(novo)}</div>`;
        else if (r > 0) h += `<div class="aviso ok">Recebendo ${brl(r)} → fica pago ${brl(novo)} de ${brl(total)}</div>`;
        if (e > 0 && r > 0) h += `<div class="aviso ${e >= r ? "ok" : "mal"}">${e >= r ? "Troco: <b>" + brl(e - r) + "</b>" : "Faltam " + brl(r - e)}</div>`;
        msg.innerHTML = h;
        if (pg && !pg.disabled && r) pg.checked = novo >= total - 0.005;
      };
      rec.oninput = att; ent.oninput = att;
      cx.querySelector("#gQuitar")?.addEventListener("click", () => { rec.value = saldoDe(p).toFixed(2); att(); });
      cx.querySelector("#gEstornar")?.addEventListener("click", () => { rec.value = (-pagoAt).toFixed(2); att(); });
    },
  });
}

/* ══════ EXCEL (ExcelJS sob demanda) ══════ */
let exceljs;
function carregarExcel() {
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  // 1º tenta a cópia do próprio hub (static/vendor), depois o CDN
  const urls = ["/static/vendor/exceljs.min.js", "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"];
  const tentar = (i, ok, erro) => {
    if (i >= urls.length) { exceljs = null; erro(new Error("Não consegui carregar o leitor de Excel (sem internet?).")); return; }
    const s = document.createElement("script"); s.src = urls[i];
    s.onload = () => (window.ExcelJS ? ok(window.ExcelJS) : tentar(i + 1, ok, erro)); s.onerror = () => { s.remove(); tentar(i + 1, ok, erro); };
    document.head.appendChild(s);
  };
  return exceljs || (exceljs = new Promise((ok, erro) => tentar(0, ok, erro)));
}
async function baixar(wb, nome) {
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
const slug = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_");
function abaChamada(wb, nome, colunas, linhas) {
  const ws = wb.addWorksheet(nome.replace(/[[\]:*?/\\]/g, "").slice(0, 31) || "Dia");
  ws.columns = colunas.map((c) => ({ header: c, key: c, width: Math.max(c.length, ...linhas.map((l) => String(l[c] ?? "").length)) + 3 }));
  ws.getRow(1).font = { bold: true };
  linhas.forEach((l) => {
    const r = ws.addRow(l);
    if (l.Pago === "Não") r.eachCell({ includeEmpty: true }, (c) => (c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFDE8E8" } }));
  });
}
async function excelChamada() {
  try {
    const X = await carregarExcel(), wb = new X.Workbook(), ev = S.ev;
    const ord = [...S.pax].sort((a, b) => (a.grupo || "").localeCompare(b.grupo || "") || a.nome.localeCompare(b.nome, "pt-BR"));
    (ev.datas || []).forEach((dia) => {
      const l = ord.map((p) => ({ p, v: (p.dias_onibus || []).find((x) => x.dia === dia) })).filter((x) => x.v)
        .map(({ p, v }) => ({ Grupo: p.grupo || "Geral", Nome: p.nome, RG: p.rg || "", "Ônibus": v.bus, Pago: p.pago ? "Sim" : "Não", Embarcou: p.embarcou ? "Sim" : "Não" }));
      abaChamada(wb, dia, ["Grupo", "Nome", "RG", "Ônibus", "Pago", "Embarcou"], l);
    });
    const geral = ord.map((p) => { const m = Object.fromEntries((p.dias_onibus || []).map((v) => [v.dia, v.bus]));
      return { Grupo: p.grupo || "Geral", Nome: p.nome, RG: p.rg || "", ...Object.fromEntries((ev.datas || []).map((d) => [d, m[d] ? "Ônibus " + m[d] : ""])), Pago: p.pago ? "Sim" : "Não", Embarcou: p.embarcou ? "Sim" : "Não" }; });
    abaChamada(wb, "Todos os Dias", ["Grupo", "Nome", "RG", ...(ev.datas || []), "Pago", "Embarcou"], geral);
    await baixar(wb, "chamada_embarque_" + slug(ev.nome) + ".xlsx");
  } catch (e) { falha(e); }
}
const pyLista = (l) => "[" + (l || []).map((v) => `{'dia': '${String(v.dia).replace(/'/g, "\\'")}', 'bus': ${Number(v.bus)}}`).join(", ") + "]";
async function excelDados() {
  try {
    const X = await carregarExcel(), wb = new X.Workbook(), ws = wb.addWorksheet("Passageiros");
    const cols = ["grupo", "cpf", "nome", "valor_pago", "embarcou", "valor_total", "dias_onibus", "rg", "pago"].filter((c) => c === "dias_onibus" ? vis(c) : vis(c));

    S.pax.forEach((p) => ws.addRow({ ...p, dias_onibus: pyLista(p.dias_onibus), pago: !!p.pago, embarcou: !!p.embarcou }));

        ${pv.passageiros.length > 80 ? `<p class="dica">… e mais ${pv.passageiros.length - 80}.</p>` : ""}</div>`,
    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Importar", classe: "btn", icone: "subir", principal: true, acao: async (cx) => {
      const nome = cx.querySelector("#imNome").value.trim(), datas = [...cx.querySelectorAll("[data-id].ativo")].map((x) => x.dataset.id);
      if (!nome || !datas.length) { A.toast("Informe o nome do evento e ao menos um dia.", [], { cor: "var(--rosa)" }); return false; }
      try { const r = await chamar("/importar", { method: "POST", body: { nome, datas, valor: +cx.querySelector("#imValor").value, custo_onibus: +cx.querySelector("#imCusto").value, linhas } }, "importando…");
        A.toast(`✓ Evento <b>${esc(nome)}</b> criado com <b>${r.importados}</b> passageiro(s).`, [], { cor: "var(--verde)", duracao: 7000 });
        S.aba = "reservas"; ls.set(K.aba, S.aba); await carregarEventos(r.id); }
      catch (e) { falha(e); return false; }
    } }],
    aoAbrir(cx) { cx.querySelectorAll("[data-id]").forEach((x) => (x.onclick = () => x.classList.toggle("ativo"))); },
  });
};

/* ══════ INÍCIO ══════ */
$("#btAtualizar").innerHTML = svg("repetir");
$("#btNova").innerHTML = svg("mais") + "Nova reserva";
$("#btNova").onclick = () => novaReserva();
$("#btAtualizar").onclick = () => carregarEventos().catch(falha);
$("#selEvento").onchange = (e) => { S.evId = e.target.value; carregarPax().catch(falha); };
addEventListener("keydown", (e) => {
  if (A.modalAberto() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) return;
  if (e.key === "n" || e.key === "N") { e.preventDefault(); novaReserva(); }
});
// o Parque Aliança também grava: ao voltar para a aba/janela, puxa o que mudou
const fresco = () => { if (document.visibilityState === "visible" && !A.modalAberto() && Date.now() - S.lidoEm > 45000) (S.evId ? carregarPax() : carregarEventos()).catch(() => {}); };
document.addEventListener("visibilitychange", fresco);
addEventListener("focus", fresco);
setInterval(() => { if (document.hasFocus() && Date.now() - S.lidoEm > 180000) fresco(); }, 30000);

(async () => {
  try { await A.permissoes.carregar("passagens"); }
  catch (e) { if (e.status !== 401) $("#main").innerHTML = `<section class="painel vidro"><div class="vazio"><b>Não consegui abrir</b>${esc(e.message)}</div></section>`; return; }
  try { await carregarEventos(); }
  catch (e) { $("#main").innerHTML = `<section class="painel vidro"><div class="vazio">${A.orbe("atencao", "#fb7185")}<b>Não consegui carregar os eventos</b>${esc(e.message)}<button type="button" class="btn v" onclick="location.reload()">Tentar de novo</button></div></section>`; }
})();
})();
</script>
</body>
</html>
