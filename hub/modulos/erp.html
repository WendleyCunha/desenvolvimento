<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:20px;flex-wrap:wrap}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.9),rgba(8,10,16,.84))}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca b{display:block;font:700 1.08rem var(--titulo);letter-spacing:-.01em}
.marca small{display:block;font-size:.6rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 auto}
.nav button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:600;color:var(--txt2);transition:.2s;position:relative}
.nav button svg.i{width:15px;height:15px}
.nav button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav button.ativo{color:#04141a;background:var(--ciano);box-shadow:0 0 20px -4px var(--ciano)}
.nav button .bolha{position:absolute;top:-3px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;font-size:.6rem;font-weight:800;font-style:normal;display:grid;place-items:center;background:var(--rosa);color:#fff;box-shadow:0 0 10px var(--rosa)}
.dir{display:flex;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro);box-shadow:0 0 8px var(--ouro);animation:aurRespira 1s infinite}
.sync.erro i{background:var(--rosa);box-shadow:0 0 8px var(--rosa)}
main{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.painel{border-radius:24px;padding:18px}
.cab{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cab h2{margin:0;font:700 1.18rem var(--titulo);letter-spacing:-.01em}
.cab p{margin:2px 0 0;font-size:.78rem;color:var(--txt3)}
.cab .dir{margin-left:auto;flex-wrap:wrap}
.barra-ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.barra-ferr .entrada{max-width:280px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip small{opacity:.7;margin-left:2px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{position:relative;padding:13px 14px;border-radius:15px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);transition:.25s;--c:var(--ciano);text-align:left}
.kpi:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 26px -10px var(--c);transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%)}
.kpi small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.5rem/1.1 var(--titulo);margin-top:8px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:4px}
.kpi .meta-barra{height:5px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.kpi .meta-barra i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.grade2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bloco{border-radius:18px;padding:14px;background:rgba(255,255,255,.025);border:1px solid var(--vidro-borda)}
.bloco h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:650 .9rem var(--titulo)}
.bloco h3 svg.i{width:16px;height:16px;color:var(--ciano)}
.bloco h3 small{margin-left:auto;font:500 .7rem var(--sans);color:var(--txt3)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.7rem;color:var(--txt2);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.graf{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.78rem;margin-bottom:7px}
.hbar .t{height:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--c,var(--ciano));box-shadow:0 0 10px var(--c,var(--ciano))}
.hbar b{text-align:right;font-weight:650}
.alerta-l{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);font-size:.8rem;transition:.2s;text-align:left;width:100%}
.alerta-l:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:rgba(255,255,255,.05)}
.alerta-l b{color:var(--c);font:700 1rem var(--titulo);min-width:28px}

/* tabela */
.tab-w{overflow:auto;border-radius:14px;border:1px solid var(--vidro-borda)}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th{position:sticky;top:0;background:rgba(12,14,20,.96);color:var(--txt3);font-weight:650;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;text-align:left;padding:10px;white-space:nowrap;z-index:1}
table.t td{padding:9px 10px;border-top:1px solid var(--vidro-borda);vertical-align:middle}
table.t tr.cl{cursor:pointer;transition:background .15s}
table.t tr.cl:hover td{background:rgba(34,211,238,.05)}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t .zero{color:var(--txt3);opacity:.45}
table.t .baixo{color:#fda4af;font-weight:700}
.sub{display:block;font-size:.7rem;color:var(--txt3);margin-top:2px}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--txt3);font-size:.84rem;padding:34px 10px}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}

/* agenda */
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:14px}
.dia{padding:10px;border-radius:14px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);transition:.2s}
.dia:hover{border-color:rgba(34,211,238,.4)}
.dia.ativo{border-color:var(--ciano);background:rgba(34,211,238,.1);box-shadow:0 0 22px -8px var(--ciano)}
.dia small{display:block;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3)}
.dia b{display:block;font:700 1.15rem var(--titulo);margin-top:2px}
.dia span{display:block;font-size:.68rem;color:var(--txt2);margin-top:4px}
.dia.hoje small{color:var(--ouro2)}
.lst{display:flex;flex-direction:column;gap:7px}
.card-p{--c:var(--ciano);position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);text-align:left;transition:.2s}
.card-p::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.card-p:hover{border-color:color-mix(in srgb,var(--c) 40%,transparent);background:rgba(255,255,255,.055)}
.card-p b{font-size:.86rem;font-weight:600}
.card-p input[type=checkbox]{width:18px;height:18px;accent-color:var(--ciano)}
.card-p .orbe{width:34px;height:34px;border-radius:11px}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:7px;font-size:.64rem;font-weight:650;color:var(--txt2);background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda);margin:4px 4px 0 0}
.mini svg.i{width:11px;height:11px}
.mini.c{color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.cap{margin-top:10px}
.cap .t{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.cap .t i{display:block;height:100%;box-shadow:0 0 12px currentColor;transition:width .5s}
.cap small{font-size:.74rem;color:var(--txt2)}

/* cargas */
.cargas{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.lst-cargas{display:flex;flex-direction:column;gap:8px}
.carga-item{--c:var(--ciano);border-radius:16px;border:1px solid var(--vidro-borda);background:rgba(255,255,255,.02);overflow:hidden}
.carga-item.aberta{border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent)}
.carga-linha{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.carga-linha:hover{background:rgba(127,127,127,.07)}
.carga-linha .cl-t{display:flex;flex-direction:column;min-width:0;flex:1}
.carga-linha .cl-t b{font:700 .98rem var(--titulo)}
.carga-linha .cl-seta{font-size:1rem;opacity:.7;padding-left:4px}
.carga-item .carga .t1 > :not(.etq){display:none}
.carga-item .carga{border:0;border-top:1px solid var(--vidro-borda);border-radius:0;background:none}
.carga{--c:var(--ciano);border-radius:18px;padding:14px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:9px}
.carga .t1{display:flex;align-items:center;gap:10px}
.carga .t1 b{font:700 1rem var(--titulo)}
.carga .t1 .etq{margin-left:auto}
.parada{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 9px;border-radius:12px;background:rgba(255,255,255,.03);font-size:.8rem}
.parada .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .7rem var(--titulo);background:rgba(34,211,238,.15);color:var(--ciano)}
.bxs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.parada .bxs.linha2{grid-column:2/-1;justify-content:flex-start}
.bxs button{padding:5px 8px;border-radius:9px;font-size:.66rem;font-weight:700;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);transition:.2s}
.bxs button:hover{background:var(--c);color:#06120c}

/* retornos */
.colunas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.coluna{--c:var(--ciano);border-radius:18px;padding:12px;background:rgba(255,255,255,.025);border:1px solid color-mix(in srgb,var(--c) 25%,var(--vidro-borda));min-height:120px}
.coluna h4{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:650 .82rem var(--titulo);color:var(--c)}
.coluna h4 b{margin-left:auto;font-size:1rem}
.peca{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--vidro-borda);margin-bottom:6px;font-size:.8rem;width:100%;text-align:left;transition:.2s}
.peca:hover:not(:disabled){border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 0 18px -8px var(--c)}
.peca .q{margin-left:auto;font:700 .95rem var(--titulo);color:var(--c)}

/* forms */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.linha-it{display:grid;grid-template-columns:minmax(0,3fr) 80px 110px 34px;gap:8px;align-items:center;margin-bottom:7px}
.linha-it select,.linha-it input{padding:8px 10px}
.linha-it small{grid-column:1/-1;margin-top:-4px;font-size:.68rem;color:var(--txt3)}
.linha-it .preco-fixo{font:600 .9rem var(--titulo);text-align:right;color:var(--txt2);white-space:nowrap}
/* busca (cliente / item) dentro do pedido */
.res-busca{display:grid;gap:4px;margin-top:6px;max-height:320px;overflow:auto}
.res-busca:empty{display:none}
.res-busca button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--vidro-borda);background:rgba(255,255,255,.03);color:var(--txt);cursor:pointer;font:inherit}
.res-busca button:hover,.res-busca button:focus-visible{border-color:rgba(var(--ouro-rgb),.55);background:rgba(var(--ouro-rgb),.08)}
.res-busca small{display:block;color:var(--txt3);font-size:.74rem}
.res-busca .vz{padding:8px 4px;color:var(--txt3);font-size:.8rem}
.cli-esc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(var(--ouro-rgb),.45);background:rgba(var(--ouro-rgb),.07);margin-top:6px}
.cli-esc small{display:block;color:var(--txt2);font-size:.78rem}
.sep{margin-top:14px;padding-top:12px;border-top:1px solid var(--vidro-borda)}
.sep>h4{margin:0 0 10px;font-size:.64rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3)}
.dica{font-size:.74rem;color:var(--txt3);line-height:1.5;margin:6px 0 0}
.aviso{font-size:.78rem;padding:9px 12px;border-radius:11px;margin-top:10px;line-height:1.5}
.aviso.ok{color:#bbf7d0;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.aviso.mal{color:#fecdd3;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3)}
.aviso.at{color:#fde68a;background:rgba(232,179,61,.08);border:1px solid rgba(232,179,61,.3)}
.totais{display:flex;justify-content:flex-end;align-items:center;gap:18px;font-size:.84rem;margin-top:8px;flex-wrap:wrap}
.totais b{font:700 1.05rem var(--titulo);color:var(--ouro2)}
.linha-tempo{position:relative;padding-left:18px;margin:0}
.linha-tempo li{list-style:none;position:relative;padding:0 0 10px;font-size:.8rem}
.linha-tempo li::before{content:"";position:absolute;left:-14px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ciano);box-shadow:0 0 8px var(--ciano)}
.linha-tempo li::after{content:"";position:absolute;left:-10.5px;top:15px;bottom:-2px;width:1px;background:var(--vidro-borda-forte)}
.linha-tempo li:last-child::after{display:none}
.linha-tempo small{color:var(--txt3);margin-left:6px}
.tent{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:6px;font-size:.8rem}
.travado{opacity:.5;pointer-events:none}
fieldset:disabled{opacity:.85}

@media (max-width:1100px){.grade2,.grade3{grid-template-columns:1fr}}
@media (max-width:820px){
  .topo{position:relative;top:0}
  .nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;margin:0}
  .cargas{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{padding:8px}
  .painel{padding:13px}
  .g2,.g3{grid-template-columns:1fr}
  .linha-it{grid-template-columns:minmax(0,1fr) 64px 34px}
  .linha-it .preco{display:none}
  .nav button span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca"><span id="logo"></span><span><b>ERP</b><small id="empresa">Operação</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="dir">
      <span class="sync" id="sync"><i></i><span>conectando…</span></span>
      <button type="button" class="btn-ic" id="btAtualizar" title="Recarregar"></button>
      <button type="button" class="btn" id="btNovoPed" data-perm="acao:pedidos" hidden></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script src="/static/aurora.js?v=6"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg;
Object.assign(A.ICONES, {
  caminhao: A.ICONES.caminhao || '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  retorno: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  painel: '<rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/>',
  pedido: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  produto: '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
  impressora: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
});
A.fundo();
document.getElementById("logo").outerHTML = A.orbe("caixa", "#22d3ee");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;

/* ══════ ESTADO ══════ */
const API = "/api/erp";
const COLS = ["produtos", "parceiros", "saldos", "pedidos", "cargas", "movimentos"];
const S = { produtos: {}, parceiros: {}, saldos: {}, pedidos: {}, cargas: {}, movimentos: {}, config: {}, perm: { acoes: {}, campos: {} }, locais: [], destinos: [], hoje: "" };

/* ══════ API ══════ */
function sync(e, t) { const el = $("#sync"); el.className = "sync " + (e || ""); el.lastElementChild.textContent = t; }
async function api(url, op = {}) {
  sync("salvando", op.method && op.method !== "GET" ? "salvando…" : "carregando…");
  try {
    const r = await A.api(API + url, op);
    if (r && r.mudou) aplicar(r.mudou);
    sync("", "atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }));
    return r;
  } catch (e) {
    sync("erro", "erro");
    if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); }
    throw e;
  }
}
function aplicar(m) {
  COLS.forEach((col) => (m[col] || []).forEach((d) => (S[col][d.id] = d)));
  (m.removidos || []).forEach((x) => delete S[x.col][x.id]);
}
const falha = (e) => A.toast("⚠ " + esc(e.message), [], { cor: "var(--rosa)", duracao: 9000 });
const ok = (t) => A.toast("✓ " + t, [], { cor: "var(--verde)" });
async function carregar() {
  const d = await api("/estado");
  COLS.forEach((col) => (S[col] = Object.fromEntries(d[col].map((x) => [x.id, x]))));
  Object.assign(S, { config: d.config, perm: d.perm, locais: d.locais, destinos: d.destinos, hoje: d.hoje, admin: !!d.admin });
  if (!V.dia) V.dia = S.hoje;

}

const resumoItens = (its, max = 2) => { const l = (its || []).map((i) => `${i.qtd}× ${prod(i.produto_id).nome}`); return esc(l.slice(0, max).join(" · ") + (l.length > max ? ` · +${l.length - max}` : "")); };

const limVei = (v, base = plano()) => ({ pontos: +v?.max_pontos || +base.max_pontos || 0, m3: +v?.max_m3 || +base.max_m3 || 0, kg: +v?.max_kg || +base.max_kg || 0, vol: +v?.capacidade || 0 });

  }).join("") + (Object.keys(lim).some((k) => lim[k] && tot[k] > lim[k]) ? `<div class="aviso mal">Passou do limite do veículo.</div>` : "");

/* ══════ INDICADORES ══════ */
function indicadores(dias) {
  const ini = addDia(S.hoje, -dias + 1), ts = [];
  lista("pedidos").forEach((p) => (p.tentativas || []).forEach((t) => { if (t.data >= ini && t.data <= S.hoje) ts.push({ ...t, pedido: p }); }));
  const por = (r) => ts.filter((t) => t.resultado === r).length;
  const primeiras = ts.filter((t) => t.n === 1), acerto = primeiras.filter((t) => t.resultado === "entregue").length;
  const movs = lista("movimentos").filter((m) => m.em.slice(0, 10) >= ini);
  const perdas = movs.filter((m) => m.para === "perdas");
  return {
    ts, ent: por("entregue"), aus: por("ausente"), ava: por("avaria"), rec: por("recusado"), total: ts.length, primeiras: primeiras.length, acerto,
    assert: pct(acerto, primeiras.length), efetivas: por("entregue") + por("avaria"), movs,
    perdasQ: perdas.reduce((s, m) => s + m.qtd, 0), perdasV: perdas.reduce((s, m) => s + m.qtd * Number(m.custo_unit || 0), 0),
    retornos: movs.filter((m) => ["retorno_avaria", "recusa", "recolha_troca"].includes(m.tipo)).reduce((s, m) => s + m.qtd, 0),
    valorEst: lista("produtos").reduce((s, p) => s + ["disponivel", "reservado", "transito", "outlet"].reduce((a, l) => a + (saldo(p.id)[l] || 0), 0) * Number(p.custo || 0), 0),
    abaixo: lista("produtos").filter((p) => p.ativo !== false && (saldo(p.id).disponivel || 0) < Number(p.minimo || 0)),
  };
}

      ${kpi("Assertividade", pctTxt(I.acerto, I.primeiras), `${I.acerto} de ${I.primeiras} entregues na 1ª tentativa, sem avaria`, I.assert >= 90 ? "#34d399" : I.assert >= 75 ? "#e8b33d" : "#fb7185", I.assert)}

/* ── ponte com o módulo Tickets: atendimentos do pedido + abrir ticket ── */
async function ticketsDoPedido(p, cx) {

  catch (_) { box.remove(); return; }
  if (!d.configurado || d.sem_acesso) { box.remove(); return; }
  const SITU = { aberto: ["Aberto", "#fbbf24"], em_andamento: ["Em andamento", "#60a5fa"], aguardando: ["Aguardando", "#fb923c"], resolvido: ["Resolvido", "#34d399"], finalizado: ["Finalizado", "#a3a3a3"], cancelado: ["Cancelado", "#6b7183"] };
  const abrirMod = (id) => { try { (window.top || window).postMessage({ hub: "abrir", id: "tickets", hash: "t=" + encodeURIComponent(id) }, location.origin); } catch (_) {} };

    ${d.tickets.length ? d.tickets.map((t) => `<div class="tent" style="cursor:pointer" data-tk="${esc(t.id)}"><span class="etq" style="--c:${(SITU[t.status] || ["", "#888"])[1]}">${(SITU[t.status] || [t.status])[0]}</span>

    ${d.pode_abrir ? `<button type="button" class="btn v p" id="tkAbrir" style="margin-top:8px">${svg("mais")} Abrir ticket deste pedido</button>` : ""}`;
  box.querySelectorAll("[data-tk]").forEach((x) => (x.onclick = () => abrirMod(x.dataset.tk)));
  const b = $("#tkAbrir", box);
  if (b) b.onclick = () => {
    A.modal({ titulo: `Abrir ticket · pedido #${p.numero}`, icone: "mensagem", largura: 520,
      html: `<label class="campo">Assunto<input id="tkA" value="Pedido #${p.numero}"></label>
        <label class="campo" style="margin-top:10px">O que aconteceu<textarea id="tkD" rows="4"></textarea></label>
        <label class="chave" style="--c:var(--verde);margin-top:10px"><input type="checkbox" id="tkMeu" checked><span class="trilho"></span>Já deixar comigo</label>`,
      botoes: [{ rotulo: "Cancelar" }, { rotulo: "Abrir ticket", classe: "btn", principal: true, acao: async (c2) => {
        try { const r = await A.api(`/api/tickets/erp/pedido/${encodeURIComponent(p.id)}/abrir`, { method: "POST", body: { assunto: $("#tkA", c2).value, descricao: $("#tkD", c2).value, atribuir_a_mim: $("#tkMeu", c2).checked } });
          ok("Ticket aberto."); ticketsDoPedido(p, cx); abrirMod(r.id); }
        catch (e) { falha(e); return false; }
      } }] });
  };
}
function perguntar(rotulo, valor = "") {

function agendar(ids) {
  const ps = ids.map((i) => S.pedidos[i]).filter(Boolean);
  const sug = ps[0]?.agendamento?.data && ps[0].agendamento.data >= S.hoje ? ps[0].agendamento.data : addDia(S.hoje, 1);
  A.modal({
    titulo: ps.length > 1 ? `Agendar ${ps.length} pedidos` : `${ps[0].agendamento?.data ? "Reagendar" : "Agendar"} pedido #${ps[0].numero} · ${ps[0].cliente_nome}`, icone: "calendario", cor: "#8b5cf6", largura: 520,
    html: `${ps.length === 1 && ps[0].agendamento?.data ? `<div class="aviso at" style="margin-bottom:12px">Hoje agendado para <b>${dBR(ps[0].agendamento.data)}</b>${ps[0].agendamento.janela ? " · " + esc(ps[0].agendamento.janela) : ""}. Escolha a nova data — o cliente vê a mudança no app e no ticket.</div>` : ""}
      <div class="g2"><label class="campo">Data da entrega<input type="date" id="aData" value="${sug}" min="${S.hoje}"></label>
      <label class="campo">Janela<select id="aJan">${(S.config.janelas || []).map((j) => `<option${ps.length === 1 && ps[0].agendamento?.janela === j ? " selected" : ""}>${esc(j)}</option>`).join("")}</select></label></div>
      <label class="campo" style="margin-top:10px">Observação para a entrega<input id="aObs" value="${ps.length === 1 ? esc(ps[0].agendamento?.obs || "") : ""}" placeholder="ex.: ligar antes, portaria, subir escada…"></label>
      <div class="dica" id="aCarga"></div>`,
    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Agendar", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
      const body = { acao: "agendar", data: $("#aData", cx).value, janela: $("#aJan", cx).value, obs: $("#aObs", cx).value };
      let n = 0;
      for (const p of ps) { try { await api(`/pedidos/${p.id}/acao`, { method: "POST", body }); n++; } catch (e) { falha(new Error(`#${p.numero}: ${e.message}`)); } }
      if (!n) return false;
      ok(`${n} pedido(s) agendado(s) para ${dBR(body.data)}.`); V.sel.clear(); V.dia = body.data; render();
    } }],
    aoAbrir(cx) { const at = () => { const d = $("#aData", cx).value, k = lista("pedidos").filter((p) => p.agendamento?.data === d && ["agendado", "em_carga"].includes(p.status)); $("#aCarga", cx).innerHTML = `Já agendados nesse dia: <b>${k.length}</b> pedido(s), ${k.reduce((s, p) => s + volumes(p), 0)} volume(s).`; }; $("#aData", cx).oninput = at; at(); },
  });
}

    ${bq ? `<div class="bloco" style="margin-bottom:14px"><h3>${svg("filtro")} ${achados.length} resultado(s) para “${esc(V.bAg)}” <small>todos os dias</small></h3>
      ${achados.length ? `<div class="lst">${achados.map((p) => cardPed(p, { extra: (p.agendamento?.data ? `<br><button type="button" class="btn v p" data-irdia="${p.agendamento.data}" style="margin-top:6px">${svg("calendario")}Ver o dia ${dBR(p.agendamento.data)}</button>` : `<br><span class="mini c" style="--c:#60a5fa">a agendar</span>`) + botaoReag(p) })).join("")}</div>` : `<p class="dica">Nenhum pedido encontrado.</p>`}</div>` : ""}
    <div class="chips" style="margin-bottom:12px">${[["sem", "Sem agendamento", aAg.length], ["agendados", "Agendados", nAgend]].map(([k, r, n]) => `<button type="button" class="chip${V.agEt === k ? " ativo" : ""}" data-aget="${k}">${r}<small>${n}</small></button>`).join("")}</div>

      if (!body.pedidos.length && !c) { A.toast("Selecione ao menos um pedido.", [], { cor: "var(--rosa)" }); return false; }

      const desenhar = () => {

          <span><b>#${p.numero} · ${esc(p.cliente_nome)}</b><span class="sub">${esc(endTxt(p.endereco))} · ${volumes(p)} vol.${p.agendamento?.janela ? " · " + esc(p.agendamento.janela) : ""}${p.tipo === "troca" ? " · troca" : ""}</span>${puxadoTag(p, data)}</span>
          <span class="bxs" style="--c:#94a3b8"><button type="button" data-up="${i}" aria-label="Subir">↑</button><button type="button" data-dn="${i}" aria-label="Descer">↓</button></span></div>`; }).join("") || `<p class="dica">Sem pedidos agendados nesse dia.</p>`;
        const tot = { pontos: 0, vol: 0, m3: 0, kg: 0 };
        ordem.filter((i) => marcados.has(i)).forEach((i) => { const m = med(S.pedidos[i]); tot.pontos++; tot.vol += m.vol; tot.m3 += m.m3; tot.kg += m.kg; });
        $("#cCap", cx).innerHTML = barras(tot, limVei(parc($("#cVei", cx).value))) + ($("#cVei", cx).value ? "" : `<p class="dica">Escolha o veículo para ver a ocupação (limites em WROUTER › Motoristas e app › Veículos).</p>`);
      };
      cx.addEventListener("change", (e) => { if (e.target.dataset.m) { e.target.checked ? marcados.add(e.target.dataset.m) : marcados.delete(e.target.dataset.m); desenhar(); } if (e.target.id === "cVei") desenhar(); });
      cx.addEventListener("click", (e) => {
        const u = e.target.dataset.up, d = e.target.dataset.dn;
        if (u != null && +u > 0) { [ordem[+u - 1], ordem[+u]] = [ordem[+u], ordem[+u - 1]]; desenhar(); }
        if (d != null && +d < ordem.length - 1) { [ordem[+d + 1], ordem[+d]] = [ordem[+d], ordem[+d + 1]]; desenhar(); }
      });
      desenhar();
    },
  });
}

/* ══════ CARGAS ══════ */
// pedido de outro dia (antecipado/remarcado) ou ainda sem agenda: ao entrar na carga a agenda passa a ser a data da carga
function puxadoTag(p, data) {
  const d = p.agendamento?.data;
  if (p.carga_id) return "";
  if (p.status !== "agendado" || !d) return `<span class="mini c" style="--c:#60a5fa">sem agenda → ${dBR(data)}</span>`;
  if (d !== data) return `<span class="mini c" style="--c:#e8b33d">${d > data ? "antecipa" : "remarca"} ${dBR(d)} → ${dBR(data)}</span>`;
  return "";
}
function pedidosParaCarga() {
  const q = V.pBusca.toLowerCase().trim();
  return lista("pedidos").filter(prontoCarga)
    .filter((p) => (p.status !== "agendado" || !p.agendamento?.data ? V.pSemAg : p.agendamento.data >= V.pDe && p.agendamento.data <= V.pAte))
    .filter((p) => !V.pJan || (p.agendamento?.janela || "") === V.pJan)
    .filter((p) => !q || `${p.numero} ${p.cliente_nome} ${p.endereco?.bairro || ""} ${p.endereco?.cidade || ""} ${p.endereco?.cep || ""} ${p.endereco?.logradouro || ""}`.toLowerCase().includes(q))
    .sort((a, b) => (a.agendamento?.data || "9").localeCompare(b.agendamento?.data || "9") || a.numero - b.numero);
}
function blocoPuxar() {
  if (!pode("cargas")) return "";
  const am = addDia(S.hoje, 1);
  if (!V.pDe) V.pDe = am; if (!V.pAte) V.pAte = am; if (!V.pData) V.pData = am;
  const ps = pedidosParaCarga(), ids = ps.map((p) => p.id), sel = [...V.sel].filter((id) => ids.includes(id));
  const tot = { pontos: 0, vol: 0, m3: 0, kg: 0 };
  (sel.length ? sel : ids).forEach((i) => { const m = med(S.pedidos[i]); tot.pontos++; tot.vol += m.vol; tot.m3 += m.m3; tot.kg += m.kg; });
  const semGeo = ps.filter((p) => !geoOk(p)).length, semMed = ps.filter((p) => med(p).falta).length;
  const pre = V.pDe === am && V.pAte === am && !V.pSemAg && !V.pJan && !V.pBusca;
  return `<div class="bloco" style="margin-bottom:16px"><h3>${svg("filtro")} Pedidos para carga <small>${pre ? "agendados para amanhã" : `${ps.length} no filtro`}</small></h3>
    <div class="barra-ferr" style="flex-wrap:wrap;gap:8px;align-items:end">
      <label class="campo" style="min-width:140px">Entrega de<input type="date" id="pDe" value="${V.pDe}"></label>
      <label class="campo" style="min-width:140px">até<input type="date" id="pAte" value="${V.pAte}"></label>
      <label class="campo" style="min-width:130px">Janela<select id="pJan"><option value="">Todas</option>${(S.config.janelas || []).map((j) => `<option ${V.pJan === j ? "selected" : ""}>${esc(j)}</option>`).join("")}</select></label>
      <label class="campo" style="flex:1;min-width:180px">Bairro, cidade, CEP, cliente ou nº<input id="pBusca" value="${esc(V.pBusca)}" placeholder="Buscar…"></label>
      <label class="chave" style="--c:var(--ciano);margin-bottom:8px"><input type="checkbox" id="pSemAg" ${V.pSemAg ? "checked" : ""}><span class="trilho"></span>Incluir sem agenda (com estoque reservado)</label>
      <div class="seg" style="margin-bottom:4px"><button type="button" data-atalho="1">Amanhã</button><button type="button" data-atalho="7">Próx. 7 dias</button><button type="button" data-atalho="0">Tudo pronto</button></div>
    </div>
    <div class="chips" style="margin:10px 0"><span class="mini"><b>${tot.pontos}</b>&nbsp;${sel.length ? "selecionado(s)" : "pedido(s)"}</span><span class="mini">${tot.vol} vol.</span><span class="mini">${n1(tot.m3, 2)} m³</span><span class="mini">${n1(tot.kg, 0)} kg</span>
      ${semGeo ? `<span class="mini c" style="--c:#fb923c" title="Localizando o endereço em segundo plano (OpenStreetMap / CEP)">📍 ${semGeo} sem localização</span>` : ""}${semMed ? `<span class="mini c" style="--c:#e8b33d" title="Preencha cubagem e peso no cadastro do produto">${semMed} sem m³/kg no produto</span>` : ""}</div>
    ${ps.length ? `<div class="lst" style="max-height:440px;overflow:auto">${ps.map((p) => { const m = med(p); return cardPed(p, { check: true, extra: `<br><span class="mini">${n1(m.m3, 2)} m³</span><span class="mini">${n1(m.kg, 0)} kg</span>${geoOk(p) ? "" : `<span class="mini c" style="--c:#fb923c">📍 sem localização</span>`}${puxadoTag(p, V.pData)}` }); }).join("")}</div>`
      : `<p class="dica">Nenhum pedido pronto para carga nesse filtro. Amplie as datas ou inclua os sem agenda.</p>`}
    ${ps.length ? `<div class="sep chips" style="align-items:end"><button type="button" class="btn v p" id="pTodos">Selecionar todos</button>${sel.length ? `<button type="button" class="btn v p" id="pLimpa">Limpar seleção</button>` : ""}
      <label class="campo" style="min-width:150px">Data da carga<input type="date" id="pData" value="${V.pData}" min="${S.hoje}"></label>
      <button type="button" class="btn" id="pMontar" ${sel.length ? "" : "disabled"}>${svg("caminhao")}Montar carga · ${sel.length}</button>
      ${pode("planejar") ? `<button type="button" class="btn" id="pSugerir" style="--c:var(--violeta)">${svg("alvo")}Sugerir cargas${sel.length ? ` · ${sel.length}` : ` · ${ps.length}`}</button>` : ""}</div>` : ""}</div>`;
}
function ligarPuxar() {
  const re = () => { V.sel.clear(); render(); };
  $("#pDe")?.addEventListener("change", (e) => { V.pDe = e.target.value; if (V.pAte < V.pDe) V.pAte = V.pDe; re(); });
  $("#pAte")?.addEventListener("change", (e) => { V.pAte = e.target.value; re(); });
  $("#pJan")?.addEventListener("change", (e) => { V.pJan = e.target.value; re(); });
  $("#pSemAg")?.addEventListener("change", (e) => { V.pSemAg = e.target.checked; re(); });
  $("#pData")?.addEventListener("change", (e) => { V.pData = e.target.value; render(); });
  buscaViva("pBusca", "pBusca", render);
  $$("[data-atalho]").forEach((b) => (b.onclick = () => { const n = +b.dataset.atalho, am = addDia(S.hoje, 1);
    if (n === 0) { V.pDe = "2000-01-01"; V.pAte = "2999-12-31"; V.pSemAg = true; } else { V.pDe = am; V.pAte = addDia(S.hoje, n); V.pSemAg = false; } V.pJan = ""; V.pBusca = ""; re(); }));
  const ids = pedidosParaCarga().map((p) => p.id);
  $("#pTodos")?.addEventListener("click", () => { ids.forEach((i) => V.sel.add(i)); render(); });
  $("#pLimpa")?.addEventListener("click", () => { V.sel.clear(); render(); });
  $("#pMontar")?.addEventListener("click", () => montarCarga([...V.sel].filter((i) => ids.includes(i)), null, V.pData));
  $("#pSugerir")?.addEventListener("click", () => { const sel = [...V.sel].filter((i) => ids.includes(i)); sugerirCargas(sel.length ? sel : ids, V.pData); });
  localizarPedidos(ids);
}
// localização dos endereços (grátis, em segundo plano no servidor); a tela pergunta de novo até terminar
let geoTimer = null;
async function localizarPedidos(ids, tentativa = 0) {
  const falta = ids.filter((i) => S.pedidos[i] && !geoOk(S.pedidos[i]) && V.geo[i]?.falhou !== true && (tentativa || !V.geoPedido.has(i)));
  if (!falta.length) return;
  falta.forEach((i) => V.geoPedido.add(i));
  try {
    const r = await A.api(API + "/plano/localizar", { method: "POST", body: { pedidos: falta } });
    let mudou = false;
    Object.entries(r.geo || {}).forEach(([i, g]) => { if (g && JSON.stringify(V.geo[i]) !== JSON.stringify(g)) { V.geo[i] = g; mudou = true; } });
    if (mudou && V.aba === "cargas" && !A.modalAberto()) render();
    clearTimeout(geoTimer);
    if (r.na_fila && tentativa < 30) geoTimer = setTimeout(() => localizarPedidos(ids, tentativa + 1), 5000);
  } catch (_) { /* sem permissão ou offline: segue sem localização */ }
}

/* ── SUGERIR CARGAS (planejamento automático) ── */
function sugerirCargas(ids, data) {
  const pl = plano();
  const veis = lista("parceiros").filter((p) => p.tipo === "veiculo" && p.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  const st = { res: null, data };
  const limTxt = (v) => { const l = limVei(v, {}); return [l.pontos && `${l.pontos} paradas`, l.vol && `${l.vol} vol.`, l.m3 && `${n1(l.m3, 2)} m³`, l.kg && `${n1(l.kg, 0)} kg`].filter(Boolean).join(" · ") || "sem limites próprios (usa os padrões)"; };
  A.modal({
    titulo: `Sugerir cargas · ${ids.length} pedido(s)`, icone: "alvo", cor: "#8b5cf6", largura: 1000,
    html: `<div id="plCfg"><p class="dica" style="margin-top:0">Escolhe a entrega mais urgente e junta os pedidos mais próximos até bater um dos limites. A ordem de entrega sai do CD pelo caminho mais curto${pl.cd?.lat != null ? "" : ` — <b>cadastre o endereço do CD em Ajustes</b> para a rota começar dele`}.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
        <label class="campo">Data das cargas<input type="date" id="plData" value="${data}" min="${S.hoje}"></label>
        <label class="campo">Máx. paradas<input type="number" min="0" id="plPts" value="${pl.max_pontos || 0}"></label>
        <label class="campo">Máx. m³<input type="number" min="0" step="0.1" id="plM3" value="${pl.max_m3 || 0}"></label>
        <label class="campo">Máx. kg<input type="number" min="0" step="10" id="plKg" value="${pl.max_kg || 0}"></label>
        <label class="campo">Raio (km)<input type="number" min="0" step="1" id="plRaio" value="${pl.raio_km || 0}"></label></div>
      <p class="dica">0 = não usa o critério. O limite cadastrado no veículo vale mais que o padrão.</p>
      <label class="chave" style="--c:var(--ciano)"><input type="checkbox" id="plJan" ${pl.respeitar_janela !== false ? "checked" : ""}><span class="trilho"></span>Respeitar a janela (entregas da manhã primeiro, da tarde por último)</label>
      <div class="sep"><h4>Veículos disponíveis <small style="font-weight:400">(nenhum marcado = monta quantas cargas precisar, veículo a definir)</small></h4>
        ${veis.length ? veis.map((v) => `<div class="parada" style="grid-template-columns:22px minmax(0,1fr) minmax(160px,220px);margin-bottom:6px"><input type="checkbox" data-pv="${v.id}" style="accent-color:var(--ciano);width:18px;height:18px">
          <span><b>${esc(v.nome)}</b>${v.placa ? ` <small class="sub" style="display:inline">${esc(v.placa)}</small>` : ""}<span class="sub">${limTxt(v)}</span></span><select data-pm="${v.id}">${opcoesParceiros("motorista", "", "Motorista…")}</select></div>`).join("") : `<p class="dica">Nenhum veículo cadastrado (WROUTER › Motoristas e app).</p>`}</div>
      <div class="chips" style="margin-top:12px"><button type="button" class="btn" id="plGerar">${svg("alvo")}Gerar sugestão</button></div></div>
      <div id="plRes"></div>`,
    botoes: [{ rotulo: "Fechar" }],
    aoAbrir(cx) {
      const desenhar = () => {
        const r = st.res; if (!r) return;
        const info = (i) => r.pontos[i] || {};
        const nC = r.cargas.length;
        const card = (c, k) => {
          const v = parc(c.veiculo_id), lim = limVei(v, { max_pontos: r.limites.max_pontos, max_m3: r.limites.max_m3, max_kg: r.limites.max_kg });
          const tot = { pontos: c.pedidos.length, vol: 0, m3: 0, kg: 0 }; c.pedidos.forEach((i) => { tot.vol += info(i).vol || 0; tot.m3 += info(i).m3 || 0; tot.kg += info(i).kg || 0; });
          const semMed = c.pedidos.some((i) => (info(i).sem_medida || []).length);
          return `<div class="carga luz" style="--c:#22d3ee"><div class="t1">${A.orbe("caminhao", "#22d3ee")}<div><b>Carga ${k + 1} · ${dBR(st.data)}</b><span class="sub">${c.pedidos.length} parada(s)${c.km ? ` · ≈ ${n1(c.km)} km em linha reta${r.cd ? " a partir do CD" : ""}` : ""}</span></div></div>
            <div class="g2"><label class="campo">Veículo<select data-sv="${k}"><option value="">A definir</option>${veisOpc(c.veiculo_id)}</select></label><label class="campo">Motorista<select data-sm="${k}">${opcoesParceiros("motorista", c.motorista_id, "A definir")}</select></label></div>
            ${barras(tot, lim)}${semMed ? `<p class="dica">Há produto sem cubagem/peso no cadastro: m³ e kg podem estar abaixo do real.</p>` : ""}
            ${c.pedidos.map((i, n) => { const p = S.pedidos[i] || {}, f = info(i);
              return `<div class="parada" style="grid-template-columns:24px minmax(0,1fr) auto"><span class="n">${n + 1}</span><span style="min-width:0"><b>#${p.numero} ${esc(p.cliente_nome || "")}</b><span class="sub">${esc(f.bairro || bairro(p))} · ${f.vol} vol. · ${n1(f.m3, 2)} m³ · ${n1(f.kg, 0)} kg${f.janela ? " · " + esc(f.janela) : ""}</span>${puxadoTag(p, st.data)}</span>
                <span class="bxs" style="--c:#94a3b8"><button type="button" data-su="${k}:${n}" aria-label="Subir">↑</button><button type="button" data-sd="${k}:${n}" aria-label="Descer">↓</button><select data-mv="${k}:${i}" aria-label="Mover" style="max-width:120px"><option value="">mover…</option>${r.cargas.map((_, j) => j === k ? "" : `<option value="${j}">p/ carga ${j + 1}</option>`).join("")}<option value="fora">tirar</option></select></span></div>`; }).join("") || `<p class="dica">Carga vazia (não será criada).</p>`}</div>`;
        };
        const foraLista = [...r.sobra, ...r.sem_local.map((i) => ({ id: i, motivo: "sem localização (endereço ainda não encontrado)" }))];
        $("#plRes", cx).innerHTML = `<div class="sep"><h4>Sugestão: ${nC} carga(s) · ${r.cargas.reduce((s, c) => s + c.pedidos.length, 0)} pedido(s)</h4>
          ${nC ? `<div class="cargas">${r.cargas.map(card).join("")}</div>` : `<p class="dica">Nenhuma carga coube nos limites.</p>`}
          ${foraLista.length ? `<div class="sep"><h4>Ficaram de fora · ${foraLista.length}</h4>${foraLista.map((x) => { const p = S.pedidos[x.id] || {};
            return `<div class="parada" style="grid-template-columns:minmax(0,1fr) auto"><span><b>#${p.numero} ${esc(p.cliente_nome || "")}</b><span class="sub">${esc(bairro(p))} — ${esc(x.motivo)}</span></span>
              ${nC && !/reservado|outra carga|está /.test(x.motivo) ? `<select data-mv="fora:${x.id}"><option value="">pôr na…</option>${r.cargas.map((_, j) => `<option value="${j}">carga ${j + 1}</option>`).join("")}</select>` : ""}</div>`; }).join("")}</div>` : ""}
          ${nC ? `<div class="chips" style="margin-top:14px"><button type="button" class="btn" id="plCriar">${svg("check")}Criar ${r.cargas.filter((c) => c.pedidos.length).length} carga(s) para ${dBR(st.data)}</button><span class="dica">Pedidos de outros dias ou sem agenda passam para essa data (fica no histórico e o cliente vê no app).</span></div>` : ""}</div>`;
      };
      const veisOpc = (sel) => veis.map((v) => `<option value="${v.id}" ${v.id === sel ? "selected" : ""}>${esc(v.nome)}</option>`).join("");
      $("#plGerar", cx).onclick = async () => {
        const veiculos = $$("[data-pv]", cx).filter((x) => x.checked).map((x) => ({ veiculo_id: x.dataset.pv, motorista_id: $(`[data-pm="${x.dataset.pv}"]`, cx).value }));
        st.data = $("#plData", cx).value || data;
        const body = { data: st.data, pedidos: ids, veiculos, respeitar_janela: $("#plJan", cx).checked,
          limites: { max_pontos: +$("#plPts", cx).value || 0, max_m3: +$("#plM3", cx).value || 0, max_kg: +$("#plKg", cx).value || 0, raio_km: +$("#plRaio", cx).value || 0 } };
        try { st.res = await api("/plano/sugerir", { method: "POST", body }); desenhar(); $("#plRes", cx).scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) { falha(e); }
      };
      cx.addEventListener("change", (e) => {
        const r = st.res; if (!r) return;
        const t = e.target;
        if (t.dataset.sv != null) { r.cargas[+t.dataset.sv].veiculo_id = t.value; desenhar(); }
        if (t.dataset.sm != null) r.cargas[+t.dataset.sm].motorista_id = t.value;
        if (t.dataset.mv != null && t.value !== "") {
          const [de, pid] = t.dataset.mv.split(":");
          if (de === "fora") { r.sobra = r.sobra.filter((x) => x.id !== pid); r.sem_local = r.sem_local.filter((x) => x !== pid); }
          else r.cargas[+de].pedidos = r.cargas[+de].pedidos.filter((x) => x !== pid);
          if (t.value === "fora") r.sobra.push({ id: pid, motivo: "tirado por você" }); else r.cargas[+t.value].pedidos.push(pid);
          if (!r.pontos[pid]) { const p = S.pedidos[pid], m = med(p); r.pontos[pid] = { ...m, janela: p.agendamento?.janela || "", bairro: bairro(p) }; }
          desenhar();
        }
      });
      cx.addEventListener("click", async (e) => {
        const r = st.res, b = e.target.closest("button"); if (!r || !b) return;
        const mv = (s, d) => { const [k, n] = s.split(":").map(Number), l = r.cargas[k].pedidos, j = n + d; if (j < 0 || j >= l.length) return; [l[n], l[j]] = [l[j], l[n]]; desenhar(); };
        if (b.dataset.su) mv(b.dataset.su, -1);
        if (b.dataset.sd) mv(b.dataset.sd, 1);
        if (b.id === "plCriar") {

          catch (er) { falha(er); b.disabled = false; }
        }
      });
    },
  });
}

/* ── FATURAMENTO ── */
const nfTag = (c) => {
  if (c.status !== "montando" || !c.pedidos.length) return "";
  const n = c.pedidos.filter((i) => S.pedidos[i]?.nf).length, tudo = n === c.pedidos.length;
  if (!n && !plano().exigir_faturamento) return "";
  return `<span class="mini c" style="--c:${tudo ? "#34d399" : "#fb923c"}" title="Faturamento">🧾 ${tudo ? "faturada" : `${n}/${c.pedidos.length} com NF`}</span>`;
};
function faturar(c) {
  A.modal({
    titulo: `Faturar carga ${c.numero} · ${dBR(c.data)}`, icone: "documento", cor: "#34d399", largura: 640,

// [NF simplificada] lê o PDF das NF-e completas, confere qual pedido é de cada nota e grava (conta como faturado)
function importarNfs(c, arq) {
  const rd = new FileReader();
  rd.onerror = () => falha(new Error("Não consegui abrir o arquivo."));
  rd.onload = async () => {
    let r; try { r = await api(`/cargas/${c.id}/nf/ler`, { method: "POST", body: { pdf: rd.result } }); } catch (e) { falha(e); return; }
    const opc = (sel) => `<option value="">— não ligar —</option>` + c.pedidos.map((pid) => { const p = S.pedidos[pid]; return p ? `<option value="${pid}" ${pid === sel ? "selected" : ""}>#${p.numero} ${esc(p.cliente_nome)}</option>` : ""; }).join("");
    A.modal({
      titulo: `Notas do PDF · carga ${c.numero}`, icone: "documento", cor: "#34d399", largura: 760,
      html: `<p class="dica" style="margin-top:0">${r.notas.length} nota(s) lida(s). Confira o pedido de cada uma — o hub sugeriu pela chave, nº da NF, pedido, CPF/CNPJ ou nome do cliente.</p>
        ${r.notas.map((x, i) => `<div class="parada" style="grid-template-columns:minmax(0,1fr) 260px;margin-bottom:6px"><span><b>NF ${esc(x.nf.numero)} · série ${esc(x.nf.serie)}</b> · ${esc(x.nf.dest_nome || "")}<span class="sub">${esc(x.nf.dest_doc || "")} · emissão ${esc(x.nf.emissao || "")}${x.nf.pedido_origem ? " · pedido " + esc(x.nf.pedido_origem) : ""} · ${(x.nf.itens || []).length} item(ns)</span>
          <span class="sub" style="color:${x.pid ? "var(--verde)" : "var(--ouro)"}">${x.pid ? "✓ ligado por " + esc(x.como) : "⚠ escolha o pedido"}</span></span>
          <select class="entrada" data-nfi="${i}">${opc(x.pid)}</select></div>`).join("")}`,
      botoes: [{ rotulo: "Cancelar" }, { rotulo: "Gravar NFs", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
        const vinculos = $$("[data-nfi]", cx).map((s) => ({ pid: s.value, nf: r.notas[+s.dataset.nfi].nf })).filter((v) => v.pid);
        const pids = vinculos.map((v) => v.pid); if (new Set(pids).size !== pids.length) { A.toast("Um pedido recebeu duas notas. Confira.", [], { cor: "var(--rosa)" }); return false; }
        try { const x = await api(`/cargas/${c.id}/nf/aplicar`, { method: "POST", body: { vinculos } }); ok(`${x.alterados} NF(s) gravada(s)${x.faturada ? " — carga faturada" : ""}. Use "Etiquetas NF" na carga para imprimir.`); render(); } catch (e) { falha(e); return false; }
      } }],
    });
  };
  rd.readAsDataURL(arq);
}
// [WROUTER] prova de entrega gravada no pedido

// Etapas da aba Cargas (a montagem da carga continua aqui no ERP; o WLOGISTICA começa depois, no palete)
function etapasCarga() {
  const cs = lista("cargas").sort((a, b) => b.data.localeCompare(a.data) || b.numero - a.numero);
  return {
    prontos: lista("pedidos").filter(prontoCarga),
    montando: cs.filter((c) => c.status === "montando"),
    em_rota: cs.filter((c) => c.status === "em_rota" && c.data >= S.hoje),
    baixa: cs.filter((c) => c.status === "em_rota" && c.data < S.hoje),
    finalizada: cs.filter((c) => c.status === "finalizada").slice(0, 24),
  };
}
const ET_CARGA = [["prontos", "Prontos para carga", "#60a5fa"], ["montando", "Cargas em montagem", "#22d3ee"], ["em_rota", "Em rota", "#e8b33d"], ["baixa", "Aguardando baixa", "#fb923c"], ["finalizada", "Finalizadas", "#34d399"]];
// linha compacta: "Carga 2 · 26/11 · veículo · motorista" — clicar abre os pedidos da carga

  $$("[data-cet]").forEach((b) => (b.onclick = () => { V.cEt = b.dataset.cet; lsSet("wd.erp.cEt", V.cEt); V.cAberta = ""; rCargas(); }));

  $$("[data-cedit]").forEach((b) => (b.onclick = () => montarCarga([], S.cargas[b.dataset.cedit])));

    try { await api(`/cargas/${c.id}`, { method: "DELETE" }); ok(`Carga ${c.numero} desfeita.`); render(); } catch (e) { falha(e); } }));
  $$("[data-cprint]").forEach((b) => (b.onclick = () => romaneio(S.cargas[b.dataset.cprint])));

  ligarPuxar();

  return `<div class="carga luz" style="--c:${cor}">
    <div class="t1">${A.orbe("caminhao", cor)}<div><b>Carga ${c.numero} · ${dBR(c.data)}</b><span class="sub">${esc(parc(c.veiculo_id)?.nome || "sem veículo")} · ${esc(parc(c.motorista_id)?.nome || "sem motorista")}${c.ajudante ? " + " + esc(c.ajudante) : ""}</span></div>
      <span class="etq" style="--c:${cor}">${{ montando: "Montando", em_rota: "Em rota", finalizada: "Finalizada" }[c.status]}</span></div>
    <div><span class="mini">${c.pedidos.length} parada(s)</span>${c.status === "montando" ? `<span class="mini">${vol} vol.</span>${wlogTag(c)}${nfTag(c)}` : ""}${c.status !== "montando" ? Object.entries(RES).map(([k, [r, col]]) => { const n = res.filter((x) => x === k).length; return n ? `<span class="mini c" style="--c:${col}">${n} ${r.toLowerCase()}</span>` : ""; }).join("") + (c.status === "em_rota" ? `<span class="mini">${c.pedidos.length - res.length} sem baixa</span>` : "") : ""}</div>
    ${c.pedidos.map((pid, i) => { const p = S.pedidos[pid]; if (!p) return ""; const b = (c.baixas || {})[pid];
      return `<div class="parada"><span class="n">${i + 1}</span><span style="min-width:0;cursor:pointer" data-abrir="${pid}"><b>#${p.numero} ${esc(p.cliente_nome)}</b><span class="sub">${esc(bairro(p))}</span></span>
        ${b ? `<span class="etq" style="--c:${RES[b][1]}">${RES[b][0]}</span>` : c.status === "em_rota" && pode("baixa") ? `<span class="bxs linha2">${Object.entries(RES).map(([k, [r, col]]) => `<button type="button" style="--c:${col}" data-bx="${k}" data-c="${c.id}" data-p="${pid}" data-perm="acao:baixa">${r}</button>`).join("")}</span>` : ""}</div>`; }).join("")}
    <div class="chips">${c.status === "montando" && pode("cargas") ? `<button type="button" class="btn v p" data-cedit="${c.id}">${svg("lapis")}Editar</button><button type="button" class="btn perigo p" data-cdel="${c.id}">${svg("lixo")}Desfazer</button><button type="button" class="btn p" data-csair="${c.id}" data-perm="acao:cargas">${svg("caminhao")}Liberar saída</button>` : ""}${c.status === "montando" && pode("faturar") && c.pedidos.length ? `<button type="button" class="btn v p" data-cfat="${c.id}">${svg("documento")}Faturar</button>` : ""}
      <button type="button" class="btn v p" data-cprint="${c.id}">${svg("impressora")}Romaneio</button>${c.pedidos.some((i) => S.pedidos[i]?.nf?.chave) ? `<button type="button" class="btn v p" data-cetq="${c.id}" title="DANFE Simplificado – Etiqueta (100 × 150 mm) de cada pedido faturado">${svg("impressora")}Etiquetas NF</button>` : ""}</div>
  </div>`;
}
// [WLOGISTICA] situação do armazém na carga (montagem do palete → doca → liberada)
function wlogTag(c) {
  const w = c.wlog || {}, ab = (w.pendencias || []).some((x) => x.status === "aberta");
  const st = ab ? ["divergência no armazém", "#fb7185"] : w.doca?.fim ? ["liberada pelo armazém", "#34d399"] : w.doca ? ["em conferência na doca", "#22d3ee"]

  return `<span class="mini c" style="--c:${st[1]}" title="WLOGISTICA">📦 ${st[0]}</span>`;

function baixa(cid, pid, res) {

  $("#main").innerHTML = `<section class="painel vidro vidro-borda-viva">
    <div class="cab">${A.orbe(ic, "#8b5cf6")}<div><h2>Cadastros</h2><p>Clientes e fornecedores. <b>Motoristas e veículos</b> ficam no <b>WROUTER › Motoristas e app</b>.</p></div>
      <div class="dir">${pode("cadastros") ? `<button type="button" class="btn" id="btCad" data-perm="acao:cadastros">${svg("mais")}Novo</button>` : ""}</div></div>
    <div class="barra-ferr"><div class="seg">${TIPOS_CAD.map(([k, r]) => `<button type="button" data-ct="${k}" style="--c:var(--violeta)" class="${V.cadTipo === k ? "ativo" : ""}">${r} <small>${lista("parceiros").filter((p) => p.tipo === k).length}</small></button>`).join("")}</div>
      <input class="entrada" id="bCad" placeholder="Buscar…" value="${esc(V.bCad)}"></div>
    ${ps.length ? `<div class="tab-w"><table class="t"><tr><th>Nome</th>${V.cadTipo === "veiculo" ? `<th class="num">Capacidade (vol.)</th><th class="num">Paradas</th><th class="num">m³</th><th class="num">kg</th>` : `${vis("contato") ? "<th>Documento</th><th>Telefone</th>" : ""}<th>Endereço</th>`}${V.cadTipo === "cliente" ? `<th class="num">Pedidos</th>` : ""}<th>Situação</th></tr>
      ${ps.map((p) => `<tr class="cl" data-ec="${p.id}"><td><b>${esc(p.nome)}</b></td>${V.cadTipo === "veiculo" ? `<td class="num">${p.capacidade || "—"}</td><td class="num">${p.max_pontos || "—"}</td><td class="num">${p.max_m3 ? n1(p.max_m3, 2) : "—"}</td><td class="num">${p.max_kg ? n1(p.max_kg, 0) : "—"}</td>` : `${vis("contato") ? `<td>${esc(p.doc || "")}</td><td>${esc(p.telefone || "")}</td>` : ""}<td>${esc(endTxt(p.endereco))}</td>`}${V.cadTipo === "cliente" ? `<td class="num">${lista("pedidos").filter((x) => x.cliente_id === p.id).length}</td>` : ""}<td>${p.ativo === false ? `<span class="etq" style="--c:#6b7183">Inativo</span>` : `<span class="etq" style="--c:#34d399">Ativo</span>`}</td></tr>`).join("")}</table></div>` : `<div class="vazio">${A.orbe(ic, "#8b5cf6")}<b>Nenhum cadastro em ${esc(rotT)}</b></div>`}</section>`;
  $$("[data-ct]").forEach((b) => (b.onclick = () => { V.cadTipo = b.dataset.ct; rCadastros(); }));
  buscaViva("bCad", "bCad", rCadastros);
  $("#btCad")?.addEventListener("click", () => editarParceiro(null, V.cadTipo));
  $$("[data-ec]").forEach((r) => (r.onclick = () => editarParceiro(r.dataset.ec)));
}
function editarParceiro(id, tipo, depois) {
  const p = id ? S.parceiros[id] : { tipo, ativo: true, endereco: {} };
  tipo = p.tipo;
  const so = !pode("cadastros"), e = p.endereco || {};
  const rotT = { cliente: "Cliente", fornecedor: "Fornecedor", motorista: "Motorista", veiculo: "Veículo" }[tipo];
  A.modal({
    titulo: id ? `${rotT} · ${p.nome}` : `Novo ${rotT.toLowerCase()}`, icone: { cliente: "usuario", fornecedor: "caixa", motorista: "usuarios", veiculo: "caminhao" }[tipo], cor: "#8b5cf6", largura: 700,
    html: `<fieldset ${so ? "disabled" : ""} style="border:0;padding:0;margin:0">
      <label class="campo">${tipo === "veiculo" ? "Identificação (placa · modelo)" : "Nome / razão social"} *<input id="cNome" value="${esc(p.nome || "")}" autofocus></label>
      ${tipo === "cliente" ? `<label class="campo" style="margin-top:10px">Código do cliente <small style="font-weight:400;color:var(--txt3)">(o mesmo dos Tickets — liga o atendimento aos pedidos)</small><input id="cCod" value="${esc(p.codigo || "")}" placeholder="em branco = automático (6 letras e números)"></label>` : ""}
      ${tipo === "veiculo" ? `<div class="g2" style="margin-top:10px"><label class="campo">Placa<input id="cPlaca" value="${esc(p.placa || "")}"></label><label class="campo">Capacidade (volumes)<input type="number" id="cCap" min="0" value="${p.capacidade || 0}"></label></div>
      <div class="g3" style="margin-top:10px"><label class="campo">Máx. paradas<input type="number" id="cPts" min="0" value="${p.max_pontos || 0}"></label><label class="campo">Máx. m³ (baú)<input type="number" id="cM3" min="0" step="0.1" value="${p.max_m3 || 0}"></label><label class="campo">Máx. kg<input type="number" id="cKg" min="0" step="10" value="${p.max_kg || 0}"></label></div>
      <p class="dica">Limites do planejamento de cargas (0 = usa o padrão de Ajustes).</p>` :
      `${vis("contato") ? `<div class="g3" style="margin-top:10px" data-perm="campo:contato"><label class="campo">CPF / CNPJ<input id="cDoc" value="${esc(p.doc || "")}" ${edita("contato") ? "" : "disabled"}></label><label class="campo">Telefone<input id="cTel" value="${esc(p.telefone || "")}" ${edita("contato") ? "" : "disabled"}></label><label class="campo">E-mail<input id="cMail" value="${esc(p.email || "")}" ${edita("contato") ? "" : "disabled"}></label></div>
      ${tipo === "cliente" ? `<div class="g3" style="margin-top:10px"><label class="campo">Data de nascimento<input type="date" id="cNasc" min="1900-01-01" value="${esc(p.nascimento || "")}" ${edita("contato") ? "" : "disabled"}></label></div>` : ""}` : ""}
      ${tipo !== "motorista" ? `<div class="sep"><h4>Endereço${tipo === "cliente" ? " de entrega" : ""}</h4>
        <div style="display:grid;grid-template-columns:110px minmax(0,2fr) 80px minmax(0,1fr);gap:10px"><label class="campo">CEP<input id="eCep" value="${esc(e.cep || "")}"></label><label class="campo">Logradouro<input id="eLog" value="${esc(e.logradouro || "")}"></label><label class="campo">Nº<input id="eNum" value="${esc(e.numero || "")}"></label><label class="campo">Complemento<input id="eCompl" value="${esc(e.complemento || "")}"></label></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 70px;gap:10px;margin-top:10px"><label class="campo">Bairro<input id="eBai" value="${esc(e.bairro || "")}"></label><label class="campo">Cidade<input id="eCid" value="${esc(e.cidade || "")}"></label><label class="campo">UF<input id="eUf" maxlength="2" value="${esc(e.uf || "")}"></label></div>
        <label class="campo" style="margin-top:10px">Referência<input id="eRef" value="${esc(e.referencia || "")}"></label></div>` : ""}`}
      <div class="sep"><label class="chave" style="--c:var(--verde)"><input type="checkbox" id="cAtivo" ${p.ativo === false ? "" : "checked"}><span class="trilho"></span>Ativo</label></div>
      <label class="campo" style="margin-top:10px">Observações<textarea id="cObs" rows="2">${esc(p.obs || "")}</textarea></label></fieldset>`,
    botoes: so ? [{ rotulo: "Fechar" }] : [{ rotulo: "Cancelar" }, { rotulo: "Salvar", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
      const v = (s) => $(s, cx)?.value ?? "";
      const body = { tipo, nome: v("#cNome"), ativo: $("#cAtivo", cx).checked, obs: v("#cObs") };
      if ($("#cCod", cx)) body.codigo = v("#cCod").trim();
      if (tipo === "veiculo") Object.assign(body, { placa: v("#cPlaca"), capacidade: +v("#cCap") || 0, max_pontos: +v("#cPts") || 0, max_m3: +v("#cM3") || 0, max_kg: +v("#cKg") || 0 });
      else {
        if ($("#cDoc", cx) && edita("contato")) Object.assign(body, { doc: v("#cDoc"), telefone: v("#cTel"), email: v("#cMail"), ...($("#cNasc", cx) ? { nascimento: v("#cNasc") } : {}) });
        if ($("#eLog", cx)) body.endereco = { cep: v("#eCep"), logradouro: v("#eLog"), numero: v("#eNum"), complemento: v("#eCompl"), bairro: v("#eBai"), cidade: v("#eCid"), uf: v("#eUf").toUpperCase(), referencia: v("#eRef") };
      }
      try { const r = id ? await api("/parceiros/" + id, { method: "PUT", body }) : await api("/parceiros", { method: "POST", body });
        aplicar({ parceiros: [r.parceiro] }); ok(`${rotT} salvo.`); depois ? depois(r.parceiro) : render(); }
      catch (er) { falha(er); return false; }
    } }],
  });
}

/* ══════ AJUSTES ══════ */
function rAjustes() {
  const c = S.config, vazio = !lista("produtos").length && !lista("pedidos").length;
  const lst = (k, r) => `<label class="campo">${r} <small style="font-weight:400">(um por linha)</small><textarea data-cfg="${k}" rows="4">${esc((c[k] || []).join("\n"))}</textarea></label>`;
  $("#main").innerHTML = `<section class="painel vidro vidro-borda-viva">
    <div class="cab">${A.orbe("ajustes", "#94a3b8")}<div><h2>Ajustes do ERP</h2><p>Nomes dos locais de estoque, janelas de entrega e motivos usados nos indicadores.</p></div>
      <div class="dir"><button type="button" class="btn" id="btCfg">${svg("check")}Salvar ajustes</button></div></div>
    <div class="grade2"><div class="bloco"><h3>${svg("casa")} Empresa</h3><label class="campo">Nome exibido<input id="cfEmp" value="${esc(c.empresa || "")}"></label>
      <div class="sep"><h4>Nomes dos locais de estoque</h4><div class="g2">${S.locais.map((l) => `<label class="campo"><span style="color:${COR_LOCAL[l]}">● ${l}</span><input data-rot="${l}" value="${esc(rot(l))}"></label>`).join("")}</div></div></div>
      <div class="bloco"><h3>${svg("lista")} Listas</h3><div class="g2">${lst("janelas", "Janelas de entrega")}${lst("categorias", "Categorias de produto")}${lst("motivos_ausencia", "Motivos de ausência")}${lst("motivos_avaria", "Motivos de avaria")}${lst("motivos_troca", "Motivos de troca")}</div></div></div>
    <div class="sep"><div class="bloco"><h3>${svg("caminhao")} Planejamento de cargas</h3>
      <label class="campo">Endereço do CD (de onde as cargas saem)<input id="plEnd" value="${esc(plano().cd?.endereco || "")}" placeholder="Rua, número, bairro, cidade - UF, CEP"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:10px"><label class="campo">Latitude<input id="plLat" value="${plano().cd?.lat ?? ""}" inputmode="decimal"></label><label class="campo">Longitude<input id="plLng" value="${plano().cd?.lng ?? ""}" inputmode="decimal"></label>
        <button type="button" class="btn v" id="plAchar">${svg("mapa")}Localizar</button></div><p class="dica" id="plAchou">${plano().cd?.lat != null ? "CD localizado ✓" : "Sem o CD a rota sugerida começa pela ponta mais distante."}</p>
      <h4 style="margin-top:12px">Limites padrão por carga <small style="font-weight:400">(0 = não usa; o limite do veículo vale mais)</small></h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px"><label class="campo">Máx. paradas<input type="number" min="0" id="plPts" value="${plano().max_pontos || 0}"></label><label class="campo">Máx. m³<input type="number" min="0" step="0.1" id="plM3" value="${plano().max_m3 || 0}"></label>
        <label class="campo">Máx. kg<input type="number" min="0" step="10" id="plKg" value="${plano().max_kg || 0}"></label><label class="campo">Raio da carga (km)<input type="number" min="0" step="1" id="plRaio" value="${plano().raio_km || 0}"></label></div>
      <div style="display:grid;gap:8px;margin-top:12px"><label class="chave" style="--c:var(--ciano)"><input type="checkbox" id="plJanA" ${plano().respeitar_janela !== false ? "checked" : ""}><span class="trilho"></span>Respeitar a janela na ordem de entrega (manhã → sem janela → tarde)</label>
        <label class="chave" style="--c:var(--verde)"><input type="checkbox" id="plFat" ${plano().exigir_faturamento ? "checked" : ""}><span class="trilho"></span>Exigir faturamento (NF de todos os pedidos) antes da saída e do app do motorista</label></div></div></div>
    ${vazio ? `<div class="sep"><button type="button" class="btn v" id="btEx">${svg("foguete")}Carregar dados de exemplo</button><p class="dica">Cria um cenário completo para conhecer o sistema (só com o ERP vazio).</p></div>` : ""}
    ${S.admin ? `<div class="sep"><h4 style="color:var(--rosa)">Começar do zero</h4><p class="dica">Baixe o backup antes. Zerar apaga produtos, clientes, saldos, pedidos, cargas e movimentos (os ajustes desta tela ficam e a numeração volta para 1). Não tem volta.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><a class="btn v" href="/api/erp/backup" download>${svg("baixar")}Baixar backup (JSON)</a><button type="button" class="btn perigo" id="btZerar">${svg("lixo")}Zerar ERP</button></div></div>` : ""}
    <div class="sep"><h4>Próximas etapas</h4><p class="dica">Pré-nota fiscal (DANFE de conferência, sem valor fiscal) · Financeiro (receber/pagar e conciliação) · RH (funcionários) — sobre este mesmo núcleo.</p></div></section>`;
  $("#btEx")?.addEventListener("click", carregarExemplo);
  $("#btZerar")?.addEventListener("click", () => {
    A.modal({ titulo: "Zerar o ERP", icone: "atencao", cor: "var(--rosa)", largura: 460,
      html: `<p>Isto apaga <b>todos</b> os dados do ERP no banco. Já baixou o backup?</p><label class="campo" style="margin-top:10px">Digite <b>ZERAR</b> para confirmar<input id="zConf" autocomplete="off"></label>`,
      botoes: [{ rotulo: "Voltar" }, { rotulo: "Zerar agora", classe: "btn perigo", principal: true, acao: async () => {
        if ($("#zConf").value.trim().toUpperCase() !== "ZERAR") { A.toast("Digite ZERAR."); return false; }
        try { const r = await api("/zerar", { method: "POST", body: { confirmar: "ZERAR", manter_config: true } });
          ok(`ERP zerado: ${Object.values(r.apagados).reduce((a2, b2) => a2 + b2, 0)} registros apagados.`); await carregar(); } catch (e) { falha(e); return false; }
      } }] });
  });
  $("#btCfg").onclick = async () => {
    const body = { empresa: $("#cfEmp").value, rotulos: Object.fromEntries($$("[data-rot]").map((x) => [x.dataset.rot, x.value])) };
    $$("[data-cfg]").forEach((x) => (body[x.dataset.cfg] = x.value.split("\n").map((s) => s.trim()).filter(Boolean)));
    const pl = { cd: { endereco: $("#plEnd").value, lat: $("#plLat").value.replace(",", "."), lng: $("#plLng").value.replace(",", ".") }, max_pontos: +$("#plPts").value || 0, max_m3: +$("#plM3").value || 0,
      max_kg: +$("#plKg").value || 0, raio_km: +$("#plRaio").value || 0, respeitar_janela: $("#plJanA").checked, exigir_faturamento: $("#plFat").checked };
    try { const r = await api("/config", { method: "PUT", body }); const r2 = await api("/plano/config", { method: "PUT", body: pl }); S.config = { ...r.config, plano: r2.plano }; ok("Ajustes salvos."); render(); } catch (e) { falha(e); }
  };
  $("#plAchar").onclick = async () => {
    try { const r = await api("/plano/cd/localizar", { method: "POST", body: { endereco: $("#plEnd").value } }); $("#plLat").value = r.lat; $("#plLng").value = r.lng; $("#plAchou").textContent = `Encontrado: ${r.achado || ""} — confira e salve os ajustes.`; }
    catch (e) { falha(e); }
  };
}

/* ══════ INÍCIO ══════ */
$("#btAtualizar").innerHTML = svg("repetir");
$("#btNovoPed").innerHTML = svg("mais") + "Novo pedido";
$("#btNovoPed").onclick = () => editarPedido();
$("#btAtualizar").onclick = () => carregar().catch(falha);
// Reflete a rua sem precisar clicar em atualizar: baixa pelo app do motorista, WROUTER, WLOGISTICA…
// (não atualiza com janela aberta nem enquanto alguém digita, para não perder o que está sendo feito)
const podeAtualizar = () => { const a = document.activeElement; return document.visibilityState === "visible" && !A.modalAberto() && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
setInterval(() => { if (podeAtualizar()) carregar().catch(() => {}); }, 20000);
document.addEventListener("visibilitychange", () => { if (podeAtualizar()) carregar().catch(() => {}); });
addEventListener("keydown", (e) => { if (A.modalAberto() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) return; if ((e.key === "n" || e.key === "N") && pode("pedidos")) { e.preventDefault(); editarPedido(); } });
(async () => {
  try { await A.permissoes.carregar("erp"); }
  catch (e) { if (e.status !== 401) $("#main").innerHTML = `<section class="painel vidro"><div class="vazio"><b>Não consegui abrir</b>${esc(e.message)}</div></section>`; return; }
  try { await carregar(); }
  catch (e) { $("#main").innerHTML = `<section class="painel vidro"><div class="vazio">${A.orbe("atencao", "#fb7185")}<b>Não consegui carregar o ERP</b>${esc(e.message)}<button type="button" class="btn v" onclick="location.reload()">Tentar de novo</button></div></section>`; }
})();
})();
</script>
</body>
</html>
