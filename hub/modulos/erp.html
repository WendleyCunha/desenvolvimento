<!--
═══════════════════════════════════════════════════════════════════════════════
 erp.html — ERP · módulo do hub Wendley Desenvolvimento (kit Aurora Glass)
───────────────────────────────────────────────────────────────────────────────
 Núcleo operacional: razão de estoque por LOCAL (disponível, reservado, trânsito,

 reserva automática, agendamento, montagem de carga, saída com baixa automática,
 baixa de entrega (entregue / ausente / avaria / recusa), reenvio, trocas com
 recolha e triagem de retornos com destino. Indicadores de assertividade.
 API: /api/erp (hub/erp.py) — regras e permissões validadas no servidor.
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:20px;flex-wrap:wrap}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.9),rgba(8,10,16,.84))}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca b{display:block;font:700 1.08rem var(--titulo);letter-spacing:-.01em}
.marca small{display:block;font-size:.6rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 auto}
.nav button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:600;color:var(--txt2);transition:.2s;position:relative}
.nav button svg.i{width:15px;height:15px}
.nav button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav button.ativo{color:#04141a;background:var(--ciano);box-shadow:0 0 20px -4px var(--ciano)}
.nav button .bolha{position:absolute;top:-3px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;font-size:.6rem;font-weight:800;font-style:normal;display:grid;place-items:center;background:var(--rosa);color:#fff;box-shadow:0 0 10px var(--rosa)}
.dir{display:flex;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro);box-shadow:0 0 8px var(--ouro);animation:aurRespira 1s infinite}
.sync.erro i{background:var(--rosa);box-shadow:0 0 8px var(--rosa)}
main{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.painel{border-radius:24px;padding:18px}
.cab{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cab h2{margin:0;font:700 1.18rem var(--titulo);letter-spacing:-.01em}
.cab p{margin:2px 0 0;font-size:.78rem;color:var(--txt3)}
.cab .dir{margin-left:auto;flex-wrap:wrap}
.barra-ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.barra-ferr .entrada{max-width:280px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip small{opacity:.7;margin-left:2px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{position:relative;padding:13px 14px;border-radius:15px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);transition:.25s;--c:var(--ciano);text-align:left}
.kpi:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 26px -10px var(--c);transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%)}
.kpi small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.5rem/1.1 var(--titulo);margin-top:8px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:4px}
.kpi .meta-barra{height:5px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.kpi .meta-barra i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.grade2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bloco{border-radius:18px;padding:14px;background:rgba(255,255,255,.025);border:1px solid var(--vidro-borda)}
.bloco h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:650 .9rem var(--titulo)}
.bloco h3 svg.i{width:16px;height:16px;color:var(--ciano)}
.bloco h3 small{margin-left:auto;font:500 .7rem var(--sans);color:var(--txt3)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.7rem;color:var(--txt2);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.graf{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.78rem;margin-bottom:7px}
.hbar .t{height:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--c,var(--ciano));box-shadow:0 0 10px var(--c,var(--ciano))}
.hbar b{text-align:right;font-weight:650}
.alerta-l{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);font-size:.8rem;transition:.2s;text-align:left;width:100%}
.alerta-l:hover{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:rgba(255,255,255,.05)}
.alerta-l b{color:var(--c);font:700 1rem var(--titulo);min-width:28px}

/* tabela */
.tab-w{overflow:auto;border-radius:14px;border:1px solid var(--vidro-borda)}
table.t{width:100%;border-collapse:collapse;font-size:.8rem}
table.t th{position:sticky;top:0;background:rgba(12,14,20,.96);color:var(--txt3);font-weight:650;font-size:.64rem;letter-spacing:.8px;text-transform:uppercase;text-align:left;padding:10px;white-space:nowrap;z-index:1}
table.t td{padding:9px 10px;border-top:1px solid var(--vidro-borda);vertical-align:middle}
table.t tr.cl{cursor:pointer;transition:background .15s}
table.t tr.cl:hover td{background:rgba(34,211,238,.05)}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t .zero{color:var(--txt3);opacity:.45}
table.t .baixo{color:#fda4af;font-weight:700}
.sub{display:block;font-size:.7rem;color:var(--txt3);margin-top:2px}
.vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--txt3);font-size:.84rem;padding:34px 10px}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}

/* agenda */
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-bottom:14px}
.dia{padding:10px;border-radius:14px;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);transition:.2s}
.dia:hover{border-color:rgba(34,211,238,.4)}
.dia.ativo{border-color:var(--ciano);background:rgba(34,211,238,.1);box-shadow:0 0 22px -8px var(--ciano)}
.dia small{display:block;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3)}
.dia b{display:block;font:700 1.15rem var(--titulo);margin-top:2px}
.dia span{display:block;font-size:.68rem;color:var(--txt2);margin-top:4px}
.dia.hoje small{color:var(--ouro2)}
.lst{display:flex;flex-direction:column;gap:7px}
.card-p{--c:var(--ciano);position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);text-align:left;transition:.2s}
.card-p::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--c);box-shadow:0 0 10px var(--c)}
.card-p:hover{border-color:color-mix(in srgb,var(--c) 40%,transparent);background:rgba(255,255,255,.055)}
.card-p b{font-size:.86rem;font-weight:600}
.card-p input[type=checkbox]{width:18px;height:18px;accent-color:var(--ciano)}
.card-p .orbe{width:34px;height:34px;border-radius:11px}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:7px;font-size:.64rem;font-weight:650;color:var(--txt2);background:rgba(255,255,255,.05);border:1px solid var(--vidro-borda);margin:4px 4px 0 0}
.mini svg.i{width:11px;height:11px}
.mini.c{color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
.cap{margin-top:10px}
.cap .t{height:10px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.cap .t i{display:block;height:100%;box-shadow:0 0 12px currentColor;transition:width .5s}
.cap small{font-size:.74rem;color:var(--txt2)}

/* cargas */
.cargas{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.carga{--c:var(--ciano);border-radius:18px;padding:14px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:9px}
.carga .t1{display:flex;align-items:center;gap:10px}
.carga .t1 b{font:700 1rem var(--titulo)}
.carga .t1 .etq{margin-left:auto}
.parada{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 9px;border-radius:12px;background:rgba(255,255,255,.03);font-size:.8rem}
.parada .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .7rem var(--titulo);background:rgba(34,211,238,.15);color:var(--ciano)}
.bxs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.parada .bxs.linha2{grid-column:2/-1;justify-content:flex-start}
.bxs button{padding:5px 8px;border-radius:9px;font-size:.66rem;font-weight:700;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);transition:.2s}
.bxs button:hover{background:var(--c);color:#06120c}

/* retornos */
.colunas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.coluna{--c:var(--ciano);border-radius:18px;padding:12px;background:rgba(255,255,255,.025);border:1px solid color-mix(in srgb,var(--c) 25%,var(--vidro-borda));min-height:120px}
.coluna h4{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:650 .82rem var(--titulo);color:var(--c)}
.coluna h4 b{margin-left:auto;font-size:1rem}
.peca{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--vidro-borda);margin-bottom:6px;font-size:.8rem;width:100%;text-align:left;transition:.2s}
.peca:hover:not(:disabled){border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 0 18px -8px var(--c)}
.peca .q{margin-left:auto;font:700 .95rem var(--titulo);color:var(--c)}

/* forms */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.linha-it{display:grid;grid-template-columns:minmax(0,3fr) 80px 110px 34px;gap:8px;align-items:center;margin-bottom:7px}
.linha-it select,.linha-it input{padding:8px 10px}
.linha-it small{grid-column:1/-1;margin-top:-4px;font-size:.68rem;color:var(--txt3)}
.sep{margin-top:14px;padding-top:12px;border-top:1px solid var(--vidro-borda)}
.sep>h4{margin:0 0 10px;font-size:.64rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3)}
.dica{font-size:.74rem;color:var(--txt3);line-height:1.5;margin:6px 0 0}
.aviso{font-size:.78rem;padding:9px 12px;border-radius:11px;margin-top:10px;line-height:1.5}
.aviso.ok{color:#bbf7d0;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.aviso.mal{color:#fecdd3;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.3)}
.aviso.at{color:#fde68a;background:rgba(232,179,61,.08);border:1px solid rgba(232,179,61,.3)}
.totais{display:flex;justify-content:flex-end;align-items:center;gap:18px;font-size:.84rem;margin-top:8px;flex-wrap:wrap}
.totais b{font:700 1.05rem var(--titulo);color:var(--ouro2)}
.linha-tempo{position:relative;padding-left:18px;margin:0}
.linha-tempo li{list-style:none;position:relative;padding:0 0 10px;font-size:.8rem}
.linha-tempo li::before{content:"";position:absolute;left:-14px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ciano);box-shadow:0 0 8px var(--ciano)}
.linha-tempo li::after{content:"";position:absolute;left:-10.5px;top:15px;bottom:-2px;width:1px;background:var(--vidro-borda-forte)}
.linha-tempo li:last-child::after{display:none}
.linha-tempo small{color:var(--txt3);margin-left:6px}
.tent{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.03);margin-bottom:6px;font-size:.8rem}
.travado{opacity:.5;pointer-events:none}
fieldset:disabled{opacity:.85}

@media (max-width:1100px){.grade2,.grade3{grid-template-columns:1fr}}
@media (max-width:820px){
  .topo{position:relative;top:0}
  .nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;margin:0}
  .cargas{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{padding:8px}
  .painel{padding:13px}
  .g2,.g3{grid-template-columns:1fr}
  .linha-it{grid-template-columns:minmax(0,1fr) 64px 34px}
  .linha-it .preco{display:none}
  .nav button span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca"><span id="logo"></span><span><b>ERP</b><small id="empresa">Operação</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="dir">
      <span class="sync" id="sync"><i></i><span>conectando…</span></span>
      <button type="button" class="btn-ic" id="btAtualizar" title="Recarregar"></button>
      <button type="button" class="btn" id="btNovoPed" data-perm="acao:pedidos" hidden></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script src="/static/aurora.js?v=3"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg;
Object.assign(A.ICONES, {
  caminhao: A.ICONES.caminhao || '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
  retorno: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  painel: '<rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/>',
  pedido: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
  produto: '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
  impressora: '<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
});
A.fundo();
document.getElementById("logo").outerHTML = A.orbe("caixa", "#22d3ee");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;

/* ══════ ESTADO ══════ */
const API = "/api/erp";
const COLS = ["produtos", "parceiros", "saldos", "pedidos", "cargas", "movimentos"];
const S = { produtos: {}, parceiros: {}, saldos: {}, pedidos: {}, cargas: {}, movimentos: {}, config: {}, perm: { acoes: {}, campos: {} }, locais: [], destinos: [], hoje: "" };
const V = { aba: ls("wd.erp.aba", "painel"), periodo: +ls("wd.erp.per", "30"), fPed: "abertos", bPed: "", dia: "", cadTipo: "cliente", bProd: "", bEst: "", bCad: "", sel: new Set() };
function ls(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pode = (a) => !!S.perm.acoes?.[a];
const vis = (c) => (S.perm.campos?.[c] || "editar") !== "oculto";
const edita = (c) => (S.perm.campos?.[c] || "editar") === "editar";
const brl = (v) => "R$ " + Number(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl0 = (v) => "R$ " + Math.round(Number(v || 0)).toLocaleString("pt-BR");
const n0 = (v) => Number(v || 0).toLocaleString("pt-BR");
const pct = (a, b) => (b ? Math.round(a / b * 1000) / 10 : 0);
const pctTxt = (a, b) => pct(a, b).toLocaleString("pt-BR") + "%";
const dBR = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "—";
const dhBR = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)} ${iso.slice(11, 16)}` : "—";
const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const addDia = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const rot = (l) => S.config.rotulos?.[l] || l;
const prod = (id) => S.produtos[id] || { nome: "(produto removido)", sku: "?" };
const parc = (id) => S.parceiros[id] || null;
const lista = (col) => Object.values(S[col]);
const saldo = (pid) => S.saldos[pid] || {};
const STATUS = {
  rascunho: ["Rascunho", "#94a3b8"], confirmado: ["A agendar", "#60a5fa"], agendado: ["Agendado", "#8b5cf6"], em_carga: ["Em carga", "#22d3ee"],
  em_rota: ["Em rota", "#e8b33d"], reagendar: ["Reagendar", "#fb923c"], entregue: ["Entregue", "#34d399"], recusado: ["Recusado", "#fb7185"], cancelado: ["Cancelado", "#6b7183"],
};
const RES = { entregue: ["Entregue", "#34d399"], ausente: ["Ausente", "#fb923c"], avaria: ["Avaria", "#fb7185"], recusado: ["Recusado", "#f43f5e"] };

/* ══════ API ══════ */
function sync(e, t) { const el = $("#sync"); el.className = "sync " + (e || ""); el.lastElementChild.textContent = t; }
async function api(url, op = {}) {
  sync("salvando", op.method && op.method !== "GET" ? "salvando…" : "carregando…");
  try {
    const r = await A.api(API + url, op);
    if (r && r.mudou) aplicar(r.mudou);
    sync("", "atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }));
    return r;
  } catch (e) {
    sync("erro", "erro");
    if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); }
    throw e;
  }
}
function aplicar(m) {
  COLS.forEach((col) => (m[col] || []).forEach((d) => (S[col][d.id] = d)));
  (m.removidos || []).forEach((x) => delete S[x.col][x.id]);
}
const falha = (e) => A.toast("⚠ " + esc(e.message), [], { cor: "var(--rosa)", duracao: 9000 });
const ok = (t) => A.toast("✓ " + t, [], { cor: "var(--verde)" });
async function carregar() {
  const d = await api("/estado");
  COLS.forEach((col) => (S[col] = Object.fromEntries(d[col].map((x) => [x.id, x]))));
  Object.assign(S, { config: d.config, perm: d.perm, locais: d.locais, destinos: d.destinos, hoje: d.hoje, admin: !!d.admin });
  if (!V.dia) V.dia = S.hoje;

}

const volumes = (p) => (p.pendentes || []).reduce((s, i) => s + Number(i.qtd || 0) * Math.max(1, Number(prod(i.produto_id).volumes || 1)), 0);

/* ══════ INDICADORES ══════ */
function indicadores(dias) {
  const ini = addDia(S.hoje, -dias + 1), ts = [];
  lista("pedidos").forEach((p) => (p.tentativas || []).forEach((t) => { if (t.data >= ini && t.data <= S.hoje) ts.push({ ...t, pedido: p }); }));
  const por = (r) => ts.filter((t) => t.resultado === r).length;
  const primeiras = ts.filter((t) => t.n === 1), acerto = primeiras.filter((t) => t.resultado === "entregue").length;
  const movs = lista("movimentos").filter((m) => m.em.slice(0, 10) >= ini);
  const perdas = movs.filter((m) => m.para === "perdas");
  return {
    ts, ent: por("entregue"), aus: por("ausente"), ava: por("avaria"), rec: por("recusado"), total: ts.length, primeiras: primeiras.length, acerto,
    assert: pct(acerto, primeiras.length), efetivas: por("entregue") + por("avaria"), movs,
    perdasQ: perdas.reduce((s, m) => s + m.qtd, 0), perdasV: perdas.reduce((s, m) => s + m.qtd * Number(m.custo_unit || 0), 0),
    retornos: movs.filter((m) => ["retorno_avaria", "recusa", "recolha_troca"].includes(m.tipo)).reduce((s, m) => s + m.qtd, 0),
    valorEst: lista("produtos").reduce((s, p) => s + ["disponivel", "reservado", "transito", "outlet"].reduce((a, l) => a + (saldo(p.id)[l] || 0), 0) * Number(p.custo || 0), 0),
    abaixo: lista("produtos").filter((p) => p.ativo !== false && (saldo(p.id).disponivel || 0) < Number(p.minimo || 0)),
  };
}

function rPainel() {

      ${kpi("Assertividade", pctTxt(I.acerto, I.primeiras), `${I.acerto} de ${I.primeiras} entregues na 1ª tentativa, sem avaria`, I.assert >= 90 ? "#34d399" : I.assert >= 75 ? "#e8b33d" : "#fb7185", I.assert)}

function grafSemanas(sem) {
  const W = 640, H = 220, pl = 30, pb = 26, pt = 14;
  const tot = (s) => Object.keys(RES).reduce((a, k) => a + s[k], 0);
  const max = Math.max(4, ...sem.map(tot)), bw = (W - pl - 10) / Math.max(1, sem.length);
  let g = "";
  for (let i = 0; i <= 4; i++) { const y = pt + (H - pt - pb) * (1 - i / 4); g += `<line x1="${pl}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl - 6}" y="${y + 4}" fill="#6b7183" font-size="10" text-anchor="end">${Math.round(max * i / 4)}</text>`; }
  sem.forEach((s, i) => {
    let y = H - pb; const x = pl + i * bw + bw * .2, w = bw * .6;
    Object.keys(RES).forEach((k) => { const h = (H - pt - pb) * s[k] / max; if (h > 0) { y -= h; g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${RES[k][1]}" opacity=".9"><title>${RES[k][0]}: ${s[k]}</title></rect>`; } });
    if (tot(s)) g += `<text x="${x + w / 2}" y="${y - 5}" fill="#a3a9b8" font-size="10" text-anchor="middle">${tot(s)}</text>`;
    g += `<text x="${x + w / 2}" y="${H - 8}" fill="#6b7183" font-size="10" text-anchor="middle">${s.rot}</text>`;
  });
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tentativas por semana">${g}</svg>`;
}

/* ══════ PEDIDOS ══════ */

function opcoesProdutos(sel) {

function rAgenda() {
  const peds = lista("pedidos");
  const aAg = peds.filter((p) => ["confirmado", "reagendar"].includes(p.status)).sort((a, b) => (b.status === "reagendar") - (a.status === "reagendar") || a.numero - b.numero);
  const dias = Array.from({ length: 14 }, (_, i) => addDia(S.hoje, i - 1));
  const doDia = peds.filter((p) => p.agendamento?.data === V.dia && ["agendado", "em_carga", "em_rota"].includes(p.status)).sort((a, b) => a.numero - b.numero);
  const livres = doDia.filter((p) => p.status === "agendado");
  const selec = [...V.sel].filter((id) => livres.some((p) => p.id === id));
  $("#main").innerHTML = `<section class="painel vidro vidro-borda-viva">
    <div class="cab">${A.orbe("calendario", "#8b5cf6")}<div><h2>Agenda de entregas</h2><p>Agende os confirmados e os que voltaram (ausentes e reposições). Depois selecione e monte a carga do dia.</p></div></div>
    <div class="dias">${dias.map((d) => { const ps = peds.filter((p) => p.agendamento?.data === d && ["agendado", "em_carga", "em_rota"].includes(p.status)); const dt = new Date(d + "T12:00:00");
      return `<button type="button" class="dia${d === V.dia ? " ativo" : ""}${d === S.hoje ? " hoje" : ""}" data-dia="${d}"><small>${d === S.hoje ? "hoje" : SEM[dt.getDay()]}</small><b>${dBR(d)}</b><span>${ps.length} ped. · ${ps.reduce((s, p) => s + volumes(p), 0)} vol.</span></button>`; }).join("")}</div>
    <div class="grade2">
      <div class="bloco"><h3>${svg("caminhao")} ${dBR(V.dia)} · ${doDia.length} pedido(s) <small>${livres.length} sem carga</small></h3>
        ${doDia.length ? `<div class="lst">${doDia.map((p) => cardPed(p, { check: p.status === "agendado" && pode("cargas") })).join("")}</div>` : `<p class="dica">Nenhum pedido agendado nesse dia.</p>`}
        ${pode("cargas") && livres.length ? `<div class="sep chips"><button type="button" class="btn v p" id="selTodos">Selecionar todos sem carga</button>
          <button type="button" class="btn" id="btMontar" ${selec.length ? "" : "disabled"}>${svg("caminhao")}Montar carga · ${selec.length} pedido(s) · ${selec.reduce((s, id) => s + volumes(S.pedidos[id]), 0)} vol.</button></div>` : ""}
      </div>
      <div class="bloco"><h3>${svg("relogio")} A agendar <small>${aAg.length}</small></h3>
        ${aAg.length ? `<div class="lst">${aAg.map((p) => cardPed(p, { extra: pode("agendar") && (p.reservado || !(p.pendentes || []).length) ? `<br><button type="button" class="btn v p" data-ag="${p.id}" style="margin-top:6px">${svg("calendario")}Agendar</button>` : "" })).join("")}</div>` : `<p class="dica">Nada para agendar.</p>`}
      </div>
    </div></section>`;
  $$("[data-dia]").forEach((b) => (b.onclick = () => { V.dia = b.dataset.dia; V.sel.clear(); rAgenda(); }));
  $$("[data-ag]").forEach((b) => (b.onclick = () => agendar([b.dataset.ag])));
  $("#selTodos")?.addEventListener("click", () => { livres.forEach((p) => V.sel.add(p.id)); rAgenda(); });
  $("#btMontar")?.addEventListener("click", () => montarCarga(selec, null));
  ligarCards($("#main"));
}
function montarCarga(ids, c) {
  const atual = c ? c.pedidos : ids;
  const data = c ? c.data : V.dia;
  const candidatos = lista("pedidos").filter((p) => p.agendamento?.data === data && p.status === "agendado").map((p) => p.id);
  const ordem = [...atual, ...candidatos.filter((i) => !atual.includes(i))];
  const marcados = new Set(atual);
  A.modal({
    titulo: c ? `Carga ${c.numero} · ${dBR(c.data)}` : `Montar carga · ${dBR(data)}`, icone: "caminhao", cor: "#22d3ee", largura: 760,
    html: `<div class="g3"><label class="campo">Veículo<select id="cVei">${opcoesParceiros("veiculo", c?.veiculo_id)}</select></label>
      <label class="campo">Motorista<select id="cMot">${opcoesParceiros("motorista", c?.motorista_id)}</select></label>
      <label class="campo">Ajudante<input id="cAju" value="${esc(c?.ajudante || "")}"></label></div>
      <div class="cap" id="cCap"></div>
      <div class="sep"><h4>Pedidos — a ordem é a sequência de entrega (↑ ↓)</h4><div id="cLista"></div></div>
      <label class="campo" style="margin-top:10px">Observação<input id="cObs" value="${esc(c?.obs || "")}"></label>`,
    botoes: [{ rotulo: "Cancelar" }, { rotulo: c ? "Salvar carga" : "Criar carga", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
      const body = { data, veiculo_id: $("#cVei", cx).value, motorista_id: $("#cMot", cx).value, ajudante: $("#cAju", cx).value, obs: $("#cObs", cx).value, pedidos: ordem.filter((i) => marcados.has(i)) };
      if (!body.pedidos.length && !c) { A.toast("Selecione ao menos um pedido.", [], { cor: "var(--rosa)" }); return false; }
      try { c ? await api("/cargas/" + c.id, { method: "PUT", body }) : await api("/cargas", { method: "POST", body }); ok(c ? `Carga ${c.numero} atualizada.` : "Carga criada."); V.sel.clear(); if (!c) V.aba = "cargas"; render(); }
      catch (e) { falha(e); return false; }
    } }],
    aoAbrir(cx) {
      const desenhar = () => {
        $("#cLista", cx).innerHTML = ordem.map((id, i) => { const p = S.pedidos[id]; return `<div class="parada" style="margin-bottom:6px;grid-template-columns:22px minmax(0,1fr) auto"><input type="checkbox" data-m="${id}" ${marcados.has(id) ? "checked" : ""} style="accent-color:var(--ciano);width:18px;height:18px">
          <span><b>#${p.numero} · ${esc(p.cliente_nome)}</b><span class="sub">${esc(endTxt(p.endereco))} · ${volumes(p)} vol.${p.agendamento?.janela ? " · " + esc(p.agendamento.janela) : ""}${p.tipo === "troca" ? " · troca" : ""}</span></span>
          <span class="bxs" style="--c:#94a3b8"><button type="button" data-up="${i}" aria-label="Subir">↑</button><button type="button" data-dn="${i}" aria-label="Descer">↓</button></span></div>`; }).join("") || `<p class="dica">Sem pedidos agendados nesse dia.</p>`;
        const vei = parc($("#cVei", cx).value), cap = Number(vei?.capacidade || 0), vol = ordem.filter((i) => marcados.has(i)).reduce((s, i) => s + volumes(S.pedidos[i]), 0);
        const pc = cap ? Math.round(vol / cap * 100) : 0, cor = !cap ? "#94a3b8" : pc > 100 ? "#fb7185" : pc > 85 ? "#e8b33d" : "#34d399";
        $("#cCap", cx).innerHTML = `<small>Ocupação: <b>${vol}</b> volume(s)${cap ? ` de ${cap} (${pc}%)` : " — escolha um veículo (capacidade em Cadastros)"}</small><div class="t"><i style="width:${Math.min(100, pc)}%;background:${cor};color:${cor}"></i></div>${pc > 100 ? `<div class="aviso mal">Passou da capacidade do veículo.</div>` : ""}`;
      };
      cx.addEventListener("change", (e) => { if (e.target.dataset.m) { e.target.checked ? marcados.add(e.target.dataset.m) : marcados.delete(e.target.dataset.m); desenhar(); } if (e.target.id === "cVei") desenhar(); });
      cx.addEventListener("click", (e) => {
        const u = e.target.dataset.up, d = e.target.dataset.dn;
        if (u != null && +u > 0) { [ordem[+u - 1], ordem[+u]] = [ordem[+u], ordem[+u - 1]]; desenhar(); }
        if (d != null && +d < ordem.length - 1) { [ordem[+d + 1], ordem[+d]] = [ordem[+d], ordem[+d + 1]]; desenhar(); }
      });
      desenhar();
    },
  });
}

/* ══════ CARGAS ══════ */
function rCargas() {
  const cs = lista("cargas").sort((a, b) => b.data.localeCompare(a.data) || b.numero - a.numero);
  const ab = cs.filter((c) => c.status !== "finalizada"), fin = cs.filter((c) => c.status === "finalizada").slice(0, 24);
  $("#main").innerHTML = `<section class="painel vidro vidro-borda-viva">
    <div class="cab">${A.orbe("caminhao", "#22d3ee")}<div><h2>Cargas</h2><p>Liberar a saída baixa o estoque reservado para <b>${esc(rot("transito"))}</b>. Na volta, a baixa de cada parada define para onde vai cada peça.</p></div></div>
    ${ab.length ? `<div class="cargas">${ab.map(cardCarga).join("")}</div>` : `<div class="vazio">${A.orbe("caminhao", "#22d3ee")}<b>Nenhuma carga aberta</b>Monte cargas na Agenda.</div>`}
    ${fin.length ? `<div class="sep"><h4>Finalizadas</h4><div class="cargas">${fin.map(cardCarga).join("")}</div></div>` : ""}</section>`;
  $$("[data-csair]").forEach((b) => (b.onclick = async () => { const c = S.cargas[b.dataset.csair];
    if (!(await A.confirmar(`Liberar a saída da carga <b>${c.numero}</b>? O estoque reservado de ${c.pedidos.length} pedido(s) vai para <b>${esc(rot("transito"))}</b>.`, { titulo: "Saída da carga", rotulo: "Liberar saída" }))) return;
    try { await api(`/cargas/${c.id}/sair`, { method: "POST" }); ok(`Carga ${c.numero} em rota.`); render(); } catch (e) { falha(e); } }));
  $$("[data-cedit]").forEach((b) => (b.onclick = () => montarCarga([], S.cargas[b.dataset.cedit])));
  $$("[data-cdel]").forEach((b) => (b.onclick = async () => { const c = S.cargas[b.dataset.cdel];
    if (!(await A.confirmar(`Desfazer a carga <b>${c.numero}</b>? Os pedidos voltam para a agenda.`, { titulo: "Desfazer carga", rotulo: "Desfazer", perigo: true }))) return;
    try { await api(`/cargas/${c.id}`, { method: "DELETE" }); ok(`Carga ${c.numero} desfeita.`); render(); } catch (e) { falha(e); } }));
  $$("[data-cprint]").forEach((b) => (b.onclick = () => romaneio(S.cargas[b.dataset.cprint])));
  $$("[data-bx]").forEach((b) => (b.onclick = () => baixa(b.dataset.c, b.dataset.p, b.dataset.bx)));
  ligarCards($("#main"));
}
function cardCarga(c) {

  return `<div class="carga luz" style="--c:${cor}">
    <div class="t1">${A.orbe("caminhao", cor)}<div><b>Carga ${c.numero} · ${dBR(c.data)}</b><span class="sub">${esc(parc(c.veiculo_id)?.nome || "sem veículo")} · ${esc(parc(c.motorista_id)?.nome || "sem motorista")}${c.ajudante ? " + " + esc(c.ajudante) : ""}</span></div>
      <span class="etq" style="--c:${cor}">${{ montando: "Montando", em_rota: "Em rota", finalizada: "Finalizada" }[c.status]}</span></div>
    <div><span class="mini">${c.pedidos.length} parada(s)</span>${c.status === "montando" ? `<span class="mini">${vol} vol.</span>` : ""}${c.status !== "montando" ? Object.entries(RES).map(([k, [r, col]]) => { const n = res.filter((x) => x === k).length; return n ? `<span class="mini c" style="--c:${col}">${n} ${r.toLowerCase()}</span>` : ""; }).join("") + (c.status === "em_rota" ? `<span class="mini">${c.pedidos.length - res.length} sem baixa</span>` : "") : ""}</div>

      return `<div class="parada"><span class="n">${i + 1}</span><span style="min-width:0;cursor:pointer" data-abrir="${pid}"><b>#${p.numero} ${esc(p.cliente_nome)}</b><span class="sub">${esc(bairro(p))}</span></span>
        ${b ? `<span class="etq" style="--c:${RES[b][1]}">${RES[b][0]}</span>` : c.status === "em_rota" && pode("baixa") ? `<span class="bxs linha2">${Object.entries(RES).map(([k, [r, col]]) => `<button type="button" style="--c:${col}" data-bx="${k}" data-c="${c.id}" data-p="${pid}" data-perm="acao:baixa">${r}</button>`).join("")}</span>` : ""}</div>`; }).join("")}
    <div class="chips">${c.status === "montando" && pode("cargas") ? `<button type="button" class="btn v p" data-cedit="${c.id}">${svg("lapis")}Editar</button><button type="button" class="btn perigo p" data-cdel="${c.id}">${svg("lixo")}Desfazer</button><button type="button" class="btn p" data-csair="${c.id}" data-perm="acao:cargas">${svg("caminhao")}Liberar saída</button>` : ""}
      <button type="button" class="btn v p" data-cprint="${c.id}">${svg("impressora")}Romaneio</button></div>
  </div>`;
}
function baixa(cid, pid, res) {

  A.modal({
    titulo: `${RES[res][0]} · #${p.numero} ${p.cliente_nome}`, icone: { entregue: "check", ausente: "relogio", avaria: "atencao", recusado: "fechar" }[res], cor: RES[res][1], largura: 600,

    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Confirmar baixa", classe: "btn", icone: "check", principal: true, acao: async (cx) => {

    } }],

/* ══════ RETORNOS / TRIAGEM ══════ */
function rRetornos() {
  const cols = ["triagem", "assistencia", "at", "fornecedor", "outlet"];
  const itens = (l) => lista("produtos").map((p) => ({ p, q: saldo(p.id)[l] || 0 })).filter((x) => x.q > 0).sort((a, b) => b.q - a.q);
  const ult = lista("movimentos").filter((m) => ["retorno_avaria", "recusa", "recolha_troca", "destinacao"].includes(m.tipo)).sort((a, b) => b.em.localeCompare(a.em)).slice(0, 40);
  const TIPO = { retorno_avaria: ["Avaria na entrega", "#fb7185"], recusa: ["Recusa", "#f43f5e"], recolha_troca: ["Recolha de troca", "#f472b6"], destinacao: ["Destinação", "#22d3ee"] };
  $("#main").innerHTML = `<section class="painel vidro vidro-borda-viva">
    <div class="cab">${A.orbe("retorno", "#fb923c")}<div><h2>Retornos e triagem</h2><p>Toda peça que volta (avaria, recusa, troca) entra na triagem. Clique na peça para dar destino.</p></div></div>
    <div class="colunas">${cols.map((l) => { const it = itens(l); return `<div class="coluna" style="--c:${COR_LOCAL[l]}"><h4>${esc(rot(l))}<b>${it.reduce((s, x) => s + x.q, 0)}</b></h4>
      ${it.map(({ p, q }) => `<button type="button" class="peca" data-dest="${l}" data-pid="${p.id}" data-perm="acao:triagem" ${pode("triagem") ? "" : "disabled"}><span>${esc(p.nome)}<span class="sub">${esc(p.sku)}</span></span><span class="q">${q}</span></button>`).join("") || `<p class="dica">vazio</p>`}</div>`; }).join("")}
      <div class="coluna" style="--c:${COR_LOCAL.perdas}"><h4>${esc(rot("perdas"))}<b>${lista("saldos").reduce((s, x) => s + (x.perdas || 0), 0)}</b></h4><p class="dica">Acumulado. Saída definitiva — entra no indicador de perdas.</p></div>
    </div>
    <div class="sep"><h4>Últimos retornos e destinações (60 dias)</h4>${ult.length ? `<div class="tab-w"><table class="t"><tr><th>Quando</th><th>Tipo</th><th>Produto</th><th class="num">Qtd</th><th>De → Para</th><th>Motivo / ref.</th><th>Por</th></tr>
      ${ult.map((m) => `<tr><td>${dhBR(m.em)}</td><td><span class="etq" style="--c:${TIPO[m.tipo][1]}">${TIPO[m.tipo][0]}</span></td><td>${esc(prod(m.produto_id).nome)}</td><td class="num">${m.qtd}</td><td>${esc(m.de === "externo" ? "cliente" : rot(m.de))} → ${esc(rot(m.para))}</td><td>${esc([...new Set([m.motivo, m.condicao, m.ref, m.obs].filter(Boolean))].join(" · "))}</td><td>@${esc(m.por)}</td></tr>`).join("")}</table></div>` : `<p class="dica">Nenhum retorno recente.</p>`}</div>
  </section>`;
  $$("[data-dest]").forEach((b) => (b.onclick = () => destinar(b.dataset.dest, b.dataset.pid)));
}
function destinar(de, pid) {
  const tem = saldo(pid)[de] || 0, p = prod(pid);
  const opts = S.destinos.filter((d) => d !== de);
  const INFO = { disponivel: "Volta a ser vendável como novo.", outlet: "Fica vendável no mercado/outlet, separado do estoque novo.", assistencia: "Vai para recuperação interna — depois você dá destino de novo.",
    at: "Vai para a assistência técnica externa — acompanhe na coluna AT.", fornecedor: "Devolvido ao fornecedor (troca autorizada). Quando a reposição chegar, destine para o estoque.", perdas: "Baixa definitiva." };
  A.modal({
    titulo: `Destinar · ${p.nome}`, icone: "retorno", cor: COR_LOCAL[de], largura: 600,
    html: `<p class="dica" style="margin:0 0 10px">Em <b>${esc(rot(de))}</b>: ${tem} peça(s).</p>

      <label class="campo">${tipo === "veiculo" ? "Identificação (placa · modelo)" : "Nome / razão social"} *<input id="cNome" value="${esc(p.nome || "")}" autofocus></label>
      ${tipo === "cliente" ? `<label class="campo" style="margin-top:10px">Código do cliente <small style="font-weight:400;color:var(--txt3)">(o mesmo dos Tickets — liga o atendimento aos pedidos)</small><input id="cCod" value="${esc(p.codigo || "")}" placeholder="em branco = automático (6 letras e números)"></label>` : ""}
      ${tipo === "veiculo" ? `<div class="g2" style="margin-top:10px"><label class="campo">Placa<input id="cPlaca" value="${esc(p.placa || "")}"></label><label class="campo">Capacidade (volumes)<input type="number" id="cCap" min="0" value="${p.capacidade || 0}"></label></div>` :
      `${vis("contato") ? `<div class="g3" style="margin-top:10px" data-perm="campo:contato"><label class="campo">CPF / CNPJ<input id="cDoc" value="${esc(p.doc || "")}" ${edita("contato") ? "" : "disabled"}></label><label class="campo">Telefone<input id="cTel" value="${esc(p.telefone || "")}" ${edita("contato") ? "" : "disabled"}></label><label class="campo">E-mail<input id="cMail" value="${esc(p.email || "")}" ${edita("contato") ? "" : "disabled"}></label></div>` : ""}
      ${tipo !== "motorista" ? `<div class="sep"><h4>Endereço${tipo === "cliente" ? " de entrega" : ""}</h4>
        <div style="display:grid;grid-template-columns:110px minmax(0,2fr) 80px minmax(0,1fr);gap:10px"><label class="campo">CEP<input id="eCep" value="${esc(e.cep || "")}"></label><label class="campo">Logradouro<input id="eLog" value="${esc(e.logradouro || "")}"></label><label class="campo">Nº<input id="eNum" value="${esc(e.numero || "")}"></label><label class="campo">Complemento<input id="eCompl" value="${esc(e.complemento || "")}"></label></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 70px;gap:10px;margin-top:10px"><label class="campo">Bairro<input id="eBai" value="${esc(e.bairro || "")}"></label><label class="campo">Cidade<input id="eCid" value="${esc(e.cidade || "")}"></label><label class="campo">UF<input id="eUf" maxlength="2" value="${esc(e.uf || "")}"></label></div>
        <label class="campo" style="margin-top:10px">Referência<input id="eRef" value="${esc(e.referencia || "")}"></label></div>` : ""}`}
      <div class="sep"><label class="chave" style="--c:var(--verde)"><input type="checkbox" id="cAtivo" ${p.ativo === false ? "" : "checked"}><span class="trilho"></span>Ativo</label></div>
      <label class="campo" style="margin-top:10px">Observações<textarea id="cObs" rows="2">${esc(p.obs || "")}</textarea></label></fieldset>`,
    botoes: so ? [{ rotulo: "Fechar" }] : [{ rotulo: "Cancelar" }, { rotulo: "Salvar", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
      const v = (s) => $(s, cx)?.value ?? "";
      const body = { tipo, nome: v("#cNome"), ativo: $("#cAtivo", cx).checked, obs: v("#cObs") };
      if ($("#cCod", cx)) body.codigo = v("#cCod").trim();
      if (tipo === "veiculo") Object.assign(body, { placa: v("#cPlaca"), capacidade: +v("#cCap") || 0 });
      else {
        if ($("#cDoc", cx) && edita("contato")) Object.assign(body, { doc: v("#cDoc"), telefone: v("#cTel"), email: v("#cMail") });
        if ($("#eLog", cx)) body.endereco = { cep: v("#eCep"), logradouro: v("#eLog"), numero: v("#eNum"), complemento: v("#eCompl"), bairro: v("#eBai"), cidade: v("#eCid"), uf: v("#eUf").toUpperCase(), referencia: v("#eRef") };
      }
      try { const r = id ? await api("/parceiros/" + id, { method: "PUT", body }) : await api("/parceiros", { method: "POST", body });
        aplicar({ parceiros: [r.parceiro] }); ok(`${rotT} salvo.`); depois ? depois(r.parceiro) : render(); }
      catch (er) { falha(er); return false; }
    } }],
  });
}

/* ══════ AJUSTES ══════ */
function rAjustes() {
  const c = S.config, vazio = !lista("produtos").length && !lista("pedidos").length;
  const lst = (k, r) => `<label class="campo">${r} <small style="font-weight:400">(um por linha)</small><textarea data-cfg="${k}" rows="4">${esc((c[k] || []).join("\n"))}</textarea></label>`;
  $("#main").innerHTML = `<section class="painel vidro vidro-borda-viva">
    <div class="cab">${A.orbe("ajustes", "#94a3b8")}<div><h2>Ajustes do ERP</h2><p>Nomes dos locais de estoque, janelas de entrega e motivos usados nos indicadores.</p></div>
      <div class="dir"><button type="button" class="btn" id="btCfg">${svg("check")}Salvar ajustes</button></div></div>
    <div class="grade2"><div class="bloco"><h3>${svg("casa")} Empresa</h3><label class="campo">Nome exibido<input id="cfEmp" value="${esc(c.empresa || "")}"></label>
      <div class="sep"><h4>Nomes dos locais de estoque</h4><div class="g2">${S.locais.map((l) => `<label class="campo"><span style="color:${COR_LOCAL[l]}">● ${l}</span><input data-rot="${l}" value="${esc(rot(l))}"></label>`).join("")}</div></div></div>
      <div class="bloco"><h3>${svg("lista")} Listas</h3><div class="g2">${lst("janelas", "Janelas de entrega")}${lst("categorias", "Categorias de produto")}${lst("motivos_ausencia", "Motivos de ausência")}${lst("motivos_avaria", "Motivos de avaria")}${lst("motivos_troca", "Motivos de troca")}</div></div></div>
    ${vazio ? `<div class="sep"><button type="button" class="btn v" id="btEx">${svg("foguete")}Carregar dados de exemplo</button><p class="dica">Cria um cenário completo para conhecer o sistema (só com o ERP vazio).</p></div>` : ""}
    ${S.admin ? `<div class="sep"><h4 style="color:var(--rosa)">Começar do zero</h4><p class="dica">Baixe o backup antes. Zerar apaga produtos, clientes, saldos, pedidos, cargas e movimentos (os ajustes desta tela ficam e a numeração volta para 1). Não tem volta.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><a class="btn v" href="/api/erp/backup" download>${svg("baixar")}Baixar backup (JSON)</a><button type="button" class="btn perigo" id="btZerar">${svg("lixo")}Zerar ERP</button></div></div>` : ""}
    <div class="sep"><h4>Próximas etapas</h4><p class="dica">Pré-nota fiscal (DANFE de conferência, sem valor fiscal) · Financeiro (receber/pagar e conciliação) · RH (funcionários) — sobre este mesmo núcleo.</p></div></section>`;
  $("#btEx")?.addEventListener("click", carregarExemplo);
  $("#btZerar")?.addEventListener("click", () => {
    A.modal({ titulo: "Zerar o ERP", icone: "atencao", cor: "var(--rosa)", largura: 460,
      html: `<p>Isto apaga <b>todos</b> os dados do ERP no banco. Já baixou o backup?</p><label class="campo" style="margin-top:10px">Digite <b>ZERAR</b> para confirmar<input id="zConf" autocomplete="off"></label>`,
      botoes: [{ rotulo: "Voltar" }, { rotulo: "Zerar agora", classe: "btn perigo", principal: true, acao: async () => {
        if ($("#zConf").value.trim().toUpperCase() !== "ZERAR") { A.toast("Digite ZERAR."); return false; }
        try { const r = await api("/zerar", { method: "POST", body: { confirmar: "ZERAR", manter_config: true } });
          ok(`ERP zerado: ${Object.values(r.apagados).reduce((a2, b2) => a2 + b2, 0)} registros apagados.`); await carregar(); } catch (e) { falha(e); return false; }
      } }] });
  });
  $("#btCfg").onclick = async () => {
    const body = { empresa: $("#cfEmp").value, rotulos: Object.fromEntries($$("[data-rot]").map((x) => [x.dataset.rot, x.value])) };
    $$("[data-cfg]").forEach((x) => (body[x.dataset.cfg] = x.value.split("\n").map((s) => s.trim()).filter(Boolean)));
    try { const r = await api("/config", { method: "PUT", body }); S.config = r.config; ok("Ajustes salvos."); render(); } catch (e) { falha(e); }
  };
}

/* ══════ INÍCIO ══════ */
$("#btAtualizar").innerHTML = svg("repetir");
$("#btNovoPed").innerHTML = svg("mais") + "Novo pedido";
$("#btNovoPed").onclick = () => editarPedido();
$("#btAtualizar").onclick = () => carregar().catch(falha);
addEventListener("keydown", (e) => { if (A.modalAberto() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) return; if ((e.key === "n" || e.key === "N") && pode("pedidos")) { e.preventDefault(); editarPedido(); } });
(async () => {
  try { await A.permissoes.carregar("erp"); }
  catch (e) { if (e.status !== 401) $("#main").innerHTML = `<section class="painel vidro"><div class="vazio"><b>Não consegui abrir</b>${esc(e.message)}</div></section>`; return; }
  try { await carregar(); }
  catch (e) { $("#main").innerHTML = `<section class="painel vidro"><div class="vazio">${A.orbe("atencao", "#fb7185")}<b>Não consegui carregar o ERP</b>${esc(e.message)}<button type="button" class="btn v" onclick="location.reload()">Tentar de novo</button></div></section>`; }
})();
})();
</script>
</body>
</html>
