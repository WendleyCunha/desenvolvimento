<!--
═══════════════════════════════════════════════════════════════════════════════
 lila-closet.html — LILA CLOSET ATELIER (módulo do hub)
───────────────────────────────────────────────────────────────────────────────
 Hoje · Pedidos · Agenda · Clientes & medidas · Prospects · Financeiro · Ajustes
 API: /api/atelier (hub/atelier.py) — mesmas coleções lila_* do app Streamlit.
 Regras (atelier_regras.py): régua 1 Confecção · 2 Prova · 3 Entrega · 4 Concluído
 (o 4 é sempre humano); Data da Confecção pergunta se o dia já tem encomenda e
 bloqueia se o dia tiver mais de 3 provas; consertos não disputam o dia.
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1500px;margin:0 auto}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-radius:20px;flex-wrap:wrap}
.topo.vidro{background:linear-gradient(135deg,rgba(26,14,18,.9),rgba(10,8,12,.86))}
html[data-claro] .topo.vidro{background:rgba(255,255,255,.82)}
.marca{display:flex;align-items:center;gap:10px;margin-right:6px}
.marca b{display:block;font:700 1.08rem 'Playfair Display',serif}
.marca small{display:block;font-size:.55rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:#fda4af}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.nav button{padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:650;color:var(--txt2);position:relative}
.nav button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav button.ativo{color:#fecdd3;background:rgba(251,113,133,.13);box-shadow:inset 0 0 0 1px rgba(251,113,133,.45)}
html[data-claro] .nav button.ativo{color:#be123c}
.nav button em{font-style:normal;font-size:.62rem;font-weight:700;margin-left:5px;padding:1px 6px;border-radius:9px;background:var(--rosa);color:#1a0a0e}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro)} .sync.erro i{background:var(--rosa)}
main{margin-top:14px}
.painel{border-radius:22px;padding:16px;margin-bottom:14px}
.cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cab h2{margin:0;font:700 1.25rem var(--titulo)} .cab p{margin:2px 0 0;font-size:.8rem;color:var(--txt3)}
.cab .dir{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sec{display:flex;align-items:center;gap:8px;margin:16px 2px 10px;font-size:.64rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--vidro-borda),transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{position:relative;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);--c:var(--rosa);text-align:left;overflow:hidden}
button.kpi{cursor:pointer;width:100%;font:inherit;color:inherit} button.kpi:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.kpi small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.35rem/1.15 var(--titulo);margin-top:6px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:3px}
.barra-p{height:6px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.barra-p i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ouro),var(--rosa))}
.vazio{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--txt3);font-size:.84rem;padding:26px 10px}
.vazio b{color:var(--txt);font:600 1rem var(--titulo)}
.aviso{font-size:.82rem;padding:10px 12px;border-radius:12px;line-height:1.5;margin:6px 0}
.aviso.ok{color:#bbf7d0;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}
.aviso.ouro{color:var(--ouro2);background:rgba(var(--ouro-rgb),.07);border:1px solid rgba(var(--ouro-rgb),.3)}
.aviso.mal{color:#fecdd3;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.35)}
html[data-claro] .aviso.ok{color:#065f46} html[data-claro] .aviso.mal{color:#9f1239} html[data-claro] .aviso.ouro{color:#7a5300}
.dica{font-size:.72rem;color:var(--txt3);line-height:1.5;margin:0}
.lin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);margin-bottom:7px;--c:var(--ouro)}
.lin .t{flex:1;min-width:0} .lin .t b{display:block;font-size:.88rem} .lin .t small{display:block;color:var(--txt3);font-size:.74rem;margin-top:2px}
.lin.atraso{border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.06)}
.lin .acoes{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:.66rem;font-weight:650;white-space:nowrap;--c:var(--txt2);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.grid-ped{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ped{border-radius:18px;padding:14px;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px;--c:var(--ouro)}
.ped:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
.ped .t1{display:flex;gap:8px;align-items:flex-start} .ped .t1 b{font:700 .98rem var(--titulo);flex:1}
.ped .sub{font-size:.76rem;color:var(--txt3)}
.ped .badges{display:flex;gap:5px;flex-wrap:wrap}
.trilha{display:flex;align-items:center;margin:4px 0 2px}
.trilha .ep{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:.64rem;color:var(--txt3)}
.trilha .ep i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;border:2px solid var(--vidro-borda-forte);background:rgba(0,0,0,.2);z-index:1}
.trilha .ep:not(:last-child)::after{content:"";position:absolute;top:13px;left:55%;right:-45%;height:2px;background:var(--vidro-borda-forte)}
.trilha .ep.feita i{background:var(--ouro);border-color:var(--ouro)} .trilha .ep.feita::after{background:var(--ouro)!important}
.trilha .ep.atual i{border-color:var(--rosa);box-shadow:0 0 12px rgba(251,113,133,.5)} .trilha .ep.atual{color:#fecdd3;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros .entrada{width:auto;min-width:220px;flex:1}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.62rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ouro2);text-align:center;padding:4px 0}
.cal .dia{min-height:96px;border-radius:12px;padding:6px;background:rgba(255,255,255,.03);border:1px solid var(--vidro-borda);display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
.cal .dia:hover{border-color:rgba(251,113,133,.45)} .cal .dia.fora{opacity:.3;cursor:default} .cal .dia.hoje{border-color:var(--rosa);box-shadow:inset 0 0 0 1px var(--rosa)}
.cal .dia > b{font-size:.78rem}
.cal .tg{font-size:.6rem;line-height:1.25;padding:2px 5px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--ouro)) 15%,transparent);color:var(--c,var(--ouro2));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .tg.atraso{--c:var(--rosa)}
.oc{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:.7rem;text-align:center}
.oc .h{font-size:.58rem;color:var(--txt3);font-weight:700}
.oc .d{padding:5px 0;border-radius:7px;background:rgba(255,255,255,.03);cursor:pointer;border:1px solid transparent}
.oc .d.conf{background:rgba(251,113,133,.16);color:#fecdd3} .oc .d.lot{background:rgba(var(--ouro-rgb),.18);color:var(--ouro2)} .oc .d.sel{border-color:var(--ciano)}
.oc .d.v{visibility:hidden}
/* medidas */
.medidas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.campo small.v{color:var(--txt3);font-weight:400}
/* tabelas */
.tab{width:100%;border-collapse:collapse;font-size:.8rem}
.tab th{font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);text-align:left;padding:7px;border-bottom:1px solid var(--vidro-borda);white-space:nowrap}
.tab td{padding:7px;border-bottom:1px solid var(--vidro-borda);vertical-align:middle}
.tab td.n,.tab th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab input.entrada{padding:5px 7px;font-size:.78rem}
.tab tr.conc td{opacity:.75}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.oculto{display:none!important}
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.subnav button{padding:8px 13px;border-radius:11px;font-size:.8rem;font-weight:650;color:var(--txt2);border:1px solid transparent}
.subnav button.ativo{color:var(--txt);border-color:var(--vidro-borda-forte);background:rgba(255,255,255,.06)}
@media (max-width:900px){.g4,.g3{grid-template-columns:1fr 1fr}.cal .dia{min-height:64px}.cal .tg{font-size:.52rem}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}.topo{position:relative;top:0}.cal{gap:3px}.cal .dia{padding:3px;min-height:52px}.cal .tg{display:none}.cal .dia .qt{display:block}}
.cal .dia .qt{display:none;font-size:.6rem;color:var(--rosa)}
</style>

<body>
<div class="app">
  <header class="topo vidro vidro-borda-viva">
    <div class="marca"><span id="logo"></span><span><b>Lila Closet</b><small>Atelier · sob medida</small></span></div>
    <nav class="nav" id="nav"></nav>
    <button type="button" class="btn p" id="btNovoTopo"></button>
    <span class="sync" id="sync"><i></i><span>…</span></span>
  </header>
  <main id="main"><div class="vazio"><b>Carregando o atelier…</b></div></main>
</div>
<script src="/static/aurora.js?v=3"></script>
<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
A.fundo();
$("#logo").outerHTML = A.orbe("tesoura", "#fb7185");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;
const API = "/api/atelier";
const MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const ETAPA = { 1: ["🪡", "Confecção", "#60a5fa"], 2: ["👗", "Prova", "#a78bfa"], 3: ["🎁", "Entrega", "#e8b33d"], 4: ["✅", "Concluído", "#34d399"] };
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const S = { e: null, sec: ls.get("wd.lila.sec", "hoje"), filtroPed: "andamento", busca: "", calRef: null, finSub: "visao", fin: null, mesRel: "", mesFech: "", projIdx: 0,
  cliSel: "", vidaPessoal: ls.get("wd.lila.pessoal", "0") === "1" };

/* ══════ HELPERS ══════ */
const pode = (a) => !!S.e?.perm?.acoes?.[a];
const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const brl = (v) => num(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dbr = (s) => { s = String(s || ""); return s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "—"; };
const dcurta = (s) => { s = String(s || ""); return s.length >= 10 ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "—"; };
const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const somaDias = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const hoje = () => S.e?.hoje || iso(new Date());
const nomeMes = (m) => `${MESES[+m.slice(5, 7) - 1]}/${m.slice(0, 4)}`;
const mesMais = (m, n) => { let a = +m.slice(0, 4), mm = +m.slice(5, 7) - 1 + n; a += Math.floor(mm / 12); mm = ((mm % 12) + 12) % 12; return `${a}-${String(mm + 1).padStart(2, "0")}`; };
const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const mini = (t, c) => `<span class="mini" style="--c:${c}">${esc(t)}</span>`;
const ehConserto = (e) => String(e.peca || "").startsWith("[Conserto]");
const saldo = (e) => Math.max(num(e.valor_total) - num(e.valor_recebido), 0);
const etapa = (e) => +e.etapa || 1;
const ativo = (e) => !+e.cancelado;
function sync(estado, txt) { const el = $("#sync"); el.className = "sync " + (estado || ""); el.lastElementChild.textContent = txt; }
async function api(url, op = {}, msg = "salvando…") {
  sync("salvando", msg);
  try { const r = await A.api(API + url, op); sync("", "atualizado " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })); return r; }
  catch (e) { sync("erro", "erro"); if (e.status === 401) { const w = window.top || window; w.location.href = "/login?volta=" + encodeURIComponent(w.location.pathname); } throw e; }
}
const ok = (t) => A.toast(t, [], { cor: "var(--verde)", duracao: 3500 });
const falha = (e) => A.toast("⚠ " + esc(typeof e === "string" ? e : (e.dados?.detail?.mensagem || e.message)), [], { cor: "var(--rosa)", duracao: 9000 });
/* Grava com a regra da Data da Confecção: se o dia já tem encomenda, pergunta; se tem mais de 3 provas, bloqueia. */
async function comAgenda(url, op) {
  try { return await api(url, op); }
  catch (e) {
    const ag = e.dados?.detail;
    if (e.status === 409 && ag?.agenda === "confirmar") {
      if (await A.confirmar(esc(ag.mensagem), { titulo: "Data da Confecção", rotulo: "Sim, marcar mesmo assim" })) return api(url, { ...op, body: { ...op.body, confirmar: true } });
      return null;
    }
    if (e.status === 409 && ag?.agenda === "bloqueado") { A.toast("⛔ " + esc(ag.mensagem), [], { cor: "var(--rosa)", duracao: 10000 }); return null; }
    throw e;
  }
}

/* ══════ CARREGAR ══════ */
async function carregar(fresco = 0) {
  try { S.e = await api("/estado" + (fresco ? "?fresco=1" : ""), {}, "carregando…"); }
  catch (e) { $("#main").innerHTML = `<div class="vazio">${A.orbe("atencao", "var(--rosa)")}<b>Não foi possível abrir o atelier</b>${esc(e.message)}</div>`; return; }
  S.e.encById = Object.fromEntries(S.e.encomendas.map((x) => [x.id, x]));
  if (S.fin && pode("financeiro")) S.fin = null;
  render();
}
function ir(sec) { S.sec = sec; ls.set("wd.lila.sec", sec); render(); scrollTo(0, 0); }

/* ══════ NAV ══════ */
function nav() {
  const encs = S.e.encomendas.filter(ativo), h = hoje();
  const tarefasHoje = S.e.cronograma.filter((t) => !+t.concluida && (t.tipo_agenda || "Trabalho") === "Trabalho" && String(t.data) <= h).length;
  const itens = [["hoje", "Hoje", tarefasHoje], ["pedidos", "Pedidos"], ["agenda", "Agenda"], ["clientes", "Clientes & medidas"], ["prospects", "Prospects", S.e.prospects.length],
    ["financeiro", "Financeiro", 0, "financeiro"], ["ajustes", "Ajustes", 0, "configurar"]];
  $("#nav").innerHTML = itens.filter((i) => !i[3] || pode(i[3])).map((i) => `<button type="button" data-sec="${i[0]}" class="${S.sec === i[0] ? "ativo" : ""}">${i[1]}${i[2] ? `<em>${i[2]}</em>` : ""}</button>`).join("");
  $$("#nav [data-sec]").forEach((b) => (b.onclick = () => ir(b.dataset.sec)));
  const bn = $("#btNovoTopo"); bn.innerHTML = `${svg("mais")} Novo pedido`; bn.classList.toggle("oculto", !pode("pedidos")); bn.onclick = () => novoPedido();
}
function render() {
  if (!S.e) return;
  nav();
  const m = $("#main");
  ({ hoje: telaHoje, pedidos: telaPedidos, agenda: telaAgenda, clientes: telaClientes, prospects: telaProspects, financeiro: telaFinanceiro, ajustes: telaAjustes }[S.sec] || telaHoje)(m);
}

/* ══════ HOJE ══════ */
function linhaTarefa(t, comAcoes = true) {
  const enc = t.encomenda_id ? S.e.encById[t.encomenda_id] : null, atraso = String(t.data) < hoje();
  return `<div class="lin ${atraso ? "atraso" : ""}"><div class="t"><b>${esc(t.tarefa)}</b><small>${esc(t.categoria || "")} · ${num(t.horas)}h · ${dbr(t.data)}${enc ? " · 👤 " + esc(enc.cliente) : ""} ${atraso ? mini("atrasada", "#fb7185") : ""}</small></div>
    ${comAcoes ? `<div class="acoes">${enc ? `<button type="button" class="btn v p" data-ped="${enc.id}">Abrir pedido</button>` : ""}<button type="button" class="btn v p" data-tdata="${t.id}">${svg("calendario")} Data</button><button type="button" class="btn p" data-tfeito="${t.id}">${svg("check")} Feito</button></div>` : ""}</div>`;
}
function ligarTarefas(m) {
  $$("[data-ped]", m).forEach((b) => (b.onclick = (ev) => { ev.stopPropagation(); abrirPedido(b.dataset.ped); }));
  $$("[data-tfeito]", m).forEach((b) => (b.onclick = async () => { try { await api(`/tarefas/${b.dataset.tfeito}/feito`, { method: "POST" }); await carregar(); ok("Feito!"); } catch (e) { falha(e); } }));
  $$("[data-tdata]", m).forEach((b) => (b.onclick = () => editarDataTarefa(b.dataset.tdata)));
}
function telaHoje(m) {
  const e = S.e, h = hoje(), encs = e.encomendas.filter(ativo), cfg = e.cfg;
  const ativos = encs.filter((x) => etapa(x) < 4).length, meta = +cfg.meta_pedidos_mes || 8;
  const doMes = encs.filter((x) => String(x.criado_em || x._criado_em || "").slice(0, 7) === h.slice(0, 7)).length, pct = Math.min(doMes / meta * 100, 100);
  const dias = +cfg.alerta_entrega_dias || 7;
  const urg = encs.filter((x) => etapa(x) < 4 && x.data_entrega).map((x) => ({ ...x, _d: Math.round((new Date(x.data_entrega + "T12:00") - new Date(h + "T12:00")) / 864e5) })).filter((x) => x._d <= dias).sort((a, b) => a._d - b._d);

    </div>
    ${urg.length ? `<div class="sec" style="color:var(--rosa)">🚨 Entregas urgentes — prioridade máxima (até ${dias} dias)</div>
      ${urg.map((x) => `<div class="lin atraso"><div class="t"><b>${esc(x.cliente)} — ${esc(x.peca)}</b><small>🎁 Entrega ${dbr(x.data_entrega)} · <b style="color:var(--rosa)">${x._d < 0 ? `ATRASADO há ${-x._d} dia(s)` : x._d === 0 ? "ENTREGA É HOJE" : `faltam ${x._d} dia(s)`}</b> · ${ETAPA[etapa(x)][0]} ${ETAPA[etapa(x)][1]}</small></div><div class="acoes"><button type="button" class="btn v p" data-ped="${x.id}">Ver pedido</button></div></div>`).join("")}` : ""}
    <div class="sec">⚡ Tarefas para hoje</div>
    ${tarefas.length ? tarefas.map((t) => linhaTarefa(t, pode("pedidos"))).join("") : `<div class="aviso ok">✅ Tudo em dia! Nenhuma tarefa pendente para hoje.</div>`}
    <p class="dica">“Feito” avança o pedido no máximo até <b>Entrega</b> — o <b>Concluído</b> é sempre você que marca, dentro do pedido.</p>
  </section>`;
  $$("[data-ir]", m).forEach((b) => (b.onclick = () => ir(b.dataset.ir)));
  ligarTarefas(m);
}

/* ══════ PEDIDOS ══════ */
function cardPedido(x) {
  const canc = !ativo(x), et = ETAPA[etapa(x)], s = saldo(x), cor = canc ? "#6b7183" : et[2];
  const contrato = x.cpf_cliente && x.rg_cliente;
  return `<div class="ped" data-ped="${x.id}" style="--c:${cor}">
    <div class="t1"><b>${esc(x.cliente)} — ${esc(x.peca)}</b>${canc ? mini("Cancelado", "#6b7183") : mini(et[0] + " " + et[1], et[2])}</div>
    <div class="sub">💰 ${brl(x.valor_total)} · 🎁 entrega ${dbr(x.data_entrega)}${ehConserto(x) ? " · conserto" : ""}</div>
    ${canc ? "" : `<div class="barra-p"><i style="width:${etapa(x) / 4 * 100}%"></i></div>`}
    <div class="badges">${mini("Recebido " + brl(x.valor_recebido), "#34d399")}${!canc && s > 0.01 ? mini("Saldo " + brl(s), "#fb923c") : ""}${pode("contratos") && !ehConserto(x) ? (contrato ? mini("📄 Contrato pronto", "#60a5fa") : mini("⏳ Falta CPF/RG", "#94a3b8")) : ""}</div>
    ${!canc && etapa(x) === 3 && pode("pedidos") ? `<button type="button" class="btn v p" data-concluir="${x.id}">${svg("check")} Marcar como concluído</button>` : ""}
  </div>`;
}
function telaPedidos(m) {
  const f = S.filtroPed, q = norm(S.busca);
  let l = S.e.encomendas.slice();
  const filtros = { andamento: (x) => ativo(x) && etapa(x) < 4, entrega: (x) => ativo(x) && etapa(x) === 3, concluidos: (x) => ativo(x) && etapa(x) === 4, cancelados: (x) => !ativo(x), todos: () => true };
  const cont = Object.fromEntries(Object.entries(filtros).map(([k, fn]) => [k, l.filter(fn).length]));
  l = l.filter(filtros[f] || filtros.andamento);
  if (q) l = l.filter((x) => norm(`${x.cliente} ${x.peca}`).includes(q));
  l.sort((a, b) => String(a.data_entrega || "9999").localeCompare(String(b.data_entrega || "9999")));
  m.innerHTML = `<section class="painel vidro">
    <div class="cab"><div><h2>📋 Pedidos</h2><p>Clique num pedido para ver e editar tudo — régua, valores, datas, contrato e medidas.</p></div></div>
    <div class="filtros"><input class="entrada" id="busca" placeholder="Buscar cliente ou peça…" value="${esc(S.busca)}">
      <div class="seg">${[["andamento", "Em andamento"], ["entrega", "Na entrega"], ["concluidos", "Concluídos"], ["cancelados", "Cancelados"], ["todos", "Todos"]].map(([k, r]) => `<button type="button" data-f="${k}" class="${f === k ? "ativo" : ""}">${r} <small>${cont[k]}</small></button>`).join("")}</div></div>
    ${l.length ? `<div class="grid-ped">${l.map(cardPedido).join("")}</div>` : `<div class="vazio">${A.orbe("tesoura", "#fb7185")}<b>Nenhum pedido aqui</b>Troque o filtro ou crie um novo pedido.</div>`}
  </section>`;
  $("#busca").oninput = (ev) => { S.busca = ev.target.value; clearTimeout(telaPedidos._t); telaPedidos._t = setTimeout(() => { telaPedidos(m); const b = $("#busca"); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }, 250); };
  $$("[data-f]", m).forEach((b) => (b.onclick = () => { S.filtroPed = b.dataset.f; telaPedidos(m); }));
  $$(".ped[data-ped]", m).forEach((c) => (c.onclick = (ev) => { if (ev.target.closest("[data-concluir]")) return; abrirPedido(c.dataset.ped); }));
  $$("[data-concluir]", m).forEach((b) => (b.onclick = async (ev) => { ev.stopPropagation(); try { await api(`/encomendas/${b.dataset.concluir}/concluir`, { method: "POST" }); await carregar(); ok("Pedido concluído!"); } catch (e) { falha(e); } }));
}

/* ── mini-calendário de ocupação da Data da Confecção ── */
async function miniOcupacao(el, mes, excluir, aoEscolher, selecionado) {
  el.innerHTML = `<p class="dica">carregando a agenda…</p>`;
  let r; try { r = await api(`/ocupacao?mes=${mes}${excluir ? "&excluir=" + excluir : ""}`, {}, "agenda…"); } catch (e) { el.innerHTML = ""; return; }
  const p = new Date(mes + "-01T12:00"), ini = (p.getDay() + 6) % 7, dias = new Date(p.getFullYear(), p.getMonth() + 1, 0).getDate();
  let h = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><button type="button" class="btn-ic p" data-mm="-1">${svg("voltar")}</button><b style="flex:1;text-align:center;font-size:.8rem">${nomeMes(mes)}</b><button type="button" class="btn-ic p" data-mm="1">${svg("avancar")}</button></div><div class="oc">`;
  h += ["S", "T", "Q", "Q", "S", "S", "D"].map((d) => `<span class="h">${d}</span>`).join("");
  for (let i = 0; i < ini; i++) h += `<span class="d v">.</span>`;
  for (let dd = 1; dd <= dias; dd++) {
    const k = `${mes}-${String(dd).padStart(2, "0")}`, o = r.dias[k];
    const cls = o?.lotado ? "lot" : o?.confeccoes?.length ? "conf" : "";
    const tip = o ? `${o.confeccoes.length ? "Confecção: " + o.confeccoes.join(", ") : ""}${o.provas ? (o.confeccoes.length ? " · " : "") + o.provas + " prova(s)" : ""}` : "livre";
    h += `<span class="d ${cls} ${k === selecionado ? "sel" : ""}" data-dia="${k}" title="${esc(tip)}">${dd}</span>`;
  }
  h += `</div><p class="dica" style="margin-top:6px"><span style="color:#fda4af">●</span> já tem confecção (dá para confirmar mais uma) · <span style="color:var(--ouro2)">●</span> mais de ${r.limite} provas (bloqueado para confecção). Clique num dia para escolher.</p>`;
  el.innerHTML = h;
  $$("[data-mm]", el).forEach((b) => (b.onclick = () => miniOcupacao(el, mesMais(mes, +b.dataset.mm), excluir, aoEscolher, selecionado)));
  $$("[data-dia]", el).forEach((d) => (d.onclick = () => { aoEscolher(d.dataset.dia); $$(".sel", el).forEach((x) => x.classList.remove("sel")); d.classList.add("sel"); }));
}

async function telaFinanceiro(m) {
  if (!pode("financeiro")) { m.innerHTML = `<div class="vazio"><b>Sem acesso ao financeiro</b></div>`; return; }
  S.mesRel = S.mesRel || hoje().slice(0, 7); S.mesFech = S.mesFech || hoje().slice(0, 7);
  m.innerHTML = `<section class="painel vidro"><div class="cab"><div><h2>💰 Financeiro</h2><p>Dinheiro real (o que entrou e saiu) separado do que ainda vai acontecer (pela agenda).</p></div></div>
    <div class="subnav">${[["visao", "Visão geral"], ["lanc", "Lançamentos"], ["proj", "Projeção"], ["fech", "Fechamento & conciliação"]].map(([k, r]) => `<button type="button" data-fs="${k}" class="${S.finSub === k ? "ativo" : ""}">${r}</button>`).join("")}</div>
    <div id="finCorpo"><div class="vazio"><b>Calculando…</b></div></div></section>`;
  $$("[data-fs]", m).forEach((b) => (b.onclick = () => { S.finSub = b.dataset.fs; telaFinanceiro(m); }));
  const corpo = $("#finCorpo");
  try {
    if (S.finSub === "fech") return await finFechamento(corpo);
    S.fin = await api(`/financeiro?mes=${S.mesRel}`, {}, "calculando…");
    ({ visao: finVisao, lanc: finLanc, proj: finProj }[S.finSub] || finVisao)(corpo, S.fin);
  } catch (e) { corpo.innerHTML = `<div class="aviso mal">${esc(e.message)}</div>`; }
}

  $$("[data-pi]", el).forEach((b) => (b.onclick = () => { S.projIdx = +b.dataset.pi; finProj(el, F); }));
  $$("[data-br]", el).forEach((b) => (b.onclick = async () => { const x = S.e.encById[b.dataset.br]; try { await api("/recebimentos", { method: "POST", body: { encomenda_id: x.id, valor: b.dataset.v, descricao: `Quitação (atraso) – ${x.cliente}: ${x.peca}`, forma_pagamento: "Pix" } }); await carregar(); ok("Baixado!"); } catch (e) { falha(e); } }));
  $$("[data-bp]", el).forEach((b) => (b.onclick = async () => { try { await api(`/gastos/${b.dataset.bp}`, { method: "PUT", body: { pago: true } }); await carregar(); ok("Despesa baixada!"); } catch (e) { falha(e); } }));
}
async function finFechamento(el) {
  const mes = S.mesFech, si = S.saldoIniDigitado?.[mes];
  const R = await api(`/fechamento/${mes}${si !== undefined ? "?saldo_inicial=" + si : ""}`, {}, "calculando…");
  const f = R.fechamento || {}, travado = R.ja_fechado, pctC = R.total_itens ? R.conciliados / R.total_itens * 100 : 0;
  const extrato = travado ? num(f.saldo_extrato_informado) : (S.extrato?.[mes] ?? R.saldo_teorico), dif = R.saldo_teorico - num(extrato);
  const linhas = (l, tipo) => l.length ? `<table class="tab"><thead><tr><th>✔</th><th>Data</th><th>Descrição</th><th class="n">Valor</th><th></th></tr></thead><tbody>${l.slice().sort((a, b) => String(a.data).localeCompare(b.data)).map((x) => `<tr class="${+x.conciliado ? "conc" : ""}" data-lt="${tipo}" data-lid="${x.id}">
      <td><input type="checkbox" data-conc ${+x.conciliado ? "checked" : ""} ${travado ? "disabled" : ""}></td>
      <td>${travado ? dcurta(x.data) : `<input class="entrada" type="date" data-k="data" value="${esc(x.data || "")}" style="width:128px">`}</td>
      <td>${travado ? esc(x.descricao || "") : `<input class="entrada" data-k="descricao" value="${esc(x.descricao || "")}">`}</td>
      <td class="n">${travado ? brl(x.valor) : `<input class="entrada" type="number" step="0.01" data-k="valor" value="${num(x.valor)}" style="width:96px;text-align:right">`}</td>
      <td>${travado ? "" : `<button type="button" class="btn-ic p" data-del title="Excluir">${svg("lixo")}</button>`}</td></tr>`).join("")}</tbody></table>` : `<p class="dica">Nada neste mês.</p>`;
  el.innerHTML = `<div class="filtros"><button type="button" class="btn-ic" id="fAnt">${svg("voltar")}</button><b style="min-width:150px;text-align:center">${nomeMes(mes)}</b><button type="button" class="btn-ic" id="fProx">${svg("avancar")}</button>
      ${travado ? mini(`🔒 fechado em ${dbr(f.data_fechamento)}`, "#34d399") : mini("⏳ em conferência", "#e8b33d")}
      <div style="margin-left:auto;display:flex;gap:6px"><a class="btn v p" target="_blank" href="${API}/fechamento/${mes}/pdf?saldo_inicial=${encodeURIComponent(si ?? "")}&saldo_extrato=${encodeURIComponent(travado ? "" : extrato)}">${svg("documento")} PDF ${travado ? "do fechamento" : "(prévia)"}</a></div></div>
    <div class="sec">📋 Resumo — saldo anterior + entradas − despesas = saldo final</div>
    ${R.saldo_inicial_editavel ? `<label class="campo" style="max-width:320px">Saldo inicial do mês (R$) <small class="v">primeiro mês controlado: digite o saldo real do dia 1</small><input type="number" step="0.01" id="fSi" value="${R.saldo_inicial}"></label>` : ""}
    <div class="res" style="margin-top:8px"><div class="kpi" style="--c:var(--txt2)"><small>📦 Saldo do mês anterior</small><b>${brl(R.saldo_inicial)}</b><span>${R.tem_anterior ? "transportado do fechamento anterior" : "informado"}</span></div>
      <div class="kpi" style="--c:var(--verde)"><small>📥 (+) Entradas</small><b>${brl(R.entradas)}</b><span>${R.recebimentos.length} lançamento(s)</span></div>
      <div class="kpi" style="--c:var(--rosa)"><small>📤 (−) Despesas pagas</small><b>${brl(R.despesas)}</b><span>${R.gastos.length} lançamento(s)</span></div>
      <div class="kpi" style="--c:${R.resultado >= 0 ? "var(--verde)" : "var(--rosa)"}"><small>${R.resultado >= 0 ? "✅ Saldo positivo do mês" : "⚠️ Saldo negativo do mês"}</small><b>${brl(R.resultado)}</b></div>
      <div class="kpi" style="--c:var(--ouro)"><small>💰 Saldo disponível no fim do mês</small><b>${brl(travado ? f.saldo_final : R.saldo_teorico)}</b><span>vira o saldo inicial de ${nomeMes(mesMais(mes, 1))}</span></div></div>
    <div class="sec">✏️ Extrato do mês — confira com o banco e marque ✔</div>
    <div class="g2" style="align-items:start"><div><b style="font-size:.85rem">📥 Entradas</b>${linhas(R.recebimentos, "r")}</div><div><b style="font-size:.85rem">📤 Saídas pagas</b>${linhas(R.gastos, "g")}</div></div>
    <div class="kpi" style="--c:#60a5fa;margin-top:10px"><small>✅ Progresso da conferência</small><b>${R.conciliados} de ${R.total_itens}</b><div class="barra-p"><i style="width:${pctC}%"></i></div></div>
    <div class="sec">🎯 Grandes despesas previstas (dinheiro reservado)</div>
    ${R.grandes.map((g) => `<div class="lin"><div class="t"><b>${esc(g.descricao)}</b><small>${dbr(g.data)} · ${brl(g.valor)}</small></div><button type="button" class="btn v p" data-gpaga="${g.id}">Já paguei</button></div>`).join("") || `<p class="dica">Nenhuma em aberto.</p>`}
    <div class="g3" style="margin-top:6px"><div class="kpi" style="--c:var(--laranja)"><small>Reservado</small><b>${brl(R.total_grandes)}</b></div><div class="kpi" style="--c:${R.fundos_disponiveis < 0 ? "var(--rosa)" : "var(--verde)"}"><small>Fundos realmente disponíveis</small><b>${brl(R.fundos_disponiveis)}</b></div>
      <button type="button" class="kpi" style="--c:var(--ouro)" id="gNova"><small>➕</small><b style="font-size:1rem">Reservar grande despesa</b></button></div>
    <div class="sec">🏦 Confronto com o saldo do banco</div>
    <div class="g2" style="align-items:end"><label class="campo">Saldo do extrato no último dia do mês (R$)<input type="number" step="0.01" id="fExt" value="${extrato}" ${travado ? "disabled" : ""}></label>
      <div class="aviso ${Math.abs(dif) < 0.01 ? "ok" : "mal"}">${Math.abs(dif) < 0.01 ? "✅ Bateu certinho com o banco." : `⚠️ Diferença de <b>${brl(Math.abs(dif))}</b> (${dif > 0 ? "a mais no sistema" : "a mais no banco"}). Confira lançamentos faltando, tarifas ou duplicados.`}</div></div>
    <label class="campo" style="margin-top:8px">Observações do fechamento<textarea id="fObs" rows="2" ${travado ? "disabled" : ""}>${esc(travado ? f.observacoes || "" : S.obsFech?.[mes] || "")}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${pode("fechar") ? (travado ? `<button type="button" class="btn v" id="fReabrir">🔓 Reabrir (só para corrigir erro)</button>` : `<button type="button" class="btn" id="fFechar">🔒 Fechar o mês e ir para o próximo</button>`) : `<p class="dica">Fechar o mês é para quem tem a permissão “fechar”.</p>`}</div>
    <div class="sec">🗓️ Histórico de fechamentos</div>
    ${(S.e.fechamentos || []).filter((x) => +x.fechado).sort((a, b) => String(b.mes).localeCompare(a.mes)).map((x) => `<div class="lin" style="cursor:pointer" data-hm="${x.mes}"><div class="t"><b>${nomeMes(x.mes)}</b><small>anterior ${brl(x.saldo_inicial)} · entradas ${brl(x.receitas_mes)} · despesas ${brl(x.despesas_mes)} · final <b>${brl(x.saldo_final)}</b></small></div></div>`).join("") || `<p class="dica">Nenhum mês fechado ainda.</p>`}`;
  $("#fAnt").onclick = () => { S.mesFech = mesMais(mes, -1); finFechamento(el); };
  $("#fProx").onclick = () => { S.mesFech = mesMais(mes, 1); finFechamento(el); };
  $$("[data-hm]", el).forEach((d) => (d.onclick = () => { S.mesFech = d.dataset.hm; finFechamento(el); }));
  $("#fSi")?.addEventListener("change", (ev) => { S.saldoIniDigitado = { ...(S.saldoIniDigitado || {}), [mes]: ev.target.value }; finFechamento(el); });
  $("#fExt")?.addEventListener("change", (ev) => { S.extrato = { ...(S.extrato || {}), [mes]: ev.target.value }; finFechamento(el); });
  $("#fObs")?.addEventListener("input", (ev) => { S.obsFech = { ...(S.obsFech || {}), [mes]: ev.target.value }; });
  $$("tr[data-lid]", el).forEach((tr) => {
    const url = (tr.dataset.lt === "r" ? "/recebimentos/" : "/gastos/") + tr.dataset.lid;
    $("[data-conc]", tr).onchange = async (ev) => { try { await api(url, { method: "PUT", body: { conciliado: ev.target.checked } }); await carregar(); } catch (e) { falha(e); } };
    $$("[data-k]", tr).forEach((i) => (i.onchange = async () => { try { await api(url, { method: "PUT", body: { [i.dataset.k]: i.value } }); await carregar(); ok("Lançamento atualizado."); } catch (e) { falha(e); } }));
    $("[data-del]", tr)?.addEventListener("click", async () => { if (!(await A.confirmar("Excluir este lançamento?", { perigo: true, rotulo: "Excluir" }))) return; try { await api(url, { method: "DELETE" }); await carregar(); ok("Excluído."); } catch (e) { falha(e); } });
  });
  $$("[data-gpaga]", el).forEach((b) => (b.onclick = async () => { try { await api(`/gastos/${b.dataset.gpaga}`, { method: "PUT", body: { pago: true, data: hoje() } }); await carregar(); } catch (e) { falha(e); } }));
  $("#gNova").onclick = () => A.modal({ titulo: "Reservar grande despesa", icone: "dinheiro", largura: 440,
    html: `<label class="campo">Descrição *<input id="gdD"></label><div class="g2" style="margin-top:8px"><label class="campo">Valor (R$) *<input id="gdV" type="number" min="0.01" step="50"></label><label class="campo">Data prevista<input id="gdT" type="date" value="${hoje()}"></label></div>`,
    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Reservar", classe: "btn", principal: true, acao: async () => { try { await api("/gastos", { method: "POST", body: { descricao: $("#gdD").value, valor: $("#gdV").value, data: $("#gdT").value, grande_despesa_prevista: true, pago: false } }); await carregar(); ok("Reservado!"); } catch (e) { falha(e); return false; } } }] });
  $("#fFechar")?.addEventListener("click", async () => {
    const falta = R.total_itens - R.conciliados;
    if (!(await A.confirmar(`${falta ? `<b>${falta} lançamento(s) ainda sem conferir.</b> ` : ""}Fechar <b>${nomeMes(mes)}</b>? O saldo final vira o saldo inicial de ${nomeMes(mesMais(mes, 1))} e os lançamentos do mês travam.`, { rotulo: "Fechar o mês" }))) return;
    try { const r = await api(`/fechamento/${mes}/fechar`, { method: "POST", body: { saldo_inicial: R.saldo_inicial, saldo_extrato: $("#fExt").value, observacoes: $("#fObs").value } }); await carregar(); S.mesFech = r.proximo; ok(`Mês fechado: ${brl(r.saldo_final)} passa para ${nomeMes(r.proximo)}.`); } catch (e) { falha(e); }
  });
  $("#fReabrir")?.addEventListener("click", async () => { if (!(await A.confirmar("Reabrir este mês? Os lançamentos voltam a ser editáveis.", { rotulo: "Reabrir" }))) return; try { await api(`/fechamento/${mes}/reabrir`, { method: "POST" }); await carregar(); } catch (e) { falha(e); } });
}

/* ══════ AJUSTES ══════ */
function telaAjustes(m) {
  const c = S.e.cfg, todos = S.e.encomendas.slice().sort((a, b) => norm(a.cliente).localeCompare(norm(b.cliente))), cls = S.e.clientes.slice().sort((a, b) => norm(a.nome).localeCompare(norm(b.nome)));
  m.innerHTML = `<section class="painel vidro"><div class="cab"><div><h2>⚙️ Ajustes</h2><p>Leituras do banco desde que o servidor ligou: ${S.e.leituras} · <a href="#" id="aRel">recarregar tudo do banco</a></p></div></div>
    <div class="g2" style="align-items:start"><div>
      <div class="sec">🏢 Empresa (vai no contrato)</div>
      <label class="campo">CNPJ<input data-cfg="cnpj" value="${esc(c.cnpj || "")}"></label><label class="campo" style="margin-top:6px">Telefone<input data-cfg="telefone" value="${esc(c.telefone || "")}"></label><label class="campo" style="margin-top:6px">Endereço<input data-cfg="endereco" value="${esc(c.endereco || "")}"></label>
      <div class="sec">🚨 Alerta de entrega urgente</div><label class="campo">Avisar quantos dias antes da entrega<input type="number" min="1" max="180" data-cfg="alerta_entrega_dias" value="${esc(c.alerta_entrega_dias || 7)}"></label>
    </div><div>
      <div class="sec">🎯 Metas e parâmetros</div>
      <div class="g2"><label class="campo">Meta de faturamento / mês (R$)<input type="number" data-cfg="meta_faturamento" value="${esc(c.meta_faturamento || 5000)}"></label><label class="campo">Meta de pedidos / mês<input type="number" data-cfg="meta_pedidos_mes" value="${esc(c.meta_pedidos_mes || 8)}"></label>
        <label class="campo">Margem mínima (%)<input type="number" data-cfg="margem_minima_pct" value="${esc(c.margem_minima_pct || 30)}"></label><label class="campo">Reserva de emergência (meses)<input type="number" data-cfg="reserva_emergencia_meses" value="${esc(c.reserva_emergencia_meses || 3)}"></label>
        <label class="campo">Capital de giro (% da receita)<input type="number" data-cfg="capital_giro_pct" value="${esc(c.capital_giro_pct || 20)}"></label></div>
      <div class="sec">📏 Regras fixas da agenda</div>
      <p class="dica">• Provas não têm limite por dia — mas um dia com <b>mais de ${S.e.const.limite_provas} provas</b> fica bloqueado para receber <b>Confecção</b>.<br>• Duas encomendas na mesma Data da Confecção: o sistema avisa quantas já existem e pergunta sim/não.<br>• <b>Concluído</b> é sempre você que marca, dentro do pedido.<br>• Consertos não disputam a agenda de confecção.</p>
    </div></div>
    <button type="button" class="btn" id="aSalvar" style="margin-top:12px">${svg("check")} Salvar ajustes</button></section>
  ${pode("excluir") ? `<section class="painel vidro"><div class="cab"><div><h2 style="color:var(--rosa)">🔐 Exclusões permanentes</h2><p>Não tem volta. Para pedidos: apaga também as tarefas e os gastos dele (o dinheiro já recebido continua no caixa).</p></div></div>
    <div class="g2"><div><label class="campo">Pedido<select id="xPed">${todos.map((x) => `<option value="${x.id}">${esc(x.cliente)} | ${esc(x.peca)}${!ativo(x) ? " [CANCELADO]" : ""}</option>`).join("")}</select></label><button type="button" class="btn perigo p" id="xPedBt" style="margin-top:6px">Excluir pedido</button></div>
      <div><label class="campo">Cliente (ficha + medidas)<select id="xCli">${cls.map((x) => `<option value="${x.id}">${esc(x.nome)}${x.telefone ? " · " + esc(x.telefone) : ""}</option>`).join("")}</select></label><button type="button" class="btn perigo p" id="xCliBt" style="margin-top:6px">Excluir cadastro</button></div></div></section>` : ""}`;
  $("#aRel").onclick = async (ev) => { ev.preventDefault(); try { await api("/recarregar", { method: "POST" }, "relendo…"); await carregar(); ok("Relido do banco."); } catch (e) { falha(e); } };
  $("#aSalvar").onclick = async () => { const body = {}; $$("[data-cfg]", m).forEach((i) => (body[i.dataset.cfg] = i.value)); try { await api("/config", { method: "PUT", body }); await carregar(); ok("Ajustes salvos."); } catch (e) { falha(e); } };
  const excluir = (rotulo, url) => A.modal({ titulo: rotulo, icone: "atencao", cor: "var(--rosa)", largura: 420, html: `<label class="campo">Digite <b>EXCLUIR</b> para confirmar<input id="xConf" autocomplete="off"></label>`,
    botoes: [{ rotulo: "Voltar" }, { rotulo: "Excluir para sempre", classe: "btn perigo", principal: true, acao: async () => { try { await api(url, { method: "DELETE", body: { confirmar: $("#xConf").value } }); await carregar(); ok("Excluído."); } catch (e) { falha(e); return false; } } }] });
  $("#xPedBt")?.addEventListener("click", () => excluir("Excluir pedido", `/encomendas/${$("#xPed").value}`));
  $("#xCliBt")?.addEventListener("click", () => excluir("Excluir cadastro de cliente", `/clientes/${$("#xCli").value}`));
}

/* ══════ INÍCIO ══════ */
carregar(1);
addEventListener("focus", () => { if (S.e && Date.now() / 1000 - S.e.lido_em > 120 && !document.querySelector(".aur-modal-fundo.aberto")) carregar(1); });
})();
</script>
</body>
</html>
