<style>
body{padding:14px;min-height:100vh}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto}
.topo{position:sticky;top:10px;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:20px;flex-wrap:wrap}
.topo.vidro{background:linear-gradient(135deg,rgba(14,17,26,.9),rgba(8,10,16,.84))}
.marca{display:flex;align-items:center;gap:12px;min-width:0}

.marca small{display:block;font-size:.6rem;letter-spacing:2.4px;text-transform:uppercase;font-weight:700;background:var(--grad-ouro);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin:0 auto}
.nav button{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;font-size:.8rem;font-weight:600;color:var(--txt2);transition:.2s;position:relative}
.nav button svg.i{width:15px;height:15px}

.nav button.ativo{color:#140c26;background:#a78bfa;box-shadow:0 0 20px -4px #a78bfa}
.nav button .bolha{position:absolute;top:-3px;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;font-size:.6rem;font-weight:800;font-style:normal;display:grid;place-items:center;background:var(--rosa);color:#fff;box-shadow:0 0 10px var(--rosa)}
.dir{display:flex;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--txt3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde)}
.sync.salvando i{background:var(--ouro);box-shadow:0 0 8px var(--ouro);animation:aurRespira 1s infinite}
.sync.erro i{background:var(--rosa);box-shadow:0 0 8px var(--rosa)}
main{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.painel{border-radius:24px;padding:18px}
.cab{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cab h2{margin:0;font:700 1.18rem var(--titulo);letter-spacing:-.01em}
.cab p{margin:2px 0 0;font-size:.78rem;color:var(--txt3)}
.cab .dir{margin-left:auto;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{position:relative;padding:13px 14px;border-radius:15px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid var(--vidro-borda);--c:var(--ciano);text-align:left}
.kpi::before{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 70%)}
.kpi small{display:block;font-size:.6rem;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt3)}
.kpi b{display:block;font:700 1.5rem/1.1 var(--titulo);margin-top:8px;color:var(--c)}
.kpi span{display:block;font-size:.68rem;color:var(--txt3);margin-top:4px}

table.t{width:100%;border-collapse:collapse;font-size:.8rem}

.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn.p{padding:6px 10px;font-size:.72rem}
.btn.p.ic{padding:5px 8px;font-size:.95rem;line-height:1;display:inline-flex;align-items:center;justify-content:center;min-width:32px}
.km{display:inline-block;font:700 .82rem/1.2 var(--titulo);padding:3px 9px;border-radius:99px;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--txt2)}

.viz{--c:#22d3ee}
.mapa{height:380px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.04)}
.grade2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.feed{max-height:380px;overflow:auto}

.barra-ferr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px}
.mg{max-width:82%;padding:8px 12px;border-radius:16px;font-size:.86rem;white-space:pre-wrap;word-break:break-word;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--vidro-borda);align-self:flex-start}

.mg small{display:block;font-size:.66rem;color:var(--txt3);margin-bottom:2px}
.mg img{display:block;max-width:240px;border-radius:10px;margin-top:4px}
.mg.sis{align-self:center;background:none;border:0;font-size:.72rem;color:var(--txt3)}
.motivo-gde{font:800 1.05rem var(--titulo);text-transform:uppercase;letter-spacing:.03em;color:#fdba74}
.relogio{font:700 .82rem var(--titulo);padding:3px 9px;border-radius:9px;background:rgba(52,211,153,.14);color:#6ee7b7}
.relogio.quase{background:rgba(251,146,60,.16);color:#fdba74}.relogio.estourou{background:rgba(251,113,133,.18);color:#fda4af}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:.84rem}.dl dt{color:var(--txt3)}.dl dd{margin:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:.84rem;cursor:pointer}.chk input{width:18px;height:18px;accent-color:#a78bfa}
.vazio{text-align:center;color:var(--txt3);padding:26px 10px;font-size:.84rem}
.leaflet-container{background:#0b0e16}
/* mapa claro do OpenStreetMap escurecido nos temas escuros; nos claros (Retrô, Areia…) fica como é */
html:not([data-claro]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
html[data-claro] .leaflet-container{background:#e9ecef}
/* ícones do mapa: triângulo = motorista (aponta para onde vai) · balão preto = endereço do cliente */
.leaflet-div-icon.ic-mapa{background:transparent;border:0}
.ic-mapa svg{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.leg-mapa{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--txt2);margin-top:8px}
.leg-mapa span{display:inline-flex;gap:6px;align-items:center}
@media (max-width:1100px){.grade2{grid-template-columns:1fr}}
/* Ao vivo: lista/painel do motorista à ESQUERDA · "Chegando" + mapa à DIREITA (fixos ao rolar) */
.av-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.av-dir{position:sticky;top:10px;display:grid;gap:12px}
.av-dir .mapa{height:min(62vh,600px)}
.av-esq{display:grid;gap:12px;min-width:0}
.av-esq .painel{margin:0}.av-esq .tab-w{overflow-x:auto}.av-esq .barra-ferr{flex-wrap:wrap}
.mot-cab{display:flex;gap:12px;align-items:flex-start}
.mot-cab h2{margin:0;font-size:1.05rem}
.mot-cab .fechar{margin-left:auto}
.mot-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}

.mot-kpis b{display:block;font-size:1.25rem}
.mot-kpis small{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.mot-ped{border:1px solid var(--borda,rgba(255,255,255,.08));border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:pointer}
.mot-ped:hover{border-color:var(--ouro2,#e8b33d)}
/* Tela dividida: motorista (laranja) à esquerda · cliente pelo app (AZUL) à direita */

.duplo.com-cli{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.duplo.com-cli .g3{grid-template-columns:1fr 1fr}
.lado-mot{border:1px solid #fb923c;background:rgba(251,146,60,.06);border-radius:16px;padding:12px;align-self:start;position:sticky;top:0}
/* informações do motorista compactas, no tamanho do card (a conversa fica do mesmo tamanho e vai subindo) */
.info4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
.info4 .bloco{padding:8px 10px;margin:0;font-size:.78rem;min-width:0}
.info4 h3{font-size:.72rem;margin:0 0 4px;letter-spacing:.04em;text-transform:uppercase;opacity:.85;display:flex;gap:4px;align-items:center}
.info4 h3 svg{width:13px;height:13px}

.info4 .corta{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.info4 .sub{font-size:.7rem}
.info4 .palavra{font-size:.95rem;padding:2px 8px}
.info4 .btn.p{padding:4px 6px;font-size:.7rem}
.info4 .btn.ic{min-width:28px;padding:4px 6px;font-size:.85rem}

.info4 .pecas .linha{padding:2px 0;gap:6px}
.lado-mot details{margin-top:10px}
.lado-mot details summary{cursor:pointer;font-size:.78rem;opacity:.8}
@media (max-width:1200px){.info4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lado-tit{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.lado-mot .lado-tit{color:#fb923c}
.lado-cli{display:none;border:1px solid #3b82f6;background:rgba(59,130,246,.08);border-radius:16px;padding:12px;align-self:start;position:sticky;top:0}
.com-cli .lado-cli{display:block}
.lado-cli .lado-tit{color:#60a5fa}
.lado-cli .msgs{max-height:48vh;overflow:auto;display:grid;gap:6px;padding:4px 2px}
.mc{max-width:85%;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-size:.86rem;white-space:pre-wrap}
.mc.cen{margin-left:auto;background:#2563eb;color:#fff}
.mc small{display:block;font-size:.68rem;opacity:.75;margin-bottom:2px}
.btn.azul{background:#2563eb;border-color:#2563eb;color:#fff}
.btn.ic.azul{background:#2563eb;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.35)}
.btn.ic .ponto{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#fb7185;border:2px solid #0b1220}
.btn.ic{position:relative}
@media (max-width:900px){.duplo.com-cli{grid-template-columns:1fr}}
.mot-ped.foco{border-color:#22d3ee;box-shadow:0 0 0 2px rgba(34,211,238,.25)}
.kpi-bt{cursor:pointer;font:inherit;color:inherit;width:100%}
.kpi-bt:hover{border-color:var(--c)}
.dir .ic{padding:7px 9px}
.mot-ped .topo{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mot-ped .rod{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mot-sel{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
@media (max-width:1100px){.av-split{grid-template-columns:1fr}.av-dir{position:static}}
@media (max-width:820px){.topo{position:relative;top:0}.nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;margin:0}}
@media (max-width:560px){body{padding:8px}.painel{padding:13px}.nav button span{display:none}.dl{grid-template-columns:1fr}}
</style>

<script>
(() => {
"use strict";
const A = Aurora, esc = A.esc, svg = A.svg;
Object.assign(A.ICONES, {
  caminhao: A.ICONES.caminhao || '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',

});
A.fundo();
document.getElementById("logo").outerHTML = A.orbe("mapa", "#a78bfa");
document.querySelector('link[rel="icon"]').href = A.ATOMO_SVG;

const API = "/api/wrouter";
const V = { aba: ls("wd.wr.aba", "aovivo"), data: "", sel: null, busca: "", filtro: "todas", hde: "", hate: "", hbusca: "" };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const hora = (iso) => iso ? String(iso).slice(11, 16) : "";
const dBR = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : "—";
const dhBR = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)} ${iso.slice(11, 16)}` : "—";
const haQuanto = (s) => s == null ? "" : s < 60 ? `há ${s}s` : s < 3600 ? `há ${Math.round(s / 60)} min` : `há ${Math.round(s / 3600)} h`;
const kmTxt = (k) => k < 1 ? `${Math.round(k * 1000)} m` : `${k.toFixed(1).replace(".", ",")} km`;
const sem = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const pode = (a) => !!S.perm.acoes?.[a];
const DESF = { entregue: ["Entregue", "#34d399"], retorno: ["Retorno", "#fb7185"], parcial: ["Parcial", "#e8b33d"] };
const BX = { entregue: "entregue", ausente: "ausente → reagendar", avaria: "avaria → reposição", recusado: "recusado" };

const urlCli = (lk) => lk ? `${location.origin}${S.base || ""}/entrega/${lk}` : "";

const relogio = (ch) => ch.restante_seg == null ? "" : `<span class="relogio" data-ate="${Date.now() + ch.restante_seg * 1000}" data-total="${(ch.prazo_min || 15) * 60}">⏱</span>`;

function posTxt(g) {
  if (!g.pos) return g.sinal ? `📵 sem posição<span class="sub">app com internet ${haQuanto(g.sinal.ha_seg)}</span>` : "—";
  const h = g.pos.ha_seg != null ? haQuanto(g.pos.ha_seg) : "último ponto " + hora(g.pos.em);
  if (g.pos.fonte === "estimada") return `≈ estimada<span class="sub">${esc(g.pos.ref || "último cliente")}${g.sinal ? ` · app com internet ${haQuanto(g.sinal.ha_seg)}${g.sinal.gps && g.sinal.gps !== "ativo" ? " · GPS desligado" : ""}` : ""}</span>`;

  return `${h}${g.sinal && g.sinal.gps && !["ativo", "rede"].includes(g.sinal.gps) ? '<span class="sub" style="color:var(--rosa)">GPS desligado agora</span>' : ""}`;
}
function feed(d) {
  const ev = [];
  d.cargas.forEach((g) => {
    if (g.saida) ev.push({ em: g.saida.em, t: `🚚 Carga ${g.numero} (${g.placa}) saiu · ${g.motorista}` });
    if (g.chegada) ev.push({ em: g.chegada.em, t: `🏁 Carga ${g.numero} chegou no CD` });
    g.pedidos.forEach((p) => { if (p.chegou) ev.push({ em: p.chegou.em, t: `📍 #${p.numero} ${p.nome}: chegou${p.chegou.conferido ? "" : " (⚠ " + (p.chegou.dist_m != null ? p.chegou.dist_m + " m do endereço" : "sem coordenada") + ")"}` });
      if (p.desfecho && p.em) ev.push({ em: p.em, t: `${p.desfecho === "entregue" ? "✅" : p.desfecho === "parcial" ? "½" : "↩️"} #${p.numero} ${p.nome}: ${DESF[p.desfecho][0]}${p.motivo ? " — " + p.motivo : ""}${p.vizinho ? " · vizinho" : ""}` });
      if ((p.liberacao || {}).pedido_em) ev.push({ em: p.liberacao.pedido_em, t: `⚠️ #${p.numero} ${p.nome}: pediu liberação sem palavra` }); });
  });
  ev.sort((a, b) => String(b.em).localeCompare(String(a.em)));
  return ev.slice(0, 60).map((e) => `<div><span>${hora(e.em)}</span><span>${esc(e.t)}</span></div>`).join("") || '<p class="sub">Os registros dos motoristas aparecem aqui.</p>';
}

function listaKpi(id, d, trata) {
  const todos = []; d.cargas.forEach((g) => g.pedidos.forEach((p) => todos.push({ g, p })));
  const lin = ({ g, p }, extra = "") => `<div class="linha mot-ped" data-pfoco="${g.id}|${p.pid}" title="Ver no mapa o motorista e esta entrega"><span><b>#${p.numero} · ${esc(p.nome)}</b> ${desfTag(p)}<span class="sub">carga ${g.numero} · ${esc(g.motorista)}${p.em ? " · " + hora(p.em) : ""}${extra}</span></span><span class="chips">${BTLINK(p, g.id, false)}</span></div>`;
  let titulo, cor, html;
  if (id === "rua") {
    const gs = d.cargas.filter((g) => g.fase === "rua"); titulo = `Na rua (${gs.length})`; cor = "#e8b33d";
    html = gs.map((g) => `<div class="linha mot-ped" data-mot="${g.id}" title="Ver este motorista"><span><b>${esc(g.motorista)}</b> · ${esc(g.placa)} · carga ${g.numero}<span class="sub">${g.cont.entregue}/${g.cont.total} entregues · ${g.cont.pendente} pendente(s) · ${g.saida ? "saiu " + hora(g.saida.em) : ""}</span></span><span class="sub">${posTxt(g)}</span></div>`).join("");
  } else if (id === "entregues") {
    const xs = todos.filter(({ p }) => p.desfecho === "entregue" || p.desfecho === "parcial"); titulo = `Entregues (${xs.length})`; cor = "#34d399";
    html = xs.map((x) => lin(x, x.p.comprovante ? ` · recebido por ${esc(x.p.comprovante.recebedor || "—")}` : "")).join("");

  $$("[data-vpal]", c).forEach((b) => (b.onclick = async (ev) => { ev.stopPropagation(); const [g, p, acao] = b.dataset.vpal.split("|");

    try { await api(`/cargas/${g}/validar-palavra/${p}`, { method: "PUT", body: { acao } }); ok(acao === "aceitar" ? "Entrega validada." : "Reaberto."); rAoVivo(true); } catch (e) { falha(e); } }));
  $$("[data-reab]", c).forEach((b) => (b.onclick = async (ev) => { ev.stopPropagation(); const [g, p] = b.dataset.reab.split("|");
    const nota = prompt("Por que reabrir? O registro do motorista e a BAIXA no ERP são desfeitos."); if (!nota) return;
    try { await api(`/cargas/${g}/pedido/${p}/reabrir`, { method: "POST", body: { nota } }); ok("Reaberto: baixa desfeita no ERP."); rAoVivo(true); } catch (e) { falha(e); } }));

let LMAP = null;
// triângulo do motorista girado na direção em que anda; tracejado = posição aproximada (sem GPS)
const icCam = (rumo, aprox) => L.divIcon({ className: "ic-mapa", iconSize: [30, 30], iconAnchor: [15, 15],
  html: `<svg width="30" height="30" viewBox="0 0 24 24" style="transform:rotate(${rumo ?? 0}deg)"><path d="M12 2 21 21 12 16 3 21Z" fill="#f59e0b" stroke="#111" stroke-width="1.6" stroke-linejoin="round"${aprox ? ' stroke-dasharray="2 2"' : ""}/></svg>` });
// balão preto = cliente a entregar (contorno laranja/vermelho quando o caminhão está perto); cinza = já atendido
const icBal = (p) => { const cor = p.desfecho ? "#9ca3af" : "#111", anel = !p.desfecho && p.km_cor === "vermelho" ? "#ef4444" : !p.desfecho && p.km_cor === "laranja" ? "#fb923c" : "#fff";

function leaflet() { return window.L ? Promise.resolve() : new Promise((ok2, er) => { const s = document.createElement("script"); s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; s.onload = ok2; s.onerror = er; document.head.appendChild(s); }); }
// Rota PELAS RUAS entre o motorista e a entrega (OSRM público e gratuito). Se não vier rota, não desenha nada (nada de linha reta).
const ROTAS = new Map();
async function rotaRuas(de, para) {
  const k = [de[0].toFixed(3), de[1].toFixed(3), para[0].toFixed(4), para[1].toFixed(4)].join(",");
  if (ROTAS.has(k)) return ROTAS.get(k);
  let r = null;
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const resp = await fetch(`https://router.project-osrm.org/route/v1/driving/${de[1]},${de[0]};${para[1]},${para[0]}?overview=full&geometries=geojson`, { signal: ctl.signal });
    clearTimeout(to);
    const j = await resp.json(), rt = j && j.code === "Ok" && j.routes && j.routes[0];
    if (rt && rt.geometry && rt.geometry.coordinates.length > 2) r = { pts: rt.geometry.coordinates.map((c) => [c[1], c[0]]), km: rt.distance / 1000, min: Math.round(rt.duration / 60) };
  } catch (_) { r = null; }
  ROTAS.set(k, r); if (ROTAS.size > 60) ROTAS.delete(ROTAS.keys().next().value);
  return r;
}

async function mapa(d, sel) {
  const box = $("#mapa"); if (!box) return;
  try { await leaflet(); } catch (_) { box.innerHTML = '<p class="sub" style="padding:14px">Não consegui carregar o mapa (OpenStreetMap).</p>'; return; }
  if (LMAP) { LMAP.remove(); LMAP = null; }
  LMAP = L.map(box, { zoomControl: true }); L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap", maxZoom: 19 }).addTo(LMAP);   // OSM direto (o CARTO deixou de responder)
  const pts = [];
  const foco = sel && V.foco ? sel.pedidos.find((p) => p.pid === V.foco) : null;
  if (foco) {   // só o motorista e AQUELA entrega, com a rota pelas ruas
    const g = sel, p = foco, pts = [];
    if (g.pos) { L.marker([g.pos.lat, g.pos.lng], { icon: icCam(g.pos.rumo, g.pos.aprox), zIndexOffset: 500 }).addTo(LMAP).bindTooltip(`🚚 ${g.numero} · ${g.placa} · ${g.motorista}`); pts.push([g.pos.lat, g.pos.lng]); }
    if (p.destino) { L.marker([p.destino.lat, p.destino.lng], { icon: icBal(p) }).addTo(LMAP).bindTooltip(`#${p.numero} ${p.nome}`, { permanent: true, direction: "top", offset: [0, -34] }); pts.push([p.destino.lat, p.destino.lng]); }
    if (pts.length) LMAP.fitBounds(pts, { padding: [40, 40], maxZoom: 16 }); else LMAP.setView([-23.55, -46.63], 10);
    const info = $("#rotaInfo");
    if (g.pos && p.destino && !p.desfecho) {
      if (info) info.textContent = "calculando a rota pelas ruas…";
      const mapaAtual = LMAP, rt = await rotaRuas([g.pos.lat, g.pos.lng], [p.destino.lat, p.destino.lng]);
      if (mapaAtual !== LMAP) return;   // o mapa foi refeito enquanto calculava
      if (rt) { L.polyline(rt.pts, { color: "#22d3ee", weight: 5, opacity: .85 }).addTo(LMAP); LMAP.fitBounds(rt.pts, { padding: [40, 40], maxZoom: 16 }); }
      if (info) info.textContent = rt ? `pelas ruas: ${rt.km.toFixed(1).replace(".", ",")} km · ~${rt.min} min` : "rota pelas ruas indisponível agora";
    } else if (info) info.textContent = p.desfecho ? "entrega já registrada" : !g.pos ? "motorista sem posição" : "endereço sem coordenada";
    return;
  }
  (sel ? d.cargas.filter((g) => g.id === sel.id) : d.cargas).forEach((g) => {
    if (g.trilha.length > 1) L.polyline(g.trilha.map((t) => [t[0], t[1]]), { color: "#a78bfa", weight: 3, opacity: .6 }).addTo(LMAP);
    if (g.pos) { L.marker([g.pos.lat, g.pos.lng], { icon: icCam(g.pos.rumo, g.pos.aprox), zIndexOffset: 500 }).addTo(LMAP).on("click", () => { V.sel = V.sel === g.id ? null : g.id; rAoVivo(true); }).bindTooltip(`🚚 ${g.numero} · ${g.placa} · ${g.motorista}${g.pos.fonte !== "gps" ? " (" + g.pos.fonte + ")" : ""}`); pts.push([g.pos.lat, g.pos.lng]); }
    g.pedidos.forEach((p) => { if (!p.destino) return;
      L.marker([p.destino.lat, p.destino.lng], { icon: icBal(p) }).addTo(LMAP).bindTooltip(`#${p.numero} ${p.nome}${p.desfecho ? " · " + (DESF[p.desfecho] || [p.desfecho])[0] : p.km != null ? " · " + kmTxt(p.km) : ""}`); pts.push([p.destino.lat, p.destino.lng]); });
  });
  if (pts.length) LMAP.fitBounds(pts, { padding: [30, 30], maxZoom: 14 }); else LMAP.setView([-23.55, -46.63], 10);
}

      ${d.motoristas.map((m) => `<div class="linha"${m.ativo === false ? ' style="opacity:.55"' : ""}><span><b>${esc(m.nome)}</b>${m.ativo === false ? " · inativo" : ""}<span class="sub">${esc([m.telefone, m.doc].filter(Boolean).join(" · ") || "sem telefone")}</span></span>
        <span style="display:flex;gap:10px;align-items:center"><label class="chk" title="Exigir palavra-chave" style="display:flex;gap:6px;align-items:center;font-size:12.5px">🔑<input type="checkbox" data-pal="${m.id}"${m.palavra ? " checked" : ""}></label><button type="button" class="btn v p" data-ed="${m.id}">Editar</button></span></div>`).join("") || '<p class="sub">Nenhum motorista. Clique em + Motorista.</p>'}</div></div>
    <div class="bloco" style="margin-top:14px"><h3>${svg("ajustes")} Regras do app</h3>
      <div class="g3"><label class="campo">Tentativas de palavra antes de travar<input class="entrada" type="number" min="1" max="20" id="cTent" value="${c.tentativas}"></label>
        <label class="campo">Prazo do atendimento no chat (min)<input class="entrada" type="number" min="1" max="240" id="cChat" value="${c.chat_minutos}"></label>
        <label class="campo">Raio do "Chegou no cliente" (m)<input class="entrada" type="number" min="50" max="2000" id="cRaio" value="${c.raio_chegada_m}"></label></div>
      <h3 style="margin-top:14px">📍 Distância do motorista até o cliente</h3>
      <div class="g3"><label class="campo">🟠 Se aproximando: abaixo de (km)<input class="entrada" type="number" min="0.1" max="100" step="0.1" id="cKmL" value="${c.km_laranja}"></label>
        <label class="campo">🔴 Bem perto: abaixo de (km)<input class="entrada" type="number" min="0.1" max="100" step="0.1" id="cKmV" value="${c.km_vermelho}"></label>
        <label class="campo" style="align-self:end"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cMapa"${c.mapa_cliente ? " checked" : ""} style="width:18px;height:18px">Cliente vê o mapa (motorista e endereço)</span></label></div>
      <span class="sub">Vale na hora para a operação, o app do motorista, o app do cliente e o link. O cliente só vê o mapa com o triângulo do motorista quando ele entra na faixa laranja; antes disso vê só "a caminho" e o km. Use casas decimais: 0,5 = 500 m.</span>
      <h3 style="margin-top:14px">Motivos (chat e retorno) → o que a baixa faz no ERP</h3><div id="mots">${c.motivos.map((m, i) => linhaMot(m, i)).join("")}</div>
      <div class="chips" style="margin-top:8px"><button type="button" class="btn v p" id="mAdd">${svg("mais")}Motivo</button><button type="button" class="btn" id="cSalvar">${svg("check")}Salvar regras</button></div></div></section>`;
  $$("[data-reset]").forEach((b) => (b.onclick = async () => { if (!(await A.confirmar(`Resetar a senha da placa <b>${esc(b.dataset.reset)}</b>? O celular logado sai.`, { perigo: true, rotulo: "Resetar" }))) return;
    try { await api(`/placas/${b.dataset.reset}/resetar`, { method: "POST" }); ok("Senha resetada para a inicial."); rMotoristas(); } catch (e) { falha(e); } }));
  const todos = Object.fromEntries([...d.veiculos.map((v) => [v.id, { ...v, tipo: "veiculo" }]), ...d.motoristas.map((m) => [m.id, { ...m, tipo: "motorista" }])]);
  $$("[data-novo]").forEach((b) => (b.onclick = () => editarCad({ tipo: b.dataset.novo, ativo: true })));
  $$("[data-ed]").forEach((b) => (b.onclick = () => editarCad(todos[b.dataset.ed])));
  $$("[data-pal]").forEach((i) => (i.onchange = async () => { try { await api(`/motoristas/${i.dataset.pal}`, { method: "PUT", body: { palavra: i.checked } }); ok(i.checked ? "Palavra ligada." : "Palavra desligada."); } catch (e) { falha(e); i.checked = !i.checked; } }));
  $("#mAdd").onclick = () => $("#mots").insertAdjacentHTML("beforeend", linhaMot({ motivo: "", tipo: "ausente" }, $$("#mots .linha").length));
  $("#cSalvar").onclick = async () => {
    const motivos = $$("#mots .linha").map((l) => ({ motivo: $("input", l).value, tipo: $("select", l).value })).filter((m) => m.motivo.trim());
    try { await api("/cfg", { method: "PUT", body: { tentativas: +$("#cTent").value, chat_minutos: +$("#cChat").value, raio_chegada_m: +$("#cRaio").value, km_laranja: +$("#cKmL").value, km_vermelho: +$("#cKmV").value, mapa_cliente: $("#cMapa").checked, motivos } }); ok("Regras salvas."); rMotoristas(); } catch (e) { falha(e); } };
}
function editarCad(x) {
  const vei = x.tipo === "veiculo", nv = !x.id;
  A.modal({
    titulo: nv ? (vei ? "Novo veículo" : "Novo motorista") : `${vei ? "Veículo" : "Motorista"} · ${x.placa || x.nome}`, icone: vei ? "caminhao" : "usuarios", cor: "#a78bfa", largura: 620,
    html: `${vei ? `<div class="g2"><label class="campo">Placa * <small style="font-weight:400">(login do app)</small><input class="entrada" id="fPlaca" value="${esc(x.placa || "")}" placeholder="ABC1D23" style="text-transform:uppercase"></label>
        <label class="campo">Identificação / modelo<input class="entrada" id="fNome" value="${esc(x.nome && x.nome !== x.placa ? x.nome : "")}" placeholder="ex.: Furgão HR"></label></div>
      ${!nv && x.placa ? `<p class="sub">Trocar a placa muda o login: o celular sai e a nova placa começa com a senha inicial.</p>` : ""}
      <h4 style="margin:14px 0 6px">Capacidade para o planejamento de cargas <small style="font-weight:400">(0 = sem limite / usa o padrão do ERP)</small></h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px"><label class="campo">Volumes<input class="entrada" type="number" min="0" id="fCap" value="${x.capacidade || 0}"></label>
        <label class="campo">Máx. paradas<input class="entrada" type="number" min="0" id="fPts" value="${x.max_pontos || 0}"></label><label class="campo">Máx. m³ (baú)<input class="entrada" type="number" min="0" step="0.1" id="fM3" value="${x.max_m3 || 0}"></label>
        <label class="campo">Máx. kg<input class="entrada" type="number" min="0" step="10" id="fKg" value="${x.max_kg || 0}"></label></div>`
      : `<label class="campo">Nome *<input class="entrada" id="fNome" value="${esc(x.nome || "")}"></label>
      <div class="g2" style="margin-top:10px"><label class="campo">Telefone<input class="entrada" id="fTel" value="${esc(x.telefone || "")}" inputmode="tel"></label><label class="campo">CPF / CNH<input class="entrada" id="fDoc" value="${esc(x.doc || "")}"></label></div>`}
      <label class="campo" style="margin-top:10px">Observações<textarea class="entrada" id="fObs" rows="2">${esc(x.obs || "")}</textarea></label>
      <label class="linha chk" style="margin-top:10px"><span><b>Ativo</b><span class="sub">${vei ? "Inativo: some da montagem de carga e o login do app deixa de funcionar." : "Inativo: some da montagem de carga."}</span></span><input type="checkbox" id="fAtivo"${x.ativo === false ? "" : " checked"}></label>`,
    botoes: [{ rotulo: "Cancelar" }, { rotulo: "Salvar", classe: "btn", icone: "check", principal: true, acao: async (cx) => {
      const v = (q) => $(q, cx)?.value ?? "";
      const body = { tipo: x.tipo, nome: v("#fNome").trim(), obs: v("#fObs"), ativo: $("#fAtivo", cx).checked };
      if (vei) Object.assign(body, { placa: v("#fPlaca"), capacidade: +v("#fCap") || 0, max_pontos: +v("#fPts") || 0, max_m3: +String(v("#fM3")).replace(",", ".") || 0, max_kg: +v("#fKg") || 0 });
      else Object.assign(body, { telefone: v("#fTel"), doc: v("#fDoc") });
      try { await api(nv ? "/cadastros" : `/cadastros/${x.id}`, { method: nv ? "POST" : "PUT", body }); ok(vei ? "Veículo salvo." : "Motorista salvo."); rMotoristas(); }
      catch (e) { falha(e); return false; }
    } }],
  });
}
const linhaMot = (m) => `<div class="linha"><input class="entrada" value="${esc(m.motivo)}" placeholder="ex.: Cliente ausente" style="flex:1;min-width:200px"><select class="entrada" style="width:auto">${[["ausente", "Ausente → reagendar (volta reservado)"], ["avaria", "Avaria → reposição (triagem)"], ["recusa", "Recusa → recusado (triagem)"]].map(([k, r]) => `<option value="${k}"${m.tipo === k ? " selected" : ""}>${r}</option>`).join("")}</select></div>`;

$("#btAtualizar").innerHTML = svg("repetir");
$("#btAtualizar").onclick = () => render();
(async () => {
  try { const eu = await api("/eu"); S.perm = eu.perm; S.base = eu.base || ""; } catch (e) { $("#main").innerHTML = `<section class="painel vidro"><div class="vazio">${esc(e.message)}</div></section>`; return; }
  if (!["aovivo", "historico", "motoristas"].some(pode)) { $("#main").innerHTML = `<section class="painel vidro"><div class="vazio">Sem permissão nas abas do WROUTER. Peça ao administrador (Configurações → Usuários → WROUTER).</div></section>`; return; }
  render();
})();
setInterval(() => { if (document.visibilityState !== "visible" || A.modalAberto()) return; if (V.aba === "aovivo") rAoVivo(true).catch(() => {}); else if (V.aba === "conversas") rConversas().catch(() => {}); }, 20000);
})();
</script>
</body>
</html>
